<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深圳市建设施工围挡数字化管理系统</title>
<style>
/* ═══ Design Token ═══ */
:root{
  --color-primary-50:#EBF2FF;--color-primary-100:#C6D9FF;--color-primary-200:#9DBEFF;
  --color-primary-300:#6B9EF5;--color-primary-400:#3D7FED;--color-primary-500:#1862D4;
  --color-primary-600:#104FAD;--color-primary-700:#0A3C86;--color-primary-800:#062A60;--color-primary-900:#031940;
  --color-gray-0:#FFFFFF;--color-gray-50:#F7F8FA;--color-gray-100:#F0F1F5;--color-gray-200:#E3E6ED;
  --color-gray-300:#C6CBD8;--color-gray-400:#9CA3B0;--color-gray-500:#6B7280;--color-gray-600:#4B5563;
  --color-gray-700:#374151;--color-gray-800:#1F2937;--color-gray-900:#111827;
  --color-success:#1A9042;--color-warning:#D48A00;
  --text-title:var(--color-gray-900);--text-primary:var(--color-gray-800);--text-secondary:var(--color-gray-600);
  --text-tertiary:var(--color-gray-400);
  --border-color-light:var(--color-gray-200);
  --border-radius-sm:2px;--border-radius-md:4px;--border-radius-lg:6px;
  --bg-page:var(--color-gray-50);--bg-card:var(--color-gray-0);
  --shadow-sm:0 1px 2px rgba(0,0,0,0.06);--shadow-md:0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg:0 4px 16px rgba(0,0,0,0.10);
  --space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;
  --space-6:24px;--space-8:32px;--space-10:40px;--space-12:48px;--space-16:64px;
  --font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --font-size-xs:12px;--font-size-sm:13px;--font-size-md:14px;--font-size-lg:16px;
  --font-size-xl:18px;--font-size-2xl:20px;--font-size-3xl:24px;
  --font-weight-regular:400;--font-weight-medium:500;--font-weight-bold:600;
  --line-height-normal:1.6;
  --transition-fast:0.1s ease;--transition-normal:0.2s ease;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font-family);font-size:var(--font-size-md);color:var(--text-primary);background:var(--bg-page);line-height:var(--line-height-normal);-webkit-font-smoothing:antialiased;height:100%}

body{background:linear-gradient(180deg,#EBF2FF 0%,#F7F8FA 100%)}
.portal-wrapper{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:var(--space-6) var(--space-4)}

.portal-header{text-align:center;margin-bottom:var(--space-8)}
.portal-plan-btn{display:inline-block;margin-top:var(--space-4);padding:6px 16px;font-size:var(--font-size-sm);color:#fff;background:var(--color-primary-500);border-radius:var(--border-radius-md);text-decoration:none;transition:background var(--transition-fast)}.portal-plan-btn:hover{background:var(--color-primary-600)}
.portal-logo{width:48px;height:48px;background:var(--color-primary-500);border-radius:var(--border-radius-lg);display:flex;align-items:center;justify-content:center;margin:0 auto var(--space-5)}
.portal-logo svg{width:28px;height:28px;color:#fff}
.portal-title{font-size:24px;font-weight:var(--font-weight-bold);color:var(--text-title);letter-spacing:0.02em;margin-bottom:var(--space-1)}
.portal-subtitle{font-size:var(--font-size-sm);color:var(--text-secondary);font-weight:var(--font-weight-regular)}

.portal-cards{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4);max-width:680px;width:100%}
@media(max-width:600px){.portal-cards{grid-template-columns:1fr}}
.portal-card{flex:1;background:var(--bg-card);border:1px solid var(--border-color-light);border-radius:var(--border-radius-lg);padding:var(--space-6) var(--space-5);text-align:center;cursor:pointer;transition:all var(--transition-normal);text-decoration:none;color:var(--text-primary);display:flex;flex-direction:column;align-items:center;box-shadow:var(--shadow-sm)}
.portal-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--color-primary-300)}
.portal-card:hover .portal-card-icon{background:var(--color-primary-500);color:#fff;transform:scale(1.05)}
.portal-card-icon{width:44px;height:44px;background:var(--color-primary-50);border-radius:var(--border-radius-lg);display:flex;align-items:center;justify-content:center;margin-bottom:var(--space-4);transition:all var(--transition-normal);color:var(--color-primary-500)}
.portal-card-icon svg{width:22px;height:22px}
.portal-card-title{font-size:var(--font-size-lg);font-weight:var(--font-weight-bold);margin-bottom:var(--space-1)}
.portal-card-desc{font-size:var(--font-size-xs);color:var(--text-tertiary);line-height:var(--line-height-normal);margin-bottom:var(--space-3)}
.portal-card-roles{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.portal-card-role{font-size:var(--font-size-xs);color:var(--text-tertiary);background:var(--color-gray-100);padding:2px 8px;border-radius:var(--border-radius-sm)}

.portal-footer{margin-top:var(--space-8);text-align:center;font-size:var(--font-size-xs);color:var(--text-tertiary)}
</style>
</head>
