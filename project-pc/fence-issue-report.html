<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新增围挡问题 - 深圳市建设施工围挡数字化管理系统</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root {
  --color-primary-50:#EBF2FF;--color-primary-100:#C6D9FF;--color-primary-200:#9DBEFF;
  --color-primary-300:#6B9EF5;--color-primary-400:#3D7FED;--color-primary-500:#1862D4;
  --color-primary-600:#104FAD;--color-primary-700:#0A3C86;--color-primary-800:#062A60;--color-primary-900:#031940;
  --color-gray-0:#FFFFFF;--color-gray-50:#F7F8FA;--color-gray-100:#F0F1F5;--color-gray-200:#E3E6ED;
  --color-gray-300:#C6CBD8;--color-gray-400:#9CA3B0;--color-gray-500:#6B7280;--color-gray-600:#4B5563;
  --color-gray-700:#374151;--color-gray-800:#1F2937;--color-gray-900:#111827;
  --color-success:#1A9042;--color-success-light:#E6F4EA;--color-warning:#D48A00;--color-warning-light:#FEF3CD;
  --color-danger:#D13B2F;--color-danger-light:#FDECEA;--color-info:#1862D4;--color-info-light:#E8F3FF;
  --text-title:var(--color-gray-900);--text-primary:var(--color-gray-800);--text-secondary:var(--color-gray-600);
  --text-tertiary:var(--color-gray-400);--text-link:var(--color-primary-500);--text-inverse:#FFFFFF;
  --border-color-light:var(--color-gray-200);--border-color-default:var(--color-gray-300);--border-color-focus:var(--color-primary-500);
  --border-radius-sm:2px;--border-radius-md:4px;--border-radius-lg:6px;
  --bg-page:var(--color-gray-50);--bg-card:var(--color-gray-0);--bg-sidebar:#0D2B55;--bg-header:#FFFFFF;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.06);--shadow-md:0 2px 8px rgba(0,0,0,0.08);--shadow-card:0 1px 4px rgba(0,0,0,0.07);
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;
  --font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --font-size-xs:12px;--font-size-sm:13px;--font-size-md:14px;--font-size-lg:16px;--font-size-xl:18px;--font-size-2xl:20px;
  --font-weight-regular:400;--font-weight-medium:500;--font-weight-bold:600;
  --transition-fast:0.1s ease;--header-height:56px;--sidebar-width:220px;--height-md:32px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font-family);font-size:var(--font-size-md);color:var(--text-primary);background:#F5F6F8;line-height:1.6;-webkit-font-smoothing:antialiased;height:100%}
a{color:var(--text-link);text-decoration:none}::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--color-gray-300);border-radius:3px}

.layout-wrapper{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.layout-header{height:var(--header-height);background:var(--bg-header);display:flex;align-items:center;padding:0;position:fixed;top:0;left:0;right:0;z-index:100;box-shadow:var(--shadow-sm)}
.layout-header::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--color-primary-600),var(--color-primary-400),var(--color-primary-600))}
.header-logo{display:flex;align-items:center;gap:var(--space-4);padding:0 var(--space-6);height:100%;border-right:1px solid var(--color-gray-100)}
.header-logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--color-primary-500),var(--color-primary-700));border-radius:var(--border-radius-md);display:flex;align-items:center;justify-content:center;color:var(--text-inverse);box-shadow:0 2px 6px rgba(24,98,212,0.25)}
.header-logo-text{font-size:var(--font-size-xl);font-weight:var(--font-weight-bold);color:var(--text-title)}
.header-right{margin-left:auto;display:flex;align-items:center;height:100%;padding:0 var(--space-5)}
.header-action-group{display:flex;align-items:center;gap:2px;padding:0 var(--space-3);border-right:1px solid var(--color-gray-100);height:100%}
.header-action-btn{position:relative;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:var(--border-radius-md);cursor:pointer;background:none;border:none;color:var(--text-secondary)}
.header-action-btn:hover{background:var(--color-gray-50)}.header-action-btn svg{width:18px;height:18px}
.header-badge{position:absolute;top:4px;right:4px;min-width:16px;height:16px;background:var(--color-danger);color:#fff;font-size:10px;font-weight:var(--font-weight-bold);border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg-header)}
.header-user{display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);cursor:pointer;height:36px;border-radius:var(--border-radius-md)}
.header-user:hover{background:var(--color-gray-50)}.header-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--color-primary-100),var(--color-primary-200));display:flex;align-items:center;justify-content:center;font-size:var(--font-size-xs);color:var(--color-primary-700);font-weight:var(--font-weight-medium)}
.header-user-info{display:flex;flex-direction:column;line-height:1.3}.header-user-name{font-size:var(--font-size-sm);color:var(--text-primary)}.header-user-role{font-size:10px;color:var(--text-tertiary)}
.layout-body{display:flex;margin-top:var(--header-height);height:calc(100vh - var(--header-height));overflow:hidden}
.layout-sidebar{width:var(--sidebar-width);background:var(--bg-sidebar);height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column}
.nav-menu{list-style:none;padding:var(--space-4) 0;flex:1}
.nav-group-label{font-size:11px;color:rgba(255,255,255,0.35);letter-spacing:0.06em;padding:var(--space-3) var(--space-5) var(--space-1);font-weight:var(--font-weight-medium);text-transform:uppercase}
.nav-item{position:relative}
.nav-item a{display:flex;align-items:center;gap:var(--space-3);padding:0 var(--space-5);height:40px;font-size:var(--font-size-sm);color:rgba(255,255,255,0.65);transition:background var(--transition-fast),color var(--transition-fast);text-decoration:none}
.nav-item a:hover{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.9)}
.nav-item a.active{background:rgba(24,98,212,0.25);color:#FFF;font-weight:var(--font-weight-medium)}
.nav-item a.active::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:3px;background:#FFF;border-radius:0 2px 2px 0}
.nav-icon{width:16px;height:16px;flex-shrink:0;opacity:0.8}.nav-item a.active .nav-icon{opacity:1}
.sidebar-bottom{padding:var(--space-3) var(--space-5);border-top:1px solid rgba(255,255,255,0.06)}.sidebar-version{font-size:11px;color:rgba(255,255,255,0.2)}
.layout-main{flex:1;display:flex;flex-direction:column;min-height:0}
.breadcrumb{display:flex;align-items:center;gap:var(--space-1);font-size:var(--font-size-sm);padding:var(--space-3) var(--space-6) 0;color:var(--text-tertiary)}
.breadcrumb a{color:var(--text-tertiary)}.breadcrumb a:hover{color:var(--text-link)}.breadcrumb .sep{color:var(--color-gray-300)}.breadcrumb .current{color:var(--text-primary);font-weight:var(--font-weight-medium)}
.page-header-fixed{position:sticky;top:0;z-index:9;display:flex;align-items:center;justify-content:space-between;padding:var(--space-3) var(--space-6);border-bottom:1px solid var(--border-color-light);background:#F5F6F8}
.page-title{font-size:var(--font-size-2xl);font-weight:var(--font-weight-bold);color:var(--text-title);display:flex;align-items:center;gap:var(--space-2)}
.page-title-accent{width:3px;height:20px;background:var(--color-primary-500);border-radius:2px;display:inline-block}.page-header-actions{display:flex;gap:var(--space-2)}
.main-body{display:flex;flex:1;min-height:0}
.section-nav{width:150px;flex-shrink:0;overflow-y:auto;padding:var(--space-4) 0}
.section-nav-item{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);font-size:var(--font-size-sm);color:var(--text-secondary);cursor:pointer;border-left:3px solid transparent;transition:all var(--transition-fast);text-decoration:none}
.section-nav-item:hover{background:var(--color-gray-50);color:var(--text-primary)}
.section-nav-item.active{background:var(--color-primary-50);color:var(--color-primary-600);font-weight:var(--font-weight-medium);border-left-color:var(--color-primary-500)}
.section-nav-num{width:20px;height:20px;border-radius:50%;background:var(--color-gray-200);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:var(--font-weight-bold);flex-shrink:0}
.section-nav-item.active .section-nav-num{background:var(--color-primary-500);color:#fff}
.form-content{flex:1;min-width:0;padding:var(--space-4) var(--space-6);overflow-y:auto}
.form-content::-webkit-scrollbar{width:5px}.form-content::-webkit-scrollbar-thumb{background:var(--color-gray-300);border-radius:3px}
.card{background:var(--bg-card);border:1px solid var(--border-color-light);border-radius:var(--border-radius-lg);box-shadow:var(--shadow-card);overflow:hidden;margin-bottom:var(--space-5)}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:var(--space-4) var(--space-6);border-bottom:1px solid var(--border-color-light);background:var(--color-gray-50)}
.card-title{font-size:var(--font-size-lg);font-weight:var(--font-weight-bold);color:var(--text-title);display:flex;align-items:center;gap:var(--space-2)}
.card-title-dot{width:4px;height:16px;background:var(--color-primary-500);border-radius:2px;display:inline-block}.card-body{padding:var(--space-6)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 var(--space-8);max-width:860px;margin:0 auto}
.form-item{display:flex;flex-direction:column;gap:var(--space-1);margin-bottom:var(--space-5)}.form-item.full{grid-column:1/-1}
.form-label{font-size:var(--font-size-sm);color:var(--text-primary);font-weight:var(--font-weight-medium);display:flex;align-items:center;gap:var(--space-1)}
.form-label .required{color:var(--color-danger)}
.form-select,.form-input,.form-textarea{height:var(--height-md);padding:0 var(--space-3);font-size:var(--font-size-sm);color:var(--text-primary);background:var(--bg-card);border:1px solid var(--border-color-default);border-radius:var(--border-radius-md);outline:none;width:100%;font-family:var(--font-family);transition:border-color var(--transition-fast),box-shadow var(--transition-fast)}
.form-select:focus,.form-input:focus,.form-textarea:focus{border-color:var(--border-color-focus);box-shadow:0 0 0 2px var(--color-primary-50)}
.form-select:disabled,.form-input:disabled{background:var(--color-gray-100);color:var(--text-tertiary);cursor:not-allowed}
.form-textarea{height:auto;padding:var(--space-3);resize:vertical;min-height:90px;line-height:1.6}.form-hint{font-size:var(--font-size-xs);color:var(--text-tertiary);margin-top:4px}
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-2)}
.type-chip{border:1.5px solid var(--border-color-light);border-radius:var(--border-radius-md);padding:10px 8px;text-align:center;font-size:var(--font-size-sm);color:var(--text-secondary);cursor:pointer;background:var(--bg-card);transition:all var(--transition-fast)}
.type-chip:hover{border-color:var(--color-primary-300)}.type-chip.selected{border-color:var(--color-primary-500);background:var(--color-primary-50);color:var(--color-primary-500);font-weight:var(--font-weight-bold)}
.fence-info-card{background:var(--bg-card);border:1px solid var(--border-color-light);border-radius:var(--border-radius-lg);overflow:hidden}
.fence-info-hd{background:linear-gradient(135deg,var(--color-primary-50),var(--color-primary-100));padding:8px 16px;font-size:var(--font-size-sm);font-weight:var(--font-weight-bold);color:var(--color-primary-600);display:flex;align-items:center;gap:4px}
.fence-info-bd{padding:12px 16px}
.fence-info-row{display:flex;justify-content:space-between;padding:4px 0;font-size:var(--font-size-sm)}.fence-info-row+.fence-info-row{border-top:1px solid var(--border-color-light)}
.fence-info-lbl{color:var(--text-tertiary)}.fence-info-val{color:var(--text-primary);font-weight:var(--font-weight-medium)}
.fence-info-map{width:100%;height:130px;border-radius:var(--border-radius-sm);overflow:hidden;margin-top:8px}
.fence-info-units{font-size:var(--font-size-xs);color:var(--text-tertiary);padding:8px 0 0;line-height:1.8}
.photo-row{display:flex;flex-wrap:wrap;gap:8px}
.photo-add{width:80px;height:80px;border:1.5px dashed var(--border-color-default);border-radius:var(--border-radius-md);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--text-tertiary);font-size:11px;gap:3px;background:var(--bg-card);transition:all var(--transition-fast)}
.photo-add:hover{border-color:var(--color-primary-300);color:var(--color-primary-500)}
.photo-thumb{width:80px;height:80px;border-radius:var(--border-radius-md);overflow:hidden;position:relative;border:1px solid var(--border-color-light)}
.photo-thumb img{width:100%;height:100%;object-fit:cover}.photo-thumb .del{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,0.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer}
.loc-display{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg-card);border:1px solid var(--color-primary-300);border-radius:var(--border-radius-md);font-size:var(--font-size-sm);color:var(--color-primary-600);cursor:pointer;font-weight:var(--font-weight-medium)}
.loc-display:hover{border-color:var(--color-primary-500)}.loc-display svg{flex-shrink:0}.loc-display:active{background:var(--color-primary-50)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:var(--height-md);padding:0 var(--space-4);font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);border-radius:var(--border-radius-md);border:1px solid transparent;cursor:pointer;transition:all var(--transition-fast);white-space:nowrap;font-family:var(--font-family)}
.btn:active{transform:translateY(1px)}.btn:disabled{opacity:0.5;cursor:not-allowed}
.btn-primary{background:var(--color-primary-500);color:#fff;box-shadow:0 1px 3px rgba(24,98,212,0.2)}.btn-primary:hover{background:var(--color-primary-600)}
.btn-ghost{background:transparent;color:var(--text-secondary);border-color:var(--border-color-default)}.btn-ghost:hover{background:var(--color-gray-100);color:var(--text-primary)}
/* Location overlay */
.loc-overlay{position:fixed;inset:0;background:var(--bg-page);z-index:300;display:flex;flex-direction:column}
.loc-overlay-hd{display:flex;align-items:center;justify-content:space-between;padding:48px var(--space-4) 0;background:var(--color-primary-500);flex-shrink:0}
.loc-overlay-hd .back-btn{display:flex;align-items:center;gap:3px;background:none;border:none;color:#fff;font-size:var(--font-size-md);cursor:pointer;padding:10px 6px}
.loc-overlay-hd .ttl{font-size:var(--font-size-lg);font-weight:var(--font-weight-bold);color:#fff}
.loc-overlay-hd .ok-btn{background:rgba(255,255,255,0.95);border:none;color:var(--color-primary-600);padding:6px 14px;border-radius:20px;font-size:var(--font-size-sm);cursor:pointer;font-weight:var(--font-weight-bold)}
.loc-overlay-status{padding:5px var(--space-4) 8px;background:var(--color-primary-500);color:rgba(255,255,255,0.85);font-size:var(--font-size-xs);display:flex;align-items:center;gap:4px}
.loc-overlay-status .dot{width:5px;height:5px;background:#4ADE80;border-radius:50%;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.loc-overlay-map{flex:1;position:relative;overflow:hidden}.loc-overlay-map .leaflet-container{width:100%;height:100%}
.loc-overlay-curr{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:500;background:rgba(0,0,0,0.6);color:#fff;padding:5px 14px;border-radius:20px;font-size:var(--font-size-xs);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:4px;border:none;font-family:var(--font-family)}
.loc-overlay-curr:active{background:rgba(0,0,0,0.8)}
.loc-overlay-cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:500}.loc-overlay-cross svg{width:34px;height:34px;color:var(--color-danger);filter:drop-shadow(0 2px 4px rgba(0,0,0,0.35))}
.loc-overlay-legend{position:absolute;top:8px;right:8px;z-index:500;background:rgba(255,255,255,0.94);border-radius:6px;padding:4px 10px;font-size:10px;line-height:1.9;pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,0.08)}
</style>
</head>

function renderFenceInfo(fence,project){var card=document.getElementById('fenceInfoCard'),wrap=document.getElementById('fenceInfoWrap');wrap.style.display='';if(!fence){card.innerHTML='<div class="fence-info-card"><div class="fence-info-hd">围挡信息</div><div style="padding:20px;text-align:center;font-size:var(--font-size-sm);color:var(--text-tertiary)">该工程暂无围挡记录</div></div>';return;}var now=new Date(),plan=new Date(fence.planRemoveDate||fence.custodyEnd);var days=Math.ceil((plan-now)/86400000),daysTxt=days>0?days+' 天':'已到期 '+Math.abs(days)+' 天';card.innerHTML='<div class="fence-info-card"><div class="fence-info-hd">围挡信息 — '+esc(fence.id)+'</div><div class="fence-info-bd"><div class="fence-info-row"><span class="fence-info-lbl">围挡长度</span><span class="fence-info-val">'+(fence.length||'--')+' m</span></div><div class="fence-info-row"><span class="fence-info-lbl">围挡高度</span><span class="fence-info-val">'+(fence.height||'--')+' m</span></div><div class="fence-info-row"><span class="fence-info-lbl">距拆除时间</span><span class="fence-info-val" style="color:'+(days<=30?'var(--color-warning)':days<0?'var(--color-danger)':'')+'">'+daysTxt+'</span></div><div class="fence-info-map" id="fencePrevMap"></div><div class="fence-info-units"><div>建设单位：'+esc((project&&project.buildUnit)||'--')+'</div><div>施工单位：'+esc((project&&project.constructUnit)||'--')+'</div><div>监理单位：'+esc((project&&project.supervisorUnit)||'--')+'</div></div></div></div>';setTimeout(function(){renderFencePrevMap(fence,project);},200);}

function openLocPicker(){var ov=document.createElement('div');ov.className='loc-overlay';ov.id='locPickerOv';var pn=document.getElementById('rptProject').value,en=document.getElementById('rptEngineer').value;var fence=null,project=null;if(pn&&en){var all=MOCK_DATA.getHoardings();for(var i=0;i<all.length;i++){if(all[i].projectName===pn&&all[i].engineerName===en){fence=all[i];break}}project=MOCK_DATA.getProjects().find(function(p){return p.name===pn});}if(!fence){var a2=MOCK_DATA.getHoardings();if(a2.length){fence=a2[0];project=MOCK_DATA.getProjects()[0];}}ov.innerHTML='<div class="loc-overlay-hd"><button class="back-btn" onclick="document.getElementById(\'locPickerOv\').remove()">&larr; 返回</button><span class="ttl">选择问题位置</span><button class="ok-btn" onclick="confirmLoc()">确定</button></div><div class="loc-overlay-status"><span class="dot"></span>拖动地图，将十字准星对准问题位置</div><div class="loc-overlay-map"><div id="locPickerMap" style="position:absolute;inset:0"></div><div class="loc-overlay-legend"><span style="color:#D13B2F">—</span> 项目红线  <span style="color:#1862D4">—</span> 围挡范围  <span style="color:#1A9042">●</span> 出入口</div><div class="loc-overlay-cross"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 010-5 2.5 2.5 0 010 5z"/></svg></div><button class="loc-overlay-curr" onclick="useCurrLoc()">⊙ 当前位置</button></div>';document.querySelector('.layout-wrapper').appendChild(ov);setTimeout(function(){var el=document.getElementById('locPickerMap');if(!el)return;var m=L.map(el,{zoomControl:true,attributionControl:false});m.zoomControl.setPosition('bottomright');L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(m);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,opacity:0.4}).addTo(m);if(project&&project.redlineGeo&&project.redlineGeo.length>=3)L.polygon(project.redlineGeo,{color:'#D13B2F',weight:2,fillOpacity:0.06,fillColor:'#D13B2F'}).addTo(m);if(fence&&fence.gpsShape&&fence.gpsShape.length>=2){if(fence.gpsShape.length===2)L.polyline(fence.gpsShape,{color:'#1862D4',weight:2}).addTo(m);else L.polygon(fence.gpsShape,{color:'#1862D4',weight:2,fillOpacity:0.08,fillColor:'#1862D4',dashArray:'6 3'}).addTo(m);}if(fence&&fence.entrances)fence.entrances.forEach(function(e){var c=e.type==='vehicle'?'#1862D4':e.type==='pedestrian'?'#1A9042':e.type==='temporary'?'#f0832c':'#D13B2F';L.circleMarker([e.lat,e.lng],{radius:4,color:c,fillColor:c,fillOpacity:0.6,weight:1.5}).addTo(m);});var clat=_location.lat||22.548,clng=_location.lng||114.061;if(fence&&fence.gpsShape&&fence.gpsShape.length>0){clat=fence.gpsShape[0][0];clng=fence.gpsShape[0][1];}m.setView([clat,clng],16);_pickerMap=m;},200);}
function confirmLoc(){var m=_pickerMap;if(!m)return;var c=m.getCenter();_location.lat=c.lat;_location.lng=c.lng;_location.addr=c.lat.toFixed(6)+', '+c.lng.toFixed(6);_location.picked=true;document.getElementById('locText').textContent=_location.addr;document.getElementById('locPickerOv').remove();showToast('位置已确认');}
function useCurrLoc(){var m=_pickerMap;if(!m)return;if(navigator.geolocation){navigator.geolocation.getCurrentPosition(function(pos){m.setView([pos.coords.latitude,pos.coords.longitude],17);showToast('已定位到当前位置');},function(){showToast('获取定位失败，请手动选择');},{timeout:8000,enableHighAccuracy:true});}else{showToast('设备不支持定位');}}

/* Submit */
function submitReport(){
  if(!_issueType){showToast('请选择问题类型');return;}
  var isNotBuilt=_issueType==='应建未建围挡';
  if(isNotBuilt){
    var isReported=document.querySelector('input[name="rptIsReported"]:checked');
    if(!isReported){showToast('请选择项目工程是否已报建');return;}
    if(isReported.value==='是'){
      // Normal flow - need project data
    }else{
      var street=document.getElementById('rptStreet').value;
      if(!street){showToast('请选择所属街道');return;}
      var detail=document.getElementById('rptDetail').value.trim();
      if(!detail){showToast('请填写问题详情');return;}
      if(_photos.length===0){showToast('请至少上传一张照片');return;}
      if(!_location.picked){showToast('请选择问题位置');return;}
      MOCK_DATA.addStreetIssue({street:(fence?fence.projectStreet:''),type:_issueType,fenceId:'',fenceAddr:street,details:detail,photos:_photos.slice(),location:{lat:_location.lat,lng:_location.lng,addr:_location.addr},projectName:'',engineerName:'',responsibleUnit:'',source:'项目巡检',street:street});
      showToast('问题已上报成功');setTimeout(function(){window.location.href='fence-issue-list.html';},1200);return;}}var pn=document.getElementById('rptProject').value;if(!pn){showToast('请选择关联项目');return;}var en=document.getElementById('rptEngineer').value;if(!en){showToast('请选择关联工程');return;}var unit=document.getElementById('rptRespUnit').value;if(!unit){showToast('请选择责任单位');return;}var detail=document.getElementById('rptDetail').value.trim();if(!detail){showToast('请填写问题详情');return;}if(_photos.length===0){showToast('请至少上传一张照片');return;}if(!_location.picked){showToast('请选择问题位置');return;}var fence=null,all=MOCK_DATA.getHoardings();for(var i=0;i<all.length;i++){if(all[i].projectName===pn&&all[i].engineerName===en){fence=all[i];break}}MOCK_DATA.addStreetIssue({street:(fence?fence.projectStreet:''),type:_issueType,fenceId:fence?fence.id:'',fenceAddr:fence?fence.address:pn,details:detail,photos:_photos.slice(),location:{lat:_location.lat,lng:_location.lng,addr:_location.addr},projectName:pn,engineerName:en,responsibleUnit:unit,source:'项目巡检'});showToast('问题已上报成功');setTimeout(function(){window.location.href='fence-issue-list.html';},1200);}

function showToast(m){var d=document.createElement('div');d.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.8);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:9999';d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove();},2000);}

renderTypeGrid();initProjectSelect();initDistrictSelect();
(function(){var navs=document.querySelectorAll('.section-nav-item'),fc=document.getElementById('formContent');navs.forEach(function(n){n.addEventListener('click',function(e){e.preventDefault();var el=document.getElementById(this.getAttribute('data-sec'));if(el)el.scrollIntoView({behavior:'smooth',block:'start'});});});fc.addEventListener('scroll',function(){var st=fc.scrollTop;navs.forEach(function(n){var el=document.getElementById(n.getAttribute('data-sec'));if(el)n.classList.toggle('active',st+120>=el.offsetTop-fc.offsetTop);});});})();
</script>
