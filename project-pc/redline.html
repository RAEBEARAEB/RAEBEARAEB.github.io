<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目红线管理 - 深圳市建设施工围挡数字化管理系统</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ═══ Design Token ═══ */
:root {
  --color-primary-50:#EBF2FF;--color-primary-100:#C6D9FF;--color-primary-200:#9DBEFF;
  --color-primary-300:#6B9EF5;--color-primary-400:#3D7FED;--color-primary-500:#1862D4;
  --color-primary-600:#104FAD;--color-primary-700:#0A3C86;--color-primary-800:#062A60;--color-primary-900:#031940;
  --color-gray-0:#FFFFFF;--color-gray-50:#F7F8FA;--color-gray-100:#F0F1F5;--color-gray-200:#E3E6ED;
  --color-gray-300:#C6CBD8;--color-gray-400:#9CA3B0;--color-gray-500:#6B7280;--color-gray-600:#4B5563;
  --color-gray-700:#374151;--color-gray-800:#1F2937;--color-gray-900:#111827;
  --color-success-light:#E6F4EA;--color-success:#1A9042;--color-success-dark:#136B31;
  --color-warning-light:#FEF3CD;--color-warning:#D48A00;--color-warning-dark:#9E6600;
  --color-danger-light:#FDECEA;--color-danger:#D13B2F;--color-danger-dark:#9E2C22;
  --color-info-light:#E8F3FF;--color-info:#1862D4;--color-info-dark:#104FAD;
  --text-title:var(--color-gray-900);--text-primary:var(--color-gray-800);--text-secondary:var(--color-gray-600);
  --text-tertiary:var(--color-gray-400);--text-link:var(--color-primary-500);--text-link-hover:var(--color-primary-600);--text-inverse:#FFFFFF;
  --border-color-light:var(--color-gray-200);--border-color-default:var(--color-gray-300);--border-color-focus:var(--color-primary-500);
  --border-radius-sm:2px;--border-radius-md:4px;--border-radius-lg:6px;--border-radius-tag:2px;
  --bg-page:var(--color-gray-50);--bg-card:var(--color-gray-0);--bg-table-head:var(--color-gray-100);
  --bg-table-stripe:var(--color-gray-50);--bg-sidebar:#0D2B55;--bg-header:#FFFFFF;--bg-overlay:rgba(0,0,0,0.45);
  --shadow-sm:0 1px 2px rgba(0,0,0,0.04);--shadow-md:0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg:0 4px 16px rgba(0,0,0,0.08);--shadow-card:0 1px 4px rgba(0,0,0,0.05);
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;
  --space-6:24px;--space-8:32px;--space-10:40px;--space-12:48px;
  --font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --font-size-xs:12px;--font-size-sm:13px;--font-size-md:14px;--font-size-lg:16px;
  --font-size-xl:18px;--font-size-2xl:20px;--font-size-3xl:24px;
  --font-weight-regular:400;--font-weight-medium:500;--font-weight-bold:600;
  --line-height-tight:1.4;--line-height-normal:1.6;--line-height-loose:1.8;
  --transition-fast:0.15s ease;--transition-normal:0.2s ease;
  --height-sm:28px;--height-md:32px;--height-lg:36px;
  --header-height:56px;--sidebar-width:220px;
}
.leaflet-container{font-family:var(--font-family)!important;background:#E8ECF2}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font-family);font-size:var(--font-size-md);color:var(--text-primary);background:var(--bg-page);line-height:var(--line-height-normal);-webkit-font-smoothing:antialiased;height:100%}
a{color:var(--text-link);text-decoration:none;transition:color var(--transition-fast)}
a:hover{color:var(--text-link-hover)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--color-gray-300);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--color-gray-400)}

/* ═══ 布局 ═══ */
.layout-wrapper{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.layout-header{height:var(--header-height);background:var(--bg-header);display:flex;align-items:center;padding:0;position:fixed;top:0;left:0;right:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.layout-header::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--color-primary-600),var(--color-primary-400),var(--color-primary-600))}
.header-logo{display:flex;align-items:center;gap:var(--space-4);padding:0 var(--space-6);height:100%;border-right:1px solid var(--color-gray-100)}
.header-logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--color-primary-500),var(--color-primary-700));border-radius:var(--border-radius-md);display:flex;align-items:center;justify-content:center;color:var(--text-inverse);box-shadow:0 2px 6px rgba(24,98,212,0.25)}
.header-logo-text{font-size:var(--font-size-xl);font-weight:var(--font-weight-bold);color:var(--text-title);letter-spacing:0.02em}
.header-right{margin-left:auto;display:flex;align-items:center;gap:0;height:100%;padding:0 var(--space-5)}
.header-action-group{display:flex;align-items:center;gap:2px;padding:0 var(--space-3);border-right:1px solid var(--color-gray-100);height:100%}
.header-action-btn{position:relative;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:var(--border-radius-md);cursor:pointer;transition:background var(--transition-fast);background:none;border:none;color:var(--text-secondary)}
.header-action-btn:hover{background:var(--color-gray-50);color:var(--text-primary)}
.header-action-btn svg{width:18px;height:18px}
.header-badge{position:absolute;top:4px;right:4px;min-width:16px;height:16px;background:var(--color-danger);color:var(--text-inverse);font-size:10px;font-weight:var(--font-weight-bold);border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;line-height:1;border:2px solid var(--bg-header)}
.header-user{display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);cursor:pointer;height:36px;border-radius:var(--border-radius-md);transition:background var(--transition-fast)}
.header-user:hover{background:var(--color-gray-50)}
.header-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--color-primary-100),var(--color-primary-200));display:flex;align-items:center;justify-content:center;font-size:var(--font-size-xs);color:var(--color-primary-700);font-weight:var(--font-weight-medium)}
.header-user-info{display:flex;flex-direction:column;line-height:1.3}
.header-user-name{font-size:var(--font-size-sm);color:var(--text-primary);font-weight:var(--font-weight-medium)}
.header-user-role{font-size:10px;color:var(--text-tertiary)}
.layout-body{display:flex;margin-top:var(--header-height);height:calc(100vh - var(--header-height));overflow:hidden}
.layout-sidebar{width:var(--sidebar-width);background:var(--bg-sidebar);height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column}
.nav-menu{list-style:none;padding:var(--space-4) 0;flex:1}
.nav-group-label{padding:var(--space-5) var(--space-5) var(--space-1);font-size:11px;color:rgba(255,255,255,0.25);letter-spacing:0.08em;font-weight:var(--font-weight-medium);text-transform:uppercase}
.nav-item{position:relative}
.nav-item a{display:flex;align-items:center;gap:var(--space-3);padding:0 var(--space-5);height:40px;font-size:var(--font-size-sm);color:rgba(255,255,255,0.55);transition:all var(--transition-fast);text-decoration:none;position:relative}
.nav-item a:hover{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.85)}
.nav-item a.active{background:rgba(24,98,212,0.25);color:#FFFFFF;font-weight:var(--font-weight-medium)}
.nav-item a.active::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:3px;background:#FFFFFF;border-radius:0 2px 2px 0}
.nav-icon{width:16px;height:16px;flex-shrink:0;opacity:0.7}
.nav-item a.active .nav-icon{opacity:1}
.sidebar-bottom{padding:var(--space-3) var(--space-5);border-top:1px solid rgba(255,255,255,0.06)}
.sidebar-version{font-size:11px;color:rgba(255,255,255,0.2)}
.layout-main{flex:1;overflow-y:auto;padding:var(--space-4) var(--space-6);background:var(--bg-page);display:flex;flex-direction:column}

.breadcrumb{display:flex;align-items:center;gap:var(--space-1);font-size:var(--font-size-sm);margin-bottom:var(--space-2);flex-shrink:0}
.breadcrumb-item{color:var(--text-tertiary)}
.breadcrumb-item a{color:var(--text-tertiary)}
.breadcrumb-item a:hover{color:var(--text-link)}
.breadcrumb-item:last-child{color:var(--text-secondary);font-weight:var(--font-weight-medium)}
.breadcrumb-sep{color:var(--color-gray-300);font-size:11px}
.page-header{margin-bottom:var(--space-3);flex-shrink:0}
.page-title{font-size:var(--font-size-2xl);font-weight:var(--font-weight-bold);color:var(--text-title);line-height:var(--line-height-tight)}
.page-title-accent{display:inline-block;width:3px;height:20px;background:var(--color-primary-500);border-radius:2px;margin-right:var(--space-2);vertical-align:middle;position:relative;top:-1px}

/* ═══ 选择器 ═══ */
.selector-bar{display:flex;gap:var(--space-4);align-items:flex-end;padding:var(--space-3) var(--space-5);background:var(--bg-card);border:1px solid var(--border-color-light);border-radius:var(--border-radius-lg);margin-bottom:var(--space-3);box-shadow:var(--shadow-card);position:relative;flex-shrink:0}
.selector-bar::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--color-primary-500);border-radius:var(--border-radius-lg) 0 0 var(--border-radius-lg)}
.selector-item{display:flex;flex-direction:column;gap:var(--space-1)}
.selector-label{font-size:var(--font-size-xs);color:var(--text-secondary);font-weight:var(--font-weight-medium);letter-spacing:0.02em}
.selector-select{height:var(--height-md);padding:0 var(--space-3);font-size:var(--font-size-sm);color:var(--text-primary);background:var(--bg-card);border:1px solid var(--border-color-default);border-radius:var(--border-radius-md);outline:none;width:200px;font-family:var(--font-family);transition:all var(--transition-fast);cursor:pointer}
.selector-select:hover{border-color:var(--color-primary-300)}
.selector-select:focus{border-color:var(--border-color-focus);box-shadow:0 0 0 2px var(--color-primary-50)}
.selector-actions{margin-left:auto;display:flex;gap:var(--space-2);align-items:center}

/* ═══ 按钮 ═══ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-1);height:var(--height-md);padding:0 var(--space-4);font-size:var(--font-size-md);font-weight:var(--font-weight-medium);border-radius:var(--border-radius-md);border:1px solid transparent;cursor:pointer;transition:all var(--transition-fast);white-space:nowrap;line-height:1;outline:none;font-family:var(--font-family)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:0.5;cursor:not-allowed;pointer-events:none}
.btn-primary{background:var(--color-primary-500);color:var(--text-inverse);border-color:var(--color-primary-500)}
.btn-primary:hover{background:var(--color-primary-600);border-color:var(--color-primary-600)}
.btn-secondary{background:transparent;color:var(--color-primary-500);border-color:var(--color-primary-500)}
.btn-secondary:hover{background:var(--color-primary-50)}
.btn-ghost{background:transparent;color:var(--text-secondary);border-color:var(--border-color-default)}
.btn-ghost:hover{background:var(--color-gray-100);color:var(--text-primary)}
.btn-danger{background:var(--color-danger);color:var(--text-inverse);border-color:var(--color-danger)}
.btn-danger:hover{background:var(--color-danger-dark);border-color:var(--color-danger-dark)}
.btn-sm{height:var(--height-sm);padding:0 var(--space-3);font-size:var(--font-size-sm)}
.btn svg{width:14px;height:14px}

/* ═══ 标签 ═══ */
.tag{display:inline-flex;align-items:center;padding:0 var(--space-2);height:20px;font-size:var(--font-size-xs);font-weight:var(--font-weight-medium);border-radius:var(--border-radius-tag);border:1px solid transparent;white-space:nowrap}
.tag-success{background:var(--color-success-light);color:var(--color-success-dark);border-color:#B7DEC3}
.tag-default{background:var(--color-gray-100);color:var(--text-secondary);border-color:var(--border-color-light)}

/* ═══ 详情卡片 ═══ */
.card{background:var(--bg-card);border:1px solid var(--border-color-light);border-radius:var(--border-radius-lg);box-shadow:var(--shadow-card);padding:var(--space-4) var(--space-5);margin-bottom:0;flex:1;display:flex;flex-direction:column;min-height:0}
#detailContent{display:none;flex:1;min-height:0;flex-direction:column}
#detailContent.show{display:flex}
.detail-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--space-4)}
.detail-info{flex-shrink:0}
.detail-grid{display:flex;gap:var(--space-4) var(--space-8);flex-wrap:wrap}
.detail-item{display:flex;flex-direction:column;gap:var(--space-1);min-width:130px}
.detail-label{font-size:var(--font-size-xs);color:var(--text-tertiary)}
.detail-value{font-size:var(--font-size-md);color:var(--text-primary);font-weight:var(--font-weight-medium)}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;color:var(--text-tertiary);gap:var(--space-3)}
.empty-state svg{width:48px;height:48px;opacity:0.25}
.detail-map-wrap{display:none;flex:1;min-height:0}
.detail-map-wrap.show{display:flex;flex-direction:column}
.detail-map{width:100%;flex:1;min-height:360px;border-radius:var(--border-radius-md);border:1px solid var(--border-color-light);overflow:hidden}
.detail-map-info{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-1) var(--space-3);margin-top:var(--space-1);background:var(--color-gray-50);border-radius:var(--border-radius-md);font-size:var(--font-size-xs);color:var(--text-secondary);flex-shrink:0}

/* ═══ 弹窗 ═══ */
.modal-overlay{position:fixed;inset:0;background:var(--bg-overlay);z-index:1000;display:flex;align-items:center;justify-content:center}
.modal{background:var(--bg-card);border-radius:var(--border-radius-lg);box-shadow:var(--shadow-lg);width:560px;max-width:90vw;max-height:80vh;display:flex;flex-direction:column}
.modal-sm{width:420px}
.modal-header{padding:var(--space-5) var(--space-6);border-bottom:1px solid var(--border-color-light);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-title{font-size:var(--font-size-xl);font-weight:var(--font-weight-bold);color:var(--text-title)}
.modal-close{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:var(--border-radius-md);cursor:pointer;background:none;border:none;color:var(--text-tertiary)}
.modal-close:hover{background:var(--color-gray-100);color:var(--text-primary)}
.modal-body{padding:var(--space-6);overflow-y:auto;flex:1}
.modal-footer{padding:var(--space-4) var(--space-6);border-top:1px solid var(--border-color-light);display:flex;justify-content:flex-end;gap:var(--space-3);flex-shrink:0}

/* ═══ 删除确认弹窗 ═══ */
.confirm-icon{width:48px;height:48px;border-radius:50%;background:var(--color-danger-light);display:flex;align-items:center;justify-content:center;margin:0 auto var(--space-4)}
.confirm-icon svg{width:24px;height:24px;color:var(--color-danger)}
.confirm-text{text-align:center;font-size:var(--font-size-lg);font-weight:var(--font-weight-medium);color:var(--text-title);margin-bottom:var(--space-4)}
.confirm-info{background:var(--color-gray-50);border:1px solid var(--border-color-light);border-radius:var(--border-radius-md);padding:var(--space-4);margin-bottom:var(--space-4)}
.confirm-info-row{display:flex;gap:var(--space-6)}
.confirm-info-label{font-size:var(--font-size-xs);color:var(--text-tertiary)}
.confirm-info-value{font-size:var(--font-size-md);color:var(--text-primary);font-weight:var(--font-weight-medium)}
.confirm-warning{margin-top:var(--space-3);font-size:var(--font-size-xs);color:var(--color-warning-dark)}

/* ═══ Toast ═══ */
.toast{position:fixed;top:var(--space-6);left:50%;transform:translateX(-50%);z-index:2000;padding:var(--space-3) var(--space-6);background:var(--color-success);color:#fff;font-size:var(--font-size-sm);border-radius:var(--border-radius-md);box-shadow:var(--shadow-lg);display:none;align-items:center;gap:var(--space-2)}
.toast.show{display:flex}
.toast.error{background:var(--color-danger)}

/* ═══ 变更记录弹窗 ═══ */
.ch-modal .modal{width:900px;max-width:95vw;max-height:85vh}
.timeline{padding:0;position:relative}
.timeline::before{content:'';position:absolute;left:15px;top:0;bottom:0;width:2px;background:var(--border-color-default)}
.timeline-card{position:relative;padding-left:40px;margin-bottom:24px}
.timeline-card:last-child{margin-bottom:0}
.timeline-dot{position:absolute;left:10px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--color-primary-500);border:2px solid #fff;box-shadow:0 0 0 2px var(--color-primary-200)}
.timeline-dot.first{background:var(--color-success);box-shadow:0 0 0 2px rgba(26,144,66,0.2)}
.ch-time{font-size:var(--font-size-sm);color:var(--text-secondary);margin-bottom:2px}
.ch-type{font-size:11px;color:var(--color-primary-500);font-weight:var(--font-weight-medium);margin-left:var(--space-2)}
.ch-meta{font-size:var(--font-size-xs);color:var(--text-tertiary);margin-bottom:var(--space-2);display:flex;gap:var(--space-4)}
.ch-maps{display:flex;gap:var(--space-3)}
.ch-map-wrap{flex:1;min-width:0}
.ch-map-label{font-size:11px;color:var(--text-tertiary);margin-bottom:4px;font-weight:var(--font-weight-medium)}
.ch-map{width:100%;height:180px;border-radius:var(--border-radius-md);border:1px solid var(--border-color-light);overflow:hidden}
.ch-empty-map{width:100%;height:180px;border-radius:var(--border-radius-md);border:1px dashed var(--border-color-default);display:flex;align-items:center;justify-content:center;font-size:var(--font-size-xs);color:var(--text-tertiary);background:var(--color-gray-50)}
</style>
<script src="../shared_data.js"></script>
</head>

var previewMap = null, previewPolygons = [];

function normalizeGeo(g) {
  if (!g || !g.length) return [];
  // New format: array of shape objects {type, points}
  if (g[0] && g[0].type && g[0].points) {
    return g.filter(function(s) { return s.type !== 'line' && s.points && s.points.length >= 3; })
            .map(function(s) { return s.points; });
  }
  // Old format: array of coordinate rings
  if (!Array.isArray(g[0][0])) return [g];
  return g;
}

function initPreviewMap() {
  if (previewMap) return;
  previewMap = L.map('redlineMap', { zoomControl: false }).setView([22.55, 114.05], 12);
  L.control.zoom({ position: 'bottomright' }).addTo(previewMap);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri', maxZoom: 19 }).addTo(previewMap);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(previewMap);
}

function renderPreviewMap(geo) {
  var geoPolygons = normalizeGeo(geo);
  var hasPoly = geoPolygons.length > 0 && geoPolygons[0].length >= 3;
  var wrap = document.getElementById('detailMapWrap');
  if (!hasPoly) { wrap.classList.remove('show'); clearPreviewMap(); return; }
  wrap.classList.add('show');
  initPreviewMap();
  setTimeout(function() {
    previewMap.invalidateSize();
    previewPolygons.forEach(function(l) { previewMap.removeLayer(l); });
    previewPolygons = [];
    var group = L.featureGroup();
    geoPolygons.forEach(function(pts) {
      if (pts.length < 3) return;
      var poly = L.polygon(pts, { color: '#D13B2F', weight: 2.5, fillColor: 'rgba(209,59,47,0.2)', fillOpacity: 0.5 }).addTo(previewMap);
      previewPolygons.push(poly);
      group.addLayer(poly);
    });
    try { previewMap.fitBounds(group.getBounds(), { padding: [30, 30], maxZoom: 17 }); } catch(e) {}
    var totalArea = geoPolygons.reduce(function(s, pts) { return s + calcPolygonArea(pts); }, 0);
    document.getElementById('detailMapInfo').textContent = '红线范围已绘制（' + geoPolygons.length + ' 个范围）';
  }, 200);
}

function clearPreviewMap() {
  previewPolygons.forEach(function(l) { if (previewMap) previewMap.removeLayer(l); });
  previewPolygons = [];
}

function calcPolygonArea(pts) {
  if (!pts || pts.length < 3) return 0;
  var area = 0;
  for (var i = 0; i < pts.length; i++) {
    var j = (i + 1) % pts.length;
    area += pts[i][0] * pts[j][1] - pts[j][0] * pts[i][1];
  }
  return Math.abs(area) * 111320 * 111320 * Math.cos(pts[0][0] * Math.PI / 180) / 2;
}

function initChMaps(records){
  records.forEach(function(rec,i){
    if(rec.before&&rec.before.length>0&&rec.before[0].length>=3){
      var el=document.getElementById('ch-before-'+i);
      if(el){
        var m=L.map(el,{zoomControl:false,attributionControl:false}).setView([22.55,114.05],12);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(m);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(m);
        var g=L.featureGroup();
        rec.before.forEach(function(pts){if(pts.length>=3){g.addLayer(L.polygon(pts,{color:'#9CA3B0',weight:2,fillColor:'rgba(156,163,176,0.15)',fillOpacity:0.5,dashArray:'4 3'}).addTo(m))}});
        try{m.fitBounds(g.getBounds(),{padding:[10,10],maxZoom:17})}catch(e){}
        chMaps.push(m);
      }
    }
    if(rec.after&&rec.after.length>0&&rec.after[0].length>=3){
      var el2=document.getElementById('ch-after-'+i);
      if(el2){
        var m2=L.map(el2,{zoomControl:false,attributionControl:false}).setView([22.55,114.05],12);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(m2);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(m2);
        var g2=L.featureGroup();

        try{m2.fitBounds(g2.getBounds(),{padding:[10,10],maxZoom:17})}catch(e){}
        chMaps.push(m2);
      }
    }
  });
}

function destroyChMaps(){chMaps.forEach(function(m){m.remove()});chMaps=[]}

  if (m) {
    var idx = parseInt(m[1]);
    if (idx >= 0 && idx < mockData.length) {
      document.getElementById('selProject').value = idx;
      onProjectChange();
    }
    return;
  }
  var selProj = document.getElementById('selProject');
  if (selProj.options.length > 1) {
    selProj.selectedIndex = 1;
    onProjectChange();
  }
})();
</script>
