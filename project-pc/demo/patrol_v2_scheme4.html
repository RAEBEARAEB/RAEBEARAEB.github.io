<script>
// ═══ Fence data (demo: 2 fences from 福田 project, sorted by status priority) ═══
var FS=[],FP=[],FU=[],FST=[],FC=[],FCL=[];
var STATUS_PRIORITY={'超期未拆':0,'待认领':1,'已安装':2,'已拆除':3};
var STATUS_COLOR={'超期未拆':['#FDECEA','#D13B2F'],'待认领':['#FEF3CD','#D48A00'],'已安装':['#E6F4EA','#1A9042'],'已拆除':['#F0F1F5','#6B7280']};
function sortByStatus(arr,statusArr){
  var idxs=arr.map(function(_,i){return i});
  idxs.sort(function(a,b){return (STATUS_PRIORITY[statusArr[a]]||99)-(STATUS_PRIORITY[statusArr[b]]||99)});
  return {arr:arr.map(function(_,i){return arr[idxs[i]]}),statusArr:statusArr.map(function(_,i){return statusArr[idxs[i]]})};
}
function buildFences(){
  var rawNames=[],rawStatuses=[],rawProj=[],rawUnit=[];
  var TARGET='福田中心区市政管网改造工程';
  // Use hardcoded data for reliable demo: 2 fences with different statuses
  rawNames=['管道铺设工程','沟槽开挖工程'];
  rawProj=[TARGET,TARGET];
  rawUnit=['深圳市市政工程总公司','深圳市市政工程总公司'];
  rawStatuses=['已拆除','超期未拆'];
  // Sort by status priority: 超期未拆 > 待认领 > 已安装 > 已拆除
  var sorted=sortByStatus(rawNames,rawStatuses);
  FS=sorted.arr;FST=sorted.statusArr;
  // Remap project & unit by original indices
  var idxMap={};rawNames.forEach(function(n,i){idxMap[n]=i});
  FS.forEach(function(n){FP.push(rawProj[idxMap[n]]);FU.push(rawUnit[idxMap[n]]);});
  // Keep first 2
  if(FS.length>2){FS=FS.slice(0,2);FP=FP.slice(0,2);FU=FU.slice(0,2);FST=FST.slice(0,2);}
  // Assign colors
  for(var i=0;i<FS.length;i++){var c=STATUS_COLOR[FST[i]]||['#F0F1F5','#6B7280'];FCL[i]=c[0];FC[i]=c[1];}
  // Verify: log to console
  console.log('Demo4 fences (sorted):',FS.map(function(n,i){return n+' ['+FST[i]+']';}).join(' | '));
}
buildFences();
var PS=['刘伟','陈刚','王强'],LS=['福华三路中段','福华三路东段','福华三路西段'];
var calY=new Date().getFullYear(),calM=new Date().getMonth()+1,selDate=new Date().toISOString().slice(0,10);
var filterFence='all';
var ALL=[];
FS.forEach(function(fn,fi){
  var n=new Date();
  for(var d=0;d<45;d++){var dt=new Date(n);dt.setDate(dt.getDate()-d);var ds=dt.toISOString().slice(0,10);if(d<2||Math.random()>0.28){var c=Math.random()>0.65?2:1;for(var j=0;j<c;j++){var hi=Math.random()>0.72;var np=1+Math.floor(Math.random()*4);var ni=hi?1:0;ALL.push({fenceIdx:fi,fenceName:fn,projectName:FP[fi],responsibleUnit:FU[fi],fenceColor:FC[fi],fenceBg:FCL[fi],date:ds,dateFull:ds+' '+String(Math.floor(Math.random()*24)).padStart(2,'0')+':'+String(Math.floor(Math.random()*60)).padStart(2,'0')+':'+String(Math.floor(Math.random()*60)).padStart(2,'0'),time:(8+Math.floor(Math.random()*9))+':'+String(Math.floor(Math.random()*60)).padStart(2,'0'),person:PS[Math.floor(Math.random()*PS.length)],loc:LS[Math.floor(Math.random()*LS.length)],nPanos:np,nIssues:ni,hasIssue:hi,issueType:hi?['围挡破损','围挡脏污','围挡基础松动','围挡安全隐患','围挡缺失'][Math.floor(Math.random()*5)]:null,status:hi?(Math.random()>0.5?'待整改':'整改完成'):'正常'});}}}
});
ALL.sort(function(a,b){return(b.date+b.time).localeCompare(a.date+a.time)});

function getFiltered(){return filterFence==='all'?ALL:ALL.filter(function(x){return x.fenceName===filterFence})}
function getDateMap(arr){var m={};arr.forEach(function(x){m[x.date]=true});return m}

/* ── Coverage cards ── */
function renderCov(){
  var ym=calY+'-'+String(calM).padStart(2,'0');
  var monP=ALL.filter(function(x){return x.date.slice(0,7)===ym});
  var workD=Math.round(new Date(calY,calM,0).getDate()*0.7);
  var h='';
  var nTotal=monP.length;
  h+='<div class="cov-card all'+(filterFence==='all'?' sel':'')+'" onclick="setFilt(\'all\')"><div class="cov-hd"><span class="cov-dot" style="background:var(--primary-500)"></span><span class="cov-pname">全部围挡</span></div><div class="cov-sub">本月累计 <b>'+nTotal+'条</b></div></div>';
  // Calculate this week's range (Mon-Sun)
  var now2=new Date();var dow=now2.getDay();var mon=new Date(now2);mon.setDate(now2.getDate()-(dow===0?6:dow-1));
  var wkStart=mon.toISOString().slice(0,10);var sun=new Date(mon);sun.setDate(mon.getDate()+6);var wkEnd=sun.toISOString().slice(0,10);
  var wkAll=ALL.filter(function(x){return x.date>=wkStart&&x.date<=wkEnd});
  var wkDays=7;
  FS.forEach(function(f,i){
    var fp=monP.filter(function(x){return x.fenceIdx===i}),fd=new Set();fp.forEach(function(x){fd.add(x.date)});
    var rate=Math.round(fd.size/workD*100),nP=fp.length;
    var wfp=wkAll.filter(function(x){return x.fenceIdx===i}),wfd=new Set();wfp.forEach(function(x){wfd.add(x.date)});
    var wkRate=Math.round(wfd.size/wkDays*100);
    h+='<div class="cov-card'+(filterFence===f?' sel':'')+'" onclick="setFilt(\''+f+'\')"><div class="cov-hd"><span class="cov-dot" style="background:'+FC[i]+'"></span><span class="cov-pname">'+FP[i]+'</span><span class="cov-stag" style="background:'+FCL[i]+';color:'+FC[i]+'">'+FST[i]+'</span></div><div class="cov-sub">'+f+' · <b>'+nP+'条</b></div><div class="cov-bar-wrap"><div class="cov-bar" style="width:'+wkRate+'%;background:'+FC[i]+'"></div></div><div class="cov-foot">本周巡检 '+wfd.size+'/'+wkDays+'天</div></div>';
  });
  document.getElementById('covRow').innerHTML=h;
}
function setFilt(v){filterFence=v;renderCov();renderMiniCal();renderRecsAll()}

/* ── Mini calendar ── */
function renderMiniCal(){
  var wd=['日','一','二','三','四','五','六'];var today=new Date().toISOString().slice(0,10);
  var h='<div class="mini-hd"><span class="mini-hd-tt">巡检日历</span><div class="mini-nav"><button onclick="chMM(-1)">&lt;</button><span style="font-size:var(--fs-sm);font-weight:var(--fw-b)">'+calY+'年'+calM+'月</span><button onclick="chMM(1)">&gt;</button></div></div><div class="mini-body"><div class="mini-wd">'+wd.map(function(w){return'<div>'+w+'</div>'}).join('')+'</div><div class="mini-grid">';
  var fd=new Date(calY,calM-1,1).getDay(),dim=new Date(calY,calM,0).getDate();
  var dm=getDateMap(getFiltered());
  for(var i=0;i<fd;i++)h+='<div class="mday other"></div>';
  for(var d=1;d<=dim;d++){var dk=calY+'-'+String(calM).padStart(2,'0')+'-'+String(d).padStart(2,'0'),cls=['mday'];if(dk===today)cls.push('today');if(dk===selDate)cls.push('sel');if(dm[dk])cls.push('has-any');h+='<div class="'+cls.join(' ')+'" onclick="selMD(\''+dk+'\')">'+d+'</div>';}
  h+='</div><div class="mini-leg"><span><span class="ld" style="background:var(--primary-500)"></span>有巡查</span><span><span class="ld" style="background:var(--gray-300)"></span>无</span></div></div>';
  document.getElementById('miniCal').innerHTML=h;

  var now2=new Date(),today2=now2.toISOString().slice(0,10);
  var miss=[];
  FS.forEach(function(f,i){var tr=ALL.filter(function(x){return x.fenceIdx===i&&x.date===today2});if(!tr.length)miss.push({name:f,color:FC[i],bg:FCL[i]})});
  var mp='<div class="miss-tt"><i class="ti ti-alert-triangle"></i>今日未巡查</div>';
  if(!miss.length)mp+='<div style="color:var(--success);padding:4px 0;font-weight:var(--fw-m)"><i class="ti ti-check"></i> 全部围挡今日已巡查</div>';
  else miss.forEach(function(x){mp+='<div class="miss-item"><span class="miss-fence-name"><span class="ld" style="background:'+x.color+'"></span>'+x.name+'</span><span style="color:var(--danger);font-weight:var(--fw-m)">未巡查</span></div>'});
  document.getElementById('missPanel').innerHTML=mp;
}
function chMM(d){calM+=d;if(calM>12){calM=1;calY++}if(calM<1){calM=12;calY--}renderCov();renderMiniCal();renderRecsAll()}
function selMD(dk){selDate=dk;renderMiniCal();} // calendar visual only, does not filter table

/* ── Records table ── */
function renderRecsAll(){
  var el=document.getElementById('recTbody'),te=document.getElementById('recTitle'),ce=document.getElementById('recCnt');
  var ym=calY+'-'+String(calM).padStart(2,'0');
  var arr=getFiltered().filter(function(x){return x.date.slice(0,7)===ym});
  te.textContent=calY+'年'+calM+'月 巡查记录';
  if(!arr.length){ce.textContent='';el.innerHTML='<tr><td colspan="8"><div class="empty-wrap"><i class="ti ti-mood-happy"></i>本月无巡查记录</div></td></tr>';return}
  ce.innerHTML='共 <strong>'+arr.length+'</strong> 条';
  el.innerHTML=arr.map(function(r){
    var stBg=r.hasIssue?'var(--warning-lt)':'var(--success-lt)',stFg=r.hasIssue?'var(--warning)':'var(--success)',stTxt=r.hasIssue?'待整改':'正常',stIcon=r.hasIssue?'ti-alert-triangle':'ti-check';
    return '<tr>'+
      '<td class="tbl-time">'+r.dateFull+'</td>'+
      '<td>'+r.projectName+'</td>'+
      '<td>'+r.fenceName+'</td>'+
      '<td>'+r.responsibleUnit+'</td>'+
      '<td>'+r.person+'</td>'+
      '<td style="text-align:center"><span class="tbl-status" style="background:'+stBg+';color:'+stFg+'"><i class="ti '+stIcon+'" style="font-size:10px"></i>'+stTxt+'</span></td>'+
      '<td style="text-align:center">'+r.nIssues+'</td>'+
      '<td class="tbl-issue" title="'+(r.issueType||'')+'">'+(r.hasIssue?r.issueType:'—')+'</td>'+
    '</tr>';
  }).join('');
}

renderCov();renderMiniCal();renderRecsAll();
</script></body></html>
