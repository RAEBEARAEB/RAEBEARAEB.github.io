<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>围挡巡查 方案2 — 矩阵时间线</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
:root{--primary-50:#EBF2FF;--primary-500:#1862D4;--primary-600:#104FAD;--primary-700:#0A3C86;
--gray-0:#FFF;--gray-50:#F7F8FA;--gray-100:#F0F1F5;--gray-200:#E3E6ED;--gray-300:#C6CBD8;--gray-400:#9CA3B0;--gray-500:#6B7280;--gray-600:#4B5563;--gray-700:#374151;--gray-800:#1F2937;--gray-900:#111827;
--success:#1A9042;--success-lt:#E6F4EA;--warning:#D48A00;--warning-lt:#FEF3CD;--danger:#D13B2F;--danger-lt:#FDECEA;
--text-title:var(--gray-900);--text:var(--gray-800);--text-sec:var(--gray-600);--text-ter:var(--gray-400);
--border:var(--gray-200);--radius:4px;--radius-lg:6px;--bg-page:var(--gray-50);--bg-card:var(--gray-0);--sidebar-bg:#0D2B55;--header-h:56px;--sidebar-w:220px;
--shadow-sm:0 1px 2px rgba(0,0,0,0.04);--shadow-md:0 2px 8px rgba(0,0,0,0.06);
--font:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
--fs-xs:12px;--fs-sm:13px;--fs-md:14px;--fs-lg:16px;--fs-xl:18px;--fs-2xl:20px;--fw-r:400;--fw-m:500;--fw-b:600;
--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px}*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font);font-size:var(--fs-md);color:var(--text);background:var(--bg-page);line-height:1.6;-webkit-font-smoothing:antialiased;height:100%}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:3px}
.layout-wrapper{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.layout-header{height:var(--header-h);background:var(--bg-card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0;position:fixed;top:0;left:0;right:0;z-index:100;box-shadow:var(--shadow-sm)}
.layout-header::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#0A3C86,#1862D4,#0A3C86)}
.hdr-logo{display:flex;align-items:center;gap:var(--s4);padding:0 var(--s6);height:100%;border-right:1px solid var(--gray-100);font-size:var(--fs-xl);font-weight:var(--fw-b);color:var(--text-title)}.hdr-logo i{font-size:22px;color:var(--primary-500)}
.hdr-right{margin-left:auto;padding:0 var(--s5)}.hdr-user{display:flex;align-items:center;gap:var(--s2)}.hdr-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#C6D9FF,#9DBEFF);display:flex;align-items:center;justify-content:center;font-size:var(--fs-xs);color:var(--primary-700);font-weight:var(--fw-m)}
.hdr-name{font-size:var(--fs-sm)}.layout-body{display:flex;margin-top:var(--header-h);height:calc(100vh - var(--header-h));overflow:hidden}
.sidebar{width:var(--sidebar-w);background:var(--sidebar-bg);flex-shrink:0;overflow-y:auto;display:flex;flex-direction:column}
.nav{list-style:none;padding:var(--s4) 0;flex:1}.nav-label{font-size:10px;color:rgba(255,255,255,0.22);letter-spacing:.1em;padding:var(--s5) var(--s5) var(--s1);font-weight:var(--fw-m);text-transform:uppercase}
.nav li a{display:flex;align-items:center;gap:var(--s3);padding:0 var(--s5);height:40px;font-size:var(--fs-sm);color:rgba(255,255,255,0.5);transition:.15s;text-decoration:none}.nav li a:hover{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.85)}
.nav li a.active{background:rgba(24,98,212,0.25);color:#fff;font-weight:var(--fw-m)}.nav li a.active::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:3px;background:#fff;border-radius:0 2px 2px 0}
.nav li{position:relative}.nav-icon{width:16px;height:16px;flex-shrink:0;opacity:0.7}.nav li a.active .nav-icon{opacity:1}.sidebar-foot{padding:var(--s3) var(--s5);border-top:1px solid rgba(255,255,255,0.06);font-size:11px;color:rgba(255,255,255,0.2)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.crumb{padding:var(--s3) var(--s6) 0;font-size:var(--fs-sm);color:var(--text-ter);flex-shrink:0}.crumb a{color:var(--text-ter);text-decoration:none}.crumb .sep{color:var(--gray-300)}.crumb .cur{color:var(--text);font-weight:var(--fw-m)}
.ph{display:flex;align-items:center;justify-content:space-between;padding:var(--s3) var(--s6) var(--s3);flex-shrink:0}.ph h1{font-size:var(--fs-2xl);font-weight:var(--fw-b);display:flex;align-items:center;gap:var(--s3)}.ph h1::before{content:'';width:4px;height:24px;background:var(--primary-500);border-radius:2px}

/* ── Matrix controls ── */
.mx-ctl{display:flex;align-items:center;justify-content:space-between;padding:0 var(--s6) var(--s3);flex-shrink:0;gap:var(--s3)}
.mx-range{display:flex;align-items:center;gap:var(--s2);font-size:var(--fs-sm)}.mx-range select{height:30px;border:1px solid var(--border);border-radius:var(--radius);padding:0 var(--s2);font-size:var(--fs-sm);font-family:var(--font);outline:none}.mx-range select:focus{border-color:var(--primary-500)}
.mx-nav{display:flex;gap:2px}.mx-nav button{width:28px;height:28px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-card);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:.15s}.mx-nav button:hover{background:var(--gray-100)}
.mx-leg{display:flex;gap:var(--s4);font-size:var(--fs-xs);color:var(--text-ter)}.mx-leg span{display:flex;align-items:center;gap:4px}.mx-leg .ld{width:8px;height:8px;border-radius:50%}

/* ── Matrix table ── */
.mx-wrap{flex:1;overflow:auto;padding:0 var(--s6) var(--s6)}
.mx-table{width:100%;border-collapse:separate;border-spacing:0}
.mx-table th,.mx-table td{vertical-align:top}
.mx-table thead th{position:sticky;top:0;z-index:5;background:var(--gray-100);padding:var(--s2) var(--s3);font-size:var(--fs-xs);font-weight:var(--fw-b);color:var(--text-sec);text-align:center;border-bottom:2px solid var(--border);white-space:nowrap;min-width:100px}
.mx-table thead th:first-child{min-width:110px;text-align:left;padding-left:var(--s4)}
.mx-date{background:var(--gray-0);padding:var(--s2) var(--s3);font-size:var(--fs-sm);font-weight:var(--fw-b);color:var(--text);border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;left:0;z-index:3}
.mx-date small{display:block;font-weight:var(--fw-r);color:var(--text-ter);font-size:11px}
.mx-cell{padding:var(--s2) var(--s3);border-bottom:1px solid var(--gray-50);min-width:100px;transition:.15s}.mx-cell:hover{background:var(--primary-50)}
.mx-cell-inner{font-size:var(--fs-xs);line-height:1.5}.mx-cell-person{font-weight:var(--fw-b)}.mx-cell-time{color:var(--text-ter);margin-left:var(--s1)}.mx-cell-extra{font-size:10px;color:var(--text-ter)}.mx-cell-status{display:inline-flex;align-items:center;gap:2px;font-size:10px;padding:0 5px;border-radius:999px;margin-top:2px}
.mx-empty{color:var(--text-ter);font-size:var(--fs-xs);text-align:center;padding:var(--s2) 0}.mx-empty i{font-size:14px;display:block;opacity:0.25}
.mx-today .mx-date{background:var(--primary-50);box-shadow:inset 3px 0 0 var(--primary-500)}
.fh-col{background:var(--gray-50)!important}.fh-col span{display:flex;align-items:center;gap:4px;justify-content:center}
</style></head><body>
<div class="layout-wrapper">
<header class="layout-header"><div class="hdr-logo"><i class="ti ti-building-fortress"></i>深圳市建设施工围挡数字化管理系统</div><div class="hdr-right"><div class="hdr-user"><div class="hdr-avatar">张</div><span class="hdr-name">张项目</span></div></div></header>
<div class="layout-body">
<aside class="sidebar"><ul class="nav">
<li><a href="#"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>首页</a></li>
<li class="nav-label">围挡管理</li>
<li><a href="#"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>围挡档案管理</a></li>
<li><a href="#" class="active"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>围挡巡查</a></li>
<li><a href="#"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>问题闭环处置</a></li>
</ul><div class="sidebar-foot">v2.0.0 · 2026.07</div></aside>
<main class="main">
<div class="crumb"><a href="#">首页</a><span class="sep">/</span><span>围挡管理</span><span class="sep">/</span><span class="cur">围挡巡查</span></div>
<div class="ph"><h1>围挡巡查</h1></div>
<div class="mx-ctl">
  <div class="mx-range"><span style="font-weight:var(--fw-b)">巡查矩阵</span> · 最近<select id="rngDays" onchange="renderMatrix()"><option value="7">7天</option><option value="14" selected>14天</option><option value="21">21天</option><option value="30">30天</option></select></div>
  <div class="mx-nav"><button onclick="navDays(-7)"><i class="ti ti-chevron-left"></i></button><button onclick="goToday2()">今天</button><button onclick="navDays(7)"><i class="ti ti-chevron-right"></i></button></div>
  <div class="mx-leg" id="mxLeg"></div>
</div>
<div class="mx-wrap"><table class="mx-table" id="mxTable"></table></div>
</main></div></div>
<script>
var FS=['管道铺设工程','沟槽开挖工程','主体结构工程'];
var FC=['#1862D4','#D48A00','#1A9042'];var FCL=['#EBF2FF','#FEF3CD','#E6F4EA'];
var PS=['刘伟','陈刚','王强'],LS=['福华三路中段','福华三路东段','福华三路西段'];
var ALL=[];var refDate=new Date();
FS.forEach(function(fn,fi){
  var n=new Date();
  for(var d=0;d<45;d++){var dt=new Date(n);dt.setDate(dt.getDate()-d);var ds=dt.toISOString().slice(0,10);if(d<2||Math.random()>0.28){var c=Math.random()>0.65?2:1;for(var j=0;j<c;j++){var hi=Math.random()>0.72;ALL.push({fenceIdx:fi,fenceName:fn,fenceColor:FC[fi],fenceBg:FCL[fi],date:ds,time:(8+Math.floor(Math.random()*9))+':'+String(Math.floor(Math.random()*60)).padStart(2,'0'),person:PS[Math.floor(Math.random()*PS.length)],loc:LS[Math.floor(Math.random()*LS.length)],nPanos:1+Math.floor(Math.random()*4),hasIssue:hi,issueType:hi?['围挡破损','围挡脏污','围挡基础松动'][Math.floor(Math.random()*3)]:null,status:hi?(Math.random()>0.5?'待整改':'整改完成'):'正常'});}}}
});
ALL.sort(function(a,b){return(b.date+b.time).localeCompare(a.date+a.time)});

function navDays(n){refDate.setDate(refDate.getDate()+n);renderMatrix()}
function goToday2(){refDate=new Date();renderMatrix()}

function renderMatrix(){
  var days=parseInt(document.getElementById('rngDays').value);
  // Build date list (latest first)
  var dates=[];for(var i=0;i<days;i++){var dt=new Date(refDate);dt.setDate(dt.getDate()-i);dates.push(dt.toISOString().slice(0,10))}
  var today=new Date().toISOString().slice(0,10);
  // Build lookup: date -> fenceIdx -> [records]
  var lu={};dates.forEach(function(ds){lu[ds]={}});
  ALL.forEach(function(r){if(lu[r.date]){if(!lu[r.date][r.fenceIdx])lu[r.date][r.fenceIdx]=[];lu[r.date][r.fenceIdx].push(r)}});

  // Legend
  var leg='';FS.forEach(function(f,i){leg+='<span><span class="ld" style="background:'+FC[i]+'"></span>'+f+'</span>'});
  leg+='<span><span class="ld" style="background:var(--gray-300)"></span> 无巡查</span>';
  document.getElementById('mxLeg').innerHTML=leg;

  // Build table
  var h='<thead><tr><th class="fh-col">日期</th>';
  FS.forEach(function(f,i){h+='<th class="fh-col"><span><span class="ld" style="background:'+FC[i]+'"></span>'+f+'</span></th>'});
  h+='</tr></thead><tbody>';
  dates.forEach(function(ds){
    var isToday=ds===today;
    var dp=ds.split('-'),wk=['日','一','二','三','四','五','六'][new Date(ds).getDay()];
    h+='<tr'+(isToday?' class="mx-today"':'')+'><td class="mx-date">'+(parseInt(dp[1])+'/'+parseInt(dp[2]))+'<small>周'+wk+'</small></td>';
    FS.forEach(function(f,fi){
      var recs=lu[ds][fi];
      h+='<td class="mx-cell">';
      if(!recs||!recs.length){
        h+='<div class="mx-empty"><i class="ti ti-minus"></i>无巡查</div>';
      }else{
        h+='<div class="mx-cell-inner">';
        recs.forEach(function(r){
          h+='<div style="margin-bottom:4px">';
          h+='<span class="mx-cell-person">'+r.person+'</span><span class="mx-cell-time">'+r.time+'</span>';
          h+='<div class="mx-cell-extra">'+r.nPanos+'张全景</div>';
          if(r.hasIssue){
            h+='<span class="mx-cell-status" style="background:var(--warning-lt);color:var(--warning)"><i class="ti ti-alert-triangle" style="font-size:9px"></i>待整改</span>';
          }else{
            h+='<span class="mx-cell-status" style="background:var(--success-lt);color:var(--success)"><i class="ti ti-check" style="font-size:9px"></i>正常</span>';
          }
          h+='</div>';
        });
        h+='</div>';
      }
      h+='</td>';
    });
    h+='</tr>';
  });
  h+='</tbody>';
  document.getElementById('mxTable').innerHTML=h;
}
renderMatrix();
</script></body></html>
