<script>
/* ═══ State ═══ */
var calYear = new Date().getFullYear();
var calMonth = new Date().getMonth() + 1;
var selectedDate = null; // 'YYYY-MM-DD'
var currentFence = null; // will be set from data

/* ═══ Mock patrol data generator ═══ */
function getPatrolData(fenceId) {
  // Generate per-fence mock patrol records for demo
  var now = new Date();
  var records = [];
  var persons = ['刘伟', '陈刚', '王强'];
  var locs = ['福田区福华三路中段', '福田区福华三路东段', '福田区福华三路西段'];

  // Generate records over the last 45 days, with some gaps
  for (var d = 0; d < 45; d++) {
    var date = new Date(now);
    date.setDate(date.getDate() - d);
    var ds = date.toISOString().slice(0,10);

    // ~70% days have patrols
    if (d < 2 || Math.random() > 0.3) {
      var n = Math.random() > 0.7 ? 2 : 1; // sometimes 2 patrols per day
      for (var j = 0; j < n; j++) {
        var hasIssue = Math.random() > 0.75;
        records.push({
          id: 'PR-' + fenceId + '-' + ds + '-' + j,
          fenceId: fenceId,
          date: ds,
          time: (8 + Math.floor(Math.random() * 9)) + ':' + String(Math.floor(Math.random() * 60)).padStart(2,'0'),
          person: persons[Math.floor(Math.random() * persons.length)],
          unit: '项目方自查',
          location: locs[Math.floor(Math.random() * locs.length)],
          panoramaCount: 1 + Math.floor(Math.random() * 4),
          hasIssue: hasIssue,
          issueType: hasIssue ? ['围挡破损','围挡脏污','围挡基础松动'][Math.floor(Math.random()*3)] : null,
          issueDesc: hasIssue ? '巡检中发现存在问题，已拍照记录并上报' : null,
          status: hasIssue ? (Math.random() > 0.5 ? '待整改' : '整改完成') : '正常'
        });
      }
    }
  }

  // Sort by date desc, then time desc
  records.sort(function(a,b){ return (b.date+b.time).localeCompare(a.date+a.time); });
  return records;
}

/* ═══ Fence Data ═══ */
function getFences() {
  // Try to get from mock data, fallback to hardcoded demo data
  try {
    var hoards = MOCK_DATA.getHoardings();
    if (hoards && hoards.length) {
      return hoards.slice(0, 3).map(function(h, i) {
        return { id: h.id || ('FB-00'+(i+1)), name: (h.engineerName || '围挡块'+(i+1)), length: h.length||'-', height: h.height||'-', unit: h.constructUnit||'--', status: h.fenceStatus||'在用' };
      });
    }
  } catch(e) {}
  return [
    { id: 'FB-001', name: '管道铺设工程', length: '320m', height: '2.5m', unit: '深圳市市政工程总公司', status: '在用' },
    { id: 'FB-002', name: '沟槽开挖工程', length: '180m', height: '2.5m', unit: '深圳市市政工程总公司', status: '在建' }
  ];
}

var allFences = getFences();
var allPatrols = {};
allFences.forEach(function(f) { allPatrols[f.id] = getPatrolData(f.id); });

function onFenceChange() {
  var fid = document.getElementById('fenceSelect').value;
  var f = allFences.find(function(x){return x.id===fid});
  if (!f) return;
  currentFence = f;
  document.getElementById('fenceInfo').innerHTML =
    '<span class="fbi-item">长度 <span class="fbi-val">'+f.length+'</span></span>'+
    '<span class="fbi-item">高度 <span class="fbi-val">'+f.height+'</span></span>'+
    '<span class="fbi-item">责任单位 <span class="fbi-val">'+f.unit+'</span></span>';
  renderCalendar();
  renderRecords();
}

function changeMonth(d) { calMonth += d; if(calMonth > 12){calMonth=1;calYear++} if(calMonth < 1){calMonth=12;calYear--} renderCalendar(); renderRecords(); }
function goToday() { var now=new Date(); calYear=now.getFullYear(); calMonth=now.getMonth()+1; selectedDate=now.toISOString().slice(0,10); renderCalendar(); renderRecords(); }

/* ═══ Calendar ═══ */
function renderCalendar() {
  var wd=['日','一','二','三','四','五','六'];
  document.getElementById('calWeekdays').innerHTML = wd.map(function(w,i){
    return '<div class="cal-weekday'+(i===0||i===6?' weekend':'')+'">'+w+'</div>';
  }).join('');

  document.getElementById('calMonthLabel').textContent = calYear+'年'+calMonth+'月';

  var firstDay = new Date(calYear, calMonth-1, 1).getDay();
  var daysInMonth = new Date(calYear, calMonth, 0).getDate();
  var today = new Date().toISOString().slice(0,10);

  var patrols = currentFence ? allPatrols[currentFence.id] || [] : [];
  var dateStatus = {};
  patrols.forEach(function(p){
    if (!dateStatus[p.date]) dateStatus[p.date] = 'normal';
    if (p.hasIssue && dateStatus[p.date] !== 'issue') dateStatus[p.date] = 'issue';
  });

  var h = '';
  for (var i = 0; i < firstDay; i++) h += '<div class="cal-day other"></div>';
  for (var d = 1; d <= daysInMonth; d++) {
    var ds = calYear+'-'+String(calMonth).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var cls = ['cal-day'];
    if (ds === today) cls.push('today');
    if (ds === selectedDate) cls.push('selected');
    if (dateStatus[ds] === 'issue') cls.push('has-issue');
    else if (dateStatus[ds] === 'normal') cls.push('has-normal');
    h += '<div class="'+cls.join(' ')+'" onclick="selectDate(\''+ds+'\')">'+d+'</div>';
  }
  document.getElementById('calGrid').innerHTML = h;
}

function selectDate(ds) {
  selectedDate = ds;
  renderCalendar();
  renderRecords();
}

/* ═══ Records ═══ */
function renderRecords() {
  var el = document.getElementById('recordsList');
  var titleEl = document.getElementById('recordsDateTitle');
  var cntEl = document.getElementById('recordsCount');

  if (!selectedDate) {
    titleEl.textContent = '巡查记录';
    cntEl.innerHTML = '<span style="color:var(--text-tertiary)">请点击日历选择日期</span>';
    el.innerHTML = '<div class="patrol-empty"><i class="ti ti-calendar-search"></i>选择日历上的日期<br>查看当天巡查记录</div>';
    return;
  }

  var patrols = currentFence ? (allPatrols[currentFence.id] || []) : [];
  var dayRecords = patrols.filter(function(p){ return p.date === selectedDate; });

  var dateParts = selectedDate.split('-');
  var weekday = ['日','一','二','三','四','五','六'][new Date(selectedDate).getDay()];
  titleEl.textContent = dateParts[0]+'年'+parseInt(dateParts[1])+'月'+parseInt(dateParts[2])+'日（星期'+weekday+'）';

  if (!dayRecords.length) {
    cntEl.textContent = '无巡查记录';
    el.innerHTML = '<div class="patrol-empty"><i class="ti ti-mood-happy"></i>当天无巡查记录</div>';
    return;
  }

  cntEl.innerHTML = '共 <strong>'+dayRecords.length+'</strong> 次巡查';

  var h = '';
  dayRecords.forEach(function(r){
    var thumbBadge = r.hasIssue ? 'var(--color-danger-light)' : 'var(--color-success-light)';
    var thumbColor = r.hasIssue ? 'var(--color-danger)' : 'var(--color-success)';
    var thumbIcon = r.hasIssue ? 'ti-alert-triangle' : 'ti-check';

    h += '<div class="patrol-card">';
    h += '<div class="patrol-card-body">';
    // Thumbnail area
    h += '<div class="patrol-thumb-wrap">';
    h += '<div class="patrol-thumb" style="background:'+thumbBadge+';color:'+thumbColor+'"><i class="ti '+thumbIcon+'"></i><span>'+r.panoramaCount+'张全景</span></div>';
    h += '</div>';
    // Info
    h += '<div class="patrol-info">';
    h += '<div class="patrol-info-top"><span class="patrol-person">'+r.person+'</span><span class="patrol-time">'+r.time+'</span></div>';
    h += '<div class="patrol-unit">'+r.unit+'</div>';
    h += '<div class="patrol-loc"><i class="ti ti-map-pin" style="font-size:11px"></i> '+r.location+'</div>';
    if (!r.hasIssue) {
      h += '<div style="margin-top:2px"><span style="display:inline-flex;align-items:center;gap:2px;font-size:10px;padding:2px 6px;border-radius:999px;background:var(--color-success-light);color:var(--color-success)"><i class="ti ti-check" style="font-size:10px"></i>正常</span></div>';
    }
    h += '</div></div>';
    // Issue bar
    if (r.hasIssue) {
      h += '<div class="patrol-issue-bar"><i class="ti ti-alert-triangle"></i> '+r.issueType+' — '+r.issueDesc+'</div>';
    }
    h += '</div>';
  });
  el.innerHTML = h;
}

/* ═══ Init ═══ */
(function(){
  // Populate fence dropdown
  var sel = document.getElementById('fenceSelect');
  sel.innerHTML = allFences.map(function(f){
    return '<option value="'+f.id+'">围挡块 '+f.id.slice(-1)+' — '+f.name+'（'+f.status+'）</option>';
  }).join('');
  currentFence = allFences[0];
  onFenceChange();

  // Default: select today
  selectedDate = new Date().toISOString().slice(0,10);
  renderCalendar();
  renderRecords();
})();
</script>
</body>
</html>
