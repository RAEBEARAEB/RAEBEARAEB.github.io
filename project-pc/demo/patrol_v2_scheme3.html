<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
:root{--primary-50:#EBF2FF;--primary-500:#1862D4;--primary-600:#104FAD;--primary-700:#0A3C86;
--gray-0:#FFF;--gray-50:#F7F8FA;--gray-100:#F0F1F5;--gray-200:#E3E6ED;--gray-300:#C6CBD8;--gray-400:#9CA3B0;--gray-500:#6B7280;--gray-600:#4B5563;--gray-700:#374151;--gray-800:#1F2937;--gray-900:#111827;
--success:#1A9042;--success-lt:#E6F4EA;--warning:#D48A00;--warning-lt:#FEF3CD;--danger:#D13B2F;--danger-lt:#FDECEA;

--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px}*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font);font-size:var(--fs-md);color:var(--text);background:var(--bg-page);line-height:1.6;-webkit-font-smoothing:antialiased;height:100%}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:3px}
.layout-wrapper{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.layout-header{height:var(--header-h);background:var(--bg-card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0;position:fixed;top:0;left:0;right:0;z-index:100;box-shadow:var(--shadow-sm)}
.layout-header::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#0A3C86,#1862D4,#0A3C86)}
.hdr-logo{display:flex;align-items:center;gap:var(--s4);padding:0 var(--s6);height:100%;border-right:1px solid var(--gray-100);font-size:var(--fs-xl);font-weight:var(--fw-b);color:var(--text-title)}.hdr-logo i{font-size:22px;color:var(--primary-500)}
.hdr-right{margin-left:auto;padding:0 var(--s5)}.hdr-user{display:flex;align-items:center;gap:var(--s2)}.hdr-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#C6D9FF,#9DBEFF);display:flex;align-items:center;justify-content:center;font-size:var(--fs-xs);color:var(--primary-700);font-weight:var(--fw-m)}.hdr-name{font-size:var(--fs-sm)}
.layout-body{display:flex;margin-top:var(--header-h);height:calc(100vh - var(--header-h));overflow:hidden}
.sidebar{width:var(--sidebar-w);background:var(--sidebar-bg);flex-shrink:0;overflow-y:auto;display:flex;flex-direction:column}.nav{list-style:none;padding:var(--s4) 0;flex:1}
.nav-label{font-size:10px;color:rgba(255,255,255,0.22);letter-spacing:.1em;padding:var(--s5) var(--s5) var(--s1);font-weight:var(--fw-m);text-transform:uppercase}
.nav li a{display:flex;align-items:center;gap:var(--s3);padding:0 var(--s5);height:40px;font-size:var(--fs-sm);color:rgba(255,255,255,0.5);transition:.15s;text-decoration:none}.nav li a:hover{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.85)}
.nav li a.active{background:rgba(24,98,212,0.25);color:#fff;font-weight:var(--fw-m)}.nav li a.active::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:3px;background:#fff;border-radius:0 2px 2px 0}
.nav li{position:relative}.nav-icon{width:16px;height:16px;flex-shrink:0;opacity:0.7}.nav li a.active .nav-icon{opacity:1}.sidebar-foot{padding:var(--s3) var(--s5);border-top:1px solid rgba(255,255,255,0.06);font-size:11px;color:rgba(255,255,255,0.2)}
.main{flex:1;overflow-y:auto;padding:0 var(--s6) var(--s6)}
.crumb{padding:var(--s3) 0 0;font-size:var(--fs-sm);color:var(--text-ter)}.crumb a{color:var(--text-ter);text-decoration:none}.crumb .sep{color:var(--gray-300)}.crumb .cur{color:var(--text);font-weight:var(--fw-m)}
.ph{display:flex;align-items:center;justify-content:space-between;padding:var(--s3) 0 var(--s4)}.ph h1{font-size:var(--fs-2xl);font-weight:var(--fw-b);display:flex;align-items:center;gap:var(--s3)}.ph h1::before{content:'';width:4px;height:24px;background:var(--primary-500);border-radius:2px}

/* ── Top: Coverage cards ── */
.cov-row{display:flex;gap:var(--s3);margin-bottom:var(--s4)}
.cov-card{flex:1;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-xl);padding:var(--s4);box-shadow:var(--shadow-sm);cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.cov-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}.cov-card.sel{border-color:var(--primary-500);box-shadow:0 0 0 2px var(--primary-50)}
.cov-card-top{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s3)}
.cov-fence-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}.cov-fence-name{font-size:var(--fs-sm);font-weight:var(--fw-b);color:var(--text)}
.cov-fence-status{font-size:10px;padding:1px 6px;border-radius:999px;margin-left:auto}
.cov-num{font-size:36px;font-weight:800;letter-spacing:-1px;line-height:1}.cov-num small{font-size:var(--fs-sm);font-weight:var(--fw-r);color:var(--text-ter)}.cov-bar-wrap{margin-top:var(--s2);height:6px;background:var(--gray-100);border-radius:3px;overflow:hidden}.cov-bar{height:100%;border-radius:3px;transition:.5s}.cov-sub{font-size:var(--fs-xs);color:var(--text-ter);margin-top:var(--s1)}
.cov-card.all{border-style:dashed}.cov-card.all .cov-num{color:var(--primary-500)}

/* ── Split layout ── */
.split-row{display:flex;gap:var(--s4);margin-bottom:var(--s4)}
.split-left{width:280px;flex-shrink:0;display:flex;flex-direction:column;gap:var(--s4)}
.split-right{flex:1;min-width:0}

/* ── Mini calendar ── */
.mini-cal{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm)}
.mini-hd{padding:var(--s2) var(--s3);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--gray-50)}
.mini-hd-tt{font-size:var(--fs-sm);font-weight:var(--fw-b)}.mini-hd-month{font-size:var(--fs-sm);font-weight:var(--fw-b)}.mini-nav{display:flex;gap:2px}.mini-nav button{width:24px;height:24px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-card);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:.15s}.mini-nav button:hover{background:var(--gray-100)}
.mini-body{padding:var(--s2)}.mini-wd{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;margin-bottom:2px}.mini-wd div{text-align:center;font-size:9px;color:var(--text-ter);font-weight:var(--fw-m);padding:1px 0}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.mday{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:2px;font-size:10px;cursor:pointer;transition:.12s;position:relative}.mday:hover{background:var(--gray-100)}.mday.other{color:var(--gray-300)}
.mday.today{font-weight:var(--fw-b);box-shadow:inset 0 0 0 1.5px var(--primary-500)}.mday.sel{background:var(--primary-500);color:#fff;font-weight:var(--fw-b)}
.mday::after{content:'';position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%}.mday.has-any::after{background:var(--primary-500)}.mday.sel::after,.mday.sel.has-any::after{background:#fff}
.mini-leg{padding:2px var(--s2) 4px;font-size:9px;color:var(--text-ter);display:flex;gap:var(--s3)}.mini-leg span{display:flex;align-items:center;gap:2px}.mini-leg .ld{display:inline-block;width:5px;height:5px;border-radius:50%}

/* ── Missing panel ── */
.miss-panel{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--s3);box-shadow:var(--shadow-sm);font-size:var(--fs-xs)}
.miss-tt{font-size:var(--fs-sm);font-weight:var(--fw-b);margin-bottom:var(--s2);display:flex;align-items:center;gap:var(--s2)}.miss-tt .ti{color:var(--danger)}.miss-item{display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--gray-50)}.miss-item:last-child{border-bottom:none}.miss-fence-name{display:flex;align-items:center;gap:4px}

/* ── Records ── */
.rec-sec{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm)}
.rec-sec-hd{padding:var(--s3) var(--s4);background:var(--gray-50);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.rec-sec-tt{font-size:var(--fs-md);font-weight:var(--fw-b)}.rec-sec-cnt{font-size:var(--fs-xs);color:var(--text-ter)}.rec-sec-cnt strong{color:var(--text)}
.rec-sec-body{padding:var(--s3) var(--s4);max-height:400px;overflow-y:auto}
.pcard{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:var(--s3);overflow:hidden;box-shadow:var(--shadow-sm);display:flex}.pcard:last-child{margin-bottom:0}
.pcard-stripe{width:3px;flex-shrink:0}.pcard-body{flex:1;display:flex;gap:var(--s3);padding:var(--s3) var(--s4);min-width:0}
.pcard-thumb{width:72px;height:54px;border-radius:var(--radius);flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;gap:2px}.pcard-thumb .ti{font-size:18px}
.pcard-info{flex:1;min-width:0}.pcard-top{display:flex;align-items:center;gap:var(--s2)}.pcard-fence{font-size:10px;padding:1px 6px;border-radius:999px;font-weight:var(--fw-b);flex-shrink:0}
.pcard-person{font-size:var(--fs-sm);font-weight:var(--fw-b)}.pcard-time{font-size:var(--fs-xs);color:var(--text-ter);margin-left:auto;white-space:nowrap}
.pcard-meta{font-size:var(--fs-xs);color:var(--text-sec)}.pcard-loc{font-size:var(--fs-xs);color:var(--text-ter);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard-issue{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s4);font-size:var(--fs-xs);font-weight:var(--fw-m)}
.empty-wrap{text-align:center;padding:var(--s6);color:var(--text-ter)}.empty-wrap .ti{font-size:32px;display:block;margin-bottom:var(--s2);opacity:0.3}
</style></head><body>

<div class="ph"><h1>围挡巡查</h1></div>
<div class="cov-row" id="covRow"></div>
<div class="split-row">
  <div class="split-left">
    <div class="mini-cal" id="miniCal"></div>
    <div class="miss-panel" id="missPanel"></div>
  </div>
  <div class="split-right">
    <div class="rec-sec"><div class="rec-sec-hd"><span class="rec-sec-tt" id="recTitle">最近巡查记录</span><span class="rec-sec-cnt" id="recCnt"></span></div><div class="rec-sec-body" id="recList"></div></div>
  </div>
</div>

<script>
var FS=['管道铺设工程','沟槽开挖工程','主体结构工程'];
var FC=['#1862D4','#D48A00','#1A9042'];var FCL=['#EBF2FF','#FEF3CD','#E6F4EA'];
var PS=['刘伟','陈刚','王强'],LS=['福华三路中段','福华三路东段','福华三路西段'];
var calY=new Date().getFullYear(),calM=new Date().getMonth()+1,selDate=new Date().toISOString().slice(0,10);
var filterFence='all'; // 'all' or fenceName
var ALL=[];
FS.forEach(function(fn,fi){
  var n=new Date();
  for(var d=0;d<45;d++){var dt=new Date(n);dt.setDate(dt.getDate()-d);var ds=dt.toISOString().slice(0,10);if(d<2||Math.random()>0.28){var c=Math.random()>0.65?2:1;for(var j=0;j<c;j++){var hi=Math.random()>0.72;ALL.push({fenceIdx:fi,fenceName:fn,fenceColor:FC[fi],fenceBg:FCL[fi],date:ds,time:(8+Math.floor(Math.random()*9))+':'+String(Math.floor(Math.random()*60)).padStart(2,'0'),person:PS[Math.floor(Math.random()*PS.length)],loc:LS[Math.floor(Math.random()*LS.length)],nPanos:1+Math.floor(Math.random()*4),hasIssue:hi,issueType:hi?['围挡破损','围挡脏污','围挡基础松动'][Math.floor(Math.random()*3)]:null,status:hi?(Math.random()>0.5?'待整改':'整改完成'):'正常'});}}}
});
ALL.sort(function(a,b){return(b.date+b.time).localeCompare(a.date+a.time)});

function getFiltered(){return filterFence==='all'?ALL:ALL.filter(function(x){return x.fenceName===filterFence})}
function getDateMap(arr){var m={};arr.forEach(function(x){m[x.date]=true});return m}

/* ── Coverage cards ── */
function renderCov(){
  var now=new Date(),ym=calY+'-'+String(calM).padStart(2,'0');
  var monP=ALL.filter(function(x){return x.date.slice(0,7)===ym});
  var workD=Math.round(new Date(calY,calM,0).getDate()*0.7);
  var h='';
  // All card
  var allDays=new Set();monP.forEach(function(x){allDays.add(x.date)});
  var allR=Math.round(allDays.size/workD*100);
  h+='<div class="cov-card all'+(filterFence==='all'?' sel':'')+'" onclick="setFilt(\'all\')"><div class="cov-card-top"><span class="cov-fence-dot" style="background:var(--primary-500)"></span><span class="cov-fence-name">全部围挡</span></div><div class="cov-num">'+allDays.size+'<small>/'+workD+'天</small></div><div class="cov-bar-wrap"><div class="cov-bar" style="width:'+allR+'%;background:var(--primary-500)"></div></div><div class="cov-sub">巡查覆盖率 '+allR+'%</div></div>';
  FS.forEach(function(f,i){
    var fp=monP.filter(function(x){return x.fenceIdx===i}),fd=new Set();fp.forEach(function(x){fd.add(x.date)});
    var rate=Math.round(fd.size/workD*100),nPatrols=fp.length;
    h+='<div class="cov-card'+(filterFence===f?' sel':'')+'" onclick="setFilt(\''+f+'\')"><div class="cov-card-top"><span class="cov-fence-dot" style="background:'+FC[i]+'"></span><span class="cov-fence-name">'+f+'</span><span class="cov-fence-status" style="background:'+FCL[i]+';color:'+FC[i]+'">'+(i===0?'在用':i===1?'在建':'已竣工')+'</span></div><div class="cov-num">'+nPatrols+'<small>条</small></div><div class="cov-bar-wrap"><div class="cov-bar" style="width:'+rate+'%;background:'+FC[i]+'"></div></div><div class="cov-sub">覆盖率 '+rate+'% · '+fd.size+'/'+workD+'天</div></div>';
  });
  document.getElementById('covRow').innerHTML=h;
}
function setFilt(v){filterFence=v;renderCov();renderMiniCal();renderRecsAll()}

/* ── Mini calendar ── */
function renderMiniCal(){
  var wd=['日','一','二','三','四','五','六'];var today=new Date().toISOString().slice(0,10);
  var h='<div class="mini-hd"><span class="mini-hd-tt">巡检日历</span><div class="mini-nav"><button onclick="chMM(-1)">&lt;</button><span class="mini-hd-month">'+calY+'年'+calM+'月</span><button onclick="chMM(1)">&gt;</button></div></div><div class="mini-body"><div class="mini-wd">'+wd.map(function(w){return'<div>'+w+'</div>'}).join('')+'</div><div class="mini-grid">';
  var fd=new Date(calY,calM-1,1).getDay(),dim=new Date(calY,calM,0).getDate();
  var dm=getDateMap(getFiltered());
  for(var i=0;i<fd;i++)h+='<div class="mday other"></div>';
  for(var d=1;d<=dim;d++){var dk=calY+'-'+String(calM).padStart(2,'0')+'-'+String(d).padStart(2,'0'),cls=['mday'];if(dk===today)cls.push('today');if(dk===selDate)cls.push('sel');if(dm[dk])cls.push('has-any');h+='<div class="'+cls.join(' ')+'" onclick="selMD(\''+dk+'\')">'+d+'</div>';}
  h+='</div><div class="mini-leg"><span><span class="ld" style="background:var(--primary-500)"></span>有巡查</span><span><span class="ld" style="background:var(--gray-300)"></span>无</span></div></div>';
  document.getElementById('miniCal').innerHTML=h;

  /* missing panel */
  var now2=new Date(),today2=now2.toISOString().slice(0,10);
  var miss=[];
  FS.forEach(function(f,i){
    var todayRecs=ALL.filter(function(x){return x.fenceIdx===i&&x.date===today2});
    if(!todayRecs.length)miss.push({name:f,color:FC[i],bg:FCL[i]});
  });
  var mp='<div class="miss-tt"><i class="ti ti-alert-triangle"></i>今日未巡查</div>';
  if(!miss.length)mp+='<div style="color:var(--success);padding:4px 0;font-weight:var(--fw-m)"><i class="ti ti-check"></i> 全部围挡今日已巡查</div>';
  else miss.forEach(function(x){mp+='<div class="miss-item"><span class="miss-fence-name"><span class="ld" style="background:'+x.color+'"></span>'+x.name+'</span><span style="color:var(--danger);font-weight:var(--fw-m)">未巡查</span></div>'});
  document.getElementById('missPanel').innerHTML=mp;
}
function chMM(d){calM+=d;if(calM>12){calM=1;calY++}if(calM<1){calM=12;calY--}renderCov();renderMiniCal();renderRecsAll()}
function selMD(dk){selDate=dk;renderMiniCal();renderRecsAll()}

/* ── Records ── */
function renderRecsAll(){
  var el=document.getElementById('recList'),te=document.getElementById('recTitle'),ce=document.getElementById('recCnt');
  var arr=getFiltered().filter(function(x){return x.date===selDate});
  var dp=selDate.split('-'),wk=['日','一','二','三','四','五','六'][new Date(selDate).getDay()];
  te.textContent=parseInt(dp[1])+'月'+parseInt(dp[2])+'日 星期'+wk+' 巡查记录';
  if(!arr.length){ce.textContent='';el.innerHTML='<div class="empty-wrap"><i class="ti ti-mood-happy"></i>当天无巡查记录</div>';return}
  ce.innerHTML='共 <strong>'+arr.length+'</strong> 条';
  el.innerHTML=arr.map(function(r){
    var bg=r.hasIssue?'var(--danger-lt)':'var(--gray-50)',fc=r.hasIssue?'var(--danger)':'var(--success)',ic=r.hasIssue?'ti-alert-triangle':'ti-check';
    var h='<div class="pcard"><div class="pcard-stripe" style="background:'+r.fenceColor+'"></div><div class="pcard-body">';
    h+='<div class="pcard-thumb" style="background:'+bg+';color:'+fc+'"><i class="ti '+ic+'"></i><span>'+r.nPanos+'张全景</span></div>';
    h+='<div class="pcard-info"><div class="pcard-top"><span class="pcard-fence" style="background:'+r.fenceBg+';color:'+r.fenceColor+'">'+r.fenceName+'</span><span class="pcard-person">'+r.person+'</span><span class="pcard-time">'+r.time+'</span></div>';
    h+='<div class="pcard-meta">项目方自查</div><div class="pcard-loc"><i class="ti ti-map-pin" style="font-size:11px"></i> '+r.loc+'</div>';
    if(!r.hasIssue)h+='<span style="display:inline-flex;align-items:center;gap:2px;font-size:10px;padding:1px 6px;border-radius:999px;background:var(--success-lt);color:var(--success);margin-top:2px"><i class="ti ti-check" style="font-size:10px"></i>正常</span>';
    h+='</div></div>';
    if(r.hasIssue)h+='<div class="pcard-issue" style="background:var(--warning-lt);color:var(--warning)"><i class="ti ti-alert-triangle"></i>'+r.issueType+' — '+r.issueDesc+'</div>';
    return h+'</div>';
  }).join('');
}

renderCov();renderMiniCal();renderRecsAll();
</script></body></html>
