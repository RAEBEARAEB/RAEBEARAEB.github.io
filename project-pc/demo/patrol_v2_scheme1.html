<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>围挡巡查 方案1 — 统一日历+色标</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
:root{--primary-50:#EBF2FF;--primary-500:#1862D4;--primary-600:#104FAD;--primary-700:#0A3C86;
--gray-0:#FFF;--gray-50:#F7F8FA;--gray-100:#F0F1F5;--gray-200:#E3E6ED;--gray-300:#C6CBD8;--gray-400:#9CA3B0;--gray-500:#6B7280;--gray-600:#4B5563;--gray-700:#374151;--gray-800:#1F2937;--gray-900:#111827;
--success:#1A9042;--success-lt:#E6F4EA;--warning:#D48A00;--warning-lt:#FEF3CD;--danger:#D13B2F;--danger-lt:#FDECEA;
--text-title:var(--gray-900);--text:var(--gray-800);--text-sec:var(--gray-600);--text-ter:var(--gray-400);
--border:var(--gray-200);--border-focus:var(--primary-500);--radius:4px;--radius-lg:6px;--radius-xl:8px;
--bg-page:var(--gray-50);--bg-card:var(--gray-0);--sidebar-bg:#0D2B55;--header-h:56px;--sidebar-w:220px;
--shadow-sm:0 1px 2px rgba(0,0,0,0.04);--shadow-md:0 2px 8px rgba(0,0,0,0.06);--shadow-card:0 1px 4px rgba(0,0,0,0.05);
--font:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
--fs-xs:12px;--fs-sm:13px;--fs-md:14px;--fs-lg:16px;--fs-xl:18px;--fs-2xl:20px;--fw-r:400;--fw-m:500;--fw-b:600;
--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px}*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font);font-size:var(--fs-md);color:var(--text);background:var(--bg-page);line-height:1.6;-webkit-font-smoothing:antialiased;height:100%}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:3px}
.layout-wrapper{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.layout-header{height:var(--header-h);background:var(--gray-0);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0;position:fixed;top:0;left:0;right:0;z-index:100;box-shadow:var(--shadow-sm)}
.layout-header::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#0A3C86,#1862D4,#0A3C86)}
.hdr-logo{display:flex;align-items:center;gap:var(--s4);padding:0 var(--s6);height:100%;border-right:1px solid var(--gray-100);font-size:var(--fs-xl);font-weight:var(--fw-b);color:var(--text-title)}
.hdr-logo i{font-size:22px;color:var(--primary-500)}.hdr-right{margin-left:auto;padding:0 var(--s5)}.hdr-user{display:flex;align-items:center;gap:var(--s2)}.hdr-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#C6D9FF,#9DBEFF);display:flex;align-items:center;justify-content:center;font-size:var(--fs-xs);color:var(--primary-700);font-weight:var(--fw-m)}.hdr-name{font-size:var(--fs-sm)}
.layout-body{display:flex;margin-top:var(--header-h);height:calc(100vh - var(--header-h));overflow:hidden}
.sidebar{width:var(--sidebar-w);background:var(--sidebar-bg);flex-shrink:0;overflow-y:auto;display:flex;flex-direction:column}.nav{list-style:none;padding:var(--s4) 0;flex:1}
.nav-label{font-size:10px;color:rgba(255,255,255,0.22);letter-spacing:.1em;padding:var(--s5) var(--s5) var(--s1);font-weight:var(--fw-m);text-transform:uppercase}
.nav li a{display:flex;align-items:center;gap:var(--s3);padding:0 var(--s5);height:40px;font-size:var(--fs-sm);color:rgba(255,255,255,0.5);transition:.15s;text-decoration:none}.nav li a:hover{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.85)}
.nav li a.active{background:rgba(24,98,212,0.25);color:#fff;font-weight:var(--fw-m)}.nav li a.active::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:3px;background:#fff;border-radius:0 2px 2px 0}
.nav li{position:relative}.nav-icon{width:16px;height:16px;flex-shrink:0;opacity:0.7}.nav li a.active .nav-icon{opacity:1}.sidebar-foot{padding:var(--s3) var(--s5);border-top:1px solid rgba(255,255,255,0.06);font-size:11px;color:rgba(255,255,255,0.2)}
.main{flex:1;overflow-y:auto;padding:0 var(--s6) var(--s6)}
.crumb{padding:var(--s3) 0 0;font-size:var(--fs-sm);color:var(--text-ter)}.crumb a{color:var(--text-ter);text-decoration:none}.crumb .sep{color:var(--gray-300)}.crumb .cur{color:var(--text);font-weight:var(--fw-m)}
.ph{display:flex;align-items:center;justify-content:space-between;padding:var(--s3) 0 var(--s4)}.ph h1{font-size:var(--fs-2xl);font-weight:var(--fw-b);display:flex;align-items:center;gap:var(--s3)}.ph h1::before{content:'';width:4px;height:24px;background:var(--primary-500);border-radius:2px}

/* ── Filter chips ── */
.chips{display:flex;gap:var(--s2);margin-bottom:var(--s4);flex-wrap:wrap}
.chip{padding:5px 14px;border-radius:999px;font-size:var(--fs-xs);font-weight:var(--fw-m);border:1px solid var(--border);background:var(--gray-0);color:var(--text-sec);cursor:pointer;transition:.15s;font-family:var(--font);white-space:nowrap;display:flex;align-items:center;gap:4px}
.chip:hover{border-color:var(--primary-500);color:var(--primary-500)}.chip.active{background:var(--primary-500);color:#fff;border-color:var(--primary-500)}
.chip-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ── Calendar ── */
.cal-wrap{display:flex;gap:var(--s4);margin-bottom:var(--s4)}
.cal-box{flex:1;background:var(--gray-0);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-card)}
.cal-hd{display:flex;align-items:center;justify-content:space-between;padding:var(--s3) var(--s4);background:var(--gray-50);border-bottom:1px solid var(--border)}
.cal-hd-l{display:flex;align-items:center;gap:var(--s3)}.cal-hd-tt{font-size:var(--fs-md);font-weight:var(--fw-b)}
.cal-nav{display:flex;align-items:center;gap:2px}.cal-nav button{width:28px;height:28px;border:1px solid var(--border);border-radius:var(--radius);background:var(--gray-0);cursor:pointer;font-size:14px;transition:.15s}.cal-nav button:hover{background:var(--gray-50)}
.cal-month{font-size:var(--fs-md);font-weight:var(--fw-b);min-width:80px;text-align:center}
.cal-today{height:28px;padding:0 12px;border:1px solid var(--primary-500);border-radius:var(--radius);background:var(--gray-0);color:var(--primary-500);font-size:var(--fs-xs);cursor:pointer;font-weight:var(--fw-m)}
.cal-today:hover{background:var(--primary-50)}.cal-body{padding:var(--s3) var(--s4)}
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:3px}.cal-wd div{text-align:center;font-size:11px;color:var(--text-ter);font-weight:var(--fw-m);padding:3px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cday{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:var(--radius);font-size:var(--fs-sm);cursor:pointer;transition:.12s;position:relative;gap:1px}
.cday:hover{background:var(--gray-100)}.cday.other{color:var(--gray-300);cursor:default}.cday.other:hover{background:transparent}
.cday.today{font-weight:var(--fw-b);background:var(--primary-50);box-shadow:inset 0 0 0 1.5px var(--primary-500)}
.cday.sel{background:var(--primary-500);color:#fff;font-weight:var(--fw-b)}.cday.sel .cd-dots span{background:#fff!important}
.cd-dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:90%}.cd-dots span{width:5px;height:5px;border-radius:50%;flex-shrink:0}.cd-count{font-size:8px;color:var(--text-ter);line-height:1}
.cal-leg{display:flex;gap:var(--s4);padding:5px var(--s4) 8px;font-size:10px;color:var(--text-ter);border-top:1px solid var(--gray-50)}
.cal-leg span{display:flex;align-items:center;gap:4px}.cal-leg .ld{width:8px;height:8px;border-radius:50%}
.cal-stat{width:200px;flex-shrink:0;background:var(--gray-0);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--s4);box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:var(--s3)}
.stat-tt{font-size:var(--fs-sm);font-weight:var(--fw-b);margin-bottom:var(--s1)}.stat-row{display:flex;justify-content:space-between;align-items:center;font-size:var(--fs-sm);padding:6px 0;border-bottom:1px solid var(--gray-50)}.stat-row:last-child{border-bottom:none}
.stat-bar{width:80px;height:6px;background:var(--gray-100);border-radius:3px;overflow:hidden;flex-shrink:0}.stat-bar-fill{height:100%;border-radius:3px;transition:.3s}
.stat-val{font-weight:var(--fw-b);font-size:var(--fs-sm);min-width:36px;text-align:right}

/* ── Records ── */
.rec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s3)}
.rec-tt{font-size:var(--fs-md);font-weight:var(--fw-b)}.rec-cnt{font-size:var(--fs-xs);color:var(--text-ter)}.rec-cnt strong{color:var(--text)}
.rec-sort{font-size:var(--fs-xs);color:var(--text-ter);cursor:pointer;display:flex;align-items:center;gap:4px}.rec-sort:hover{color:var(--primary-500)}
.pcard{background:var(--gray-0);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:var(--s3);overflow:hidden;box-shadow:var(--shadow-sm);transition:.15s;display:flex}.pcard:hover{box-shadow:var(--shadow-md)}
.pcard-stripe{width:3px;flex-shrink:0}.pcard-body{flex:1;display:flex;gap:var(--s4);padding:var(--s3) var(--s4);min-width:0}
.pcard-thumb{width:72px;height:54px;border-radius:var(--radius);flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;gap:2px}.pcard-thumb .ti{font-size:18px}
.pcard-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pcard-top{display:flex;align-items:center;gap:var(--s2)}.pcard-fence{font-size:10px;padding:1px 6px;border-radius:999px;font-weight:var(--fw-b);flex-shrink:0}
.pcard-person{font-size:var(--fs-sm);font-weight:var(--fw-b)}.pcard-time{font-size:var(--fs-xs);color:var(--text-ter);margin-left:auto;white-space:nowrap}
.pcard-meta{font-size:var(--fs-xs);color:var(--text-sec)}.pcard-loc{font-size:var(--fs-xs);color:var(--text-ter);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard-status{display:inline-flex;align-items:center;gap:2px;font-size:10px;padding:1px 6px;border-radius:999px;margin-top:1px}
.pcard-issue{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s4);font-size:var(--fs-xs);font-weight:var(--fw-m);border-top:1px solid rgba(212,138,0,0.15)}
.empty-wrap{text-align:center;padding:var(--s8);color:var(--text-ter)}.empty-wrap .ti{font-size:36px;display:block;margin-bottom:var(--s2);opacity:0.3}
</style></head><body>
<div class="layout-wrapper">
<header class="layout-header"><div class="hdr-logo"><i class="ti ti-building-fortress"></i>深圳市建设施工围挡数字化管理系统</div><div class="hdr-right"><div class="hdr-user"><div class="hdr-avatar">张</div><span class="hdr-name">张项目</span></div></div></header>
<div class="layout-body">

</ul><div class="sidebar-foot">v2.0.0 · 2026.07</div></aside>
<main class="main">
<div class="crumb"><a href="#">首页</a><span class="sep">/</span><span>围挡管理</span><span class="sep">/</span><span class="cur">围挡巡查</span></div>
<div class="ph"><h1>围挡巡查</h1></div>
<div class="chips" id="chips"></div>
<div class="cal-wrap"><div class="cal-box" id="calBox"></div><div class="cal-stat" id="calStat"></div></div>
<div class="rec-hd"><span class="rec-tt" id="recTitle">巡查记录</span><div style="display:flex;align-items:center;gap:var(--s4)"><span class="rec-sort" id="sortByDate" onclick="toggleSort()"><i class="ti ti-sort-descending"></i> 时间降序</span><span class="rec-cnt" id="recCnt"></span></div></div>
<div id="recList"></div>
</main></div></div>
<script>
var FS=['管道铺设工程','沟槽开挖工程','主体结构工程'];
var FC=['#1862D4','#D48A00','#1A9042']; // blue, orange, green for fences
var FCL=['#EBF2FF','#FEF3CD','#E6F4EA'];
var PS=['刘伟','陈刚','王强'],LS=['福华三路中段','福华三路东段','福华三路西段'];
var calY=new Date().getFullYear(),calM=new Date().getMonth()+1,selDate=new Date().toISOString().slice(0,10);
var filterFence='all',sortAsc=false;
var ALL=[]; // {fenceIdx, date, time, person, loc, nPanos, hasIssue, issueType, issueDesc, status}
FS.forEach(function(fn,fi){
  var n=new Date();
  for(var d=0;d<45;d++){var dt=new Date(n);dt.setDate(dt.getDate()-d);var ds=dt.toISOString().slice(0,10);if(d<2||Math.random()>0.28){var c=Math.random()>0.65?2:1;for(var j=0;j<c;j++){var hi=Math.random()>0.72;ALL.push({fenceIdx:fi,fenceName:fn,fenceColor:FC[fi],fenceBg:FCL[fi],date:ds,time:(8+Math.floor(Math.random()*9))+':'+String(Math.floor(Math.random()*60)).padStart(2,'0'),person:PS[Math.floor(Math.random()*PS.length)],loc:LS[Math.floor(Math.random()*LS.length)],nPanos:1+Math.floor(Math.random()*4),hasIssue:hi,issueType:hi?['围挡破损','围挡脏污','围挡基础松动'][Math.floor(Math.random()*3)]:null,issueDesc:hi?'巡检发现问题已记录上报':null,status:hi?(Math.random()>0.5?'待整改':'整改完成'):'正常'});}}}
});
ALL.sort(function(a,b){return(b.date+b.time).localeCompare(a.date+a.time)});

function getFiltered(){var r=ALL;if(filterFence!=='all')r=r.filter(function(x){return x.fenceName===filterFence});return r}
function getDateMap(arr){var m={};arr.forEach(function(x){if(!m[x.date])m[x.date]={};m[x.date][x.fenceIdx]=(m[x.date][x.fenceIdx]||0)+1});return m}

/* ── Chips ── */
function renderChips(){var h='<button class="chip'+(filterFence==='all'?' active':'')+'" onclick="setFilter(\'all\')"><i class="ti ti-layers-difference" style="font-size:13px"></i>全部围挡 ('+ALL.length+'条)</button>';FS.forEach(function(f,i){var c=ALL.filter(function(x){return x.fenceName===f}).length;h+='<button class="chip'+(filterFence===f?' active':'')+'" onclick="setFilter(\''+f+'\')"><span class="chip-dot" style="background:'+FC[i]+'"></span>'+f+' ('+c+'条)</button>'});document.getElementById('chips').innerHTML=h}
function setFilter(v){filterFence=v;renderChips();renderCal();renderRecs()}

/* ── Calendar ── */
function renderCal(){
  var wd=['日','一','二','三','四','五','六'];
  var h='<div class="cal-hd"><div class="cal-hd-l"><span class="cal-hd-tt"><i class="ti ti-calendar-month" style="font-size:14px;vertical-align:-2px"></i> 巡检日历</span></div><div class="cal-nav"><button onclick="chM(-1)">&lt;</button><span class="cal-month" id="lblM">'+calY+'年'+calM+'月</span><button onclick="chM(1)">&gt;</button></div><button class="cal-today" onclick="goT()">今天</button></div><div class="cal-body"><div class="cal-wd">'+wd.map(function(w){return'<div>'+w+'</div>'}).join('')+'</div><div class="cal-grid" id="calG"></div><div class="cal-leg">';
  FS.forEach(function(f,i){h+='<span><span class="ld" style="background:'+FC[i]+'"></span>'+f+'</span>'});
  h+='<span><span class="ld" style="background:var(--gray-300)"></span> 无巡查</span></div></div>';
  document.getElementById('calBox').innerHTML=h;

  var fd=new Date(calY,calM-1,1).getDay(),dim=new Date(calY,calM,0).getDate(),today=new Date().toISOString().slice(0,10);
  var dm=getDateMap(getFiltered()),g='';
  for(var i=0;i<fd;i++)g+='<div class="cday other"></div>';
  for(var d=1;d<=dim;d++){var dk=calY+'-'+String(calM).padStart(2,'0')+'-'+String(d).padStart(2,'0'),cls=['cday'];if(dk===today)cls.push('today');if(dk===selDate)cls.push('sel');
    var dots='',hasAny=false;FS.forEach(function(fn,fi){if(dm[dk]&&dm[dk][fi]){hasAny=true;dots+='<span style="background:'+FC[fi]+'"></span>'}});
    if(!hasAny){dots='<span style="background:var(--gray-200)"></span>'}
    g+='<div class="'+cls.join(' ')+'" onclick="selD(\''+dk+'\')"><span style="font-size:12px">'+d+'</span><div class="cd-dots">'+dots+'</div></div>';
  }
  document.getElementById('calG').innerHTML=g;

  /* stat */
  var now=new Date(),ym=calY+'-'+String(calM).padStart(2,'0');
  var monP=ALL.filter(function(x){return x.date.slice(0,7)===ym});
  var days=new Set();monP.forEach(function(x){days.add(x.date)});
  var dim2=new Date(calY,calM,0).getDate(),workD=Math.round(dim2*0.7);
  var sh='<div class="stat-tt"><i class="ti ti-chart-bar" style="font-size:14px"></i> 本月巡查概览</div>';
  sh+='<div class="stat-row"><span>总记录</span><span class="stat-val">'+monP.length+'条</span></div>';
  sh+='<div class="stat-row"><span>巡查天数</span><span class="stat-val">'+days.size+'/'+workD+'天</span></div>';
  sh+='<div class="stat-row"><span>覆盖率</span><span class="stat-val" style="color:'+(days.size/workD>=0.8?'var(--success)':days.size/workD>=0.5?'var(--warning)':'var(--danger)')+'">'+Math.round(days.size/workD*100)+'%</span></div>';
  FS.forEach(function(f,i){
    var fp=monP.filter(function(x){return x.fenceIdx===i}),fd2=new Set();fp.forEach(function(x){fd2.add(x.date)});
    var rate=Math.round(fd2.size/workD*100);
    sh+='<div class="stat-row"><span style="display:flex;align-items:center;gap:4px"><span class="ld" style="background:'+FC[i]+'"></span>'+f+'</span><div class="stat-bar"><div class="stat-bar-fill" style="width:'+rate+'%;background:'+FC[i]+'"></div></div><span class="stat-val">'+rate+'%</span></div>';
  });
  document.getElementById('calStat').innerHTML=sh;
}
function chM(d){calM+=d;if(calM>12){calM=1;calY++}if(calM<1){calM=12;calY--}renderCal();renderRecs()}
function goT(){var n=new Date();calY=n.getFullYear();calM=n.getMonth()+1;selDate=n.toISOString().slice(0,10);renderCal();renderRecs()}
function selD(dk){selDate=dk;renderCal();renderRecs()}

/* ── Records ── */
function renderRecs(){
  var el=document.getElementById('recList'),te=document.getElementById('recTitle'),ce=document.getElementById('recCnt');
  var arr=getFiltered().filter(function(x){return x.date===selDate});if(sortAsc)arr.reverse();
  var dp=selDate.split('-'),wk=['日','一','二','三','四','五','六'][new Date(selDate).getDay()];
  te.textContent=parseInt(dp[1])+'月'+parseInt(dp[2])+'日 星期'+wk;
  if(!arr.length){ce.textContent='';el.innerHTML='<div class="empty-wrap"><i class="ti ti-mood-happy"></i>当天无巡查记录</div>';return}
  ce.innerHTML='共 <strong>'+arr.length+'</strong> 条';
  el.innerHTML=arr.map(function(r){
    var bg=r.hasIssue?'var(--danger-lt)':'var(--gray-50)',fc=r.hasIssue?'var(--danger)':'var(--success)',ic=r.hasIssue?'ti-alert-triangle':'ti-check';
    var h='<div class="pcard"><div class="pcard-stripe" style="background:'+r.fenceColor+'"></div><div class="pcard-body">';
    h+='<div class="pcard-thumb" style="background:'+bg+';color:'+fc+'"><i class="ti '+ic+'"></i><span>'+r.nPanos+'张全景</span></div>';
    h+='<div class="pcard-info"><div class="pcard-top"><span class="pcard-fence" style="background:'+r.fenceBg+';color:'+r.fenceColor+'">'+r.fenceName+'</span><span class="pcard-person">'+r.person+'</span><span class="pcard-time">'+r.time+'</span></div>';
    h+='<div class="pcard-meta">项目方自查</div><div class="pcard-loc"><i class="ti ti-map-pin" style="font-size:11px"></i> '+r.loc+'</div>';
    if(!r.hasIssue)h+='<span class="pcard-status" style="background:var(--success-lt);color:var(--success)"><i class="ti ti-check" style="font-size:10px"></i>正常</span>';
    h+='</div></div>';
    if(r.hasIssue)h+='<div class="pcard-issue" style="background:var(--warning-lt);color:var(--warning)"><i class="ti ti-alert-triangle"></i>'+r.issueType+' — '+r.issueDesc+'</div>';
    return h+'</div>';
  }).join('');
}
function toggleSort(){sortAsc=!sortAsc;document.getElementById('sortByDate').innerHTML=(sortAsc?'<i class="ti ti-sort-ascending"></i> 时间升序':'<i class="ti ti-sort-descending"></i> 时间降序');renderRecs()}

renderChips();renderCal();renderRecs();
</script></body></html>
