<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>全景查看 v2 - 深圳市建设施工围挡数字化管理系统</title>
<style>
:root{
  --blue-50:#E9EBFD;--blue-100:#C8CDFA;--blue-200:#A2ADF6;
  --blue-300:#788CF3;--blue-400:#5670F0;--blue-500:#2F55EB;--blue-600:#294CDF;
  --blue-700:#1C41D3;--blue-800:#0A35C7;--blue-900:#0D47A1;
  --blue:var(--blue-500);--blue-deep:var(--blue-700);--blue-soft:var(--blue-50);
  --gray-50:#F9F9F9;--gray-100:#E6E8EA;--gray-200:#C6CACD;
  --gray-300:#A7ABB0;--gray-400:#888D92;--gray-500:#6B7075;--gray-600:#555B61;
  --gray-700:#41464C;--gray-800:#2E3238;--gray-900:#1C1F23;
  --gray-0:#FFFFFF;
  --bg:#F5F7FA;--panel:#FFFFFF;--panel-2:#F9F9F9;
  --green:#3BB346;--green-light:rgba(59,179,70,0.10);
  --yellow:#D0AA00;--yellow-light:rgba(208,170,0,0.10);
  --orange:#FC8800;--orange-light:rgba(252,136,0,0.10);
  --red:#F93920;--red-light:rgba(249,57,32,0.10);
  --text:#555B61;--text-sub:#888D92;--text-tertiary:#A7ABB0;
  --border:#E9F0F7;
  --radius-sm:2px;--radius-md:4px;
  --font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --font-xs:12px;--font-sm:12px;--font-md:14px;--font-lg:16px;--font-xl:18px;
  --fw-regular:400;--fw-medium:500;--fw-bold:600;--fw-heavy:700;
  --safe-top:47px;--safe-bottom:34px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font-family);font-size:var(--font-md);color:var(--text);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased;height:100%;overflow:hidden}
.phone-frame{position:relative;width:390px;height:844px;margin:20px auto;background:var(--bg);border-radius:40px;overflow:hidden;box-shadow:0 0 0 2px #1a1a1a,0 0 0 6px #333,0 0 0 8px #1a1a1a,0 20px 60px rgba(0,0,0,0.3)}
.phone-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#000;border-radius:0 0 20px 20px;z-index:999}
.phone-home-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;background:rgba(255,255,255,0.15);border-radius:3px;z-index:999}
.phone-screen{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;background:#000}

/* Top */
.top-overlay{position:absolute;top:0;left:0;right:0;padding-top:var(--safe-top);z-index:50}
.top-bar{display:flex;align-items:center;padding:0 12px;height:52px;gap:10px;background:rgba(0,0,0,.72)}
.top-back{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;z-index:1}
.top-back svg{width:18px;height:18px;color:#fff}
.top-info{flex:1;min-width:0;text-align:left}
.top-title{font-size:var(--font-sm);color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:var(--fw-medium);line-height:1.3}
.top-time{font-size:var(--font-xs);color:rgba(255,255,255,.50);line-height:1.3}
.top-cal{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;z-index:1}
.top-cal svg{width:16px;height:16px;color:#fff}

/* Pano — ends exactly where bottom bar begins */
.pano-container{position:absolute;top:calc(var(--safe-top) + 52px);left:0;right:0;bottom:100px;background:#000}
.pano-container iframe{width:100%;height:100%;border:none}
.pano-fallback{position:absolute;inset:0;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.pano-fallback svg{width:80px;height:80px;color:rgba(255,255,255,.12)}
.pano-fallback .title{font-size:var(--font-xl);color:rgba(255,255,255,.45);font-weight:var(--fw-bold);letter-spacing:.04em}
.pano-fallback .sub{font-size:var(--font-xs);color:rgba(255,255,255,.25)}

/* ── V2 Bottom Bar — fixed height, full-width black, no margin ── */
.btm-handle{position:absolute;bottom:0;left:0;right:0;height:100px;padding-bottom:var(--safe-bottom);background:#000;z-index:50}
.btm-bar{display:flex;flex-direction:column;justify-content:flex-start;padding:10px 8px 4px;height:100%}
.btm-count{font-size:10px;color:rgba(255,255,255,.5);text-align:center;line-height:1.3;min-height:18px;margin-bottom:6px}
.btm-row{display:flex;align-items:center;gap:6px;margin-top:auto}
.btm-arrow{width:28px;height:28px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;z-index:1;border-radius:50%;background:rgba(255,255,255,.15)}
.btm-arrow:active{background:rgba(255,255,255,.3)}
.btm-arrow svg{width:16px;height:16px;color:#fff}
.btm-btns{flex:1;display:flex;gap:8px;justify-content:center}
.btm-btn{flex:1;height:42px;border-radius:var(--radius-md);border:none;font-size:var(--font-xs);font-weight:var(--fw-medium);cursor:pointer;color:#fff;background:rgba(255,255,255,.15);font-family:var(--font-family);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:2px 4px}
.btm-btn-sub{font-size:9px;font-weight:var(--fw-medium);opacity:.8}
.btm-btn-sub.green{color:var(--green)}
.btm-btn-sub.red{color:var(--red)}
.btm-btn:active{background:rgba(255,255,255,.3)}
.btm-tag{display:inline-block;font-size:10px;padding:2px 6px;border-radius:999px}
.btm-tag-green{display:inline-block;font-size:10px;padding:2px 6px;border-radius:999px;background:var(--green-light);color:var(--green)}
.btm-tag-red{display:inline-block;font-size:10px;padding:2px 6px;border-radius:999px;background:var(--red-light);color:var(--red)}

/* Floating quick-report button */
.fab-report{width:36px;height:36px;border-radius:50%;background:var(--red);color:#fff;border:none;font-size:16px;font-weight:var(--fw-heavy);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:55;box-shadow:0 2px 8px rgba(0,0,0,.4);line-height:1;flex-shrink:0}
.fab-report:active{background:#D52515;transform:scale(.95)}

/* Quick-report drawer */
.report-panel{position:absolute;bottom:0;left:0;right:0;height:62%;background:var(--panel);border-radius:12px 12px 0 0;z-index:65;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:0 -4px 20px rgba(0,0,0,.12)}
.report-panel.show{transform:translateY(0)}
.report-panel-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 10px;border-bottom:1px solid var(--border)}
.report-panel-title{font-size:var(--font-lg);font-weight:var(--fw-heavy);display:flex;align-items:center;gap:6px}
.report-panel-title::before{content:'';width:3px;height:16px;background:var(--red);border-radius:2px}
.report-panel-close{width:28px;height:28px;border-radius:50%;background:var(--gray-100);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-sub)}
.report-panel-body{flex:1;overflow-y:auto;padding:12px 16px}
.report-panel-body::-webkit-scrollbar{display:none}
.report-panel-foot{display:flex;gap:10px;padding:12px 16px calc(var(--safe-bottom) + 8px) 16px;border-top:1px solid var(--border);background:var(--panel)}
.report-panel-foot button{flex:1;height:40px;border-radius:var(--radius-md);border:none;font-size:var(--font-md);font-weight:var(--fw-bold);cursor:pointer;font-family:var(--font-family)}
.report-panel-foot .btn-primary{background:var(--blue);color:#fff}
.report-panel-foot .btn-cancel{background:var(--gray-100);color:var(--text-sub)}

/* Report issue card */
.rpt-issue-item{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px;margin-bottom:10px;position:relative;box-shadow:var(--shadow-sm,0 4px 10px rgba(0,0,0,.05))}
.rpt-issue-label{font-size:var(--font-xs);color:var(--text-sub);margin-bottom:4px;font-weight:var(--fw-medium)}
.rpt-issue-label .required{color:var(--red);margin-right:2px}
.rpt-issue-item select,.rpt-issue-item textarea{width:100%;border:1px solid var(--gray-200);border-radius:var(--radius-md);font-size:var(--font-sm);font-family:var(--font-family);padding:7px 8px;background:var(--panel);color:var(--text);outline:none}
.rpt-issue-item select:focus,.rpt-issue-item textarea:focus{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-50)}
.rpt-issue-item select{margin-bottom:8px;height:34px}
.rpt-issue-item textarea{height:56px;resize:vertical;margin-bottom:0}
.rpt-issue-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.rpt-issue-head span{font-size:var(--font-sm);font-weight:var(--fw-heavy);color:var(--text)}
.rpt-issue-del{width:24px;height:24px;border-radius:50%;background:var(--gray-100);border:none;cursor:pointer;font-size:14px;color:var(--text-sub);display:flex;align-items:center;justify-content:center;transition:all var(--fast, .15s ease)}
.rpt-issue-del:active{background:var(--red-light);color:var(--red)}
.rpt-add-btn{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;padding:10px;border:1px dashed var(--blue-300);border-radius:var(--radius-md);background:var(--blue-50);color:var(--blue);font-size:var(--font-sm);font-weight:var(--fw-medium);cursor:pointer;font-family:var(--font-family);transition:all var(--fast, .15s ease)}
.rpt-add-btn:active{background:var(--blue-100);border-color:var(--blue)}
/* ── Photo upload ── */
.rpt-photo-preview{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.rpt-photo-thumb{width:56px;height:56px;border-radius:var(--radius-md);object-fit:cover;border:1px solid var(--border);position:relative}
.rpt-photo-add{width:56px;height:56px;border-radius:var(--radius-md);border:1px dashed var(--gray-300);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-sub);font-size:22px;transition:all var(--fast)}
.rpt-photo-add:active{background:var(--gray-50);border-color:var(--blue)}

/* Drawer */
.btm-drawer{position:absolute;bottom:0;left:0;right:0;height:50%;background:var(--panel);border-radius:12px 12px 0 0;z-index:60;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.btm-drawer.show{transform:translateY(0)}
.drawer-handle{display:flex;justify-content:center;padding:8px 0}
.drawer-bar{width:36px;height:4px;background:var(--gray-200);border-radius:2px}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 8px}
.drawer-close{width:28px;height:28px;border-radius:50%;background:var(--gray-100);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-sub)}
.drawer-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.drawer-tab{flex:1;text-align:center;padding:10px 0;font-size:var(--font-sm);color:var(--text-sub);font-weight:var(--fw-medium);cursor:pointer;position:relative}
.drawer-tab.active{color:var(--gray-900);font-weight:var(--fw-heavy)}
.drawer-tab.active::after{content:'';position:absolute;bottom:0;left:18px;right:18px;height:3px;background:var(--blue);border-radius:2px}
.drawer-body{flex:1;overflow-y:auto;padding:12px 16px}
.drawer-body::-webkit-scrollbar{display:none}
.dr-row{display:flex;padding:8px 0;font-size:var(--font-sm);border-bottom:1px solid var(--border)}
.dr-row:last-child{border-bottom:none}
.dr-label{color:var(--text-sub);min-width:80px;flex-shrink:0}
.dr-value{color:var(--text);flex:1;word-break:break-all}
.dr-btn{display:block;width:100%;height:36px;margin-top:12px;background:var(--blue);color:#fff;border:none;border-radius:var(--radius-md);font-size:var(--font-md);font-weight:var(--fw-medium);cursor:pointer}
.issue-card{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 78px 10px 10px;margin-bottom:8px}
.issue-type{font-size:var(--font-sm);font-weight:var(--fw-bold);color:var(--text);margin-bottom:3px}
.issue-desc{font-size:var(--font-xs);color:var(--text-sub);margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.issue-source{display:inline-block;font-size:10px;color:var(--blue);margin-top:2px}
.issue-status{position:absolute;top:10px;right:10px}
.tag{display:inline-block;font-size:var(--font-xs);font-weight:var(--fw-medium);padding:3px 8px;border-radius:999px}
.tag-green{background:var(--green-light);color:var(--green)}
.tag-orange{background:var(--orange-light);color:var(--orange)}
.tag-red{background:var(--red-light);color:var(--red)}
.tag-grey{background:var(--gray-100);color:var(--gray-500)}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 0;color:var(--text-sub)}
.empty-state svg{width:36px;height:36px;opacity:.25;margin-bottom:6px}
.empty-state span{font-size:var(--font-xs)}

/* Calendar */
.cal-overlay{position:absolute;inset:0;z-index:70;display:none}
.cal-overlay.show{display:flex}
.cal-mask{position:absolute;inset:0;background:rgba(0,0,0,.54)}
.cal-panel{position:absolute;right:0;top:0;bottom:0;width:88%;background:var(--panel);z-index:2;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;padding-top:var(--safe-top)}
.cal-overlay.show .cal-panel{transform:translateX(0)}
.cal-head{display:flex;align-items:center;justify-content:center;position:relative;padding:14px 16px 6px}
.cal-head-title{font-size:var(--font-md);font-weight:var(--fw-heavy);color:var(--text);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-close{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:var(--gray-100);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-sub);flex-shrink:0}
.cal-nav-row{display:flex;align-items:center;justify-content:space-between;padding:0 16px 14px}
.cal-mth{flex:1;font-size:var(--font-lg);font-weight:var(--fw-heavy);text-align:center}
.cal-nav-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--blue);border-radius:50%;cursor:pointer}
.cal-nav-btn:active{background:var(--gray-100)}
.cal-nav-btn svg{width:18px;height:18px}
.cal-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:0}
.cal-grid{width:280px;display:grid;grid-template-columns:repeat(7,1fr);margin:0 auto}
.cal-dow{text-align:center;font-size:var(--font-xs);color:var(--text-sub);padding:6px 0 4px;font-weight:var(--fw-medium)}
.cal-day{text-align:center;padding:4px 0 4px;cursor:pointer;position:relative;border-radius:var(--radius-md)}
.cal-day:active{background:var(--gray-100)}
.cal-day .day-num{display:inline-block;width:30px;height:30px;line-height:30px;font-size:var(--font-sm);color:var(--text);border-radius:50%;transition:all var(--fast)}
.cal-day.other .day-num{color:var(--gray-300)}
.cal-day.today .day-num{font-weight:var(--fw-heavy);color:var(--blue)}
.cal-day.selected .day-num{background:var(--blue);color:#fff;font-weight:var(--fw-heavy)}
.cal-dots{display:flex;justify-content:center;padding:1px 0 0}
.cal-dot{width:4px;height:4px;border-radius:50%;background:var(--blue);flex-shrink:0}
.cal-records{flex:1;overflow-y:auto;border-top:1px solid var(--border);padding-bottom:12px;width:280px;margin:0 auto}
.cal-records::-webkit-scrollbar{display:none}
.cal-rec-title{font-size:var(--font-sm);font-weight:var(--fw-heavy);color:var(--text);padding:12px 0 6px;text-align:left}
.cal-rec-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 12px;margin-bottom:6px;cursor:pointer;transition:all var(--fast);width:100%}
.cal-rec-card:active,.cal-rec-card.active{background:var(--blue-50);border-color:var(--blue)}
.cal-rec-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.cal-rec-time{font-size:var(--font-xs);font-weight:var(--fw-heavy);color:var(--text)}
.cal-rec-badge{font-size:10px;padding:2px 6px;border-radius:999px;font-weight:var(--fw-medium)}
.cal-rec-badge.normal{background:var(--green-light);color:var(--green)}
.cal-rec-badge.abnormal{background:var(--red-light);color:var(--red)}
.cal-rec-person{font-size:var(--font-xs);color:var(--text-sub)}
.cal-rec-empty{padding:24px 0;text-align:center;font-size:var(--font-xs);color:var(--text-tertiary)}

.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#222;color:#fff;padding:10px 18px;border-radius:8px;font-size:var(--font-lg);z-index:999;opacity:0;transition:all .3s ease;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* ── Location picker ── */
.loc-picker-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:9px 12px;border:1px solid var(--gray-200);border-radius:var(--radius-md);background:var(--panel);color:var(--blue);font-size:var(--font-sm);font-weight:var(--fw-medium);cursor:pointer;font-family:var(--font-family);transition:all var(--fast)}
.loc-picker-btn:active{background:var(--blue-50);border-color:var(--blue)}
.loc-picker-btn.picked{border-color:var(--blue);color:var(--text);justify-content:flex-start;gap:4px}
.loc-picker-btn svg{flex-shrink:0;width:14px;height:14px}
.loc-map-modal{position:absolute;inset:0;z-index:2000;background:rgba(0,0,0,0.5);display:none;flex-direction:column}
.loc-map-modal.show{display:flex}
.loc-map-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--border)}
.loc-map-title{font-size:var(--font-md);font-weight:var(--fw-heavy);color:var(--text)}
.loc-map-close{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text-sub);background:var(--gray-50)}
.loc-map-container{flex:1;position:relative}
.loc-map-container>div{position:absolute;inset:0}
.loc-map-foot{display:flex;gap:10px;padding:12px 16px;background:var(--panel);border-top:1px solid var(--border)}
.loc-map-foot .btn-primary{flex:1;height:40px;border-radius:var(--radius-md);background:var(--blue);color:#fff;font-size:var(--font-md);font-weight:var(--fw-medium);border:none;cursor:pointer}
.loc-map-foot .btn-cancel{flex:1;height:40px;border-radius:var(--radius-md);background:var(--gray-100);color:var(--text-sub);font-size:var(--font-md);font-weight:var(--fw-medium);border:none;cursor:pointer}
.loc-pin-hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:999;background:rgba(0,0,0,0.7);color:#fff;font-size:11px;padding:4px 12px;border-radius:10px;pointer-events:none;opacity:0;transition:opacity 0.3s}
.loc-pin-hint.show{opacity:1}
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="../mock-data.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<body>
<div class="phone-frame">
  <div class="phone-notch"></div>
  <div class="phone-home-indicator"></div>
  <div class="phone-screen">
    <div class="pano-container">
      <iframe id="panoIframe" src="" allowfullscreen allow="camera;gyroscope;accelerometer;vr"></iframe>
      <div class="pano-fallback" id="panoFallback">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <span class="title">暂无全景链接</span>
        <span class="sub">该巡检记录未上传全景照片</span>
      </div>
    </div>
    <!-- Top -->
    <div class="top-overlay">
      <div class="top-bar">
        <button class="top-back" onclick="goBack()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
        <div class="top-info">
          <div class="top-title" id="topTitle">巡查记录</div>
          <div class="top-time" id="topTime"></div>
        </div>
        <button class="top-cal" onclick="openCalendar()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></button>
      </div>
    </div>
    <!-- Bottom Handle -->

function updateTop(){
  var cur=findFence();var r=_curRecords[_curRecIdx];
  document.getElementById('topTitle').textContent='巡查记录 - '+(cur?cur.engName:'--');
  document.getElementById('topTime').textContent=(r?r.date:'--')+' '+(r?r.time||'--:--':'--');
}

/* ── V2 Bottom Bar ── */
function updateBottom(){
  var r=_curRecords[_curRecIdx];if(!r)return;
  var isAb=r.result==='异常',ic=(r.issues||[]).length;
  var issueLabel=isAb?ic+'个问题':'正常';
  var issueCls=isAb?'issue':'normal-status';
  var isToday=_curDate===_todayStr;
  var todayIdx=_todayFenceKeys.indexOf(curFenceKey());
  var todayCount=_todayFenceKeys.length;
  var curIsPatrolled=todayIdx>=0;

  // Only show prev/next arrows when: (a) viewing today AND (b) current fence was patrolled today
  var showArrows=isToday&&curIsPatrolled;

  var html='';
  if(showArrows&&todayCount>0){
    var pos=todayIdx+1;
    html+='<div class="btm-count">第 '+pos+' 条 / 今日共 '+todayCount+' 条巡检</div>';
  }
  html+='<div class="btm-row">';
  if(showArrows&&todayCount>0){
    html+='<div class="btm-arrow" onclick="prevFenceToday()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></div>';
  }
  html+='<div class="btm-btns">';
  html+='<button class="btm-btn" onclick="openDrawerTab(\'info\')">巡检信息<span class="btm-btn-sub '+(isAb?'red':'green')+'">'+(isAb?ic+'个问题':'正常')+'</span></button>';
  html+='<button class="btm-btn" onclick="openQuickReport()">新增问题</button>';
  html+='</div>';
  if(showArrows&&todayCount>0){
    html+='<div class="btm-arrow" onclick="nextFenceToday()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></div>';
  }
  html+='</div>';

  document.getElementById('btmBar').innerHTML=html;
  refreshPano();
}

function openDrawerTab(tab){
  _drawerTab=tab;
  var tabs=document.querySelectorAll('.drawer-tab');
  tabs.forEach(function(t){t.classList.remove('active');});
  // Find the tab that matches and activate it
  tabs.forEach(function(t){
    var onclick=t.getAttribute('onclick')||'';
    if(onclick.indexOf("'"+tab+"'")>=0)t.classList.add('active');
  });
  document.getElementById('btmDrawer').classList.add('show');
  renderDrawer();
}

/* ── Today fence switching ── */
function prevFenceToday(){
  var idx=_todayFenceKeys.indexOf(curFenceKey());if(idx<=0)return;
  var prev=parseFenceKey(_todayFenceKeys[idx-1]);
  var fence=findFenceByInput(prev.projectId,prev.fid);
  if(!fence)return;
  var recs=fence.patrolRecords.filter(function(r){return r.date===_todayStr;}).sort(function(a,b){return(b.time||'').localeCompare(a.time||'');});
  if(!recs.length)return;
  _curProjectId=prev.projectId;_curFid=prev.fid;_curRecords=recs;_curRecIdx=0;
  updateTop();updateBottom();renderDrawer();
}

function nextFenceToday(){
  var idx=_todayFenceKeys.indexOf(curFenceKey());if(idx<0||idx>=_todayFenceKeys.length-1)return;
  var next=parseFenceKey(_todayFenceKeys[idx+1]);
  var fence=findFenceByInput(next.projectId,next.fid);
  if(!fence)return;
  var recs=fence.patrolRecords.filter(function(r){return r.date===_todayStr;}).sort(function(a,b){return(b.time||'').localeCompare(a.time||'');});
  if(!recs.length)return;
  _curProjectId=next.projectId;_curFid=next.fid;_curRecords=recs;_curRecIdx=0;
  updateTop();updateBottom();renderDrawer();
}

  if(_drawerTab==='info'){
    html+='<div class="dr-row"><span class="dr-label">巡检人</span><span class="dr-value">'+esp(r.inspector)+'</span></div>';
    html+='<div class="dr-row"><span class="dr-label">巡检时间</span><span class="dr-value">'+(r.date||'')+' '+(r.time||'')+'</span></div>';
    var isAb=r.result==='异常',ic=(r.issues||[]).length;
    html+='<div class="dr-row"><span class="dr-label">围挡状态</span><span class="dr-value">'+(isAb?'<span class="tag tag-orange">'+ic+'个问题</span>':'<span class="tag tag-green">正常</span>')+'</span></div>';
    if(r.remark)html+='<div class="dr-row"><span class="dr-label">备注</span><span class="dr-value">'+esp(r.remark)+'</span></div>';
    html+='<button class="dr-btn" onclick="goIssueDetail()">查看详情</button>';
  }else{
    if(r.issues&&r.issues.length){r.issues.forEach(function(iss, idx){
      var issueStatus=getIssueStatusMeta(iss,cur);
      html+='<div class="issue-card" onclick="goPatrolIssue('+idx+')" style="cursor:pointer"><div class="issue-type">'+esp(iss.type)+'</div><div class="issue-desc">'+esp(iss.detail)+'</div><span class="issue-source">来源：'+esp(iss.source||'项目巡检')+(iss.source==='监管巡查'&&iss.supervisor?'（'+esp(iss.supervisor)+'）':'')+'</span><span class="tag '+issueStatus.cls+' issue-status">'+issueStatus.label+'</span></div>';
    });}else{html='<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg><span>暂无关联问题</span></div>';}
  }
  document.getElementById('drawerBody').innerHTML=html;
}
function getIssueStatusMeta(issue,fence){
  var status=(issue&&issue.status)||findLinkedIssueStatus(issue,fence)||'待整改';
  if(status==='整改逾期')return{cls:'tag-red',label:'整改逾期'};
  if(status==='整改完成')return{cls:'tag-green',label:'整改完成'};
  return{cls:'tag-orange',label:'待整改'};
}
function findLinkedIssueStatus(issue,fence){
  if(!issue||!fence)return'';
  try{
    var raw=localStorage.getItem('YZY_STREET_ISSUES');
    if(!raw)return'';
    var list=JSON.parse(raw);
    if(!Array.isArray(list))return'';
    for(var i=0;i<list.length;i++){
      var item=list[i];
      if(item.fenceId===_curFid&&item.engineerName===fence.engName&&item.type===issue.type&&item.details===issue.detail&&item.status&&item.status!=='正常')return item.status;
    }
    for(var j=0;j<list.length;j++){
      var item2=list[j];
      if(item2.fenceId===_curFid&&item2.engineerName===fence.engName&&item2.type===issue.type&&item2.status&&item2.status!=='正常')return item2.status;
    }
  }catch(e){}
  return'';
}

  var units=[];if(cur){
    var projs=typeof MOCK_DATA!=='undefined'?MOCK_DATA.getProjects():[];

  }
  if(!units.length&&cur&&cur.constructUnit)units.push(cur.constructUnit);
  _rptIssues.forEach(function(iss,i){
    var typeOpts=ISSUE_TYPES_RPT.map(function(t){return'<option value="'+t+'"'+(iss.type===t?' selected':'')+'>'+t+'</option>';}).join('');
    var unitOpts=units.map(function(u){return'<option value="'+u+'"'+(iss.unit===u?' selected':'')+'>'+u+'</option>';}).join('');
    html+='<div class="rpt-issue-item">'+
      '<div class="rpt-issue-head"><span>问题项 '+(i+1)+'</span>'+
      (_rptIssues.length>1?'<button class="rpt-issue-del" onclick="rptDelIssue('+i+')">&times;</button>':'')+
      '</div>'+
      '<div class="rpt-issue-label"><span class="required">*</span>问题类型</div>'+
      '<select onchange="rptFieldChange('+i+',&quot;type&quot;,this.value)"><option value="">请选择问题类型</option>'+typeOpts+'</select>'+
      '<div class="rpt-issue-label"><span class="required">*</span>责任单位</div>'+
      '<select onchange="rptFieldChange('+i+',&quot;unit&quot;,this.value)"><option value="">请选择责任单位</option>'+unitOpts+'</select>'+
      '<div class="rpt-issue-label"><span class="required">*</span>问题详情</div>'+
      '<textarea placeholder="请描述问题的具体情况、位置和严重程度" onchange="rptFieldChange('+i+',&quot;detail&quot;,this.value)">'+esp(iss.detail)+'</textarea>'+
      '<div class="rpt-issue-label" style="margin-top:8px"><span class="required">*</span>现场照片</div>'+
      '<div class="rpt-photo-preview">'+
        (iss.photos||[]).map(function(p,pi){return'<img class="rpt-photo-thumb" src="'+p+'" onclick="rptDelPhoto('+i+','+pi+')" title="点击删除">';}).join('')+
        ((iss.photos||[]).length<6?'<div class="rpt-photo-add" onclick="rptAddPhoto('+i+')">+</div>':'')+
      '</div>'+
      '<div class="rpt-issue-label"><span class="required">*</span>位置</div>'+
      '<button class="loc-picker-btn'+(iss.location?' picked':'')+'" id="rptLocBtn'+i+'" onclick="openLocMap('+i+')">'+
        (iss.location?
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>'+
          '<span style="font-size:11px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esp(iss.location||'')+'</span>':
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>点击地图选择位置')+
      '</button>'+
    '</div>';
  });
  html+='<button class="rpt-add-btn" onclick="rptAddIssue()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>添加问题项</button>';
  b.innerHTML=html;
}
/* ── Location map picker ── */
var _locMap=null, _locMarker=null, _locIssueIdx=-1, _locPicked={lat:null,lng:null,addr:''};
function openLocMap(idx){
  _locIssueIdx=idx; _locPicked={lat:null,lng:null,addr:''};
  var iss=_rptIssues[idx];
  document.getElementById('locMapModal').classList.add('show');
  setTimeout(function(){
    var el=document.getElementById('locMapContainer'); if(!el)return;
    if(_locMap){_locMap.remove();_locMap=null;}
    _locMap=L.map(el,{zoomControl:true,attributionControl:false});
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(_locMap);
    var cur=findFence(), center=[22.548,114.061], zoom=13;
    if(cur&&cur.gpsShape&&cur.gpsShape.length>=2){
      var fs=cur.gpsShape.map(function(p){return[p[0],p[1]];});
      L.polygon(fs,{color:'#2F55EB',weight:2,fillColor:'rgba(47,85,235,0.2)',fillOpacity:1}).addTo(_locMap);
      var cx=0,cy=0;for(var i=0;i<fs.length;i++){cx+=fs[i][0];cy+=fs[i][1];}
      center=[cx/fs.length,cy/fs.length]; zoom=16;
    }
    _locMap.setView(center,zoom);
      // Project redline
      if(cur&&cur.projectName){
        var projs=MOCK_DATA.getProjects();
        for(var pi=0;pi<projs.length;pi++){
          if(projs[pi].name===cur.projectName&&projs[pi].redlineGeo&&projs[pi].redlineGeo.length>=3){
            L.polygon(projs[pi].redlineGeo,{color:'#F93920',weight:2,fill:false}).addTo(_locMap);
            break;
          }
        }
      }
    if(iss&&iss.location&&iss._locLat){
      _locPicked={lat:iss._locLat,lng:iss._locLng,addr:iss.location};
      _locMarker=L.marker([iss._locLat,iss._locLng],{draggable:true}).addTo(_locMap);
      _locMarker.on('dragend',function(){var ll=_locMarker.getLatLng();_locPicked.lat=ll.lat;_locPicked.lng=ll.lng;});
      _locMap.setView([iss._locLat,iss._locLng],17);
    }
    _locMap.on('click',function(e){
      if(_locMarker){_locMap.removeLayer(_locMarker);}
      _locPicked={lat:e.latlng.lat,lng:e.latlng.lng,addr:e.latlng.lat.toFixed(6)+', '+e.latlng.lng.toFixed(6)};
      _locMarker=L.marker([e.latlng.lat,e.latlng.lng],{draggable:true}).addTo(_locMap);
      _locMarker.on('dragend',function(){var ll=_locMarker.getLatLng();_locPicked.lat=ll.lat;_locPicked.lng=ll.lng;});
      document.getElementById('locPinHint').classList.remove('show');
    });
    setTimeout(function(){_locMap.invalidateSize();},100);
    setTimeout(function(){document.getElementById('locPinHint').classList.add('show');},300);
  },200);
}
function closeLocMap(){
  document.getElementById('locMapModal').classList.remove('show');
  if(_locMap){_locMap.remove();_locMap=null;}
}
function confirmLocPick(){
  if(!_locPicked.lat){showToast('请在地图上点击选择问题位置',true);return;}
  _rptIssues[_locIssueIdx].location=_locPicked.addr;
  _rptIssues[_locIssueIdx]._locLat=_locPicked.lat;
  _rptIssues[_locIssueIdx]._locLng=_locPicked.lng;
  closeLocMap();
  renderQuickReport();
}


function saveQuickReport(){
  if(!_curFid){showToast('未选择围挡',true);return;}
  for(var i=0;i<_rptIssues.length;i++){
    var iss=_rptIssues[i], idx=i+1;
    if(!iss.type){showToast('请选择问题项'+idx+'的问题类型',true);return;}
    if(!iss.unit){showToast('请选择问题项'+idx+'的责任单位',true);return;}
    if(!iss.detail.trim()){showToast('请填写问题项'+idx+'的问题详情',true);return;}
    if(!(iss.photos||[]).length){showToast('请为问题项'+idx+'上传至少一张现场照片',true);return;}
    if(!iss._locLat){showToast('请在地图上选择问题项'+idx+'的位置',true);return;}
  }
  var cur=findFence();if(!cur){showToast('未找到围挡数据',true);return;}
  var now=new Date();var dt=now.toISOString().slice(0,19).replace('T',' ');
  var existingIssues=[];
  try{var raw=localStorage.getItem('YZY_STREET_ISSUES');if(raw)existingIssues=JSON.parse(raw);}catch(e){}
  _rptIssues.forEach(function(iss,i){
    existingIssues.unshift({
      id:'APP-'+Date.now()+'-'+i,
      type:iss.type,fenceId:_curFid,fenceAddr:cur.address||'',
      details:iss.detail.trim(),
      status:'待整改',source:'监管巡查',
      reportTime:dt,
      engineerName:cur.engineerName||'',responsibleUnit:iss.unit,
      photos:iss.photos||[],location:iss.location?{lat:iss._locLat||0,lng:iss._locLng||0,addr:iss.location}:null
    });
  });
  localStorage.setItem('YZY_STREET_ISSUES',JSON.stringify(existingIssues));
  closeQuickReport();showToast('已上报 '+_rptIssues.length+' 个问题');
}

/* Calendar */
function openCalendar(){document.getElementById('calOverlay').classList.add('show');renderCalendar();}
function closeCalendar(){document.getElementById('calOverlay').classList.remove('show');}
function renderCalendar(){
  var cur=findFence();
  document.getElementById('calHeadTitle').textContent=(cur?cur.engName:'--')+' · 巡检日历';
  document.getElementById('calMth').textContent=_calYear+'年'+_calMonth+'月';
  var normalDates={};
  if(cur){cur.patrolRecords.forEach(function(r){normalDates[r.date]=true;});}
  var today=new Date(),todayStr=today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());
  var y=_calYear,m=_calMonth,dim=new Date(y,m,0).getDate(),fdow=new Date(y,m-1,1).getDay();
  var pds=[],pdim=new Date(y,m-1,0).getDate();
  for(var i=fdow-1;i>=0;i--){pds.push({d:pdim-i,cls:'other'});}
  var cds=[];
  for(var d=1;d<=dim;d++){var ds=y+'-'+pad(m)+'-'+pad(d),cl='';if(ds===todayStr)cl='today';if(ds===_calSelDate)cl+=' selected';cds.push({d:d,cls:cl,ds:ds,dot:!!normalDates[ds]});}
  var rem=(pds.length+cds.length)%7===0?0:7-(pds.length+cds.length)%7;
  var nds=[];for(var nd=1;nd<=rem;nd++){nds.push({d:nd,cls:'other'});}
  var all=pds.concat(cds).concat(nds);
  var html='一二三四五六日'.split('').map(function(w){return'<div class="cal-dow">'+w+'</div>';}).join('');
  html+=all.map(function(day){
    var oc=day.cls.indexOf('other')>=0?'':'onclick="calPick(\''+day.ds+'\','+!!day.dot+')"';
    var inner='<div class="day-num">'+day.d+'</div>';
    if(day.dot){inner+='<div class="cal-dots"><span class="cal-dot"></span></div>';}
    else{inner+='<div class="cal-dots" style="visibility:hidden"><span class="cal-dot"></span></div>';}
    return'<div class="cal-day '+day.cls+'" '+oc+'>'+inner+'</div>';
  }).join('');
  document.getElementById('calGrid').innerHTML=html;
  var recHtml='',recs=[];
  if(cur){recs=cur.patrolRecords.filter(function(r){return r.date===_calSelDate;}).sort(function(a,b){return(b.time||'').localeCompare(a.time||'');});}
  if(recs.length){
    recHtml+='<div class="cal-rec-title">共 '+recs.length+' 条记录</div>';
    recs.forEach(function(r,ri){
      var isAb=r.result==='异常',ic=(r.issues||[]).length,badge=isAb?'<span class="cal-rec-badge abnormal">'+ic+'个问题</span>':'<span class="cal-rec-badge normal">正常</span>';
      var activeCls=(_curRecIdx===ri&&_curDate===_calSelDate)?' active':'';
      recHtml+='<div class="cal-rec-card'+activeCls+'" onclick="calSelectRec('+ri+')"><div class="cal-rec-card-head"><span class="cal-rec-time">'+esp(r.date)+' '+esp(r.time||'')+'</span>'+badge+'</div><div class="cal-rec-person">巡检人：'+esp(r.inspector||'--')+'</div></div>';
    });
  }else{recHtml='<div class="cal-rec-empty">该日期暂无巡检记录</div>';}
  document.getElementById('calRecords').innerHTML=recHtml;
}
function calSelectRec(idx){
  var cur=findFence();if(!cur)return;
  var recs=cur.patrolRecords.filter(function(r){return r.date===_calSelDate;}).sort(function(a,b){return(b.time||'').localeCompare(a.time||'');});
  if(!recs[idx])return;
  _curDate=_calSelDate;_curRecords=recs;_curRecIdx=idx;
  closeCalendar();updateTop();updateBottom();renderDrawer();renderCalendar();
}
function calNav(dir){_calMonth+=dir;if(_calMonth>12){_calMonth=1;_calYear++;}if(_calMonth<1){_calMonth=12;_calYear--;}renderCalendar();}
function calPick(ds,hasRecord){
  if(!hasRecord){showToast('该日期暂无巡检记录');return;}
  var cur=findFence();if(!cur)return;_calSelDate=ds;
  var recs=cur.patrolRecords.filter(function(r){return r.date===ds;}).sort(function(a,b){return(b.time||'').localeCompare(a.time||'');});
  if(!recs.length){showToast('该日期暂无巡检记录');return;}
  _curDate=ds;_curRecords=recs;_curRecIdx=0;
  renderCalendar();
}

function findFence(){return findFenceByInput(_curProjectId,_curFid);}
function curFenceKey(){return fenceKey(_curProjectId,_curFid);}
function fenceKey(projectId,fid){return projectId?projectId+'|'+fid:fid;}
function parseFenceKey(k){var i=k.indexOf('|');if(i<0)return{projectId:'',fid:k};return{projectId:k.slice(0,i),fid:k.slice(i+1)};}
function findFenceByInput(projectId,fid){
  if(projectId){
    for(var i=0;i<_fences.length;i++){if(_fences[i].projectId===projectId&&_fences[i].id===fid)return _fences[i];}
  }
  for(var i=0;i<_fences.length;i++){if(_fences[i].id===fid)return _fences[i];}
  return null;
}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(_toastTimer);_toastTimer=setTimeout(function(){t.classList.remove('show')},2000);}
function esp(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function pad(n){return n<10?'0'+n:''+n;}
