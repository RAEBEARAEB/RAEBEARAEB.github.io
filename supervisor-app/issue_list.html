<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>围挡问题处置情况 - 监管端APP</title>
<style>
:root{
  --blue-50:#E9EBFD;--blue-100:#C8CDFA;--blue-200:#A2ADF6;
  --blue-300:#788CF3;--blue-400:#5670F0;--blue-500:#2F55EB;--blue-600:#294CDF;
  --blue-700:#1C41D3;--blue-800:#0A35C7;--blue-900:#0D47A1;
  --blue:var(--blue-500);--blue-deep:var(--blue-700);--blue-soft:var(--blue-50);
  --gray-50:#F9F9F9;--gray-100:#E6E8EA;--gray-200:#C6CACD;
  --gray-300:#A7ABB0;--gray-400:#888D92;--gray-500:#6B7075;--gray-600:#555B61;
  --gray-700:#41464C;--gray-800:#2E3238;--gray-900:#1C1F23;--gray-0:#FFFFFF;
  --bg:#F5F7FA;--panel:#FFFFFF;--panel-2:#F9F9F9;
  --green:#3BB346;--green-light:rgba(59,179,70,0.10);
  --yellow:#D0AA00;--yellow-light:rgba(208,170,0,0.10);
  --orange:#FC8800;--orange-light:rgba(252,136,0,0.10);
  --red:#F93920;--red-light:rgba(249,57,32,0.10);
  --text:#555B61;--text-sub:#888D92;--text-tertiary:#A7ABB0;
  --border:#E9F0F7;
  --shadow-sm:0 4px 10px rgba(0,0,0,0.05);
  --radius-sm:2px;--radius-md:4px;
  --font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --font-xs:12px;--font-sm:12px;--font-md:14px;--font-lg:16px;--font-xl:18px;
  --fw-regular:400;--fw-medium:500;--fw-bold:600;--fw-heavy:700;
  --safe-top:47px;--safe-bottom:34px;--fast:0.15s ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font-family);font-size:var(--font-md);color:var(--text);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased;height:100%;overflow:hidden}
button{font-family:var(--font-family);cursor:pointer;border:none;background:none}
input,select{font-family:var(--font-family);outline:none}

.phone-frame{position:relative;width:390px;height:844px;margin:20px auto;background:var(--bg);border-radius:40px;overflow:hidden;box-shadow:0 0 0 2px #1a1a1a,0 0 0 6px #333,0 0 0 8px #1a1a1a,0 20px 60px rgba(0,0,0,0.3)}
.phone-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#000;border-radius:0 0 20px 20px;z-index:999}
.phone-home-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;background:rgba(0,0,0,0.15);border-radius:3px;z-index:999}

.nav-bar{flex-shrink:0;padding-top:var(--safe-top);background:var(--panel);border-bottom:1px solid var(--border)}
.nav-bar-inner{display:flex;align-items:center;height:56px;padding:0 16px}
.nav-bar-title{flex:1;text-align:center;font-size:var(--font-lg);font-weight:var(--fw-heavy);color:var(--gray-900)}
.nav-bar-back{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--blue);border-radius:var(--radius-md)}
.nav-bar-back:active{background:var(--gray-100)}

.screen-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen-body::-webkit-scrollbar{display:none}

.stats-bar{display:flex;padding:12px 16px;gap:8px}
.stat-card{flex:1;text-align:center;background:var(--panel);border-radius:var(--radius-md);padding:10px 8px;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.stat-num{font-size:22px;font-weight:var(--fw-heavy)}
.stat-label{font-size:11px;color:var(--text-sub);margin-top:2px}
.stat-card.danger .stat-num{color:var(--red)}
.stat-card.warn .stat-num{color:var(--orange)}
.stat-card.success .stat-num{color:var(--green)}

.search-bar{padding:0 16px 8px}

.issue-table{width:100%;border-collapse:collapse;font-size:var(--font-xs)}
.issue-table thead th{font-size:11px;color:var(--text-sub);font-weight:var(--fw-medium);padding:8px 4px;border-bottom:1px solid var(--border);text-align:center;white-space:nowrap;background:var(--bg)}
.issue-table thead th:first-child{padding-left:16px;text-align:left}
.issue-table tbody td{padding:12px 4px;border-bottom:1px solid #E3E6ED;text-align:center;color:var(--text);vertical-align:middle}
.issue-table tbody td:first-child{padding-left:16px;text-align:left}
.issue-table tbody tr{cursor:pointer;transition:background .1s}
.issue-table tbody tr:active{background:var(--gray-50)}

.issue-table .proj-name{font-size:var(--font-sm);font-weight:var(--fw-medium);color:var(--text);line-height:1.4}
.issue-table .proj-name.virtual{color:var(--orange);font-weight:var(--fw-bold)}
.issue-table .proj-status{font-size:11px;color:var(--text-sub);margin-top:2px}

.issue-table .num{font-weight:var(--fw-bold);font-size:var(--font-sm)}
.issue-table .num.warn{color:var(--orange)}
.issue-table .num.danger{color:var(--red)}
.issue-table .num.success{color:var(--green)}
.issue-table .num.zero{color:var(--text-tertiary)}

.empty-state{text-align:center;padding:40px 16px;color:var(--text-tertiary)}

/* Multi-select filter */
.filter-bar{padding:8px 16px 6px}
.filter-row{display:flex;gap:6px}
.filter-trig{flex:1;position:relative;height:28px;padding:0 24px 0 8px;font-size:11px;color:var(--text-sub);background:transparent;border:1px solid var(--gray-200);border-radius:14px;cursor:pointer;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:26px;transition:border-color .15s;font-family:var(--font-family)}
.filter-trig::after{content:'';position:absolute;right:8px;top:50%;transform:translateY(-40%);width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--gray-300);pointer-events:none}
.filter-trig.open{border-color:var(--blue)}
.chip-row{display:none;gap:5px;padding:6px 16px 4px;overflow-x:auto;white-space:nowrap}
.chip-row.open{display:flex}
.chip-row::-webkit-scrollbar{display:none}
.chip-c{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:var(--fw-medium);background:var(--panel);color:var(--text-sub);border:1px solid var(--gray-200);cursor:pointer;transition:all .12s;flex-shrink:0;user-select:none;font-family:var(--font-family)}
.chip-c.active{background:var(--blue);color:#fff;border-color:var(--blue)}
</style>
<script src="../shared_data.js"></script>
<script src="../mock-data.js"></script>
</head>
<body>
<div class="phone-frame">
  <div class="phone-notch"></div>

  <div style="display:flex;flex-direction:column;height:100%">
    <div class="nav-bar">
      <div class="nav-bar-inner">
        <a class="nav-bar-back" href="app_prototype.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></a>
        <span class="nav-bar-title">围挡问题处置情况</span>
        <span style="width:32px;flex-shrink:0"></span>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat-card warn"><div class="stat-num" id="statPending">0</div><div class="stat-label">待整改</div></div>
      <div class="stat-card danger"><div class="stat-num" id="statOverdue">0</div><div class="stat-label">整改逾期</div></div>
      <div class="stat-card success"><div class="stat-num" id="statDone">0</div><div class="stat-label">整改完成</div></div>
    </div>

    <div class="search-bar" style="display:flex;gap:8px;align-items:center">
      <div class="search-wrap" style="flex:1;display:flex;align-items:center;background:var(--gray-100);border-radius:20px;padding:0 12px;height:36px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--gray-300)" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-input" id="searchInput" placeholder="搜索项目名称" oninput="renderList()" style="flex:1;border:none;background:none;font-size:var(--font-xs);margin-left:6px;color:var(--text);height:36px">
      </div>
    </div>

    <div class="filter-bar">
      <div class="filter-row">
        <button class="filter-trig" id="btnfence" onclick="toggleChipRow('fence')">全部围挡状态</button>
        <button class="filter-trig" id="btnproj" onclick="toggleChipRow('proj')">全部项目状态</button>
      </div>
    </div>
    <div class="chip-row" id="chipfence">
      <span class="chip-c active" data-v="all" onclick="chipPick(this,'fence')">全部</span>
      <span class="chip-c" data-v="setting" onclick="chipPick(this,'fence')">设置中</span>
      <span class="chip-c" data-v="removing" onclick="chipPick(this,'fence')">即将到期</span>
      <span class="chip-c" data-v="removed" onclick="chipPick(this,'fence')">已到期</span>
    </div>
    <div class="chip-row" id="chipproj">
      <span class="chip-c active" data-v="all" onclick="chipPick(this,'proj')">全部</span>
      <span class="chip-c" data-v="在建" onclick="chipPick(this,'proj')">在建</span>
      <span class="chip-c" data-v="停工" onclick="chipPick(this,'proj')">停工</span>
      <span class="chip-c" data-v="竣工验收" onclick="chipPick(this,'proj')">竣工验收</span>
    </div>

    <div class="screen-body">
      <div class="section" style="padding:0 16px">
        <table class="issue-table">
          <thead><tr>
            <th>项目名称</th><th style="width:48px">待整改</th><th style="width:48px">逾期</th><th style="width:48px">整改完成</th>
          </tr></thead>
          <tbody id="projectTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="phone-home-indicator"></div>
</div>

<script>
var _allIssues = [];
var _projGroups = [];
var _fenceFilter = '*';
var _projFilter = '*';

function _getProjInfo(name) {
  var projects = MOCK_DATA.getProjects();
  for (var i=0;i<projects.length;i++){if(projects[i].name===name)return projects[i];}
  return null;
}

function _aggFenceStatus(proj) {
  if (!proj||!proj.hoardings||!proj.hoardings.length) return '—';
  var fs={};
  (proj.hoardings||[]).forEach(function(h){fs[h.fenceStatus]=true;});
  return fs['即将到期']?'即将到期':fs['设置中']?'设置中':'已到期';
}

function _aggProjStatus(proj) {
  if (!proj) return '—';
  return proj.status||'—';
}

function init() {
  _allIssues = MOCK_DATA.getClosureIssues();
  var map = {};
  _allIssues.forEach(function(iss) {
    if (iss._unregistered) return;
    var pn = iss._projectName || '未知项目';
    if (!map[pn]) map[pn] = [];
    map[pn].push(iss);
  });
  _projGroups = Object.keys(map).map(function(k) {
    var items = map[k];
    var proj = _getProjInfo(k);
    var fs = _aggFenceStatus(proj);
    var ps = _aggProjStatus(proj);
    return {
      name: k,
      isVirtual: false,
      total: items.length,
      pending: items.filter(function(i){return i.status==='待整改'}).length,
      overdue: items.filter(function(i){return i.status==='整改逾期'}).length,
      done: items.filter(function(i){return i.status==='整改完成'||i.status==='已通过'}).length,
      fenceStatus: fs,
      fenceStatusKey: proj?(fs==='即将到期'?'removing':fs==='设置中'?'setting':'removed'):'',
      projStatus: ps,
      items: items
    };
  });

  var unregs = _allIssues.filter(function(i){return i._unregistered;});
  if (unregs.length > 0) {
    var vp = {
      name: '未报建-应建未建围挡',
      isVirtual: true,
      total: unregs.length,
      pending: unregs.filter(function(i){return i.status==='待整改'}).length,
      overdue: unregs.filter(function(i){return i.status==='整改逾期'}).length,
      done: unregs.filter(function(i){return i.status==='整改完成'||i.status==='已通过'}).length,
      fenceStatus: '—', fenceStatusKey: '', projStatus: '—',
      items: unregs
    };
    _projGroups.unshift(vp);
  }

  _projGroups.sort(function(a,b){
    if(a.isVirtual) return -1;
    if(b.isVirtual) return 1;
    if(a.overdue!==b.overdue) return b.overdue-a.overdue;
    if(a.pending!==b.pending) return b.pending-a.pending;
    return b.total-a.total;
  });

  var totalP=0,totalO=0,totalD=0;
  _allIssues.forEach(function(i){
    if(i.status==='待整改')totalP++;else if(i.status==='整改逾期')totalO++;else if(i.status==='整改完成'||i.status==='已通过')totalD++;
  });
  document.getElementById('statPending').textContent=totalP;
  document.getElementById('statOverdue').textContent=totalO;
  document.getElementById('statDone').textContent=totalD;

  renderList();
}

function setFilter() {
  // Read from chips
  function readChip(id){ var vals=[];var row=document.getElementById(id);row.querySelectorAll('.chip-c.active:not([data-v="all"])').forEach(function(c){vals.push(c.dataset.v)});if(row.querySelector('.chip-c[data-v="all"].active')||vals.length===0)return'*';return vals.join(',');}
  _fenceFilter = readChip('chipfence');
  _projFilter = readChip('chipproj');
  renderList();
}

function toggleChipRow(type){var row=document.getElementById('chip'+type);var btn=document.getElementById('btn'+type);row.classList.toggle('open');btn.classList.toggle('open');}
function chipPick(el,type){
  var row=document.getElementById('chip'+type);var btn=document.getElementById('btn'+type);var isAll=el.dataset.v==='all';
  if(isAll){var chips=row.querySelectorAll('.chip-c');var wasOn=el.classList.contains('active');chips.forEach(function(c){c.classList.remove('active')});if(!wasOn)chips.forEach(function(c){c.classList.add('active')});}
  else{el.classList.toggle('active');var allC=row.querySelector('.chip-c[data-v="all"]');allC.classList.remove('active');var anyOff=row.querySelector('.chip-c:not([data-v="all"]):not(.active)');if(!anyOff){allC.classList.add('active');row.querySelectorAll('.chip-c:not([data-v="all"])').forEach(function(c){c.classList.remove('active')});}}
  var actives=row.querySelectorAll('.chip-c.active:not([data-v="all"])');var allOn=row.querySelector('.chip-c[data-v="all"].active');
  if(allOn||actives.length===0)btn.textContent=row.querySelector('.chip-c[data-v="all"]').textContent.trim();else{var labels=[];actives.forEach(function(c){labels.push(c.textContent.trim())});btn.textContent=labels.join('、');}
  setFilter();
}
document.addEventListener('click',function(e){var t=e.target;if(!t.closest('.filter-bar')&&!t.closest('.chip-row')){document.querySelectorAll('.chip-row.open').forEach(function(r){r.classList.remove('open')});document.querySelectorAll('.filter-trig.open').forEach(function(b){b.classList.remove('open')});}});

function renderList() {
  var kw = (document.getElementById('searchInput').value||'').trim().toLowerCase();
  var groups = _projGroups.slice();

  if (_fenceFilter !== '*') {
    var fenceVals = _fenceFilter.split(',');
    groups = groups.filter(function(g){
      if (g.isVirtual) return true;
      return fenceVals.indexOf(g.fenceStatusKey) !== -1;
    });
  }
  if (_projFilter !== '*') {
    var projVals = _projFilter.split(',');
    groups = groups.filter(function(g){
      if (g.isVirtual) return true;
      return projVals.indexOf(g.projStatus) !== -1;
    });
  }
  if (kw) { groups = groups.filter(function(g) { return g.name.toLowerCase().indexOf(kw) !== -1; }); }

  var container = document.getElementById('projectTableBody');
  if (!groups.length) { container.innerHTML = '<tr><td colspan="4" class="empty-state">暂无问题数据</td></tr>'; return; }

  var html = '';
  groups.forEach(function(g) {
    var projParam = g.isVirtual ? '_unregistered' : encodeURIComponent(g.name);
    var nameHtml = g.isVirtual
      ? '<span class="proj-name virtual">'+g.name+'</span>'
      : '<span class="proj-name">'+g.name+'</span><div class="proj-status">'+g.fenceStatus+' | '+g.projStatus+'</div>';
    var pCls = g.pending > 0 ? 'warn' : 'zero';
    var oCls = g.overdue > 0 ? 'danger' : 'zero';
    var dCls = g.done > 0 ? 'success' : 'zero';
    html += '<tr onclick="goProject(\''+projParam+'\')">'+
      '<td>'+nameHtml+'</td>'+
      '<td><span class="num '+pCls+'">'+g.pending+'</span></td>'+
      '<td><span class="num '+oCls+'">'+g.overdue+'</span></td>'+
      '<td><span class="num '+dCls+'">'+g.done+'</span></td>'+
    '</tr>';
  });
  container.innerHTML = html;
}

function goProject(projName) {
  window.location.href = 'issue_project.html?project=' + encodeURIComponent(projName);
}

init();
</script>
</body>
</html>
