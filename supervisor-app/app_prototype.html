<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>监管端APP - 深圳市建设施工围挡数字化管理系统</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* ═══ Design Token ═══ */
:root{
  /* ── Primary (berBlue from colors.dart) ── */
  --blue-50:#E9EBFD;--blue-100:#C8CDFA;--blue-200:#A2ADF6;
  --blue-300:#788CF3;--blue-400:#5670F0;--blue-500:#2F55EB;--blue-600:#294CDF;
  --blue-700:#1C41D3;--blue-800:#0A35C7;--blue-900:#0D47A1;
  --blue:var(--blue-500);--blue-deep:var(--blue-700);--blue-soft:var(--blue-50);
  /* ── Neutral (berGrey from colors.dart) ── */
  --gray-50:#F9F9F9;--gray-100:#E6E8EA;--gray-200:#C6CACD;
  --gray-300:#A7ABB0;--gray-400:#888D92;--gray-500:#6B7075;--gray-600:#555B61;
  --gray-700:#41464C;--gray-800:#2E3238;--gray-900:#1C1F23;
  --gray-0:#FFFFFF;
  /* ── Semantic colors ── */
  --bg:#F5F7FA;--panel:#FFFFFF;--panel-2:#F9F9F9;
  --green:#3BB346;--green-light:rgba(59,179,70,0.10);
  --yellow:#D0AA00;--yellow-light:rgba(208,170,0,0.10);
  --orange:#FC8800;--orange-light:rgba(252,136,0,0.10);
  --red:#F93920;--red-light:rgba(249,57,32,0.10);
  --text:#555B61;--text-sub:#888D92;--text-tertiary:#A7ABB0;
  --border:#E9F0F7;--divider:var(--border);
  /* ── Shadow ── */
  --shadow-sm:0 4px 10px rgba(0,0,0,0.05);--shadow-md:0 4px 10px rgba(0,0,0,0.05);--shadow-lg:0 4px 10px rgba(0,0,0,0.05);
  /* ── Radius (4px global standard, 6px for bottom sheets) ── */
  --radius-sm:2px;--radius-md:4px;
  /* ── Typography ── */
  --font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --font-xs:12px;--font-sm:12px;--font-md:14px;--font-lg:16px;--font-xl:18px;
  --fw-regular:400;--fw-medium:500;--fw-bold:600;--fw-heavy:700;
  /* ── Layout ── */
  --safe-top:47px;--safe-bottom:34px;
  --fast:0.15s ease;--normal:0.25s ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font-family);font-size:var(--font-md);color:var(--text);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;height:100%;overflow:hidden}
a{color:var(--blue);text-decoration:none}
button{font-family:var(--font-family);cursor:pointer;border:none;background:none}
input,textarea,select{font-family:var(--font-family);outline:none}

/* ═══ Phone Frame ═══ */
.phone-frame{position:relative;width:390px;height:844px;margin:20px auto;background:linear-gradient(180deg,var(--blue-50),var(--bg));border-radius:40px;overflow:hidden;box-shadow:0 0 0 2px #1a1a1a,0 0 0 6px #333,0 0 0 8px #1a1a1a,0 20px 60px rgba(0,0,0,0.3)}
.phone-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#000;border-radius:0 0 20px 20px;z-index:999}
.phone-home-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;background:rgba(0,0,0,0.15);border-radius:3px;z-index:999}

/* ═══ Screen System ═══ */
.screen{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;background:var(--bg);transform:translateX(100%);opacity:0;transition:transform 0.3s cubic-bezier(0.4,0,0.2,1),opacity 0.3s ease;will-change:transform,opacity}
.screen.active{transform:translateX(0);opacity:1;z-index:10}
.screen.behind{transform:translateX(-30%);opacity:0.5;z-index:5}

/* ═══ Nav Bar ═══ */
.nav-bar{flex-shrink:0;padding-top:var(--safe-top);background:var(--panel);border-bottom:1px solid var(--border);position:relative;z-index:50}
.nav-bar-inner{display:flex;align-items:center;height:56px;padding:0 16px}
.nav-bar-title{flex:1;text-align:center;font-size:var(--font-lg);font-weight:var(--fw-heavy);color:var(--text)}
.nav-bar-back{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--blue);border-radius:var(--radius-md)}
.nav-bar-back:active{background:var(--gray-100)}
.nav-bar-right{width:60px;text-align:right;font-size:var(--font-sm);color:var(--blue);font-weight:var(--fw-medium)}

/* ═══ Scroll Body ═══ */
.screen-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen-body::-webkit-scrollbar{display:none}

/* ═══ Greeting Bar ═══ */
.greeting-bar{padding:calc(var(--safe-top) + 10px) 16px 12px;background:var(--panel);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.greeting-hello{font-size:var(--font-lg);font-weight:var(--fw-heavy);color:var(--text)}
.greeting-date{font-size:var(--font-xs);color:var(--text-sub);margin-top:1px}
.greeting-right{display:flex;align-items:center;gap:8px}
.greeting-notify{position:relative;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--text-sub);border-radius:50%;background:var(--gray-100)}
.greeting-notify-dot{position:absolute;top:4px;right:4px;width:8px;height:8px;background:var(--red);border-radius:50%;border:2px solid var(--panel)}
.greeting-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue-deep));color:#fff;display:flex;align-items:center;justify-content:center;font-size:var(--font-sm);font-weight:var(--fw-bold)}

/* ═══ Overview Card (Hero) ═══ */
.overview-card{background:linear-gradient(145deg,var(--blue-700) 0%,var(--blue-500) 62%,var(--blue-300) 100%);margin:12px 16px 0;padding:16px;color:#fff;position:relative;overflow:hidden;border-radius:16px;box-shadow:0 4px 16px rgba(28,65,211,0.25)}
.overview-card::after{content:'';position:absolute;top:-40px;right:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,0.06)}
.overview-main{display:flex;align-items:baseline;gap:6px;margin-bottom:12px}
.overview-num{font-size:28px;font-weight:800;letter-spacing:-1px}
.overview-label{font-size:var(--font-sm);opacity:0.8}
.overview-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.overview-metric{background:rgba(255,255,255,0.12);border-radius:var(--radius-md);padding:8px 10px;display:flex;flex-direction:column;cursor:pointer;position:relative;z-index:1;transition:background var(--fast)}
.overview-metric:active{background:rgba(255,255,255,0.2)}
.overview-metric-val{font-size:var(--font-lg);font-weight:var(--fw-heavy)}
.overview-metric-lbl{font-size:10px;opacity:0.75;margin-top:1px}
.overview-metric.danger .overview-metric-val{color:#FEDDD2}
.overview-metric.warning .overview-metric-val{color:var(--yellow)}
.overview-metric.success .overview-metric-val{color:#3BB346}

/* ═══ Section ═══ */
.section{margin:12px 16px;background:var(--panel);border-radius:4px;padding:16px;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.section-title{font-size:var(--font-lg);font-weight:var(--fw-heavy)}
.badge-pill{border-radius:999px;padding:4px 10px;font-size:10px;font-weight:var(--fw-heavy);display:inline-flex;align-items:center;gap:4px}
.badge-danger{background:#F93920;color:#fff}
.toggle-btn{border:none;background:var(--panel-2);color:var(--blue);font-size:var(--font-xs);font-weight:var(--fw-heavy);border-radius:999px;padding:6px 12px;cursor:pointer}

/* ═══ 金刚区 ═══ */
.grid-icons{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:4px}
.grid-icon-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;background:transparent;border:none;border-radius:var(--radius-md);cursor:pointer;position:relative;transition:all var(--fast)}
.grid-icon-item:active{background:var(--gray-50);transform:scale(0.97)}
.grid-icon-circle{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.grid-icon-circle.patrol{background:var(--blue);color:#fff}
.grid-icon-circle.verify{background:var(--blue-50);color:var(--blue)}
.grid-icon-circle.review{background:var(--orange-light);color:var(--orange)}
.grid-icon-circle.issue{background:var(--red-light);color:var(--red)}
.grid-icon-circle svg{width:18px;height:18px}
.grid-icon-label{font-size:var(--font-xs);font-weight:var(--fw-regular);color:var(--text);white-space:nowrap}
.grid-icon-dot{position:absolute;top:4px;right:8px;min-width:16px;height:16px;padding:0 4px;background:var(--red);color:#fff;border-radius:8px;font-size:10px;font-weight:var(--fw-heavy);display:flex;align-items:center;justify-content:center;line-height:1}

/* ═══ Filter Chips ═══ */
.chips{display:flex;gap:6px;padding:0 0 10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:6px 12px;border-radius:999px;font-size:var(--font-xs);font-weight:var(--fw-medium);background:var(--panel);color:var(--text-sub);border:1px solid var(--border);cursor:pointer;transition:all var(--fast);flex-shrink:0}
.chip.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.chip small{opacity:0.7;margin-left:2px}

/* ═══ Search ═══ */
.search-bar{padding:0 0 8px}
.search-wrap{display:flex;align-items:center;background:var(--gray-100);border-radius:20px;padding:0 12px;height:36px}
.search-wrap svg{width:14px;height:14px;color:var(--text-tertiary);flex-shrink:0}
.search-input{flex:1;border:none;background:none;font-size:var(--font-xs);margin-left:6px;color:var(--text);height:36px}
.search-input::placeholder{color:var(--text-tertiary)}

/* ═══ Fence Card ═══ */
.fence-list{padding:0 0 16px}
.fence-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 16px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow-sm);transition:box-shadow var(--fast)}
.fence-card:active{box-shadow:var(--shadow-md)}
.fence-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.fence-id{font-size:var(--font-sm);font-weight:var(--fw-heavy);color:var(--blue)}
.fence-card-title{font-size:var(--font-md);font-weight:var(--fw-medium);margin-bottom:3px;line-height:1.4}
.fence-card-subtitle{font-size:var(--font-xs);color:var(--text-sub);display:flex;align-items:center;margin-bottom:4px}
.fence-card-tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{display:inline-block;font-size:var(--font-xs);font-weight:var(--fw-medium);padding:3px 8px;border-radius:999px;color:var(--text)}
.tag-setting{background:rgba(59,179,70,0.10);color:var(--green)}
.tag-removing{background:rgba(208,170,0,0.10);color:var(--yellow)}
.tag-overdue{background:rgba(249,57,32,0.10);color:var(--red)}
.tag-removed{background:rgba(47,85,235,0.10);color:var(--blue)}
.tag-issue{color:#fff;border:none;padding:1px 6px;font-size:11px;font-weight:var(--fw-medium)}
.tag-issue--normal{background:#2F8C46}
.tag-issue--pending{background:#C47D00}
.tag-issue--overdue{background:#C43B2A}

/* ═══ Detail Tabs ═══ */
.detail-tabs{display:flex;flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--border);overflow-x:auto}
.detail-tabs::-webkit-scrollbar{display:none}
.detail-tab{flex:1;min-width:0;padding:8px 12px;text-align:center;font-size:var(--font-md);color:var(--text-sub);font-weight:var(--fw-medium);position:relative;white-space:nowrap;cursor:pointer}
.detail-tab.active{color:var(--gray-900);font-weight:var(--fw-heavy)}
.detail-tab.active::after{content:'';position:absolute;bottom:0;left:18px;right:18px;height:3px;background:var(--blue);border-radius:2px}

/* ═══ Detail Content ═══ */
.detail-content{padding:12px 16px 20px}
.detail-section{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.detail-section-title{font-size:var(--font-md);font-weight:var(--fw-heavy);padding:12px 16px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
.detail-section-title::before{content:'';width:3px;height:14px;background:var(--blue);border-radius:2px}
.detail-fields{padding:8px 16px 12px}
.detail-field{display:flex;padding:4px 0;font-size:var(--font-md)}
.detail-field-label{color:var(--text-sub);min-width:130px;flex-shrink:0}
.detail-field-value{color:var(--text);word-break:break-all}
.detail-sub-title{font-size:var(--font-sm);font-weight:var(--fw-heavy);padding:10px 0 4px;display:flex;align-items:center;gap:4px}
.detail-sub-title::before{content:'';width:3px;height:12px;background:var(--blue);border-radius:2px}
.detail-summary{display:flex;flex-direction:column;gap:4px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border)}
.detail-summary-top{display:flex;align-items:center;gap:6px;min-width:0}
.detail-summary-id{font-size:var(--font-sm);font-weight:var(--fw-heavy);color:var(--blue);min-width:0}
.detail-summary-tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* ═══ Map (SVG-based) ═══ */
.map-placeholder{height:200px;background:#E8E4D8;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-tertiary);gap:6px;border-radius:var(--radius-md);margin-bottom:12px;overflow:hidden;position:relative}
.map-legend{display:flex;gap:12px;padding:4px 10px;font-size:var(--font-xs);color:var(--text-sub);background:rgba(255,255,255,0.92);border-radius:var(--radius-sm);position:absolute;top:8px;left:8px;z-index:2;box-shadow:var(--shadow-sm)}
.map-legend-item{display:flex;align-items:center;gap:4px}
.map-legend-line{display:inline-block;width:18px;height:2px;border-radius:1px;flex-shrink:0}
.map-legend-dash{display:inline-block;width:18px;height:0;border-top:2px dashed var(--blue);border-radius:0;flex-shrink:0}
.map-legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%}
.map-address-bar{position:absolute;bottom:28px;left:0;right:0;display:flex;align-items:center;gap:4px;padding:6px 12px;background:linear-gradient(transparent,rgba(0,0,0,0.45));color:#fff;font-size:var(--font-xs);z-index:2}
.map-info-bar{position:absolute;bottom:8px;left:8px;right:8px;display:flex;align-items:center;justify-content:center;padding:4px 10px;font-size:var(--font-xs);color:var(--text-sub);background:rgba(255,255,255,0.92);z-index:2;border-radius:var(--radius-sm);box-shadow:var(--shadow-sm)}

/* ═══ Project Card ═══ */
.proj-card{background:var(--panel-2);border-radius:var(--radius-md);overflow:hidden;margin-bottom:10px;border:1px solid var(--border)}
.proj-card-header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--blue-50)}
.proj-card-icon{width:24px;height:24px;border-radius:var(--radius-sm);background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:var(--font-xs);font-weight:var(--fw-heavy)}
.proj-card-name{flex:1;font-size:var(--font-sm);font-weight:var(--fw-heavy);color:var(--blue-deep)}
.proj-card-count{font-size:var(--font-xs);color:var(--text-sub)}
.eng-sub{border-top:1px solid var(--border)}
.eng-sub-header{display:flex;align-items:center;gap:6px;padding:8px 12px;cursor:pointer}
.eng-sub-header:active{background:var(--gray-100)}
.eng-sub-toggle{font-size:10px;color:var(--text-sub);transition:transform var(--fast)}
.eng-sub.expanded .eng-sub-toggle{transform:rotate(90deg)}
.eng-sub-name{flex:1;font-size:var(--font-sm);font-weight:var(--fw-heavy);padding-left:8px;position:relative}
.eng-sub-name::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:12px;background:var(--blue);border-radius:2px}
.eng-sub-body{display:none;padding:8px 16px 12px;background:var(--panel-2)}
.eng-sub.expanded .eng-sub-body{display:block}
.eng-field-row{display:flex;font-size:var(--font-md);padding:4px 0;line-height:1.5}
.eng-field-label{color:var(--text-sub);white-space:nowrap;min-width:130px}
.eng-field-value{color:var(--text);word-break:break-all}

/* ═══ Patrol ═══ */
.patrol-stat{padding:10px 0;font-size:var(--font-xs);color:var(--text-sub)}
.patrol-stat strong{color:var(--blue)}
.patrol-day-header{font-size:var(--font-sm);font-weight:var(--fw-heavy);padding:8px 0 6px;display:flex;align-items:center;gap:8px}
.patrol-day-header::after{content:'';flex:1;height:1px;background:var(--gray-200)}
.patrol-day-count{font-size:var(--font-xs);color:var(--text-sub);font-weight:var(--fw-regular)}
.patrol-card{background:var(--panel);border-radius:var(--radius-md);border:1px solid var(--border);overflow:hidden;margin-bottom:10px;box-shadow:var(--shadow-sm)}
.patrol-card-body{display:flex;gap:10px;padding:12px}
.patrol-thumb{width:80px;height:60px;border-radius:var(--radius-md);flex-shrink:0;overflow:hidden;position:relative;cursor:pointer;background:var(--blue-100)}
.patrol-thumb img{width:100%;height:100%;object-fit:cover}
.patrol-thumb-icon{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.patrol-thumb-icon svg{width:20px;height:20px;color:var(--blue);opacity:0.7}
.patrol-thumb-label{font-size:9px;color:var(--blue-deep);font-weight:var(--fw-heavy);background:rgba(47,85,235,0.15);padding:1px 6px;border-radius:3px;margin-top:2px}
.patrol-thumb-time{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:9px;color:rgba(0,0,0,0.45)}
.patrol-info{flex:1;min-width:0}
.patrol-person{font-size:var(--font-sm);font-weight:var(--fw-medium);margin-bottom:2px}
.patrol-unit{font-size:var(--font-xs);color:var(--text-sub);margin-bottom:2px}
.patrol-location{font-size:var(--font-xs);color:var(--text-sub);display:flex;align-items:center;gap:3px}
.patrol-location svg{width:10px;height:10px;flex-shrink:0}
.patrol-issue-bar{background:var(--yellow-light);padding:6px 12px;font-size:var(--font-xs);color:var(--orange);font-weight:var(--fw-medium);display:flex;align-items:center;gap:4px}
.patrol-issue-bar svg{width:12px;height:12px;flex-shrink:0}
.patrol-card-actions{display:flex;border-top:1px solid var(--border)}
.patrol-action-btn{flex:1;padding:8px;text-align:center;font-size:var(--font-xs);color:var(--blue);font-weight:var(--fw-medium);transition:background var(--fast)}
.patrol-action-btn:active{background:var(--gray-50)}
.patrol-action-btn+.patrol-action-btn{border-left:1px solid var(--border)}
.segmented{display:flex;background:var(--gray-100);border-radius:4px;padding:2px;margin-bottom:10px}
.segmented-btn{flex:1;padding:6px 0;text-align:center;font-size:var(--font-sm);color:var(--text-sub);font-weight:var(--fw-medium);border-radius:4px;transition:all var(--fast);cursor:pointer}
.segmented-btn.active{background:var(--panel);color:var(--text);border-radius:4px;box-shadow:var(--shadow-sm)}

/* ═══ Timeline ═══ */
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:6px;top:8px;bottom:8px;width:1px;background:var(--gray-200)}
.timeline-item{position:relative;margin-bottom:20px}
.timeline-item:last-child{margin-bottom:0}
.timeline-dot{position:absolute;left:-22px;top:6px;width:12px;height:12px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.timeline-dot.verify{background:var(--blue-50);border:2px solid var(--blue)}
.timeline-dot.change{background:var(--yellow-light);border:2px solid var(--yellow)}
.timeline-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm)}
.timeline-card-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--panel-2);border-bottom:1px solid var(--border)}
.timeline-time{font-size:var(--font-xs);font-weight:var(--fw-heavy)}
.timeline-role{font-size:10px;padding:2px 8px;border-radius:999px;font-weight:var(--fw-medium)}
.timeline-role.verify-role{background:var(--blue-50);color:var(--blue)}
.timeline-role.change-role{background:var(--yellow-light);color:var(--orange)}
.timeline-card-body{padding:10px 12px}
.timeline-person{font-size:var(--font-xs);color:var(--text-sub);margin-bottom:4px}
.timeline-field{display:flex;align-items:baseline;gap:4px;padding:4px 0;font-size:var(--font-xs);flex-wrap:wrap}
.timeline-field-label{color:var(--text-sub);white-space:nowrap;min-width:60px}
.timeline-field-old{color:var(--text-tertiary);text-decoration:line-through;background:var(--red-light);padding:1px 4px;border-radius:2px}
.timeline-field-arrow{color:var(--text-tertiary)}
.timeline-field-new{color:var(--blue-deep);font-weight:var(--fw-medium);background:var(--blue-50);padding:1px 4px;border-radius:2px}
.timeline-field-map{color:var(--text-sub);font-size:var(--font-xs);display:flex;align-items:center;gap:3px;background:var(--gray-100);padding:1px 4px;border-radius:2px}

/* ═══ VC Timeline (变更与校核) ═══ */
.vc-timeline{padding-left:0}
.vc-timeline-item{display:flex;gap:0}
.vc-timeline-node{display:flex;flex-direction:column;align-items:center;width:24px;flex-shrink:0;padding-top:18px}
.vc-timeline-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px rgba(47,85,235,0.20)}
.vc-timeline-dot.pending{box-shadow:0 0 0 3px rgba(208,170,0,0.20)}
.vc-timeline-line{width:1px;flex:1;min-height:14px;background:var(--gray-200)}
.vc-timeline-card{flex:1;min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.vc-card-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border)}
.vc-card-time{font-size:var(--font-sm);color:var(--text);font-weight:var(--fw-medium)}
.vc-card-badge{font-size:10px;padding:2px 8px;border-radius:999px;font-weight:var(--fw-medium)}
.vc-card-badge.verified{background:var(--blue-50);color:var(--blue)}
.vc-card-badge.pending{background:var(--yellow-light);color:var(--orange)}
.vc-card-body{padding:10px 14px}
.vc-card-person{font-size:var(--font-sm);color:var(--text);margin-bottom:8px}
.vc-fields-title{font-size:var(--font-xs);color:var(--text-sub);font-weight:var(--fw-bold);margin-bottom:6px}
.vc-field-row{display:flex;align-items:baseline;padding:3px 0;font-size:var(--font-xs);flex-wrap:wrap;gap:6px}
.vc-field-row+.vc-field-row{border-top:1px solid var(--gray-50)}
.vc-field-name{color:var(--text-sub);min-width:60px;flex-shrink:0}
.vc-old{text-decoration:line-through;color:var(--text-tertiary);margin-right:4px}
.vc-new{color:var(--blue);font-weight:var(--fw-medium)}
.vc-field-label{font-size:var(--font-xs);color:var(--text-sub);margin-bottom:4px}
.vc-map-row{display:flex;gap:8px}
.vc-map-half{flex:1;min-width:0}
.vc-map-label{font-size:10px;color:var(--text-tertiary);margin-bottom:2px}
.vc-map-thumb{width:100%;height:120px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border);background:#E8E4D8}

/* Verify section inside VC card */
.vc-verify{border-top:1px solid var(--border);padding:12px 14px}
.vc-verify-header{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.vc-verify-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.vc-verify-status{font-size:var(--font-sm);font-weight:var(--fw-bold)}
.vc-verify-time{font-size:var(--font-xs);color:var(--text-sub);margin-left:auto}
.vc-verify-person{font-size:var(--font-sm);color:var(--text-sub);margin-bottom:6px}
.vc-verify-desc{font-size:var(--font-sm);color:var(--text)}
.vc-verify-pending{border-top:1px solid var(--border);padding:14px;text-align:center;font-size:var(--font-xs);color:var(--text-tertiary)}

/* ═══ Verify Screen ═══ */
.verify-section{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.verify-section-title{font-size:var(--font-md);font-weight:var(--fw-heavy);padding:10px 16px 6px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
.verify-section-title::before{content:'';width:3px;height:14px;background:var(--blue);border-radius:2px}
.verify-field{display:flex;align-items:center;padding:8px 16px;font-size:var(--font-sm);border-bottom:1px solid var(--border)}
.verify-field:last-child{border-bottom:none}
.verify-field-label{color:var(--text-sub);min-width:110px;flex-shrink:0}
.verify-field-old{color:var(--text-tertiary);text-decoration:line-through;background:var(--red-light);padding:1px 4px;border-radius:2px;font-size:var(--font-xs);margin-right:4px}
.verify-field-new{color:var(--text);font-weight:var(--fw-medium)}
.verify-field-input{flex:1;height:32px;padding:0 8px;border:1px solid var(--gray-300);border-radius:4px;font-size:var(--font-sm);color:var(--text)}
.verify-field-input:focus{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-50)}
.verify-field.full{flex-direction:column;gap:4px}
.verify-map-compare{display:flex;align-items:center;gap:4px;font-size:var(--font-xs);color:var(--text-sub)}
.verify-footer{position:sticky;bottom:0;display:flex;gap:10px;padding:10px 16px 28px;background:var(--panel);border-top:1px solid var(--border)}

/* ═══ Panorama Viewer ═══ */
.pano-viewer{position:relative;width:100%;height:240px;background:#1a1a2e;border-radius:var(--radius-md);overflow:hidden;margin-bottom:12px}
.pano-viewer-inner{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.5);font-size:var(--font-sm)}
.pano-viewer-overlay{position:absolute;inset:0;background:radial-gradient(circle at 30% 40%,rgba(47,85,235,0.15),transparent 60%),radial-gradient(circle at 70% 60%,rgba(59,179,70,0.1),transparent 50%)}
.pano-cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24px;height:24px;border:2px solid rgba(255,255,255,0.6);border-radius:50%;pointer-events:none;z-index:4}
.pano-top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:5}
.pano-pill{height:28px;padding:0 10px;border-radius:14px;border:1px solid rgba(255,255,255,0.2);background:rgba(0,0,0,0.4);color:#fff;font-size:var(--font-xs);display:flex;align-items:center;gap:4px;backdrop-filter:blur(4px)}
.pano-thumbs{position:absolute;bottom:8px;left:8px;right:8px;display:flex;gap:6px;overflow-x:auto;z-index:5}
.pano-thumbs::-webkit-scrollbar{display:none}
.pano-thumb-item{width:60px;height:42px;border-radius:var(--radius-sm);border:2px solid rgba(255,255,255,0.3);flex-shrink:0;overflow:hidden;position:relative;background:linear-gradient(135deg,var(--blue-100),var(--blue-200))}
.pano-thumb-item.active{border-color:var(--blue);box-shadow:0 0 0 2px rgba(47,85,235,0.35)}
.pano-thumb-item span{position:absolute;left:0;right:0;bottom:0;font-size:9px;text-align:center;background:rgba(0,0,0,0.5);color:#fff;padding:1px 0}

/* ═══ Map Overview Screen ═══ */
.map-overview{position:relative;width:100%;height:calc(100% - 44px);background:#E8E4D8;overflow:hidden}
.map-overview-legend{position:absolute;top:10px;right:10px;background:rgba(255,255,255,0.94);padding:8px 10px;border-radius:var(--radius-md);font-size:var(--font-xs);box-shadow:var(--shadow-md);display:flex;flex-direction:column;gap:4px;z-index:1000}
.map-overview-list{position:absolute;bottom:0;left:0;right:0;background:var(--panel);border-radius:6px 6px 0 0;padding:12px 16px;max-height:40%;overflow-y:auto;box-shadow:0 -4px 16px rgba(0,0,0,0.08);z-index:1000}
.map-overview-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer}
.map-overview-item:last-child{border-bottom:none}
.map-overview-item:active{background:var(--gray-50)}
.map-overview-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:5px}
.map-overview-info{flex:1;min-width:0}
.map-overview-name{font-size:var(--font-md);font-weight:var(--fw-heavy);margin-bottom:3px;line-height:1.4}
.map-overview-sub{font-size:var(--font-xs);color:var(--text-sub);margin-bottom:4px}
.map-overview-tags{display:flex;gap:5px;flex-wrap:wrap}

/* ═══ Modal ═══ */
.modal-overlay{position:absolute;top:0;left:0;right:0;bottom:0;z-index:200;background:rgba(0,0,0,0.54);display:none;align-items:flex-end}
.modal-overlay.show{display:flex}
.modal-sheet{width:100%;max-height:90%;background:var(--panel);border-radius:6px 6px 0 0;overflow-y:auto;animation:slideUp 0.3s cubic-bezier(0.4,0,0.2,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:36px;height:4px;background:var(--gray-300);border-radius:2px;margin:8px auto 0}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 10px;border-bottom:1px solid var(--border)}
.modal-title{font-size:var(--font-lg);font-weight:var(--fw-heavy)}
.modal-close{width:28px;height:28px;border-radius:50%;background:var(--gray-100);display:flex;align-items:center;justify-content:center;color:var(--text-sub)}
.modal-body{padding:16px}
.modal-footer{display:flex;gap:10px;padding:12px 16px 28px;border-top:1px solid var(--border)}
.btn-cancel{flex:1;height:36px;border-radius:4px;background:transparent;color:var(--text-sub);font-size:var(--font-md);font-weight:var(--fw-medium);border:1px solid rgba(136,141,146,0.30)}
.btn-cancel:active{background:rgba(136,141,146,0.08)}
.btn-submit{flex:1;height:36px;border-radius:4px;background:var(--blue);color:white;font-size:var(--font-md);font-weight:var(--fw-medium);box-shadow:none}
.btn-submit:active{background:#294CDF}
.form-textarea-mobile{width:100%;min-height:80px;padding:10px 12px;border:1px solid var(--gray-300);border-radius:var(--radius-md);font-size:var(--font-md);color:var(--text);background:var(--panel);resize:vertical}
.form-textarea-mobile:focus{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-50)}

/* ═══ Toast ═══ */
.toast{position:absolute;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:#222222;color:white;padding:10px 18px;border-radius:8px;font-size:var(--font-lg);z-index:500;opacity:0;transition:all 0.3s ease;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ═══ Empty State ═══ */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;color:var(--text-sub)}
.empty-state svg{width:40px;height:40px;opacity:0.3;margin-bottom:10px}
.empty-state span{font-size:var(--font-sm)}

/* ═══ Patrol Detail ═══ */
.pd-pano-wrap{position:relative;margin:0 4px;border-radius:var(--radius-md);overflow:hidden;height:200px;cursor:pointer}
.pd-pano-bg{position:absolute;inset:0;background:linear-gradient(135deg,#0a1929 0%,#0f2744 40%,var(--blue-700) 70%,#0a1929 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.pd-pano-icon{font-size:48px;color:rgba(255,255,255,.2)}
.pd-pano-text{font-size:14px;color:rgba(255,255,255,.35);font-weight:600;letter-spacing:.04em}
.pd-pano-badge{position:absolute;top:10px;left:10px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3);z-index:2}
.pd-info-card{background:var(--panel);border-radius:var(--radius-md);margin:12px 4px;overflow:hidden;box-shadow:var(--shadow-sm)}
.pd-info-row{display:flex;padding:12px 16px;border-bottom:1px solid var(--border);font-size:var(--font-sm)}
.pd-info-row:last-child{border-bottom:none}
.pd-info-label{color:var(--text-sub);min-width:110px;flex-shrink:0}
.pd-info-value{color:var(--text);flex:1}
.pd-issue-list{margin:0 4px 24px}
.pd-issue-title{font-size:var(--font-md);font-weight:var(--fw-heavy);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.pd-issue-title::before{content:'';width:3px;height:14px;background:var(--blue);border-radius:2px}
.pd-issue-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px;margin-bottom:8px;cursor:pointer;transition:all var(--fast)}
.pd-issue-card:active{background:var(--gray-50)}
.pd-issue-type{font-size:var(--font-sm);font-weight:var(--fw-bold);color:var(--text);margin-bottom:4px}
.pd-issue-desc{font-size:var(--font-xs);color:var(--text-sub);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ═══ Patrol Issue Detail ═══ */
.pid-section{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.pid-map-wrap{height:220px;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border)}
.pid-photos{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pid-photos img{width:72px;height:72px;object-fit:cover;border-radius:var(--radius-md);border:1px solid var(--border)}

/* ═══ Flow Log for patrol issue detail ═══ */
.af-log{position:relative;padding-left:32px;margin-bottom:12px}
.af-log::before{content:'';position:absolute;left:11px;top:0;bottom:0;width:1px;background:var(--gray-200)}
.af-log-item{position:relative;margin-bottom:14px}
.af-log-item:last-child{margin-bottom:0}
.af-log-dot{position:absolute;left:-32px;top:4px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px}
.af-log-dot svg{width:14px;height:14px}
.af-log-dot.report{background:var(--blue-50);color:var(--blue)}
.af-log-dot.transfer{background:var(--orange-light);color:var(--orange)}
.af-log-dot.rectify{background:var(--blue-50);color:var(--blue)}
.af-log-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden}
.af-log-head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--panel-2)}
.af-log-title{font-size:var(--font-xs);font-weight:var(--fw-heavy)}
.af-log-time{font-size:10px;color:var(--text-tertiary)}
.af-log-body{padding:8px 12px;font-size:var(--font-xs)}
.af-field{display:flex;padding:5px 0;font-size:var(--font-sm)}
.af-field-lbl{color:var(--text-sub);min-width:110px;flex-shrink:0}
.af-field-val{color:var(--text);word-break:break-all}
.af-photos{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.af-photos img{width:60px;height:60px;object-fit:cover;border-radius:var(--radius-sm);border:1px solid var(--border)}

/* ═══ Date Picker Half-Modal ═══ */
.date-picker-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.35);z-index:200;display:none;align-items:flex-end}
.date-picker-overlay.show{display:flex}
.date-picker-panel{width:100%;background:var(--panel);border-radius:16px 16px 0 0;padding:16px;box-shadow:0 -4px 20px rgba(0,0,0,0.12);animation:slideUp 0.25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

/* ═══ Fullscreen Pano Overlay ═══ */
.pano-fullscreen{position:absolute;inset:0;z-index:300;background:#000;display:none}
.pano-fullscreen.show{display:flex;flex-direction:column}
.pano-fs-back{position:absolute;top:12px;left:12px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,0.5);border:none;z-index:10;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px)}
.pano-fs-back svg{width:20px;height:20px;color:#fff}
.pano-fs-content{flex:1;width:100%;height:100%}
.pano-fs-content iframe,.pano-fs-content img{width:100%;height:100%;border:none;object-fit:contain}

.dp-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.dp-title{font-size:var(--font-lg);font-weight:var(--fw-heavy)}
.dp-close{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--gray-100);border:none;cursor:pointer;color:var(--text-sub)}
.dp-row{display:flex;gap:8px;margin-bottom:12px}
.dp-field{flex:1}
.dp-label{font-size:var(--font-xs);color:var(--text-sub);margin-bottom:4px;font-weight:var(--fw-medium)}
.dp-input{width:100%;height:40px;padding:0 10px;border:1px solid var(--gray-200);border-radius:var(--radius-md);font-size:var(--font-md);color:var(--text);background:var(--gray-50);text-align:center}
.dp-input:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 2px var(--blue-50)}
.dp-actions{display:flex;gap:8px;margin-top:16px}
.dp-action-btn{flex:1;height:42px;border-radius:var(--radius-md);font-size:var(--font-md);font-weight:var(--fw-bold);border:none;cursor:pointer;transition:all var(--fast)}
.dp-action-btn.reset{background:var(--gray-100);color:var(--text-sub)}
.dp-action-btn.confirm{background:var(--blue);color:#fff}
.dp-action-btn.confirm:active{background:var(--blue-600)}

@media(max-width:420px){.phone-frame{width:100%;height:100%;margin:0;border-radius:0;box-shadow:none}.phone-notch,.phone-home-indicator{display:none}}
</style>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../shared_data.js"></script>
<script src="../mock-data.js"></script>
</head>
<body>
<div class="phone-frame" id="phoneFrame">
  <div class="phone-notch"></div>
  <div class="phone-home-indicator"></div>
  <div class="toast" id="toast"></div>

  <!-- Screen 1: 工作台 -->
  <div class="screen active" id="screenHome">
    <div class="screen-body" id="workbenchBody"><div style="padding:40px;text-align:center;color:var(--text-sub)">加载中...</div></div>
  </div>

  <!-- Screen 2: 围挡详情 -->
  <div class="screen" id="screenDetail">
    <div class="nav-bar">
      <div class="nav-bar-inner">
        <button class="nav-bar-back" onclick="goBack()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
        <span class="nav-bar-title">围挡详情</span>
        <button class="nav-bar-right" onclick="goToVerifyDetail()">校核</button>
      </div>
    </div>
    <div style="padding:8px 16px;background:var(--panel)" id="detailSummary"></div>
    <div class="detail-tabs" id="detailTabs">
      <span class="detail-tab active" data-tab="basic" onclick="switchDetailTab(this)">基本信息</span>
      <span class="detail-tab" data-tab="patrol" onclick="switchDetailTab(this)">巡检记录</span>
      <span class="detail-tab" data-tab="verifyChange" onclick="switchDetailTab(this)">变更与校核</span>
    </div>
    <div class="screen-body"><div class="detail-content" id="detailContent"></div></div>
  </div>

  <!-- Screen 2.5: 项目围挡列表 -->
  <div class="screen" id="screenProjectHoards">
    <div class="nav-bar">
      <div class="nav-bar-inner">
        <button class="nav-bar-back" onclick="goBack()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
        <span class="nav-bar-title" id="projHoardsTitle">项目围挡</span>
        <span class="nav-bar-right"></span>
      </div>
    </div>
    <div class="screen-body">
      <div style="height:220px;margin:12px 16px 0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border);position:relative" id="projectMapContainer">
        <div style="position:absolute;top:8px;right:8px;z-index:999;display:flex;gap:8px;padding:4px 10px;font-size:11px;background:rgba(255,255,255,0.92);border-radius:var(--radius-sm);box-shadow:var(--shadow-sm);flex-wrap:wrap">
          <div style="display:flex;align-items:center;gap:3px"><div style="width:7px;height:7px;border-radius:50%;background:#1890FF"></div><span style="color:var(--text-sub)">车辆</span></div>
          <div style="display:flex;align-items:center;gap:3px"><div style="width:7px;height:7px;border-radius:50%;background:#52C41A"></div><span style="color:var(--text-sub)">行人</span></div>
          <div style="display:flex;align-items:center;gap:3px"><div style="width:7px;height:7px;border-radius:50%;background:#FAAD14"></div><span style="color:var(--text-sub)">临时</span></div>
          <div style="display:flex;align-items:center;gap:3px"><div style="width:7px;height:7px;border-radius:50%;background:#FF4D4F"></div><span style="color:var(--text-sub)">其他</span></div>
        </div>
      </div>
      <div style="display:flex;gap:10px;padding:8px 16px 0;font-size:var(--font-xs)">

<script>
/* ═══════════════════════════════════════════
   Data from MOCK_DATA (mock-data.js)
   ═══════════════════════════════════════════ */

if(typeof MOCK_DATA==='undefined'){document.body.innerHTML='<div style=padding:20px;color:red>数据加载失败，请清除浏览器缓存后重试</div>';throw new Error('MOCK_DATA not loaded');}
var STATUS_KEY={ '设置中':'setting','即将到期':'removing','已到期':'removed' };
var STATUS_LABEL={ setting:'设置中',removing:'即将到期',removed:'已到期' };
var ISSUE_KEY={ '正常':'normal','待整改':'pending','整改逾期':'overdue','待审核':'pending','审核通过':'passed','退回整改':'pending' };

// Build fenceData from MOCK_DATA.getHoardings() — the authoritative data source
const fenceData=(function(){
  return MOCK_DATA.getHoardings().map(function(h){
    var stKey=STATUS_KEY[h.fenceStatus]||'setting';
    var issLabel=h.issueStatus||'正常';
    var issKey=ISSUE_KEY[issLabel]||'normal';
    return{
      id:h.id,
      project:h.projectName, eng:h.engineerName,
      address:h.address||h.projectAddress,
      status:h.fenceStatus||'设置中', statusKey:stKey,
      issue:issLabel, issueKey:issKey,
      length:h.length||0, height:h.height||2.5,
      material:h.material||'装配式钢结构喷绘围挡',
      fenceStyle:h.fenceStyle||'标准型',
      publicityContent:h.publicityContent||'—',
      roadOccupation:h.roadOccupation||'—',
      roadOccupationArea:(h.roadOccupationArea||0)+' ㎡',
      setupDate:h.setupDate||'—',
      planRemoveDate:h.planRemoveDate||'—',
      custodyLabel:(h.custodyStart||'—')+' ~ '+(h.custodyEnd||'—'),
      fenceResponsible:h.fenceResponsible||'—',
      fenceResponsiblePhone:h.fenceResponsiblePhone||'—',
      street:h.projectStreet||'—', district:h.projectDistrict||'—',
      needVerify:h.needVerify||'',
      unitName:h.constructUnit||'—',
      entrances:(h.entrances||[]).length,
      buildUnit:h.buildUnit||'—', buildContact:h.buildContact||'—',
      constructUnit:h.constructUnit||'—', constructContact:h.constructContact||'—',
      supervisorUnit:h.supervisorUnit||'—',
      regulatorUnit:h.regulatorUnit||'—',
      designUnit:h.designUnit||'—',
      planPeriod:(h.custodyStart||'')+' ~ '+(h.custodyEnd||''),
      engStatus:h.engStatus||'—',
      projectId:h.projectId
    };
  });
})();

// Build projectFenceData — aggregate by project, status priority: 即将到期 > 设置中 > 已到期
var projectFenceData=(function(){
  var map={};
  fenceData.forEach(function(f){
    var key=f.project;
    if(!map[key]){
      map[key]={
        project:f.project,district:f.district,street:f.street,
        hoardings:[],statusSet:{},
        earliestRemoveDate:null
      };
    }
    map[key].hoardings.push(f);
    if(f.statusKey)map[key].statusSet[f.statusKey]=true;
    if(f.planRemoveDate&&f.planRemoveDate!=='—'){
      if(!map[key].earliestRemoveDate||f.planRemoveDate<map[key].earliestRemoveDate){
        map[key].earliestRemoveDate=f.planRemoveDate;
      }
    }
  });
  var statusPriority=['removing','setting','removed'];
  var statusLabel={'removing':'即将到期','setting':'设置中','removed':'已到期'};
  var result=[];
  Object.keys(map).forEach(function(k){
    var entry=map[k];
    var aggStatus='setting';
    for(var i=0;i<statusPriority.length;i++){
      if(entry.statusSet[statusPriority[i]]){aggStatus=statusPriority[i];break;}
    }
    entry.aggStatusKey=aggStatus;
    entry.aggStatusLabel=statusLabel[aggStatus]||'设置中';
    entry.hoardingCount=entry.hoardings.length;
    entry.removeDate=entry.earliestRemoveDate||'—';
    result.push(entry);
  });
  return result;
})();

// Build overviewData from fenceData
const overviewData=(function(){
  var total=1286;
  var issue=fenceData.filter(function(f){return f.issueKey==='pending'||f.issueKey==='overdue'}).length;
  var overdue=fenceData.filter(function(f){return f.statusKey==='removed'}).length;
  var removing=fenceData.filter(function(f){return f.statusKey==='removing'}).length;
  var setting=fenceData.filter(function(f){return f.statusKey==='setting'}).length;
  var removed=fenceData.filter(function(f){return f.statusKey==='removed'}).length;
  var pendingVerify=Math.max(1,Math.floor(total*0.03));
  var pendingReview=Math.max(1,Math.floor(total*0.02));
  var pendingRectify=Math.floor(total*0.044);
  var rectOverdue=Math.floor(total*0.025);
  var rate=total>0?Math.round((1-issue/total)*100)+'%':'100%';
  return{total:total,issue:issue,overdue:overdue,removing:removing,
    todo:pendingVerify+pendingReview,rectified:issue,pendingRectify:pendingRectify,rectOverdue:rectOverdue,
    removed:removed,setting:setting,rate:rate,
    pendingVerify:pendingVerify,pendingReview:pendingReview};
})();

const todoData=(function(){
  var verifyItems=fenceData.filter(function(f){return f.needVerify==='是'}).slice(0,4).map(function(f){
    return{id:f.id,name:f.project+' · '+f.eng};
  });
  var reviewItems=fenceData.filter(function(f){return f.issueKey==='pending'||f.issueKey==='overdue'}).slice(0,2).map(function(f){
    return{id:f.id,name:f.project+' · '+f.eng};
  });
  if(!verifyItems.length)verifyItems=fenceData.slice(0,2).map(function(f){return{id:f.id,name:f.project+' · '+f.eng};});
  return[
    {type:'verify',title:'待校核围挡',count:verifyItems.length,desc:verifyItems.length+'条围挡信息待校核',icon:'verify',items:verifyItems},
    {type:'review',title:'整改审核',count:reviewItems.length,desc:reviewItems.length+'条整改待审核',icon:'review',items:reviewItems}
  ];
})();

// Patrol data from MOCK_DATA
const patrolData=(function(){
  var pd={};
  fenceData.forEach(function(f){
    var hoard=MOCK_DATA.findHoard(f.id);
    if(!hoard||!hoard.patrolRecords||!hoard.patrolRecords.length)return;
    var records=hoard.patrolRecords.slice();
    // Sort by date desc (latest first)
    records.sort(function(a,b){return (b.date+' '+ (b.time||'00:00')).localeCompare(a.date+' '+(a.time||'00:00'));});
    var daysMap={};
    records.forEach(function(r){
      var dateStr=r.date||'2026-05-14';
      var parts=dateStr.split('-');
      var dayLabel=parts[1]+'月'+parts[2]+'日';
      var d=new Date(dateStr);
      var weekdays=['日','一','二','三','四','五','六'];
      if(!daysMap[dayLabel]){daysMap[dayLabel]={date:dayLabel,weekday:'星期'+weekdays[d.getDay()],records:[]};}
      var hasIssue=r.result==='异常'||r.result==='有问题';
      var issueCount=(r.issues&&r.issues.length)||0;
      var fullTime=dateStr+' '+(r.time||'00:00')+':00';
      daysMap[dayLabel].records.push({
        patrolId:r.id, date:dateStr, time:r.time||'00:00', fullTime:fullTime,
        inspector:r.inspector, person:r.inspector, unit:hoard.constructUnit||'',
        hasIssue:hasIssue, issueCount:issueCount,
        issues:r.issues||[],
        panoSrc:r.panoramaSrc||'',
        panoScenes:[{name:'全景',src:r.panoramaSrc||''}],
        fenceId:f.id, engName:f.eng
      });
    });
    pd[f.id]={monthCount:records.length,engName:f.eng,days:Object.values(daysMap)};
  });
  return pd;
})();

// Verify records from MOCK_DATA
const verifyRecords=(function(){
  var vr={};
  fenceData.forEach(function(f){
    var hoard=MOCK_DATA.findHoard(f.id);
    if(!hoard||!hoard.verifyRecords||!hoard.verifyRecords.length)return;
    vr[f.id]=hoard.verifyRecords.map(function(r){
      return{time:r.date,person:r.verifier+'（'+r.unit+' · '+r.role+'）',role:r.type,type:'verify',
        changeId:r.changeId||null,
        fields:r.field?[{label:r.field,old:r.before||'—',new:r.after||'—'}]:[]};
    });
  });
  return vr;
})();

// Change records from MOCK_DATA
const changeRecords=(function(){
  var cr={};
  fenceData.forEach(function(f){
    var hoard=MOCK_DATA.findHoard(f.id);
    if(!hoard||!hoard.changeRecords||!hoard.changeRecords.length)return;
    cr[f.id]=hoard.changeRecords.map(function(r){
      return{time:r.date,person:r.changer,unit:hoard.constructUnit||'',
        role:r.type,type:'change', changeId:r.id,
        fenceId:f.id,
        fields:r.field?[{label:r.field,old:r.before||'—',new:r.after||'—'}]:[]};
    });
  });
  return cr;
})();

/* ═══════════════════════════════════════════
   Screen Navigation
   ═══════════════════════════════════════════ */
let screenStack=['screenHome'];
function showScreen(id,addToStack){
  var current=document.querySelector('.screen.active');
  var target=document.getElementById(id);
  if(addToStack!==false)screenStack.push(id);
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active','behind')});
  if(current&&current!==target)current.classList.add('behind');
  target.classList.add('active');
}
function goBack(){
  screenStack.pop();
  var prev=screenStack[screenStack.length-1]||'screenHome';
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active','behind')});
  document.getElementById(prev).classList.add('active');
}

/* ═══════════════════════════════════════════
   Workbench Rendering
   ═══════════════════════════════════════════ */
let currentFilter='all',inlineSearchKeyword='';

function renderWorkbench(){
  var d=overviewData,html='';
  // Greeting
  var h=new Date().getHours(),g=h<12?'上午好':(h<18?'下午好':'晚上好');
  html+='<div class="greeting-bar"><div><div class="greeting-hello">'+g+'，张志明</div><div class="greeting-date">2026年5月14日 星期四</div></div><div class="greeting-right"><button class="greeting-notify" onclick="showToast(\'消息通知开发中\')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg><span class="greeting-notify-dot"></span></button><div class="greeting-avatar">张</div></div></div>';
  // Overview Hero
  html+='<div class="overview-card"><div class="overview-main"><span class="overview-num">'+d.total.toLocaleString()+'</span><span class="overview-label">全市围挡</span></div><div class="overview-grid"><div class="overview-metric danger" onclick="setFilterByChip(\'issue\')"><span class="overview-metric-val">'+d.issue+'</span><span class="overview-metric-lbl">问题围挡</span></div><div class="overview-metric danger"><span class="overview-metric-val">'+d.rectOverdue+'</span><span class="overview-metric-lbl">整改逾期</span></div><div class="overview-metric warning"><span class="overview-metric-val">'+d.pendingRectify+'</span><span class="overview-metric-lbl">待整改</span></div><div class="overview-metric success"><span class="overview-metric-val">'+d.rate+'</span><span class="overview-metric-lbl">整改完成率</span></div><div class="overview-metric danger" onclick="setFilterByChip(\'overdue\')"><span class="overview-metric-val">'+d.overdue+'</span><span class="overview-metric-lbl">超期未拆</span></div><div class="overview-metric warning" onclick="setFilterByChip(\'removing\')"><span class="overview-metric-val">'+d.removing+'</span><span class="overview-metric-lbl">即将拆除</span></div></div></div>';
  // 金刚区
  var verifyCount=fenceData.filter(function(f){return f.needVerify==='是'}).length;
  html+='<div class="section" style="padding:12px 16px 10px"><div class="section-head" style="margin-bottom:8px"><span class="section-title">快捷功能</span></div>';
  html+='<div class="grid-icons">'+
    // 全景巡查
    '<div class="grid-icon-item" onclick="window.location.href=\'panorama_patrol.html\'">'+
      '<div class="grid-icon-circle patrol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg></div>'+
      '<div class="grid-icon-label">巡查</div>'+
    '</div>'+
    // 变更校核
    '<div class="grid-icon-item" onclick="window.location.href=\'verify_list.html\'">'+
      (verifyCount>0?'<span class="grid-icon-dot">'+verifyCount+'</span>':'')+
      '<div class="grid-icon-circle verify"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></div>'+
      '<div class="grid-icon-label">校核</div>'+
    '</div>'+
    // 问题
    '<div class="grid-icon-item" onclick="window.location.href=\'issue_list.html\'">'+
      '<div class="grid-icon-circle issue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>'+
      '<div class="grid-icon-label">问题</div>'+
    '</div>'+
  '</div></div>';
  // Fence List (project-level) — filter by fence status
  var sc=projectFenceData.filter(function(p){return p.aggStatusKey==='setting'}).length;
  var rc=projectFenceData.filter(function(p){return p.aggStatusKey==='removing'}).length;
  var dc=projectFenceData.filter(function(p){return p.aggStatusKey==='removed'}).length;
  html+='<div class="section" style="padding-bottom:8px"><div class="section-head"><span class="section-title">围挡列表</span><button class="toggle-btn" onclick="showScreen(\'screenMapOverview\')">地图总览</button></div><div class="search-bar"><div class="search-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input class="search-input" type="text" placeholder="搜索项目名称、区域" oninput="handleInlineSearch(this.value)"></div></div><div class="chips"><span class="chip'+(currentFilter==='all'?' active':'')+'" data-filter="all" onclick="setFilter(this)">全部 <small>'+projectFenceData.length+'</small></span><span class="chip'+(currentFilter==='setting'?' active':'')+'" data-filter="setting" onclick="setFilter(this)">设置中 <small>'+sc+'</small></span><span class="chip'+(currentFilter==='removing'?' active':'')+'" data-filter="removing" onclick="setFilter(this)">即将到期 <small>'+rc+'</small></span><span class="chip'+(currentFilter==='removed'?' active':'')+'" data-filter="removed" onclick="setFilter(this)">已到期 <small>'+dc+'</small></span></div><div class="fence-list" id="fenceList"></div></div>';
  document.getElementById('workbenchBody').innerHTML=html;
  renderFenceList();

function initProjectMap(projEntry){
  var el=document.getElementById('projectMapContainer');if(!el)return;
  if(projectMap){projectMap.remove();projectMap=null;}
  projectMap=L.map(el,{zoomControl:false,attributionControl:false});
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:18}).addTo(projectMap);

  var projects=MOCK_DATA.getProjects();
  var proj=null;
  projects.forEach(function(p){if(p.name===projEntry.project)proj=p;});
  var allLayers=[];

  // Project redline
  if(proj&&proj.redlineGeo&&proj.redlineGeo.length>0){
    var rl=proj.redlineGeo.map(function(p){return[p[0],p[1]];});
    var rlLayer=L.polygon(rl,{color:'#F93920',weight:2,fill:false}).addTo(projectMap);
    allLayers.push(rlLayer);
    projectMap.setView([proj.lat,proj.lng],15);
  }

  // All hoardings' gpsShape + entrances
  var entColor={vehicle:'#1890FF',pedestrian:'#52C41A',temporary:'#FAAD14',other:'#FF4D4F'};
  var entType={vehicle:'车辆出入口',pedestrian:'行人出入口',temporary:'临时出入口',other:'其他'};
  projEntry.hoardings.forEach(function(f){
    var hoard=MOCK_DATA.findHoard(f.id);
    if(!hoard||!hoard.gpsShape||!hoard.gpsShape.length)return;
    var fs=hoard.gpsShape.map(function(p){return[p[0],p[1]];});
    var fl=L.polygon(fs,{color:'#2F55EB',weight:2,dashArray:'6 4',fillColor:'rgba(47,85,235,0.10)',fillOpacity:1}).addTo(projectMap);
    allLayers.push(fl);
    if(hoard.entrances){
      hoard.entrances.forEach(function(e){
        var color=entColor[e.type]||'#1890FF';
        L.circleMarker([e.lat,e.lng],{radius:5,color:color,fillColor:color,fillOpacity:1,weight:2}).addTo(projectMap)
          .bindTooltip(entType[e.type],{direction:'right'});
      });
    }
  });

  if(allLayers.length>0){
    var group=L.featureGroup(allLayers);
    try{projectMap.fitBounds(group.getBounds(),{padding:[30,30]});}catch(e){}
  }else if(proj){
    projectMap.setView([proj.lat,proj.lng],15);
  }else{
    projectMap.setView([22.548,114.061],15);
  }
}

var detailMap=null;
function initDetailMap(f){
  var el=document.getElementById('detailMapContainer');
  if(!el)return;
  if(detailMap){detailMap.remove();detailMap=null;}
  detailMap=L.map(el,{zoomControl:false,attributionControl:false});
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:18}).addTo(detailMap);

  // Get GPS data from mock — findHoard returns enriched hoard with projectId
  var hoard=MOCK_DATA.findHoard(f.id);

  // Find project via hoard.projectId (SD+MOCK fence-to-project mapping differs)
  var projects=MOCK_DATA.getProjects();
  var proj=null;
  if(hoard&&hoard.projectId){
    projects.forEach(function(p){if(p.id===hoard.projectId)proj=p;});
  }

  // Build combined layer group for fitBounds
  var allLayers=[];

  // ── Project redline ──
  if(proj&&proj.redlineGeo&&proj.redlineGeo.length>0){
    var rl=proj.redlineGeo.map(function(p){return[p[0],p[1]];});
    var redlineLayer=L.polygon(rl,{color:'#F93920',weight:2,fill:false}).addTo(detailMap);
    allLayers.push(redlineLayer);
  }

  // ── Fence range (gpsShape) ──
  if(hoard&&hoard.gpsShape&&hoard.gpsShape.length>0){
    var fs=hoard.gpsShape.map(function(p){return[p[0],p[1]];});
    var fenceLayer=L.polygon(fs,{color:'#2F55EB',weight:2,dashArray:'6 4',fillColor:'rgba(47,85,235,0.10)',fillOpacity:1}).addTo(detailMap);
    allLayers.push(fenceLayer);
  }

  // ── Entrance markers (this fence) ──
  var entColor={vehicle:'#1890FF',pedestrian:'#52C41A',temporary:'#FAAD14',other:'#FF4D4F'};
  var entType={vehicle:'车辆出入口',pedestrian:'行人出入口',temporary:'临时出入口',other:'其他'};
  if(hoard&&hoard.entrances){
    hoard.entrances.forEach(function(e){
      var color=entColor[e.type]||'#1890FF';
      var mk=L.circleMarker([e.lat,e.lng],{radius:5,color:color,fillColor:color,fillOpacity:1,weight:2})
        .bindTooltip(entType[e.type]||'出入口',{direction:'top',offset:[0,-8]})
        .addTo(detailMap);
      allLayers.push(mk);
    });
  }

  // ── Other fence blocks (same project, different fenceId) ──
  if(proj&&proj.hoardings){
    proj.hoardings.forEach(function(h){
      if(h.id===f.id)return;
      if(!h.gpsShape||!h.gpsShape.length)return;
      var ofs=h.gpsShape.map(function(p){return[p[0],p[1]];});
      var otherLayer=L.polygon(ofs,{color:'var(--blue-300)',weight:1.5,dashArray:'4 3',fillColor:'rgba(92,142,255,0.06)',fillOpacity:1}).addTo(detailMap);
      allLayers.push(otherLayer);
      if(h.entrances){
        h.entrances.forEach(function(e){
          var color=entColor[e.type]||'#1890FF';
          var omk=L.circleMarker([e.lat,e.lng],{radius:4,color:color,fillColor:color,fillOpacity:0.7,weight:1.5}).addTo(detailMap);
          allLayers.push(omk);
        });
      }
    });
  }

  // ── Fit bounds (cover redline + all fence shapes) ──
  if(allLayers.length>0){
    var group=L.featureGroup(allLayers);
    try{detailMap.fitBounds(group.getBounds(),{padding:[30,30]});}catch(e){}
  }else if(proj){
    detailMap.setView([proj.lat,proj.lng],15);
  }else{
    detailMap.setView([22.548,114.061],15);
  }
}

      if (hoard.projectId) { projects.forEach(function(p) { if (p.id === hoard.projectId) proj = p; }); }

      cr.forEach(function(ch, idx) {
        var hasMap = ch.fields && ch.fields[0] && ch.fields[0].old === '（地图对比）' && ch.fields[0].new === '（地图对比）';
        if (!hasMap) return;

        ['Pre','Post'].forEach(function(suffix){
          var mapEl = document.getElementById('cvMap'+suffix+'_'+idx);
          if (!mapEl) return;
          var m = L.map(mapEl, {zoomControl:false, attributionControl:false, dragging:false, scrollWheelZoom:false});
          L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:18}).addTo(m);

          // Project redline
          if (proj && proj.redlineGeo && proj.redlineGeo.length >= 3) {
            L.polygon(proj.redlineGeo, {color:'#D13B2F',weight:2,fillOpacity:0.08,fillColor:'#D13B2F'}).addTo(m);
          }
          // Fence GPS shape
          if (hoard.gpsShape && hoard.gpsShape.length >= 2) {
            L.polygon(hoard.gpsShape, {color:'#2F55EB',weight:2,fillOpacity:0.1,fillColor:'#2F55EB',dashArray:'8 4'}).addTo(m);
          }
          // Entrances
          if (hoard.entrances) {
            hoard.entrances.forEach(function(e) {
              var c = e.type==='vehicle'?'#2F55EB':e.type==='pedestrian'?'#3BB346':'#2F55EB';
              L.circleMarker([e.lat, e.lng], {radius:4, color:c, fillColor:c, fillOpacity:0.7, weight:2}).addTo(m).bindTooltip(e.name||'出入口',{direction:'top'});
            });
          }
          // For "after" map, add a fake extra entrance to show the change
          if (suffix === 'Post' && hoard.gpsShape && hoard.gpsShape.length > 0) {
            var midLat = hoard.gpsShape[0][0] + 0.0004;
            var midLng = hoard.gpsShape[0][1] + 0.0004;
            L.circleMarker([midLat, midLng], {radius:5, color:'#F93920', fillColor:'#F93920', fillOpacity:0.9, weight:2}).addTo(m).bindTooltip('新增出入口',{direction:'top'});
          }

          // Fit bounds
          if (hoard.gpsShape && hoard.gpsShape.length > 0) {
            var bounds = L.latLngBounds([]);
            hoard.gpsShape.forEach(function(p){ bounds.extend(p); });
            if (suffix === 'Post') {
              var midLat2 = hoard.gpsShape[0][0] + 0.0004;
              var midLng2 = hoard.gpsShape[0][1] + 0.0004;
              bounds.extend([midLat2, midLng2]);
            }
            if (bounds.isValid()) m.fitBounds(bounds.pad(0.2));
          } else if (proj) {
            m.setView([proj.lat, proj.lng], 16);
          }
          setTimeout(function(){ m.invalidateSize(); }, 200);
        });
      });
    }, 400);
  }
}

      '<div style="display:flex;align-items:center;gap:3px"><div style="width:7px;height:7px;border-radius:50%;background:#FF4D4F"></div><span style="color:var(--text-sub)">其他</span></div>'+

    var projects=MOCK_DATA.getProjects();
    projects.forEach(function(proj){
      // Project redline — always show
      if(proj.redlineGeo&&proj.redlineGeo.length>=3){

        L.polygon(rl,{color:'#F93920',weight:2.5,fill:false,dashArray:'6 3'}).addTo(_overviewMap);

    }else{
      _overviewMap.setView([22.548,114.061],13);

/* ── Map search ── */
function handleMapSearch(kw){
  var card=document.getElementById('mapInfoCard');
  if(!kw.trim()){card.style.display='none';cleanupTempFences();return}
  var q=kw.toLowerCase(), results=[];
  var projects=MOCK_DATA.getProjects();
  projects.forEach(function(proj){
    (proj.hoardings||[]).forEach(function(h){
      var fk=h.fenceStatus||'设置中';
      var pn=(proj.name||'').toLowerCase(), en=(h.engineerName||'').toLowerCase();
      if(pn.indexOf(q)>=0||en.indexOf(q)>=0){
        results.push({hoard:h, project:proj});
      }
    });
  });
  if(!results.length){card.style.display='none';return}
  var html='<div style="font-size:var(--font-xs);color:var(--text-sub);margin-bottom:6px">找到 <strong>'+results.length+'</strong> 条记录</div>';
  results.slice(0,15).forEach(function(r){
    var h=r.hoard, p=r.project;
    var st=h.fenceStatus||'设置中';
    var stCls=st==='设置中'?'tag-setting':st==='即将到期'?'tag-removing':'tag-overdue';
    html+='<div class="map-overview-item" onclick="locateFenceOnMap(\''+h.id+'\')" style="padding:8px 0">'+
      '<div class="map-overview-info"><div class="map-overview-name" style="font-size:var(--font-sm)">'+p.name+'</div>'+
      '<div class="map-overview-sub">'+h.engineerName+'</div>'+
      '<div class="map-overview-tags"><span class="tag '+stCls+'" style="font-size:10px">'+st+'</span></div>'+
      '</div></div>';
  });
  card.innerHTML=html;card.style.display='block';
}

/* ── Click to select fence ── */
var _selectedStyle={color:'#2F55EB',weight:3.5,dashArray:null,fillColor:'rgba(47,85,235,0.15)',fillOpacity:1};
var _defaultStyle={color:'#2F55EB',weight:1.8,dashArray:'5 3',fillColor:'rgba(47,85,235,0.06)',fillOpacity:1};

function selectFenceOnMap(fid){
  // Deselect previous
  if(_overviewSelected&&_overviewFenceLayers[_overviewSelected]){
    _overviewFenceLayers[_overviewSelected].layer.setStyle(_defaultStyle);
  }
  _overviewSelected=fid;
  var entry=_overviewFenceLayers[fid];if(!entry)return;
  entry.layer.setStyle(_selectedStyle);
  // Fit to fence
  var bounds=entry.layer.getBounds();
  if(bounds.isValid())_overviewMap.fitBounds(bounds,{padding:[60,60],maxZoom:17});
  // Show info card
  showFenceInfoCard(entry.hoard, entry.project);
}

function deselectFenceOnMap(){
  if(_overviewSelected&&_overviewFenceLayers[_overviewSelected]){
    _overviewFenceLayers[_overviewSelected].layer.setStyle(_defaultStyle);
    // Remove temp layer if this was a temporarily-added 已到期 fence
    if(_tempFenceIds[_overviewSelected]){
      var entry=_overviewFenceLayers[_overviewSelected];
      if(entry._extras){entry._extras.forEach(function(mk){if(mk._map)_overviewMap.removeLayer(mk);});}
      if(entry.layer._map)_overviewMap.removeLayer(entry.layer);
      delete _overviewFenceLayers[_overviewSelected];
      delete _tempFenceIds[_overviewSelected];
    }
  }
  _overviewSelected=null;
  var card=document.getElementById('mapInfoCard');
  if(card)card.style.display='none';
}

/* ── Cleanup temp fence layers ── */
function cleanupTempFences(){
  Object.keys(_tempFenceIds).forEach(function(fid){
    var entry=_overviewFenceLayers[fid];
    if(!entry)return;
    if(entry._extras){entry._extras.forEach(function(mk){if(mk._map)_overviewMap.removeLayer(mk);});}
    if(entry.layer._map)_overviewMap.removeLayer(entry.layer);
    delete _overviewFenceLayers[fid];
  });
  _tempFenceIds={};
}

function locateFenceOnMap(fid){
  var entry=_overviewFenceLayers[fid];
  // If fence not on map yet (已到期), temporarily add it
  if(!entry){
    var hoard=null, proj=null;
    var projects=MOCK_DATA.getProjects();
    for(var i=0;i<projects.length;i++){
      var hs=projects[i].hoardings||[];
      for(var j=0;j<hs.length;j++){if(hs[j].id===fid){hoard=hs[j];proj=projects[i];break;}}
      if(hoard)break;
    }
    if(!hoard||!hoard.gpsShape||hoard.gpsShape.length<2)return;
    var fs=hoard.gpsShape.map(function(p){return[p[0],p[1]];});
    var poly=L.polygon(fs,{color:'#2F55EB',weight:1.8,dashArray:'5 3',fillColor:'rgba(47,85,235,0.06)',fillOpacity:1}).addTo(_overviewMap);
    entry={layer:poly, hoard:hoard, project:proj};
    _overviewFenceLayers[fid]=entry;
    _tempFenceIds[fid]=true;
    poly.on('click', function(e){L.DomEvent.stopPropagation(e);selectFenceOnMap(fid);});
    // Add entrances (colored by type)
    if(hoard.entrances){
      hoard.entrances.forEach(function(ent){
        var entColor={vehicle:'#1890FF',pedestrian:'#52C41A',temporary:'#FAAD14',other:'#FF4D4F'};
        var c=entColor[ent.type]||'#1890FF';
        var mk=L.circleMarker([ent.lat,ent.lng],{radius:4,color:c,fillColor:c,fillOpacity:0.8,weight:2}).addTo(_overviewMap);
        mk.bindTooltip(ent.name||'出入口',{direction:'top'});
        if(!entry._extras)entry._extras=[];
        entry._extras.push(mk);
      });
    }
  }
  var bounds=entry.layer.getBounds();
  if(bounds.isValid())_overviewMap.fitBounds(bounds,{padding:[60,60],maxZoom:17});
  selectFenceOnMap(fid);
}

function handleSearch(keyword){

  var kw=keyword.toLowerCase();
  var filtered=fenceData.filter(function(f){return f.id.toLowerCase().indexOf(kw)!==-1||f.project.toLowerCase().indexOf(kw)!==-1||f.address.toLowerCase().indexOf(kw)!==-1});
  if(!filtered.length){list.innerHTML='<div class="empty-state"><span>未找到匹配围挡</span></div>';return}
  var sm={setting:'tag-setting',removing:'tag-removing',removed:'tag-overdue'},im={normal:'tag-issue tag-issue--normal',pending:'tag-issue tag-issue--pending',overdue:'tag-issue tag-issue--overdue'};

  var data=JSON.stringify({fid:fenceId, date:rec.date, patrolId:patrolId, panoSrc:rec.panoramaSrc||''});

  var hoard=MOCK_DATA.findHoard(fenceId);

  var rec=null;
  hoard.patrolRecords.forEach(function(r){if(r.id===patrolId)rec=r;});
  if(!rec||!rec.issues||!rec.issues[issueIdx])return;
  var iss=rec.issues[issueIdx];
  // Find matching YZY issue — prefer getClosureIssues for _rectification / _audits
  var allIssues=MOCK_DATA.getClosureIssues ? MOCK_DATA.getClosureIssues() : MOCK_DATA.getStreetIssues();
  var yzy=null;
  for(var i=0;i<allIssues.length;i++){

  _patrolIssueInfo={fenceId:fenceId, patrolId:patrolId, issue:iss, yzy:yzy, hoard:hoard, patrolDate:rec.date, patrolTime:rec.time, inspector:rec.inspector};
  renderPatrolIssueDetail();showScreen('screenPatrolIssueDetail');

    // Issue location marker
    if(y&&y.location&&y.location.lat){
      L.circleMarker([y.location.lat,y.location.lng],{radius:7,color:'#F93920',fillColor:'#F93920',fillOpacity:0.9,weight:3}).addTo(m).bindPopup('<b>问题位置</b><br>'+y.location.addr||'');
      bounds.extend([y.location.lat,y.location.lng]);
    }
    if(bounds.isValid())m.fitBounds(bounds.pad(0.2));
    else if(proj)m.setView([proj.lat,proj.lng],15);
    else m.setView([22.548,114.061],15);
    setTimeout(function(){m.invalidateSize();},200);
  },400);
}

// Render map overview when navigating to it
var origShowScreen=showScreen;
showScreen=function(id,addToStack){
  origShowScreen(id,addToStack);
  if(id==='screenMapOverview')renderMapOverview();
};

(function init(){
  // Verify critical dependencies
  if(typeof MOCK_DATA==='undefined'){document.body.innerHTML='<div style="padding:40px;text-align:center;color:#F93920">数据模块加载失败<br><small>请清除缓存后重试</small></div>';return;}
  if(typeof projectFenceData==='undefined'){document.body.innerHTML='<div style="padding:40px;text-align:center;color:#F93920">项目数据为空<br><small>请清除缓存后重试</small></div>';return;}
  try{renderWorkbench();}catch(e){document.getElementById('workbenchBody').innerHTML='<div style="padding:40px;color:var(--red);text-align:center"><div style="font-size:20px;margin-bottom:8px">页面加载异常</div><div style="font-size:12px;color:var(--text-sub)">'+e.message+'</div></div>';}
  // Handle hash-based deep links from panorama_viewer
  setTimeout(handleDeepLink, 600);
})();
function handleDeepLink(){
  var hash=window.location.hash; if(!hash)return;
  if(hash.indexOf('#patrolDetail=')===0){
    var parts=decodeURIComponent(hash.slice('#patrolDetail='.length)).split(',');
    var fid=parts[0], pid=parts[1]; if(!fid||!pid)return;
    for(var i=0;i<fenceData.length;i++){if(fenceData[i].id===fid){currentFence=fenceData[i];break;}}
    if(!currentFence)return;
    openPatrolDetail(fid, pid);
  }
  else if(hash.indexOf('#patrolIssue=')===0){
    var parts=decodeURIComponent(hash.slice('#patrolIssue='.length)).split(',');
    var fid=parts[0], pid=parts[1], issueIdx=parseInt(parts[2])||0; if(!fid||!pid)return;
    for(var i=0;i<fenceData.length;i++){if(fenceData[i].id===fid){currentFence=fenceData[i];break;}}
    if(!currentFence)return;
    openPatrolIssueDetail(fid, pid, issueIdx);
  }
}
</script>
