<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>监管端APP - 深圳市建设施工围挡数字化管理系统</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* ═══ Design Token ═══ */
:root{
  --bg:#eef4fb;--panel:#ffffff;--panel-2:#f6f9fe;
  --blue:#0f5bd8;--blue-deep:#0a2f6f;--blue-soft:#dce9ff;--blue-50:#EBF2FF;--blue-100:#C6D9FF;--blue-200:#9DBEFF;
  --blue-300:#6B9EF5;--blue-400:#3D7FED;--blue-500:#1862D4;--blue-600:#104FAD;
  --gray-0:#FFF;--gray-50:#F7F8FA;--gray-100:#F0F1F5;--gray-200:#E3E6ED;
  --gray-300:#C6CBD8;--gray-400:#9CA3B0;--gray-500:#6B7280;--gray-600:#4B5563;
  --gray-700:#374151;--gray-800:#1F2937;--gray-900:#111827;
  --green:#17b26a;--green-light:#E6F4EA;
  --yellow:#f5b400;--yellow-light:#FEF3CD;
  --orange:#f97316;--orange-light:#FFF3E6;
  --red:#e5484d;--red-light:#FDECEA;
  --text:#10233f;--text-sub:#5e718d;--text-tertiary:#9CA3B0;
  --border:rgba(16,35,63,0.08);
  --shadow-sm:0 1px 2px rgba(0,0,0,0.04);--shadow-md:0 8px 20px rgba(20,52,107,0.06);--shadow-lg:0 12px 28px rgba(23,51,105,0.08);
  --radius-sm:4px;--radius-md:8px;--radius-lg:14px;--radius-xl:20px;
  --font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --font-xs:11px;--font-sm:12px;--font-md:14px;--font-lg:16px;--font-xl:18px;
  --fw-regular:400;--fw-medium:500;--fw-bold:600;--fw-heavy:700;
  --safe-top:47px;--safe-bottom:34px;
  --fast:0.15s ease;--normal:0.25s ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font-family);font-size:var(--font-md);color:var(--text);background:linear-gradient(180deg,#f3f7fd,#eaf1fb);line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;height:100%;overflow:hidden}
a{color:var(--blue);text-decoration:none}
button{font-family:var(--font-family);cursor:pointer;border:none;background:none}
input,textarea,select{font-family:var(--font-family);outline:none}

/* ═══ Phone Frame ═══ */
.phone-frame{position:relative;width:390px;height:844px;margin:20px auto;background:linear-gradient(180deg,#f7faff,#edf4ff);border-radius:40px;overflow:hidden;box-shadow:0 0 0 2px #1a1a1a,0 0 0 6px #333,0 0 0 8px #1a1a1a,0 20px 60px rgba(0,0,0,0.3)}
.phone-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#000;border-radius:0 0 20px 20px;z-index:999}
.phone-home-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;background:rgba(0,0,0,0.15);border-radius:3px;z-index:999}

/* ═══ Screen System ═══ */
.screen{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#f7faff,#edf4ff);transform:translateX(100%);opacity:0;transition:transform 0.3s cubic-bezier(0.4,0,0.2,1),opacity 0.3s ease;will-change:transform,opacity}
.screen.active{transform:translateX(0);opacity:1;z-index:10}
.screen.behind{transform:translateX(-30%);opacity:0.5;z-index:5}

/* ═══ Nav Bar ═══ */
.nav-bar{flex-shrink:0;padding-top:var(--safe-top);background:var(--panel);border-bottom:1px solid var(--border);position:relative;z-index:50}
.nav-bar-inner{display:flex;align-items:center;height:44px;padding:0 16px}
.nav-bar-title{flex:1;text-align:center;font-size:var(--font-lg);font-weight:var(--fw-heavy);color:var(--text)}
.nav-bar-back{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--blue);border-radius:var(--radius-md)}
.nav-bar-back:active{background:var(--gray-100)}
.nav-bar-right{width:60px;text-align:right;font-size:var(--font-sm);color:var(--blue);font-weight:var(--fw-medium)}

/* ═══ Scroll Body ═══ */
.screen-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen-body::-webkit-scrollbar{display:none}

/* ═══ Greeting Bar ═══ */
.greeting-bar{padding:calc(var(--safe-top) + 10px) 16px 12px;background:var(--panel);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.greeting-hello{font-size:var(--font-lg);font-weight:var(--fw-heavy);color:var(--text)}
.greeting-date{font-size:var(--font-xs);color:var(--text-sub);margin-top:1px}
.greeting-right{display:flex;align-items:center;gap:8px}
.greeting-notify{position:relative;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--text-sub);border-radius:50%;background:var(--gray-100)}
.greeting-notify-dot{position:absolute;top:4px;right:4px;width:8px;height:8px;background:var(--red);border-radius:50%;border:2px solid var(--panel)}
.greeting-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue-deep));color:#fff;display:flex;align-items:center;justify-content:center;font-size:var(--font-sm);font-weight:var(--fw-bold)}

/* ═══ Overview Card (Hero) ═══ */
.overview-card{background:linear-gradient(145deg,#0c3d97 0%,#0f5bd8 62%,#3d86ff 100%);margin:12px 16px 0;padding:16px;color:#fff;position:relative;overflow:hidden;border-radius:var(--radius-xl);box-shadow:0 4px 16px rgba(13,43,85,0.25)}
.overview-card::after{content:'';position:absolute;top:-40px;right:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,0.06)}
.overview-main{display:flex;align-items:baseline;gap:6px;margin-bottom:12px}
.overview-num{font-size:28px;font-weight:800;letter-spacing:-1px}
.overview-label{font-size:var(--font-sm);opacity:0.8}
.overview-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.overview-metric{background:rgba(255,255,255,0.12);border-radius:var(--radius-md);padding:8px 10px;display:flex;flex-direction:column;cursor:pointer;position:relative;z-index:1;transition:background var(--fast)}
.overview-metric:active{background:rgba(255,255,255,0.2)}
.overview-metric-val{font-size:var(--font-lg);font-weight:var(--fw-heavy)}
.overview-metric-lbl{font-size:10px;opacity:0.75;margin-top:1px}
.overview-metric.danger .overview-metric-val{color:#FF8A80}
.overview-metric.warning .overview-metric-val{color:#FFD54F}
.overview-metric.success .overview-metric-val{color:#A5D6A7}

/* ═══ Section ═══ */
.section{margin:12px 16px;background:var(--panel);border-radius:var(--radius-xl);padding:16px;box-shadow:var(--shadow-md);border:1px solid rgba(15,91,216,0.06)}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.section-title{font-size:var(--font-lg);font-weight:var(--fw-heavy)}
.badge-pill{border-radius:999px;padding:4px 10px;font-size:11px;font-weight:var(--fw-heavy);display:inline-flex;align-items:center;gap:4px}
.badge-danger{background:linear-gradient(135deg,#ff6b6b,#e5484d);color:#fff;box-shadow:0 4px 12px rgba(229,72,77,0.2)}
.toggle-btn{border:none;background:var(--panel-2);color:var(--blue);font-size:var(--font-sm);font-weight:var(--fw-heavy);border-radius:999px;padding:6px 12px;cursor:pointer}

/* ═══ Todo Row ═══ */
.todo-row{display:flex;align-items:center;padding:12px;background:linear-gradient(180deg,#fff,#f8fbff);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:8px;gap:10px;box-shadow:var(--shadow-sm);cursor:pointer}
.todo-row:active{background:var(--gray-50)}
.todo-icon{width:36px;height:36px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.todo-icon.verify{background:var(--blue-50);color:var(--blue)}
.todo-icon.review{background:var(--yellow-light);color:var(--yellow)}
.todo-info{flex:1;min-width:0}
.todo-info-title{font-size:var(--font-md);font-weight:var(--fw-medium)}
.todo-info-desc{font-size:var(--font-xs);color:var(--text-sub);margin-top:1px}
.todo-action{font-size:var(--font-sm);color:var(--blue);font-weight:var(--fw-medium);padding:6px 12px;background:var(--blue-soft);border-radius:var(--radius-md);white-space:nowrap}
.todo-action:active{opacity:0.7}

/* ═══ Filter Chips ═══ */
.chips{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:6px 12px;border-radius:999px;font-size:var(--font-xs);font-weight:var(--fw-medium);background:var(--panel);color:var(--text-sub);border:1px solid var(--border);cursor:pointer;transition:all var(--fast);flex-shrink:0}
.chip.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.chip small{opacity:0.7;margin-left:2px}

/* ═══ Search ═══ */
.search-bar{padding:8px 16px}
.search-wrap{display:flex;align-items:center;background:var(--gray-100);border-radius:20px;padding:0 12px;height:36px}
.search-wrap svg{width:14px;height:14px;color:var(--text-tertiary);flex-shrink:0}
.search-input{flex:1;border:none;background:none;font-size:var(--font-xs);margin-left:6px;color:var(--text);height:36px}
.search-input::placeholder{color:var(--text-tertiary)}

/* ═══ Fence Card ═══ */
.fence-list{padding:0 16px 16px}
.fence-card{background:linear-gradient(180deg,#fff,#f8fbff);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow-sm);transition:box-shadow var(--fast)}
.fence-card:active{box-shadow:var(--shadow-md)}
.fence-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.fence-id{font-size:var(--font-sm);font-weight:var(--fw-heavy);color:var(--blue)}
.fence-card-title{font-size:var(--font-md);font-weight:var(--fw-medium);margin-bottom:3px;line-height:1.4}
.fence-card-subtitle{font-size:var(--font-xs);color:var(--text-sub);display:flex;align-items:center;margin-bottom:4px}
.fence-card-tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{display:inline-block;font-size:10px;font-weight:var(--fw-medium);padding:3px 8px;border-radius:999px}
.tag-setting{background:rgba(23,178,106,0.12);color:var(--green)}
.tag-removing{background:rgba(245,180,0,0.12);color:var(--yellow)}
.tag-overdue{background:rgba(229,72,77,0.12);color:var(--red)}
.tag-removed{background:rgba(15,91,216,0.12);color:var(--blue)}
.tag-issue{background:transparent;border:1px solid;padding:2px 7px;font-weight:var(--fw-regular)}
.tag-issue--normal{border-color:var(--gray-300);color:var(--gray-500)}
.tag-issue--pending{border-color:rgba(245,180,0,0.35);color:var(--yellow)}
.tag-issue--overdue{border-color:rgba(229,72,77,0.35);color:var(--red)}

/* ═══ Detail Tabs ═══ */
.detail-tabs{display:flex;flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--border);overflow-x:auto}
.detail-tabs::-webkit-scrollbar{display:none}
.detail-tab{flex:1;min-width:0;padding:10px 0;text-align:center;font-size:var(--font-sm);color:var(--text-sub);font-weight:var(--fw-medium);position:relative;white-space:nowrap;cursor:pointer}
.detail-tab.active{color:var(--blue);font-weight:var(--fw-heavy)}
.detail-tab.active::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:2.5px;background:var(--blue);border-radius:2px}

/* ═══ Detail Content ═══ */
.detail-content{padding:12px 16px 20px}
.detail-section{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.detail-section-title{font-size:var(--font-md);font-weight:var(--fw-heavy);padding:12px 14px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
.detail-section-title::before{content:'';width:3px;height:14px;background:var(--blue);border-radius:2px}
.detail-fields{padding:8px 14px 12px}
.detail-field{display:flex;padding:5px 0;font-size:var(--font-sm)}
.detail-field-label{color:var(--text-sub);min-width:110px;flex-shrink:0}
.detail-field-value{color:var(--text);word-break:break-all}
.detail-sub-title{font-size:var(--font-sm);font-weight:var(--fw-heavy);padding:10px 0 4px;display:flex;align-items:center;gap:4px}
.detail-sub-title::before{content:'';width:3px;height:12px;background:var(--blue);border-radius:2px}
.detail-summary{display:flex;flex-direction:column;gap:4px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border)}
.detail-summary-top{display:flex;align-items:center;gap:6px;min-width:0}
.detail-summary-id{font-size:var(--font-sm);font-weight:var(--fw-heavy);color:var(--blue);min-width:0}
.detail-summary-tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* ═══ Map (SVG-based) ═══ */
.map-placeholder{height:200px;background:#E8E4D8;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-tertiary);gap:6px;border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden;position:relative}
.map-legend{display:flex;gap:12px;padding:4px 10px;font-size:var(--font-xs);color:var(--text-sub);background:rgba(255,255,255,0.92);border-radius:var(--radius-sm);position:absolute;top:8px;left:8px;z-index:2;box-shadow:var(--shadow-sm)}
.map-legend-item{display:flex;align-items:center;gap:4px}
.map-legend-line{display:inline-block;width:16px;height:2px;border-radius:1px}
.map-legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%}
.map-address-bar{position:absolute;bottom:28px;left:0;right:0;display:flex;align-items:center;gap:4px;padding:6px 12px;background:linear-gradient(transparent,rgba(0,0,0,0.45));color:#fff;font-size:var(--font-xs);z-index:2}
.map-info-bar{position:absolute;bottom:8px;left:8px;right:8px;display:flex;align-items:center;justify-content:center;padding:4px 10px;font-size:var(--font-xs);color:var(--text-sub);background:rgba(255,255,255,0.92);z-index:2;border-radius:var(--radius-sm);box-shadow:var(--shadow-sm)}

/* ═══ Project Card ═══ */
.proj-card{background:var(--panel-2);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:10px;border:1px solid var(--border)}
.proj-card-header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--blue-50)}
.proj-card-icon{width:24px;height:24px;border-radius:var(--radius-sm);background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:var(--font-xs);font-weight:var(--fw-heavy)}
.proj-card-name{flex:1;font-size:var(--font-sm);font-weight:var(--fw-heavy);color:var(--blue-deep)}
.proj-card-count{font-size:var(--font-xs);color:var(--text-sub)}
.eng-sub{border-top:1px solid var(--border)}
.eng-sub-header{display:flex;align-items:center;gap:6px;padding:8px 12px;cursor:pointer}
.eng-sub-header:active{background:var(--gray-100)}
.eng-sub-toggle{font-size:10px;color:var(--text-sub);transition:transform var(--fast)}
.eng-sub.expanded .eng-sub-toggle{transform:rotate(90deg)}
.eng-sub-name{flex:1;font-size:var(--font-sm);font-weight:var(--fw-heavy);padding-left:8px;position:relative}
.eng-sub-name::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:12px;background:var(--blue);border-radius:2px}
.eng-sub-body{display:none;padding:8px 14px 12px;background:var(--panel-2)}
.eng-sub.expanded .eng-sub-body{display:block}
.eng-field-row{display:flex;font-size:var(--font-xs);padding:3px 0;line-height:1.5}
.eng-field-label{color:var(--text-sub);white-space:nowrap;min-width:80px}
.eng-field-value{color:var(--text);word-break:break-all}

/* ═══ Patrol ═══ */
.patrol-stat{padding:10px 0;font-size:var(--font-xs);color:var(--text-sub)}
.patrol-stat strong{color:var(--blue)}
.patrol-day-header{font-size:var(--font-sm);font-weight:var(--fw-heavy);padding:8px 0 6px;display:flex;align-items:center;gap:8px}
.patrol-day-header::after{content:'';flex:1;height:1px;background:var(--gray-200)}
.patrol-day-count{font-size:var(--font-xs);color:var(--text-sub);font-weight:var(--fw-regular)}
.patrol-card{background:var(--panel);border-radius:var(--radius-lg);border:1px solid var(--border);overflow:hidden;margin-bottom:10px;box-shadow:var(--shadow-sm)}
.patrol-card-body{display:flex;gap:10px;padding:12px}
.patrol-thumb{width:80px;height:60px;border-radius:var(--radius-md);flex-shrink:0;overflow:hidden;position:relative;cursor:pointer;background:linear-gradient(135deg,var(--blue-100),var(--blue-200))}
.patrol-thumb img{width:100%;height:100%;object-fit:cover}
.patrol-thumb-icon{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.patrol-thumb-icon svg{width:20px;height:20px;color:var(--blue);opacity:0.7}
.patrol-thumb-label{font-size:9px;color:var(--blue-deep);font-weight:var(--fw-heavy);background:rgba(24,98,212,0.15);padding:1px 6px;border-radius:3px;margin-top:2px}
.patrol-thumb-time{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:9px;color:rgba(0,0,0,0.45)}
.patrol-info{flex:1;min-width:0}
.patrol-person{font-size:var(--font-sm);font-weight:var(--fw-medium);margin-bottom:2px}
.patrol-unit{font-size:var(--font-xs);color:var(--text-sub);margin-bottom:2px}
.patrol-location{font-size:var(--font-xs);color:var(--text-sub);display:flex;align-items:center;gap:3px}
.patrol-location svg{width:10px;height:10px;flex-shrink:0}
.patrol-issue-bar{background:var(--yellow-light);padding:6px 12px;font-size:var(--font-xs);color:#9E6600;font-weight:var(--fw-medium);display:flex;align-items:center;gap:4px}
.patrol-issue-bar svg{width:12px;height:12px;flex-shrink:0}
.patrol-card-actions{display:flex;border-top:1px solid var(--border)}
.patrol-action-btn{flex:1;padding:8px;text-align:center;font-size:var(--font-xs);color:var(--blue);font-weight:var(--fw-medium);transition:background var(--fast)}
.patrol-action-btn:active{background:var(--gray-50)}
.patrol-action-btn+.patrol-action-btn{border-left:1px solid var(--border)}
.segmented{display:flex;background:var(--gray-100);border-radius:var(--radius-md);padding:2px;margin-bottom:10px}
.segmented-btn{flex:1;padding:6px 0;text-align:center;font-size:var(--font-sm);color:var(--text-sub);font-weight:var(--fw-medium);border-radius:6px;transition:all var(--fast);cursor:pointer}
.segmented-btn.active{background:var(--panel);color:var(--text);box-shadow:var(--shadow-sm)}

/* ═══ Timeline ═══ */
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--gray-200)}
.timeline-item{position:relative;margin-bottom:20px}
.timeline-item:last-child{margin-bottom:0}
.timeline-dot{position:absolute;left:-24px;top:6px;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.timeline-dot.verify{background:var(--blue-50);border:2px solid var(--blue)}
.timeline-dot.change{background:var(--yellow-light);border:2px solid var(--yellow)}
.timeline-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm)}
.timeline-card-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--panel-2);border-bottom:1px solid var(--border)}
.timeline-time{font-size:var(--font-xs);font-weight:var(--fw-heavy)}
.timeline-role{font-size:10px;padding:2px 8px;border-radius:999px;font-weight:var(--fw-medium)}
.timeline-role.verify-role{background:var(--blue-50);color:var(--blue)}
.timeline-role.change-role{background:var(--yellow-light);color:#9E6600}
.timeline-card-body{padding:10px 12px}
.timeline-person{font-size:var(--font-xs);color:var(--text-sub);margin-bottom:4px}
.timeline-field{display:flex;align-items:baseline;gap:4px;padding:4px 0;font-size:var(--font-xs);flex-wrap:wrap}
.timeline-field-label{color:var(--text-sub);white-space:nowrap;min-width:60px}
.timeline-field-old{color:var(--text-tertiary);text-decoration:line-through;background:var(--red-light);padding:1px 4px;border-radius:2px}
.timeline-field-arrow{color:var(--text-tertiary)}
.timeline-field-new{color:var(--blue-deep);font-weight:var(--fw-medium);background:var(--blue-50);padding:1px 4px;border-radius:2px}
.timeline-field-map{color:var(--text-sub);font-size:var(--font-xs);display:flex;align-items:center;gap:3px;background:var(--gray-100);padding:1px 4px;border-radius:2px}

/* ═══ Verify Screen ═══ */
.verify-section{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.verify-section-title{font-size:var(--font-md);font-weight:var(--fw-heavy);padding:10px 14px 6px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
.verify-section-title::before{content:'';width:3px;height:14px;background:var(--blue);border-radius:2px}
.verify-field{display:flex;align-items:center;padding:8px 14px;font-size:var(--font-sm);border-bottom:1px solid var(--border)}
.verify-field:last-child{border-bottom:none}
.verify-field-label{color:var(--text-sub);min-width:110px;flex-shrink:0}
.verify-field-old{color:var(--text-tertiary);text-decoration:line-through;background:var(--red-light);padding:1px 4px;border-radius:2px;font-size:var(--font-xs);margin-right:4px}
.verify-field-new{color:var(--text);font-weight:var(--fw-medium)}
.verify-field-input{flex:1;height:32px;padding:0 8px;border:1px solid var(--gray-300);border-radius:var(--radius-md);font-size:var(--font-sm);color:var(--text)}
.verify-field-input:focus{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-50)}
.verify-field.full{flex-direction:column;gap:4px}
.verify-map-compare{display:flex;align-items:center;gap:4px;font-size:var(--font-xs);color:var(--text-sub)}
.verify-footer{position:sticky;bottom:0;display:flex;gap:10px;padding:10px 16px 28px;background:var(--panel);border-top:1px solid var(--border)}

/* ═══ Panorama Viewer ═══ */
.pano-viewer{position:relative;width:100%;height:240px;background:#1a1a2e;border-radius:var(--radius-lg);overflow:hidden;margin-bottom:12px}
.pano-viewer-inner{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.5);font-size:var(--font-sm)}
.pano-viewer-overlay{position:absolute;inset:0;background:radial-gradient(circle at 30% 40%,rgba(24,98,212,0.15),transparent 60%),radial-gradient(circle at 70% 60%,rgba(23,178,106,0.1),transparent 50%)}
.pano-cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24px;height:24px;border:2px solid rgba(255,255,255,0.6);border-radius:50%;pointer-events:none;z-index:4}
.pano-top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:5}
.pano-pill{height:28px;padding:0 10px;border-radius:14px;border:1px solid rgba(255,255,255,0.2);background:rgba(0,0,0,0.4);color:#fff;font-size:var(--font-xs);display:flex;align-items:center;gap:4px;backdrop-filter:blur(4px)}
.pano-thumbs{position:absolute;bottom:8px;left:8px;right:8px;display:flex;gap:6px;overflow-x:auto;z-index:5}
.pano-thumbs::-webkit-scrollbar{display:none}
.pano-thumb-item{width:60px;height:42px;border-radius:var(--radius-sm);border:2px solid rgba(255,255,255,0.3);flex-shrink:0;overflow:hidden;position:relative;background:linear-gradient(135deg,var(--blue-100),var(--blue-200))}
.pano-thumb-item.active{border-color:var(--blue);box-shadow:0 0 0 2px rgba(24,144,255,0.35)}
.pano-thumb-item span{position:absolute;left:0;right:0;bottom:0;font-size:9px;text-align:center;background:rgba(0,0,0,0.5);color:#fff;padding:1px 0}

/* ═══ Map Overview Screen ═══ */
.map-overview{position:relative;width:100%;height:calc(100% - 44px);background:#E8E4D8;overflow:hidden}
.map-overview-legend{position:absolute;top:10px;right:10px;background:rgba(255,255,255,0.94);padding:8px 10px;border-radius:var(--radius-md);font-size:var(--font-xs);box-shadow:var(--shadow-md);display:flex;flex-direction:column;gap:4px;z-index:10}
.map-overview-list{position:absolute;bottom:0;left:0;right:0;background:var(--panel);border-radius:16px 16px 0 0;padding:12px 16px;max-height:40%;overflow-y:auto;box-shadow:0 -4px 16px rgba(0,0,0,0.08);z-index:10}
.map-overview-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer}
.map-overview-item:last-child{border-bottom:none}
.map-overview-item:active{background:var(--gray-50)}
.map-overview-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.map-overview-info{flex:1;min-width:0}
.map-overview-id{font-size:var(--font-sm);font-weight:var(--fw-heavy)}
.map-overview-addr{font-size:var(--font-xs);color:var(--text-sub);margin-top:1px}
.map-overview-tags{display:flex;gap:4px;margin-top:3px}

/* ═══ Modal ═══ */
.modal-overlay{position:absolute;top:0;left:0;right:0;bottom:0;z-index:200;background:rgba(0,0,0,0.45);display:none;align-items:flex-end}
.modal-overlay.show{display:flex}
.modal-sheet{width:100%;max-height:90%;background:var(--panel);border-radius:16px 16px 0 0;overflow-y:auto;animation:slideUp 0.3s cubic-bezier(0.4,0,0.2,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:36px;height:4px;background:var(--gray-300);border-radius:2px;margin:8px auto 0}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--border)}
.modal-title{font-size:var(--font-lg);font-weight:var(--fw-heavy)}
.modal-close{width:28px;height:28px;border-radius:50%;background:var(--gray-100);display:flex;align-items:center;justify-content:center;color:var(--text-sub)}
.modal-body{padding:16px}
.modal-footer{display:flex;gap:10px;padding:12px 16px 28px;border-top:1px solid var(--border)}
.btn-cancel{flex:1;height:40px;border-radius:var(--radius-md);background:var(--gray-100);color:var(--text-sub);font-size:var(--font-md);font-weight:var(--fw-medium)}
.btn-cancel:active{background:var(--gray-200)}
.btn-submit{flex:1;height:40px;border-radius:var(--radius-md);background:var(--blue);color:white;font-size:var(--font-md);font-weight:var(--fw-medium);box-shadow:0 2px 6px rgba(24,98,212,0.25)}
.btn-submit:active{background:var(--blue-deep)}
.form-textarea-mobile{width:100%;min-height:80px;padding:10px 12px;border:1px solid var(--gray-300);border-radius:var(--radius-md);font-size:var(--font-md);color:var(--text);background:var(--panel);resize:vertical}
.form-textarea-mobile:focus{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-50)}

/* ═══ Toast ═══ */
.toast{position:absolute;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(0,0,0,0.75);color:white;padding:8px 20px;border-radius:20px;font-size:var(--font-sm);z-index:500;opacity:0;transition:all 0.3s ease;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ═══ Empty State ═══ */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;color:var(--text-sub)}
.empty-state svg{width:40px;height:40px;opacity:0.3;margin-bottom:10px}
.empty-state span{font-size:var(--font-sm)}

@media(max-width:420px){.phone-frame{width:100%;height:100%;margin:0;border-radius:0;box-shadow:none}.phone-notch,.phone-home-indicator{display:none}}
</style>

</head>
<body>
<div class="phone-frame" id="phoneFrame">
  <div class="phone-notch"></div>
  <div class="phone-home-indicator"></div>
  <div class="toast" id="toast"></div>

  <!-- Screen 1: 工作台 -->
  <div class="screen active" id="screenHome">
    <div class="screen-body" id="workbenchBody"></div>
  </div>

  <!-- Screen 2: 围挡详情 -->
  <div class="screen" id="screenDetail">
    <div class="nav-bar">
      <div class="nav-bar-inner">
        <button class="nav-bar-back" onclick="goBack()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
        <span class="nav-bar-title">围挡详情</span>
        <button class="nav-bar-right" onclick="openVerifyScreen()">校核</button>
      </div>
    </div>
    <div style="padding:8px 16px;background:var(--panel)" id="detailSummary"></div>
    <div class="detail-tabs" id="detailTabs">
      <span class="detail-tab active" data-tab="basic" onclick="switchDetailTab(this)">基本信息</span>
      <span class="detail-tab" data-tab="patrol" onclick="switchDetailTab(this)">巡查记录</span>
      <span class="detail-tab" data-tab="verifyChange" onclick="switchDetailTab(this)">校核变更</span>
    </div>
    <div class="screen-body"><div class="detail-content" id="detailContent"></div></div>
  </div>

  <!-- Screen 2.5: 项目围挡列表 -->
  <div class="screen" id="screenProjectHoards">
    <div class="nav-bar">
      <div class="nav-bar-inner">
        <button class="nav-bar-back" onclick="goBack()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
        <span class="nav-bar-title" id="projHoardsTitle">项目围挡</span>
        <span class="nav-bar-right"></span>
      </div>
    </div>
    <div class="screen-body">
      <div style="height:220px;margin:12px 16px 0;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border)" id="projectMapContainer"></div>
      <div style="display:flex;gap:10px;padding:8px 16px 0;font-size:var(--font-xs)">
        <div style="display:flex;align-items:center;gap:4px"><div style="width:16px;height:2px;background:#D13B2F"></div><span style="color:var(--text-sub)">项目红线</span></div>
        <div style="display:flex;align-items:center;gap:4px"><div style="width:16px;height:0;border-bottom:2px dashed #1862D4"></div><span style="color:var(--text-sub)">围挡范围</span></div>
        <div style="display:flex;align-items:center;gap:4px"><div style="width:8px;height:8px;border-radius:50%;background:#1862D4"></div><span style="color:var(--text-sub)">出入口</span></div>
      </div>
      <div class="section" style="margin-top:8px;padding-bottom:8px">
        <div class="section-head"><span class="section-title">围挡记录</span></div>
        <div class="fence-list" id="projectHoardsList"></div>
      </div>
    </div>
  </div>

  <!-- Screen 3: 校核围挡 -->
  <div class="screen" id="screenVerify">
    <div class="nav-bar">
      <div class="nav-bar-inner">
        <button class="nav-bar-back" onclick="goBack()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
        <span class="nav-bar-title">校核围挡</span>
        <span class="nav-bar-right"></span>
      </div>
    </div>
    <div class="screen-body">
      <div id="verifyContent" style="padding:12px 16px 80px"></div>
      <div class="verify-footer">
        <button class="btn-cancel" onclick="goBack()">取消</button>
        <button class="btn-submit" onclick="submitVerify()">提交校核</button>
      </div>
    </div>
  </div>

  <!-- Screen 4: 地图总览 -->
  <div class="screen" id="screenMapOverview">
    <div class="nav-bar">
      <div class="nav-bar-inner">
        <button class="nav-bar-back" onclick="goBack()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
        <span class="nav-bar-title">围挡总览地图</span>
        <span class="nav-bar-right"></span>
      </div>
    </div>
    <div class="map-overview" id="mapOverviewBody"></div>
  </div>

  <!-- Screen 5: 全景查看 -->
  <div class="screen" id="screenPanorama">
    <div class="nav-bar">
      <div class="nav-bar-inner">
        <button class="nav-bar-back" onclick="goBack()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
        <span class="nav-bar-title">全景查看</span>
        <span class="nav-bar-right"></span>
      </div>
    </div>
    <div class="screen-body" id="panoramaBody"></div>
  </div>

  <!-- Screen 6: 搜索 -->
  <div class="screen" id="screenSearch">
    <div class="nav-bar">
      <div class="nav-bar-inner">
        <button class="nav-bar-back" onclick="goBack()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
        <span class="nav-bar-title">搜索围挡</span>
        <span class="nav-bar-right"></span>
      </div>
    </div>
    <div class="search-bar">
      <div class="search-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input class="search-input" type="text" placeholder="搜索围挡编号、项目名称、地址" id="searchInput" oninput="handleSearch(this.value)"></div>
    </div>
    <div class="screen-body"><div class="fence-list" id="searchResults"></div></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════
   Data from MOCK_DATA (mock-data.js)
   ═══════════════════════════════════════════ */

var STATUS_KEY={ '设置中':'setting','即将到期':'removing','已到期':'removed' };
var STATUS_LABEL={ setting:'设置中',removing:'即将到期',removed:'已到期' };
var ISSUE_KEY={ '正常':'normal','待整改':'pending','整改逾期':'overdue','待审核':'pending','审核通过':'passed','退回整改':'pending' };

// Build fenceData from MOCK_DATA.getHoardings() — the authoritative data source
const fenceData=(function(){
  return MOCK_DATA.getHoardings().map(function(h){
    var stKey=STATUS_KEY[h.fenceStatus]||'setting';
    var issLabel=h.issueStatus||'正常';
    var issKey=ISSUE_KEY[issLabel]||'normal';
    if(stKey==='removed')issKey='overdue';
    return{
      id:h.id,
      project:h.projectName, eng:h.engineerName,
      address:h.address||h.projectAddress,
      status:h.fenceStatus||'设置中', statusKey:stKey,
      issue:issLabel, issueKey:issKey,
      length:h.length||0, height:h.height||2.5,
      material:h.material||'装配式钢结构喷绘围挡',
      fenceStyle:h.fenceStyle||'标准型',
      publicityContent:h.publicityContent||'—',
      roadOccupation:h.roadOccupation||'—',
      roadOccupationArea:(h.roadOccupationArea||0)+' ㎡',
      setupDate:h.setupDate||'—',
      planRemoveDate:h.planRemoveDate||'—',
      custodyLabel:(h.custodyStart||'—')+' ~ '+(h.custodyEnd||'—'),
      fenceResponsible:h.fenceResponsible||'—',
      fenceResponsiblePhone:h.fenceResponsiblePhone||'—',
      street:h.projectStreet||'—', district:h.projectDistrict||'—',
      needVerify:h.needVerify||'',
      unitName:h.constructUnit||'—',
      entrances:(h.entrances||[]).length,
      buildUnit:h.buildUnit||'—', buildContact:h.buildContact||'—',
      constructUnit:h.constructUnit||'—', constructContact:h.constructContact||'—',
      supervisorUnit:h.supervisorUnit||'—',
      regulatorUnit:h.regulatorUnit||'—',
      designUnit:h.designUnit||'—',
      planPeriod:(h.custodyStart||'')+' ~ '+(h.custodyEnd||''),
      engStatus:h.engStatus||'—',
      projectId:h.projectId
    };
  });
})();

// Build projectFenceData — aggregate by project, status priority: 即将到期 > 设置中 > 已到期
var projectFenceData=(function(){
  var map={};
  fenceData.forEach(function(f){
    var key=f.project;
    if(!map[key]){
      map[key]={
        project:f.project,district:f.district,street:f.street,
        hoardings:[],statusSet:{},
        earliestRemoveDate:null
      };
    }
    map[key].hoardings.push(f);
    if(f.statusKey)map[key].statusSet[f.statusKey]=true;
    if(f.planRemoveDate&&f.planRemoveDate!=='—'){
      if(!map[key].earliestRemoveDate||f.planRemoveDate<map[key].earliestRemoveDate){
        map[key].earliestRemoveDate=f.planRemoveDate;
      }
    }
  });
  var statusPriority=['removing','setting','removed'];
  var statusLabel={'removing':'即将到期','setting':'设置中','removed':'已到期'};
  var result=[];
  Object.keys(map).forEach(function(k){
    var entry=map[k];
    var aggStatus='setting';
    for(var i=0;i<statusPriority.length;i++){
      if(entry.statusSet[statusPriority[i]]){aggStatus=statusPriority[i];break;}
    }
    entry.aggStatusKey=aggStatus;
    entry.aggStatusLabel=statusLabel[aggStatus]||'设置中';
    entry.hoardingCount=entry.hoardings.length;
    entry.removeDate=entry.earliestRemoveDate||'—';
    result.push(entry);
  });
  return result;
})();

// Build overviewData from fenceData
const overviewData=(function(){
  var total=1286;
  var issue=fenceData.filter(function(f){return f.issueKey==='pending'||f.issueKey==='overdue'}).length;
  var overdue=fenceData.filter(function(f){return f.statusKey==='removed'}).length;
  var removing=fenceData.filter(function(f){return f.statusKey==='removing'}).length;
  var setting=fenceData.filter(function(f){return f.statusKey==='setting'}).length;
  var removed=fenceData.filter(function(f){return f.statusKey==='removed'}).length;
  var pendingVerify=Math.max(1,Math.floor(total*0.03));
  var pendingReview=Math.max(1,Math.floor(total*0.02));
  var pendingRectify=Math.floor(total*0.044);
  var rectOverdue=Math.floor(total*0.025);
  var rate=total>0?Math.round((1-issue/total)*100)+'%':'100%';
  return{total:total,issue:issue,overdue:overdue,removing:removing,
    todo:pendingVerify+pendingReview,rectified:issue,pendingRectify:pendingRectify,rectOverdue:rectOverdue,
    removed:removed,setting:setting,rate:rate,
    pendingVerify:pendingVerify,pendingReview:pendingReview};
})();

const todoData=(function(){
  var verifyItems=fenceData.filter(function(f){return f.needVerify==='是'}).slice(0,4).map(function(f){
    return{id:f.id,name:f.project+' · '+f.eng};
  });
  var reviewItems=fenceData.filter(function(f){return f.issueKey==='pending'||f.issueKey==='overdue'}).slice(0,2).map(function(f){
    return{id:f.id,name:f.project+' · '+f.eng};
  });
  if(!verifyItems.length)verifyItems=fenceData.slice(0,2).map(function(f){return{id:f.id,name:f.project+' · '+f.eng};});
  return[
    {type:'verify',title:'待校核围挡',count:verifyItems.length,desc:verifyItems.length+'条围挡信息待校核',icon:'verify',items:verifyItems},
    {type:'review',title:'整改审核',count:reviewItems.length,desc:reviewItems.length+'条整改待审核',icon:'review',items:reviewItems}
  ];
})();

// Patrol data from MOCK_DATA
const patrolData=(function(){
  var pd={};
  var allIssues = (typeof MOCK_DATA !== 'undefined' && MOCK_DATA.getStreetIssues) ? MOCK_DATA.getStreetIssues() : [];
  fenceData.forEach(function(f){
    var hoard=MOCK_DATA.findHoard(f.id);
    if(!hoard||!hoard.patrolRecords||!hoard.patrolRecords.length)return;
    var records=hoard.patrolRecords;
    var daysMap={};
    records.forEach(function(r){
      var dateStr=r.date||'2026-05-14';
      var parts=dateStr.split('-');
      var dayLabel=parts[1]+'月'+parts[2]+'日';
      var d=new Date(dateStr);
      var weekdays=['日','一','二','三','四','五','六'];
      if(!daysMap[dayLabel]){
        daysMap[dayLabel]={date:dayLabel,weekday:'星期'+weekdays[d.getDay()],records:[]};
      }
      var hasIssue = r.result==='异常'||r.result==='有问题';
      var matchedIssue = null;
      if(hasIssue){
        for(var mi=0; mi<allIssues.length; mi++){
          if(allIssues[mi].fenceId === f.id && allIssues[mi].source === '项目巡检'){ matchedIssue = allIssues[mi]; break; }
        }
      }
      daysMap[dayLabel].records.push({
        time:r.time||'09:00',person:r.inspector,unit:hoard.constructUnit||'',location:hoard.address||'',
        hasIssue:hasIssue,
        issueType:matchedIssue?matchedIssue.type:'—',
        issueLoc:matchedIssue&&matchedIssue.location?(matchedIssue.location.addr||matchedIssue.location.lat+', '+matchedIssue.location.lng):'—',
        issueDesc:r.issues&&r.issues.length>0?r.issues.join('、'):'',
        panoSrc:r.panoramaSrc||'alma',
        panoScenes:[{name:'全景',src:r.panoramaSrc||'alma'}]
      });
    });
    // Enrich with issue type/location from YZY issues
    var allIssues = MOCK_DATA.getStreetIssues();
    var enrichedDays = Object.values(daysMap);
    enrichedDays.forEach(function(day){
      day.records.forEach(function(rec){
        if(rec.hasIssue){
          var matched = null;
          for(var mi=0; mi<allIssues.length; mi++){
            if(allIssues[mi].fenceId === f.id && allIssues[mi].source === '项目巡检'){ matched = allIssues[mi]; break; }
          }
          rec.issueType = matched ? matched.type : '—';
          rec.issueLoc = matched && matched.location ? (matched.location.addr || matched.location.lat+', '+matched.location.lng) : '—';
        }
      });
    });
    pd[f.id]={monthCount:records.length,totalPhotos:records.length*3,engName:f.eng,days:enrichedDays};
  });
  return pd;
})();

// Verify records from MOCK_DATA
const verifyRecords=(function(){
  var vr={};
  fenceData.forEach(function(f){
    var hoard=MOCK_DATA.findHoard(f.id);
    if(!hoard||!hoard.verifyRecords||!hoard.verifyRecords.length)return;
    vr[f.id]=hoard.verifyRecords.map(function(r){

let screenStack=['screenHome'];
function showScreen(id,addToStack){
  var current=document.querySelector('.screen.active');
  var target=document.getElementById(id);
  if(addToStack!==false)screenStack.push(id);
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active','behind')});
  if(current&&current!==target)current.classList.add('behind');
  target.classList.add('active');
}
function goBack(){
  screenStack.pop();
  var prev=screenStack[screenStack.length-1]||'screenHome';
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active','behind')});
  document.getElementById(prev).classList.add('active');
}

function initProjectMap(projEntry){
  var el=document.getElementById('projectMapContainer');if(!el)return;
  if(projectMap){projectMap.remove();projectMap=null;}
  projectMap=L.map(el,{zoomControl:false,attributionControl:false});
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:18}).addTo(projectMap);

  var projects=MOCK_DATA.getProjects();
  var proj=null;
  projects.forEach(function(p){if(p.name===projEntry.project)proj=p;});
  var allLayers=[];

  // Project redline
  if(proj&&proj.redlineGeo&&proj.redlineGeo.length>0){
    var rl=proj.redlineGeo.map(function(p){return[p[0],p[1]];});
    var rlLayer=L.polygon(rl,{color:'#D13B2F',weight:2,fill:false}).addTo(projectMap);
    allLayers.push(rlLayer);
    projectMap.setView([proj.lat,proj.lng],15);
  }

  // All hoardings' gpsShape
  projEntry.hoardings.forEach(function(f){
    var hoard=MOCK_DATA.findHoard(f.id);
    if(!hoard||!hoard.gpsShape||!hoard.gpsShape.length)return;
    var fs=hoard.gpsShape.map(function(p){return[p[0],p[1]];});
    var fl=L.polygon(fs,{color:'#1862D4',weight:2,dashArray:'6 4',fillColor:'rgba(24,98,212,0.10)',fillOpacity:1}).addTo(projectMap);
    allLayers.push(fl);
    if(hoard.entrances){
      hoard.entrances.forEach(function(e){
        var mk=L.circleMarker([e.lat,e.lng],{radius:5,color:'#1862D4',fillColor:'#1862D4',fillOpacity:1,weight:2}).addTo(projectMap);
        allLayers.push(mk);
      });
    }
  });

  if(allLayers.length>0){
    var group=L.featureGroup(allLayers);
    try{projectMap.fitBounds(group.getBounds(),{padding:[30,30]});}catch(e){}
  }else if(proj){
    projectMap.setView([proj.lat,proj.lng],15);
  }else{
    projectMap.setView([22.548,114.061],15);
  }
}

var detailMap=null;
function initDetailMap(f){
  var el=document.getElementById('detailMapContainer');
  if(!el)return;
  if(detailMap){detailMap.remove();detailMap=null;}
  detailMap=L.map(el,{zoomControl:false,attributionControl:false});
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:18}).addTo(detailMap);

  // Get GPS data from mock — findHoard returns enriched hoard with projectId
  var hoard=MOCK_DATA.findHoard(f.id);

  // Find project via hoard.projectId (SD+MOCK fence-to-project mapping differs)
  var projects=MOCK_DATA.getProjects();
  var proj=null;
  if(hoard&&hoard.projectId){
    projects.forEach(function(p){if(p.id===hoard.projectId)proj=p;});
  }

  // Build combined layer group for fitBounds
  var allLayers=[];

  // ── Project redline ──
  if(proj&&proj.redlineGeo&&proj.redlineGeo.length>0){
    var rl=proj.redlineGeo.map(function(p){return[p[0],p[1]];});
    var redlineLayer=L.polygon(rl,{color:'#D13B2F',weight:2,fill:false}).addTo(detailMap);
    allLayers.push(redlineLayer);
  }

  // ── Fence range (gpsShape) ──
  if(hoard&&hoard.gpsShape&&hoard.gpsShape.length>0){
    var fs=hoard.gpsShape.map(function(p){return[p[0],p[1]];});
    var fenceLayer=L.polygon(fs,{color:'#1862D4',weight:2,dashArray:'6 4',fillColor:'rgba(24,98,212,0.10)',fillOpacity:1}).addTo(detailMap);
    allLayers.push(fenceLayer);
  }

  // ── Entrance markers (this fence) ──
  if(hoard&&hoard.entrances){
    hoard.entrances.forEach(function(e){
      var mk=L.circleMarker([e.lat,e.lng],{radius:5,color:'#1862D4',fillColor:'#1862D4',fillOpacity:1,weight:2})
        .bindTooltip(e.name||'出入口',{direction:'top',offset:[0,-8]})
        .addTo(detailMap);
      allLayers.push(mk);
    });
  }

  // ── Other fence blocks (same project, different fenceId) ──
  if(proj&&proj.hoardings){
    proj.hoardings.forEach(function(h){
      if(h.id===f.id)return;
      if(!h.gpsShape||!h.gpsShape.length)return;
      var ofs=h.gpsShape.map(function(p){return[p[0],p[1]];});
      var otherLayer=L.polygon(ofs,{color:'#3D7FED',weight:1.5,dashArray:'4 3',fillColor:'rgba(61,127,237,0.06)',fillOpacity:1}).addTo(detailMap);
      allLayers.push(otherLayer);
      if(h.entrances){
        h.entrances.forEach(function(e){
          var omk=L.circleMarker([e.lat,e.lng],{radius:4,color:'#3D7FED',fillColor:'#3D7FED',fillOpacity:0.7,weight:1.5}).addTo(detailMap);
          allLayers.push(omk);
        });
      }
    });
  }

  // ── Fit bounds (cover redline + all fence shapes) ──
  if(allLayers.length>0){
    var group=L.featureGroup(allLayers);
    try{detailMap.fitBounds(group.getBounds(),{padding:[30,30]});}catch(e){}
  }else if(proj){
    detailMap.setView([proj.lat,proj.lng],15);
  }else{
    detailMap.setView([22.548,114.061],15);
  }
}

            '<div class="patrol-card-actions"><span class="patrol-action-btn" onclick="openPanorama(\''+r.panoSrc+'\',\''+r.time+'\',this.getAttribute(\'data-pano\'))" data-pano=\''+panoData+'\'>查看全景</span></div></div>';
        }).join('');
    }).join('');
    c.innerHTML=html;
  }
  else if(tab==='verifyChange'){
    var vr=verifyRecords[f.id]||[];
    var cr=changeRecords[f.id]||[];
    // Merge both timelines, sorted by time descending
    var merged=vr.concat(cr);
    merged.sort(function(a,b){return a.time>b.time?-1:a.time<b.time?1:0});
    if(!merged.length){c.innerHTML='<div class="empty-state"><span>暂无校核变更记录</span></div>';return}
    c.innerHTML=buildTimeline(merged);
  }
}

function df2(l,v){return v?'<div class="eng-field-row"><span class="eng-field-label">'+l+'：</span><span class="eng-field-value">'+v+'</span></div>':''}

function buildTimeline(records){
  return '<div class="timeline">'+records.map(function(v){
    return '<div class="timeline-item"><div class="timeline-dot '+v.type+'">'+
      (v.type==='verify'?'<svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="var(--blue)" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>':'<svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="var(--yellow)" stroke-width="3"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>')+
      '</div><div class="timeline-card"><div class="timeline-card-header"><div><span class="timeline-time">'+v.time+'</span></div><span class="timeline-role '+(v.type==='verify'?'verify-role':'change-role')+'">'+v.role+'</span></div>'+
      '<div class="timeline-card-body"><div class="timeline-person">'+v.person+'</div>'+
      v.fields.map(function(fl){
        if(fl.old==='（地图对比）'&&fl.new==='（地图对比）')return '<div class="timeline-field"><span class="timeline-field-label">'+fl.label+'</span><span class="timeline-field-map"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg> 围挡范围地图变更</span></div>';
        return '<div class="timeline-field"><span class="timeline-field-label">'+fl.label+'</span><span class="timeline-field-old">'+fl.old+'</span><span class="timeline-field-arrow">→</span><span class="timeline-field-new">'+fl.new+'</span></div>';
      }).join('')+
      '</div></div></div>';
  }).join('')+'</div>';
}

/* ═══════════════════════════════════════════
   Map Overview
   ═══════════════════════════════════════════ */
function renderMapOverview(){
  // Color by aggregate status
  var colors={setting:'#17b26a',removing:'#f5b400',removed:'#1862D4'};
  // Build full-screen map with bottom sheet
  var html='';
  html+='<div style="position:absolute;inset:0" id="mapOverviewMap"></div>'+
    '<div class="map-overview-legend"><div class="map-legend-item"><span class="map-legend-dot" style="background:#17b26a"></span>设置中</div><div class="map-legend-item"><span class="map-legend-dot" style="background:#f5b400"></span>即将到期</div><div class="map-legend-item"><span class="map-legend-dot" style="background:#1862D4"></span>已到期</div></div>'+
    '<div class="map-overview-list"><div style="font-size:var(--font-md);font-weight:var(--fw-heavy);margin-bottom:8px">辖区围挡 · '+projectFenceData.length+'个项目</div>';

  // Project cards in bottom sheet
  projectFenceData.forEach(function(p,i){
    var col=colors[p.aggStatusKey]||'#1862D4';
    html+='<div class="map-overview-item" onclick="openProjectHoards('+i+')">'+
      '<div class="map-overview-dot" style="background:'+col+'"></div>'+
      '<div class="map-overview-info"><div class="map-overview-id">'+p.project+'</div>'+
      '<div class="map-overview-addr">'+p.removeDate+' · '+p.street+'</div>'+
      '<div class="map-overview-tags"><span class="tag '+(p.aggStatusKey==='setting'?'tag-setting':p.aggStatusKey==='removed'?'tag-overdue':'tag-removing')+'">'+p.aggStatusLabel+'</span><span class="tag tag-default" style="margin-left:4px">'+p.hoardingCount+'条围挡</span></div>'+
      '</div></div>';
  });
  html+='</div>';
  document.getElementById('mapOverviewBody').innerHTML=html;

  // Init Leaflet map with all project redlines + fence shapes
  setTimeout(function(){
    var el=document.getElementById('mapOverviewMap');if(!el)return;
    var overviewMap=L.map(el,{zoomControl:false,attributionControl:false});
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:18}).addTo(overviewMap);
    var allLayers=[];
    var projects=MOCK_DATA.getProjects();
    projects.forEach(function(proj){
      // Project redline
      if(proj.redlineGeo&&proj.redlineGeo.length>0){
        var rl=proj.redlineGeo.map(function(p){return[p[0],p[1]];});
        allLayers.push(L.polygon(rl,{color:'#D13B2F',weight:2,fill:false}).addTo(overviewMap));
      }
      // Fence shapes
      (proj.hoardings||[]).forEach(function(h){
        if(!h.gpsShape||!h.gpsShape.length)return;
        var fs=h.gpsShape.map(function(p){return[p[0],p[1]];});
        allLayers.push(L.polygon(fs,{color:'#1862D4',weight:1.5,dashArray:'5 3',fillColor:'rgba(24,98,212,0.08)',fillOpacity:1}).addTo(overviewMap));
        if(h.entrances){
          h.entrances.forEach(function(e){
            allLayers.push(L.circleMarker([e.lat,e.lng],{radius:3,color:'#1862D4',fillColor:'#1862D4',fillOpacity:1,weight:1}).addTo(overviewMap));
          });
        }
      });
    });
    if(allLayers.length>0){
      var group=L.featureGroup(allLayers);
      try{overviewMap.fitBounds(group.getBounds(),{padding:[20,20]});}catch(e){}
    }else{
      overviewMap.setView([22.548,114.061],13);
    }
  },100);
}

/* ═══════════════════════════════════════════
   Panorama Viewer
   ═══════════════════════════════════════════ */
var currentPanoScenes=[];
function openPanorama(src,time,scenesData){
  try{currentPanoScenes=JSON.parse(decodeURIComponent(scenesData))}catch(e){currentPanoScenes=[{name:'全景',src:src}]}
  renderPanorama(src,time,0);
  showScreen('screenPanorama');
}

function renderPanorama(src,time,activeIdx){
  var html='<div class="pano-viewer"><div class="pano-viewer-overlay"></div>'+
    '<div class="pano-cross"></div>'+
    '<div class="pano-top"><span class="pano-pill"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg> '+time+'</span><span class="pano-pill">场景 '+(activeIdx+1)+'/'+currentPanoScenes.length+'</span></div>'+
    '<div class="pano-viewer-inner" style="background:url(\'https://pannellum.org/images/'+src+'.jpg\') center/cover"></div>'+
    '<div class="pano-thumbs">';
  currentPanoScenes.forEach(function(s,i){
    html+='<div class="pano-thumb-item'+(i===activeIdx?' active':'')+'" onclick="renderPanorama(\''+s.src+'\',\''+time+'\','+i+')"><span>'+s.name+'</span></div>';
  });
  html+='</div></div>';
  html+='<div class="detail-section" style="margin-top:0"><div class="detail-section-title">场景信息</div><div class="detail-fields">'+
    df('拍摄时间',time)+df('场景名称',currentPanoScenes[activeIdx]?currentPanoScenes[activeIdx].name:'-')+
    df('场景数',currentPanoScenes.length+'个')+
  '</div></div>';
  document.getElementById('panoramaBody').innerHTML=html;
}

function openTodoModal(type){
  if(type==='verify'){verifyFence=fenceData[0];renderVerifyContent();showScreen('screenVerify')}
  else{showToast('整改审核页面开发中')}
}

function handleSearch(keyword){
  var list=document.getElementById('searchResults');
  if(!keyword.trim()){list.innerHTML='<div class="empty-state"><span>输入关键词搜索围挡</span></div>';return}
  var kw=keyword.toLowerCase();
  var filtered=fenceData.filter(function(f){return f.id.toLowerCase().indexOf(kw)!==-1||f.project.toLowerCase().indexOf(kw)!==-1||f.address.toLowerCase().indexOf(kw)!==-1});
  if(!filtered.length){list.innerHTML='<div class="empty-state"><span>未找到匹配围挡</span></div>';return}
  var sm={setting:'tag-setting',removing:'tag-removing',removed:'tag-overdue'},im={normal:'tag-issue tag-issue--normal',pending:'tag-issue tag-issue--pending',overdue:'tag-issue tag-issue--overdue'};
  list.innerHTML=filtered.map(function(f){
    var nv=f.needVerify==='是'?'<span class="tag" style="border:1px solid #C47D00;color:#C47D00;font-size:10px;padding:0 5px;border-radius:2px;margin-left:4px;font-weight:var(--fw-medium)">待校核</span>':'';
    return '<div class="fence-card" onclick="openDetailFromProject('+fenceData.indexOf(f)+')"><div class="fence-card-title">'+f.eng+'</div><div class="fence-card-subtitle">'+f.unitName+nv+'</div><div class="fence-card-tags"><span class="tag '+(sm[f.statusKey]||'')+'">'+f.status+'</span><span class="tag '+(im[f.issueKey]||'')+'">'+f.issue+'</span></div></div>';
  }).join('');
}
