<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>全景巡查 - 深圳市建设施工围挡数字化管理系统</title>
<style>
/* ═══ Design Token ═══ */
:root{
  --blue-50:#E9EBFD;--blue-100:#C8CDFA;--blue-200:#A2ADF6;
  --blue-300:#788CF3;--blue-400:#5670F0;--blue-500:#2F55EB;--blue-600:#294CDF;
  --blue-700:#1C41D3;--blue-800:#0A35C7;--blue-900:#0D47A1;
  --blue:var(--blue-500);--blue-deep:var(--blue-700);--blue-soft:var(--blue-50);
  --gray-50:#F9F9F9;--gray-100:#E6E8EA;--gray-200:#C6CACD;
  --gray-300:#A7ABB0;--gray-400:#888D92;--gray-500:#6B7075;--gray-600:#555B61;
  --gray-700:#41464C;--gray-800:#2E3238;--gray-900:#1C1F23;
  --gray-0:#FFFFFF;
  --bg:#F5F7FA;--panel:#FFFFFF;--panel-2:#F9F9F9;
  --green:#3BB346;--green-light:rgba(59,179,70,0.10);
  --yellow:#D0AA00;--yellow-light:rgba(208,170,0,0.10);
  --orange:#FC8800;--orange-light:rgba(252,136,0,0.10);
  --red:#F93920;--red-light:rgba(249,57,32,0.10);
  --text:#555B61;--text-sub:#888D92;--text-tertiary:#A7ABB0;
  --border:#E9F0F7;
  --shadow-sm:0 4px 10px rgba(0,0,0,0.05);
  --radius-sm:2px;--radius-md:4px;
  --font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --font-xs:12px;--font-sm:12px;--font-md:14px;--font-lg:16px;--font-xl:18px;
  --fw-regular:400;--fw-medium:500;--fw-bold:600;--fw-heavy:700;
  --safe-top:47px;--safe-bottom:34px;
  --fast:0.15s ease;--normal:0.25s ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font-family);font-size:var(--font-md);color:var(--text);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased;height:100%;overflow:hidden}
a{color:var(--blue);text-decoration:none}
button{font-family:var(--font-family);cursor:pointer;border:none;background:none}
input{font-family:var(--font-family);outline:none}
/* Phone */
.phone-frame{position:relative;width:390px;height:844px;margin:20px auto;background:var(--bg);border-radius:40px;overflow:hidden;box-shadow:0 0 0 2px #1a1a1a,0 0 0 6px #333,0 0 0 8px #1a1a1a,0 20px 60px rgba(0,0,0,0.3)}
.phone-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#000;border-radius:0 0 20px 20px;z-index:999}
.phone-home-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;background:rgba(0,0,0,0.15);border-radius:3px;z-index:999}
.phone-screen{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
/* Nav */
.nav-bar{flex-shrink:0;padding-top:var(--safe-top);background:var(--panel);border-bottom:1px solid var(--border);z-index:50}
.nav-bar-inner{display:flex;align-items:center;height:44px;padding:0 16px}
.nav-bar-left{width:85px;flex-shrink:0;display:flex;align-items:center}
.nav-bar-title{flex:1;text-align:center;font-size:var(--font-lg);font-weight:var(--fw-heavy);color:var(--text)}
.nav-bar-back{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--blue);border-radius:var(--radius-md)}
.nav-bar-back:active{background:var(--gray-100)}
.nav-bar-right{width:85px;text-align:right;font-size:var(--font-xs);color:var(--blue);font-weight:var(--fw-medium);cursor:pointer;flex-shrink:0;white-space:nowrap}
/* Body */
.screen-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen-body::-webkit-scrollbar{display:none}
/* Summary */
.summary-bar{display:flex;padding:12px 16px;gap:8px}
.summary-item{flex:1;text-align:center;background:var(--panel);border-radius:var(--radius-md);padding:10px 6px;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.summary-val{font-size:20px;font-weight:var(--fw-heavy);color:var(--text)}
.summary-val.green{color:var(--green)}
.summary-val.warn{color:var(--orange)}
.summary-lbl{font-size:var(--font-xs);color:var(--text-sub);margin-top:2px}
/* Tabs + Search */
.filter-bar{display:flex;align-items:center;padding:0 16px 8px;gap:8px}
.filter-tabs{display:flex;gap:0;flex-shrink:0}
.filter-tab{padding:6px 10px;font-size:var(--font-xs);font-weight:var(--fw-medium);color:var(--text-sub);background:var(--panel);border:1px solid var(--border);cursor:pointer}
.filter-tab:first-child{border-radius:var(--radius-md) 0 0 var(--radius-md)}
.filter-tab:last-child{border-radius:0 var(--radius-md) var(--radius-md) 0}
.filter-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.filter-search{flex:1;min-width:0;display:flex;align-items:center;background:var(--gray-100);border-radius:20px;padding:0 10px;height:32px}
.filter-search svg{width:12px;height:12px;color:var(--text-tertiary);flex-shrink:0}
.filter-search input{flex:1;border:none;background:none;font-size:var(--font-xs);margin-left:4px;color:var(--text);height:32px}
.filter-search input::placeholder{color:var(--text-tertiary)}
/* List */
.fence-list{padding:0 16px 16px}
.fence-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;cursor:pointer;min-height:56px;transition:all var(--fast)}
.fence-card:active{background:var(--gray-50)}
.fence-info{flex:1;min-width:0}
.fence-proj{font-size:var(--font-sm);font-weight:var(--fw-medium);color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fence-eng{font-size:var(--font-xs);color:var(--text-sub);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fence-status{flex-shrink:0;margin-left:8px}
.fence-arrow{color:var(--text-tertiary);margin-left:4px;flex-shrink:0}
/* Tag */
.tag{display:inline-block;font-size:var(--font-xs);font-weight:var(--fw-medium);padding:3px 8px;border-radius:999px}
.tag-green{background:var(--green-light);color:var(--green)}
.tag-grey{background:var(--gray-100);color:var(--gray-500)}
/* Date picker */
.date-picker-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.54);z-index:200;display:none;align-items:flex-end}
.date-picker-overlay.show{display:flex}
.date-picker-panel{width:100%;background:var(--panel);border-radius:6px 6px 0 0;padding:16px}
.date-picker-panel input{width:100%;height:40px;border:1px solid var(--gray-200);border-radius:var(--radius-md);font-size:var(--font-md);text-align:center}
.dp-actions{display:flex;gap:8px;margin-top:12px}
.dp-btn{flex:1;height:36px;border-radius:var(--radius-md);font-size:var(--font-md);font-weight:var(--fw-bold)}
.dp-btn.confirm{background:var(--blue);color:#fff}
.dp-btn.cancel{background:var(--gray-100);color:var(--text-sub)}
/* Toast */
.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#222;color:#fff;padding:10px 18px;border-radius:8px;font-size:var(--font-lg);z-index:500;opacity:0;transition:all 0.3s ease;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
/* Empty */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;color:var(--text-sub)}
.empty-state svg{width:40px;height:40px;opacity:0.3;margin-bottom:8px}
.empty-state span{font-size:var(--font-sm)}
</style>
<script src="../mock-data.js"></script>
</head>
<body>
<div class="phone-frame">
  <div class="phone-notch"></div>
  <div class="phone-home-indicator"></div>
  <div class="phone-screen">
    <div class="nav-bar">
      <div class="nav-bar-inner">
        <div class="nav-bar-left"><button class="nav-bar-back" onclick="goHome()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button></div>
        <span class="nav-bar-title">全景巡查</span>
        <span class="nav-bar-right" id="navDate" onclick="openDatePicker()"></span>
      </div>
    </div>
    <div class="screen-body" id="screenBody"></div>
    <div class="toast" id="toast"></div>
    <div class="date-picker-overlay" id="datePickerOverlay">
      <div class="date-picker-panel">
        <div style="font-size:var(--font-xl);font-weight:var(--fw-heavy);margin-bottom:12px">选择日期</div>
        <input type="date" id="dpInput">
        <div class="dp-actions">
          <button class="dp-btn cancel" onclick="closeDatePicker()">取消</button>
          <button class="dp-btn confirm" onclick="applyDatePicker()">确认</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
/* ═══ State ═══ */
function goHome(){window.location.href='app_prototype.html';}
var _currentDate='',_filterTab='all',_searchKw='',_toastTimer;
var _allFences=[];

/* ═══ Init ═══ */
(function init(){
  function showError(msg){document.getElementById('screenBody').innerHTML='<div class="empty-state"><span>'+msg+'</span></div>';}
  try{
    if(typeof MOCK_DATA==='undefined'){showError('数据模块加载失败，请返回首页重试');return}
    var projects=MOCK_DATA.getProjects();
    if(!projects||!projects.length){showError('未找到项目数据');return}
    projects.forEach(function(p){
      (p.hoardings||[]).forEach(function(h){
        _allFences.push({
          id:h.id,engName:h.engineerName,projName:p.name,projStreet:p.street,
          fenceStatus:h.fenceStatus,issueStatus:h.issueStatus,
          patrolRecords:(h.patrolRecords||[]).slice()
        });
      });
    });
    if(_allFences.length===0){showError('未找到围挡及巡检数据');return}
    // Default date = today's actual date
    var today=new Date();_currentDate=today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());
    document.getElementById('navDate').textContent=today.getFullYear()+'年'+(today.getMonth()+1)+'月'+today.getDate()+'日';
    render();
  }catch(e){showError('加载异常:'+e.message);}
})();

// ═══ Render ═══

/* ═══ Render ═══ */
function render(){
  var html='';
  html+=renderSummary()+renderFilterBar()+renderList();
  document.getElementById('screenBody').innerHTML=html;
}

/* ── Summary ── */
function renderSummary(){
  var total=_allFences.length,patrolled=0;
  _allFences.forEach(function(f){
    if(f.patrolRecords.some(function(r){return r.date===_currentDate;}))patrolled++;
  });
  return '<div class="summary-bar">'+
    '<div class="summary-item"><div class="summary-val">'+total+'</div><div class="summary-lbl">当前围挡总计</div></div>'+
    '<div class="summary-item"><div class="summary-val green">'+patrolled+'</div><div class="summary-lbl">已巡检</div></div>'+
    '<div class="summary-item"><div class="summary-val warn">'+(total-patrolled)+'</div><div class="summary-lbl">未巡检</div></div>'+
  '</div>';
}

/* ── Filter ── */
function renderFilterBar(){
  var tabs=['全部','已巡检','未巡检'];var keys=['all','done','undone'];
  return '<div class="filter-bar">'+
    '<div class="filter-tabs">'+tabs.map(function(t,i){return'<span class="filter-tab'+(_filterTab===keys[i]?' active':'')+'" onclick="setFilter(\''+keys[i]+'\')">'+t+'</span>';}).join('')+'</div>'+
    '<div class="filter-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" placeholder="搜索围挡" value="'+esp(_searchKw)+'" oninput="onSearch(this.value)"></div>'+
  '</div>';
}

/* ── List ── */
function renderList(){
  var filtered=_allFences.slice();
  // Filter by tab
  if(_filterTab==='done'){filtered=filtered.filter(function(f){return f.patrolRecords.some(function(r){return r.date===_currentDate;});});}
  else if(_filterTab==='undone'){filtered=filtered.filter(function(f){return!f.patrolRecords.some(function(r){return r.date===_currentDate;});});}
  // Filter by keyword
  if(_searchKw){var kw=_searchKw.toLowerCase();filtered=filtered.filter(function(f){return f.projName.toLowerCase().indexOf(kw)>=0||f.engName.toLowerCase().indexOf(kw)>=0;});}

  if(!filtered.length){return'<div class="fence-list"><div class="empty-state"><span>暂无匹配结果</span></div></div>';}

  // Group by project
  var projMap={};
  filtered.forEach(function(f){
    if(!projMap[f.projName])projMap[f.projName]={name:f.projName, fences:[]};
    projMap[f.projName].fences.push(f);
  });

  var html='<div class="fence-list">';
  Object.keys(projMap).forEach(function(pk){
    var proj=projMap[pk];
    html+='<div style="font-size:var(--font-sm);font-weight:var(--fw-heavy);color:var(--text);padding:8px 0 4px;display:flex;align-items:center;gap:6px"><span style="width:3px;height:12px;background:var(--blue);border-radius:2px;display:inline-block;flex-shrink:0"></span>'+esp(proj.name)+'</div>';
    proj.fences.forEach(function(f){
      var hasRecord=f.patrolRecords.some(function(r){return r.date===_currentDate;});
      var issueCnt=0;if(hasRecord){f.patrolRecords.forEach(function(r){if(r.date===_currentDate&&r.issues&&r.issues.length)issueCnt+=r.issues.length;});}
      var tag=hasRecord?'<span class="tag tag-green">已巡检</span>':'<span class="tag tag-grey">未巡检</span>';
      var issueHint=(hasRecord&&issueCnt>0)?'<span style="font-size:10px;color:var(--red);font-weight:var(--fw-medium);margin-left:4px">'+issueCnt+'个问题</span>':'';
      var onclick='onclick="openViewer(\''+f.id+'\')"';
      html+='<div class="fence-card" '+onclick+'><div class="fence-info"><div class="fence-eng">'+esp(f.engName)+issueHint+'</div></div><div class="fence-status">'+tag+'</div><svg class="fence-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></div>';
    });
  });
  html+='</div>';
  return html;
}

/* ── Interactions ── */
function setFilter(tab){_filterTab=tab;render();}
function onSearch(v){_searchKw=v;render();}

/* ── Viewer ── */
function openViewer(fid){
  var fence=null; for(var i=0;i<_allFences.length;i++){if(_allFences[i].id===fid){fence=_allFences[i];break;}}
  if(!fence)return;
  var records=fence.patrolRecords.filter(function(r){return r.date===_currentDate;}).sort(function(a,b){return(b.time||'').localeCompare(a.time||'');});
  if(!records.length||!_currentDate){
    // 未巡检 → 取最新一条记录
    records=fence.patrolRecords.slice().sort(function(a,b){return(b.date+' '+b.time).localeCompare(a.date+' '+a.time);});
    if(!records.length){showToast('该围挡暂无巡检记录');return;}
  }
  var data=JSON.stringify({fid:fid, date:records[0].date, panoSrc:records[0].panoramaSrc||''});
  window.location.href='panorama_viewer_v2.html?data='+encodeURIComponent(data);
}

/* ── Date Picker ── */
function openDatePicker(){document.getElementById('datePickerOverlay').classList.add('show');document.getElementById('dpInput').value=_currentDate;}
function closeDatePicker(){document.getElementById('datePickerOverlay').classList.remove('show');}
function applyDatePicker(){
  var v=document.getElementById('dpInput').value;if(!v)return;
  _currentDate=v;closeDatePicker();
  var d=new Date(v+'T00:00:00');document.getElementById('navDate').textContent=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';
  render();
}

/* ── Toast ── */
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(_toastTimer);_toastTimer=setTimeout(function(){t.classList.remove('show')},2000);}

function esp(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function pad(n){return n<10?'0'+n:''+n;}
</script>
</body>
</html>
