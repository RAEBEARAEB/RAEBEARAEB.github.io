<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>问题详情 - 围挡信息公示</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />
<style>
:root{
  --blue:#2C50DD;--blue-light:#5C7BF0;--blue-50:#EBF0FE;
  --gray-900:#1D2129;--gray-700:#4E5969;--gray-500:#86909C;--gray-300:#C9CDD4;--gray-200:#E5E6EB;--gray-100:#F4F6F8;--white:#fff;
  --green:#16A34A;--green-bg:rgba(22,163,74,0.08);
  --orange:#EA580C;--orange-bg:rgba(234,88,12,0.08);
  --red:#DC2626;--red-bg:rgba(220,38,38,0.08);
  --text:#333;--text-sec:#64748B;--text-ter:#94A3B8;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06);--shadow-card:0 1px 4px rgba(0,0,0,0.08);
  --radius-sm:4px;--radius-md:8px;--radius-lg:10px;
  --font:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --fs-xs:12px;--fs-sm:13px;--fs-md:14px;--fs-lg:16px;--fs-xl:18px;--fw-m:500;--fw-b:600;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font);font-size:var(--fs-md);color:var(--text);background:var(--gray-100);line-height:1.5;-webkit-font-smoothing:antialiased;height:100%}
@media(min-width:500px){body{background:#E2E6EC;display:flex;align-items:center;justify-content:center;height:100vh;padding:0}}
.phone-wrapper{width:100%;max-width:420px;height:100vh;position:relative;background:var(--gray-100);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:500px){.phone-wrapper{height:min(92vh,844px);border-radius:40px;box-shadow:0 0 0 2px #1a1a1a,0 0 0 6px #333,0 0 0 8px #1a1a1a,0 20px 60px rgba(0,0,0,0.3);overflow:hidden}}
.phone-status-bar{height:48px;background:#0F1A34;display:flex;align-items:flex-end;justify-content:space-between;padding:0 var(--s6) 6px;color:#fff;font-size:12px;font-weight:500;flex-shrink:0;position:relative}
.status-bar-left{display:flex;align-items:center;gap:4px}.status-bar-right{display:flex;align-items:center;gap:6px}.status-bar-right svg{width:14px;height:14px}
.dynamic-island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:28px;background:#000;border-radius:20px}
.mobile-header{background:rgba(255,255,255,.96);color:var(--text);border-bottom:1px solid var(--gray-200);padding:0 var(--s4);height:44px;display:flex;align-items:center;flex-shrink:0;position:relative;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.back-btn{background:none;border:none;display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:6px;cursor:pointer;color:var(--text)}
.back-btn:active{background:var(--gray-100)}
.back-btn svg{width:20px;height:20px}
.mobile-header-title{position:absolute;left:50%;transform:translateX(-50%);font-size:var(--fs-lg);font-weight:var(--fw-b)}
.phone-screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative;z-index:1;padding-bottom:20px}
.phone-screen::-webkit-scrollbar{width:0;display:none}
/* 卡片 */
.info-card{background:var(--white);border-radius:var(--radius-lg);margin:var(--s3) var(--s4);overflow:hidden;box-shadow:var(--shadow-sm)}
.info-card-header{display:flex;align-items:center;justify-content:space-between;padding:var(--s3) var(--s4) var(--s2)}
.info-card-title{font-size:var(--fs-md);font-weight:var(--fw-b);color:var(--gray-900);display:flex;align-items:center;gap:6px}
.info-card-title::before{content:'';width:3px;height:14px;background:var(--blue);border-radius:2px}
.info-card-body{padding:var(--s1) var(--s4) var(--s3)}
.field-row{display:flex;padding:7px 0;border-bottom:1px solid var(--gray-100)}
.field-row:last-child{border-bottom:none}
.field-label{width:76px;flex-shrink:0;font-size:var(--fs-sm);color:var(--text-ter)}
.field-value{flex:1;font-size:var(--fs-sm);color:var(--gray-700);word-break:break-all}
.tag{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:var(--fs-xs);font-weight:var(--fw-m)}
.tag-done{background:var(--green-bg);color:var(--green)}
.tag-pending{background:var(--orange-bg);color:var(--orange)}
.tag-overdue{background:var(--red-bg);color:var(--red)}
.photo-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.photo-grid img{width:calc(33.33% - 4px);aspect-ratio:1;object-fit:cover;border-radius:var(--radius-sm);cursor:pointer}
/* 流转日志 */
.log-timeline{position:relative;padding-left:28px}
.log-timeline::before{content:'';position:absolute;left:9px;top:8px;bottom:8px;width:2px;background:var(--gray-200)}
.log-item{position:relative;margin-bottom:var(--s3)}
.log-item:last-child{margin-bottom:0}
.log-dot{position:absolute;left:-28px;top:0;width:20px;height:20px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;color:#fff;z-index:1}
.log-dot.green{background:var(--green)}
.log-dot svg{width:12px;height:12px}
.log-card-inner{background:var(--gray-100);border-radius:var(--radius-sm);padding:var(--s3)}
.log-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s2)}
.log-card-title{font-size:var(--fs-sm);font-weight:var(--fw-b);color:var(--gray-900)}
.log-card-time{font-size:var(--fs-xs);color:var(--text-ter)}
.log-field{display:flex;gap:var(--s2);padding:3px 0;font-size:var(--fs-sm)}
.log-field-lbl{width:64px;flex-shrink:0;color:var(--text-ter)}
.log-field-val{flex:1;color:var(--gray-700);word-break:break-all}
/* 问题位置地图 */
.loc-map-wrap{height:200px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--gray-200)}
.empty{text-align:center;padding:40px 20px;color:var(--text-ter);font-size:var(--fs-sm)}
</style>
</head>
<body>

<div class="phone-wrapper">
  <div class="phone-status-bar">
    <div class="status-bar-left">9:41</div>
    <div class="dynamic-island"></div>
    <div class="status-bar-right">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 22h20V2L2 22z"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0114.08 0"/><path d="M1.42 9a16 16 0 0121.16 0"/><path d="M8.53 16.11a6 6 0 016.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="18" height="10" rx="2"/><line x1="22" y1="11" x2="22" y2="13"/></svg>
    </div>
  </div>
  <div class="mobile-header">
    <button class="back-btn" onclick="history.back()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
    <span class="mobile-header-title">问题详情</span>
  </div>
  <div class="phone-screen" id="screenBody"><div class="empty">加载中...</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../mock-data.js"></script>
<script>
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
var issueId=(location.search.match(/id=([^&]+)/)||[])[1];
issueId=issueId?decodeURIComponent(issueId):'';

(function(){
  if(!window.MOCK_DATA){document.getElementById('screenBody').innerHTML='<div class="empty">数据加载失败</div>';return;}
  var issue=MOCK_DATA.getClosureDetail(issueId);
  if(!issue){document.getElementById('screenBody').innerHTML='<div class="empty">未找到该问题记录 (id='+issueId+')</div>';return;}

  // 获取关联围挡数据
  var hoard = issue.fenceId ? MOCK_DATA.findFenceById(issue.fenceId) : null;

  var sc={'待整改':'tag-pending','整改逾期':'tag-overdue','整改完成':'tag-done'};
  var stTxt=issue.status||'待整改';
  var stCls=sc[issue.status]||'tag-pending';
  var r=issue._rectification;
  var h='';

  // ── 问题信息卡片 ──
  h+='<div class="info-card"><div class="info-card-header"><div class="info-card-title">问题信息</div><span class="tag '+stCls+'">'+stTxt+'</span></div><div class="info-card-body">';
  h+='<div class="field-row"><div class="field-label">问题类型</div><div class="field-value" style="color:var(--blue);font-weight:'+ 'var(--fw-m)' +'">'+esc(issue.type||'—')+'</div></div>';
  h+='<div class="field-row"><div class="field-label">关联项目</div><div class="field-value">'+esc(issue._projectName||(hoard?hoard.projectName:'')||'—')+'</div></div>';
  h+='<div class="field-row"><div class="field-label">关联工程</div><div class="field-value">'+esc(issue.engineerName||(hoard?hoard.engineerName:'')||'—')+'</div></div>';
  h+='<div class="field-row"><div class="field-label">责任单位</div><div class="field-value">'+esc(issue.responsibleUnit||(hoard?hoard.constructUnit:'')||'—')+'</div></div>';
  h+='<div class="field-row"><div class="field-label">问题描述</div><div class="field-value">'+esc(issue.details||'—')+'</div></div>';
  if(issue.photos&&issue.photos.length)h+='<div class="field-row"><div class="field-label">现场照片</div><div class="field-value"><div class="photo-grid">'+issue.photos.map(function(p){return'<img src="'+p+'" onclick="previewPhoto(this.src)">'}).join('')+'</div></div></div>';
  h+='</div></div>';

  // ── 问题位置卡片（独立section）──
  h+='<div class="info-card"><div class="info-card-header"><div class="info-card-title">问题位置</div></div><div class="info-card-body">';
  if(issue.location&&issue.location.lat){
    h+='<div class="loc-map-wrap" id="issueLocMap"></div>';
  } else {
    h+='<div style="height:120px;display:flex;align-items:center;justify-content:center;background:var(--gray-100);border-radius:var(--radius-sm);color:var(--text-ter);font-size:var(--fs-xs)">暂无位置坐标</div>';
  }
  h+='</div></div>';

  // ── 处理记录（倒序：最新在前）──
  h+='<div class="info-card"><div class="info-card-header"><div class="info-card-title">处理记录</div></div><div class="info-card-body"><div class="log-timeline">';
  // 问题处置（较新，排前面）
  if(r){
    h+='<div class="log-item"><div class="log-dot green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></div><div class="log-card-inner"><div class="log-card-head"><div class="log-card-title">问题处置</div><div class="log-card-time">'+esc(r.rectTime||'')+'</div></div>';
    if(r.rectifierUnit)h+='<div class="log-field"><div class="log-field-lbl">责任单位</div><div class="log-field-val">'+esc(r.rectifierUnit)+'</div></div>';
    if(r.desc)h+='<div class="log-field"><div class="log-field-lbl">整改说明</div><div class="log-field-val">'+esc(r.desc)+'</div></div>';
    if(r.photos&&r.photos.length)h+='<div class="log-field"><div class="log-field-lbl">整改照片</div><div class="log-field-val"><div class="photo-grid">'+r.photos.map(function(p){return'<img src="'+p+'" onclick="previewPhoto(this.src)">'}).join('')+'</div></div></div>';
    h+='</div></div>';
  }
  // 问题上报（较早，排后面）
  h+='<div class="log-item"><div class="log-dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></div><div class="log-card-inner"><div class="log-card-head"><div class="log-card-title">问题上报</div><div class="log-card-time">'+esc(issue.reportTime||'')+'</div></div></div></div>';
  h+='</div></div></div>';

  document.getElementById('screenBody').innerHTML=h;

  // Init location map
  if(issue.location&&issue.location.lat&&typeof L!=='undefined'){
    // 获取关联项目数据
    var proj = null;
    if(hoard){
      var allP = MOCK_DATA.getProjects();
      for(var i=0;i<allP.length;i++){ if(allP[i].name===hoard.projectName){ proj=allP[i]; break; } }
    }

    setTimeout(function(){
      var el=document.getElementById('issueLocMap');
      if(!el)return;
      var map=L.map(el,{zoomControl:false,attributionControl:false,dragging:true,scrollWheelZoom:false});
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(map);
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,opacity:0.5}).addTo(map);

      var bounds=L.latLngBounds([]);

      // 项目红线
      if(proj && proj.redlineGeo && proj.redlineGeo.length>=3){
        L.polygon(proj.redlineGeo,{color:'#D13B2F',weight:2,fillOpacity:0.08,fillColor:'#D13B2F'}).addTo(map);
        proj.redlineGeo.forEach(function(p){ bounds.extend(p); });
      }

      // 围挡范围图斑
      if(hoard && hoard.gpsShape && hoard.gpsShape.length>=3){
        L.polygon(hoard.gpsShape,{color:'#2F55EB',weight:2,fillOpacity:0.1,fillColor:'#2F55EB'}).addTo(map);
        hoard.gpsShape.forEach(function(p){ bounds.extend(p); });
      }

      // 问题位置标记
      L.circleMarker([issue.location.lat,issue.location.lng],{radius:7,color:'#F93920',fillColor:'#F93920',fillOpacity:0.9,weight:3}).addTo(map);
      bounds.extend([issue.location.lat,issue.location.lng]);

      if(bounds.isValid()){ map.fitBounds(bounds.pad(0.2)); }
      else{ map.setView([issue.location.lat,issue.location.lng],16); }

      setTimeout(function(){ map.invalidateSize(); },200);
    },300);
  }
})();

function previewPhoto(src){
  var o=document.createElement('div');
  o.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;cursor:zoom-out';
  o.innerHTML='<img src="'+src+'" style="max-width:92%;max-height:92%;border-radius:6px">';
  o.onclick=function(){document.body.removeChild(o)};
  document.body.appendChild(o);
}
</script>
</body>
</html>
