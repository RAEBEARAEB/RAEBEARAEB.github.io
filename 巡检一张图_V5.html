#problemMask .problem-related-photo img{width:100%;height:100%;object-fit:cover}.problem-related-photo span{position:absolute;right:0;bottom:0;left:0;padding:2px 4px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff;font-size:9px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#problemMask .problem-related-photo.selected{border-color:#2ed3d0}.problem-related-photo.selected:after{content:'✓';position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#20bbb9;color:#fff;font-size:12px;line-height:18px;text-align:center}
#problemMask #problemUpload{display:block;min-height:92px;padding:12px;border:1px solid rgba(125,190,200,.22);border-radius:7px;background:rgba(255,255,255,.018)}
#problemMask .problem-evidence-grid{display:flex;flex-wrap:wrap;gap:9px}
#problemMask .problem-evidence-thumb{position:relative;width:92px;height:68px;padding:0;border:1px solid rgba(125,190,200,.32);border-radius:5px;overflow:hidden;background:#153945;cursor:pointer}
#problemMask .problem-evidence-thumb img{width:100%;height:100%;object-fit:cover}.problem-evidence-thumb .remove{position:absolute;top:3px;right:3px;width:20px;height:20px;border:0;border-radius:3px;background:#d9434d;color:white;line-height:20px;cursor:pointer}
#problemMask .problem-upload-add{order:-1;display:flex!important;flex-direction:column;align-items:center;justify-content:center;width:92px!important;height:68px!important;border:1px dashed rgba(125,190,200,.52);border-radius:5px;background:rgba(255,255,255,.02);color:#a5c9ce;font-size:11px;cursor:pointer}
#problemMask .problem-upload-add b{font-size:23px;font-weight:300;line-height:22px}.problem-upload-add:hover{border-color:#2ed3d0;color:#dff}
#problemMask .problem-v5-actions{display:flex;justify-content:flex-end;gap:10px;padding:14px 24px;border-top:1px solid rgba(125,190,200,.22);background:#0c3240}
#problemMask .problem-v5-btn{height:38px;padding:0 20px;border:1px solid rgba(157,204,210,.48);border-radius:7px;background:transparent;color:#c8e2e5;cursor:pointer}.problem-v5-btn.primary{border-color:#2ed3d0;background:#2ed3d0;color:#06313b;font-weight:650}
.problem-v5-preview{position:fixed;z-index:4200;width:300px;height:210px;padding:5px;border:1px solid rgba(125,190,200,.52);border-radius:8px;background:#061a21;box-shadow:0 16px 36px rgba(0,0,0,.55);pointer-events:none}
.problem-v5-preview img{width:100%;height:100%;object-fit:cover;border-radius:5px}
@media(max-width:760px){#problemMask .problem-v5-grid{grid-template-columns:1fr}#problemMask .problem-v5-field.full{grid-column:auto}}

<script>
(()=>{
  const mask=document.getElementById('problemMask');if(!mask)return;
  const demo=['施工隐患_高处作业平台.jpg','施工隐患_脚手架攀爬.jpg','施工隐患_脚手架与现场杂物.jpg','施工隐患_梯道设置不规范.jpg','施工隐患_临边切割作业.jpg'];
  const related=Array.from({length:30},(_,i)=>({id:`related-${i}`,url:`${demo[i%demo.length]}#related-${i}`,name:`DJI_${2601+i}.jpg`}));
  mask.innerHTML=`<div class="modal problem-modal-v5"><div class="problem-v5-head"><h2>新增隐患问题</h2><button type="button" class="problem-v5-close" id="closeProblem" aria-label="关闭">×</button></div><div class="problem-v5-body"><div class="problem-v5-grid"><label class="problem-v5-field"><span class="problem-v5-label">问题位置</span><input class="problem-v5-control" id="problemLocation" placeholder="请输入具体问题位置"></label><div class="problem-v5-field"><span class="problem-v5-label"><i class="problem-v5-required">*</i> 检查类型</span><div class="problem-v5-radios"><label><input type="radio" name="workspaceCheckType" value="安全" checked>安全</label><label><input type="radio" name="workspaceCheckType" value="质量">质量</label></div></div><label class="problem-v5-field full"><span class="problem-v5-label"><i class="problem-v5-required">*</i> 问题描述</span><textarea class="problem-v5-control" id="problemDesc" placeholder="请输入问题描述"></textarea></label><div class="problem-v5-field full" id="problemEvidence"><div class="problem-v5-photo-head"><span class="problem-v5-label"><i class="problem-v5-required">*</i> 问题照片</span><span class="problem-v5-help">支持 JPG、JPEG、PNG，单张不超过10MB；支持多选、拖拽上传、 Ctrl+V 粘贴或直接选择关联图片</span></div><div class="problem-v5-related"><div class="problem-v5-related-title">关联图片列表</div><div id="problemRelatedPhotos"></div></div><div id="problemUpload"></div><input id="problemEvidenceInput" type="file" accept=".jpg,.jpeg,.png" multiple hidden></div></div></div><div class="problem-v5-actions"><button type="button" class="problem-v5-btn" id="cancelProblem">取消</button><button type="button" class="problem-v5-btn primary" id="saveProblem">保存问题</button></div></div>`;
  const $=id=>document.getElementById(id);
  const showPreview=(src,el)=>{let p=document.querySelector('.problem-v5-preview');if(!p){p=document.createElement('div');p.className='problem-v5-preview';p.innerHTML='<img alt="关联图片预览">';document.body.appendChild(p)}p.querySelector('img').src=src;const r=el.getBoundingClientRect();p.style.left=Math.min(innerWidth-312,r.left)+'px';p.style.top=Math.max(8,r.top-220)+'px'};
  const hidePreview=()=>document.querySelector('.problem-v5-preview')?.remove();
  const render=()=>{const rel=$('problemRelatedPhotos'),box=$('problemUpload');if(!rel||!box)return;rel.innerHTML=related.map(x=>`<button type="button" class="problem-related-photo ${problemEvidenceUrls.includes(x.url)?'selected':''}" data-related="${x.id}"><img src="${x.url}" alt="${x.name}"><span>${x.name}</span></button>`).join('');rel.querySelectorAll('[data-related]').forEach(btn=>{const x=related.find(v=>v.id===btn.dataset.related);btn.onclick=()=>{if(!problemEvidenceUrls.includes(x.url))problemEvidenceUrls.push(x.url);problemEvidenceReady=true;render()};btn.onmouseenter=()=>showPreview(x.url,btn);btn.onmouseleave=hidePreview});box.innerHTML=`<div class="problem-evidence-grid">${problemEvidenceUrls.map((url,i)=>`<button type="button" class="problem-evidence-thumb" data-preview="${i}"><img src="${url}" alt="问题照片"><span class="remove" data-remove="${i}">×</span></button>`).join('')}<button type="button" class="problem-upload-add" id="problemAddPhoto"><b>＋</b><span>${problemEvidenceUrls.length?'继续添加':'点击上传照片'}</span></button></div>`;box.querySelectorAll('[data-preview]').forEach(btn=>btn.onclick=e=>{if(e.target.closest('[data-remove]'))return;openIssueImage(problemEvidenceUrls[+btn.dataset.preview])});box.querySelectorAll('[data-remove]').forEach(btn=>btn.onclick=e=>{e.stopPropagation();problemEvidenceUrls.splice(+btn.dataset.remove,1);problemEvidenceReady=problemEvidenceUrls.length>0;render()});$('problemAddPhoto').onclick=()=>$('problemEvidenceInput').click()};
  window.ensureProblemFields=()=>{};window.renderProblemEvidence=render;
  $('problemEvidenceInput').onchange=e=>{[...e.target.files].forEach(f=>problemEvidenceUrls.push(URL.createObjectURL(f)));problemEvidenceReady=problemEvidenceUrls.length>0;render()};
  $('closeProblem').onclick=()=>closeProblem();$('cancelProblem').onclick=()=>closeProblem();$('saveProblem').onclick=()=>saveProblem();
  $('problemUpload').ondragover=e=>e.preventDefault();$('problemUpload').ondrop=e=>{e.preventDefault();[...(e.dataTransfer?.files||[])].filter(f=>/^image\/(jpeg|png)$/.test(f.type)).forEach(f=>problemEvidenceUrls.push(URL.createObjectURL(f)));problemEvidenceReady=problemEvidenceUrls.length>0;render()};
  document.addEventListener('paste',e=>{if(!mask.classList.contains('show'))return;[...(e.clipboardData?.files||[])].filter(f=>/^image\/(jpeg|png)$/.test(f.type)).forEach(f=>problemEvidenceUrls.push(URL.createObjectURL(f)));problemEvidenceReady=problemEvidenceUrls.length>0;render()});
  new MutationObserver(()=>{if(mask.classList.contains('show')){if(!document.querySelector('input[name="workspaceCheckType"]:checked'))document.querySelector('input[name="workspaceCheckType"][value="安全"]').checked=true;render()}else hidePreview()}).observe(mask,{attributes:true,attributeFilter:['class']});
  render();
})();
</script>
<script>
(()=>{
  const mask=document.getElementById('problemMask');if(!mask)return;
  if(mask.parentElement!==document.body)document.body.appendChild(mask);
  const $=id=>document.getElementById(id),sources=['施工隐患_高处作业平台.jpg','施工隐患_脚手架攀爬.jpg','施工隐患_脚手架与现场杂物.jpg','施工隐患_梯道设置不规范.jpg','施工隐患_临边切割作业.jpg'];
  const related=Array.from({length:30},(_,i)=>({id:i,url:`${sources[i%sources.length]}#related-${i}`,name:`DJI_${2601+i}.jpg`}));let draft=[];
  const toast=msg=>{const t=$('toast');if(!t)return;t.textContent=msg;t.classList.add('show');clearTimeout(t.__timer);t.__timer=setTimeout(()=>t.classList.remove('show'),1800)};
  const preview=src=>{let p=$('problemV5ImagePreview');if(!p){document.body.insertAdjacentHTML('beforeend','<div class="modal-mask issue-image-preview-mask" id="problemV5ImagePreview"><img id="problemV5ImagePreviewImg" alt="问题照片大图"></div>');p=$('problemV5ImagePreview');p.onclick=()=>p.classList.remove('show')}$('problemV5ImagePreviewImg').src=src;p.classList.add('show')};
  const hover=(src,el)=>{document.querySelector('.problem-v5-preview')?.remove();const p=document.createElement('div');p.className='problem-v5-preview';p.innerHTML=`<img src="${src}" alt="关联图片预览">`;document.body.appendChild(p);const r=el.getBoundingClientRect();p.style.left=Math.min(innerWidth-312,Math.max(8,r.left))+'px';p.style.top=Math.max(8,r.top-220)+'px'};
  const render=()=>{const rel=$('problemRelatedPhotos'),box=$('problemUpload');if(!rel||!box)return;rel.innerHTML=related.map(x=>`<button type="button" class="problem-related-photo ${draft.includes(x.url)?'selected':''}" data-v5-related="${x.id}"><img src="${x.url}" alt="${x.name}"><span>${x.name}</span></button>`).join('');rel.querySelectorAll('[data-v5-related]').forEach(btn=>{const x=related[+btn.dataset.v5Related];btn.onclick=()=>{if(!draft.includes(x.url))draft.push(x.url);render()};btn.onmouseenter=()=>hover(x.url,btn);btn.onmouseleave=()=>document.querySelector('.problem-v5-preview')?.remove()});box.innerHTML=`<div class="problem-evidence-grid">${draft.map((url,i)=>`<button type="button" class="problem-evidence-thumb" data-v5-preview="${i}"><img src="${url}" alt="问题照片"><span class="remove" data-v5-remove="${i}">×</span></button>`).join('')}<button type="button" class="problem-upload-add" id="problemAddPhoto"><b>＋</b><span>${draft.length?'继续添加':'点击上传照片'}</span></button></div>`;box.querySelectorAll('[data-v5-preview]').forEach(btn=>btn.onclick=e=>{if(!e.target.closest('[data-v5-remove]'))preview(draft[+btn.dataset.v5Preview])});box.querySelectorAll('[data-v5-remove]').forEach(btn=>btn.onclick=e=>{e.stopPropagation();draft.splice(+btn.dataset.v5Remove,1);render()});$('problemAddPhoto').onclick=()=>$('problemEvidenceInput').click()};
  const close=()=>{mask.classList.remove('show');$('problemLocation').value='';$('problemDesc').value='';draft=[];render();document.querySelector('.problem-v5-preview')?.remove()};
  window.ensureProblemFields=()=>{};window.renderProblemEvidence=render;
  $('problemEvidenceInput').onchange=e=>{[...e.target.files].forEach(f=>draft.push(URL.createObjectURL(f)));render();e.target.value=''};
  $('closeProblem').onclick=close;$('cancelProblem').onclick=close;$('saveProblem').onclick=()=>{if(!$('problemDesc').value.trim()){toast('请填写问题描述');return}if(!draft.length){toast('请选择或上传问题照片');return}close();toast('巡检问题已保存')};
  $('problemUpload').ondragover=e=>e.preventDefault();$('problemUpload').ondrop=e=>{e.preventDefault();[...(e.dataTransfer?.files||[])].filter(f=>/^image\/(jpeg|png)$/.test(f.type)).forEach(f=>draft.push(URL.createObjectURL(f)));render()};
  document.addEventListener('paste',e=>{if(!mask.classList.contains('show'))return;[...(e.clipboardData?.files||[])].filter(f=>/^image\/(jpeg|png)$/.test(f.type)).forEach(f=>draft.push(URL.createObjectURL(f)));render()});
  new MutationObserver(()=>{if(mask.classList.contains('show'))render();else document.querySelector('.problem-v5-preview')?.remove()}).observe(mask,{attributes:true,attributeFilter:['class']});render();
})();
</script>
</body>
