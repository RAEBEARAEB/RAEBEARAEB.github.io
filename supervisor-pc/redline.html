<style>
/* ═══ Design Token ═══ */
:root {
  --color-primary-50:#EBF2FF;--color-primary-100:#C6D9FF;--color-primary-200:#9DBEFF;
  --color-primary-300:#6B9EF5;--color-primary-400:#3D7FED;--color-primary-500:#1862D4;
  --color-primary-600:#104FAD;--color-primary-700:#0A3C86;--color-primary-800:#062A60;--color-primary-900:#031940;
  --color-gray-0:#FFFFFF;--color-gray-50:#F7F8FA;--color-gray-100:#F0F1F5;--color-gray-200:#E3E6ED;
  --color-gray-300:#C6CBD8;--color-gray-400:#9CA3B0;--color-gray-500:#6B7280;--color-gray-600:#4B5563;
  --color-gray-700:#374151;--color-gray-800:#1F2937;--color-gray-900:#111827;
  --color-success-light:#E6F4EA;--color-success:#1A9042;--color-success-dark:#136B31;
  --color-warning-light:#FEF3CD;--color-warning:#D48A00;--color-warning-dark:#9E6600;
  --color-danger-light:#FDECEA;--color-danger:#D13B2F;--color-danger-dark:#9E2C22;
  --color-info-light:#E8F3FF;--color-info:#1862D4;--color-info-dark:#104FAD;
  --text-title:var(--color-gray-900);--text-primary:var(--color-gray-800);--text-secondary:var(--color-gray-600);
  --text-tertiary:var(--color-gray-400);--text-link:var(--color-primary-500);--text-link-hover:var(--color-primary-600);--text-inverse:#FFFFFF;
  --border-color-light:var(--color-gray-200);--border-color-default:var(--color-gray-300);--border-color-focus:var(--color-primary-500);
  --border-radius-sm:2px;--border-radius-md:4px;--border-radius-lg:6px;--border-radius-tag:2px;
  --bg-page:var(--color-gray-50);--bg-card:var(--color-gray-0);--bg-table-head:var(--color-gray-100);
  --bg-table-stripe:var(--color-gray-50);--bg-sidebar:#0D2B55;--bg-header:#FFFFFF;--bg-overlay:rgba(0,0,0,0.45);
  --shadow-sm:0 1px 2px rgba(0,0,0,0.04);--shadow-md:0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg:0 4px 16px rgba(0,0,0,0.08);--shadow-card:0 1px 4px rgba(0,0,0,0.05);
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;
  --space-6:24px;--space-8:32px;--space-10:40px;--space-12:48px;
  --font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --font-size-xs:12px;--font-size-sm:13px;--font-size-md:14px;--font-size-lg:16px;
  --font-size-xl:18px;--font-size-2xl:20px;--font-size-3xl:24px;
  --font-weight-regular:400;--font-weight-medium:500;--font-weight-bold:600;
  --line-height-tight:1.4;--line-height-normal:1.6;--line-height-loose:1.8;
  --transition-fast:0.15s ease;--transition-normal:0.2s ease;
  --height-sm:28px;--height-md:32px;--height-lg:36px;
  --header-height:56px;--sidebar-width:220px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font-family);font-size:var(--font-size-md);color:var(--text-primary);background:var(--bg-page);line-height:var(--line-height-normal);-webkit-font-smoothing:antialiased;height:100%}
a{color:var(--text-link);text-decoration:none;transition:color var(--transition-fast)}
a:hover{color:var(--text-link-hover)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--color-gray-300);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--color-gray-400)}

/* ═══ 布局 ═══ */
.layout-wrapper{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.layout-header{height:var(--header-height);background:var(--bg-header);display:flex;align-items:center;padding:0;position:fixed;top:0;left:0;right:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.layout-header::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--color-primary-600),var(--color-primary-400),var(--color-primary-600))}
.header-logo{display:flex;align-items:center;gap:var(--space-4);padding:0 var(--space-6);height:100%;border-right:1px solid var(--color-gray-100)}
.header-logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--color-primary-500),var(--color-primary-700));border-radius:var(--border-radius-md);display:flex;align-items:center;justify-content:center;color:var(--text-inverse);box-shadow:0 2px 6px rgba(24,98,212,0.25)}
.header-logo-text{font-size:var(--font-size-xl);font-weight:var(--font-weight-bold);color:var(--text-title);letter-spacing:0.02em}
.header-right{margin-left:auto;display:flex;align-items:center;gap:0;height:100%;padding:0 var(--space-5)}
.header-action-group{display:flex;align-items:center;gap:2px;padding:0 var(--space-3);border-right:1px solid var(--color-gray-100);height:100%}
.header-action-btn{position:relative;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:var(--border-radius-md);cursor:pointer;transition:background var(--transition-fast);background:none;border:none;color:var(--text-secondary)}
.header-action-btn:hover{background:var(--color-gray-50);color:var(--text-primary)}
.header-action-btn svg{width:18px;height:18px}
.header-badge{position:absolute;top:4px;right:4px;min-width:16px;height:16px;background:var(--color-danger);color:var(--text-inverse);font-size:10px;font-weight:var(--font-weight-bold);border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;line-height:1;border:2px solid var(--bg-header)}
.header-dashboard-btn{display:inline-flex;align-items:center;gap:6px;padding:0 16px;height:36px;font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);color:#fff;background:linear-gradient(135deg,#1D4ED8,#2563EB,#3B82F6);border-radius:var(--border-radius-md);cursor:pointer;transition:all var(--transition-fast);white-space:nowrap;text-decoration:none;border:1px solid rgba(37,99,235,0.4);box-shadow:0 2px 10px rgba(29,78,216,0.25),inset 0 1px 0 rgba(255,255,255,0.15);font-family:var(--font-family)}
.header-dashboard-btn:hover{background:linear-gradient(135deg,#1E40AF,#1D4ED8,#2563EB);box-shadow:0 4px 16px rgba(29,78,216,0.4),inset 0 1px 0 rgba(255,255,255,0.2);transform:translateY(-1px)}
.header-dashboard-btn svg{width:16px;height:16px;flex-shrink:0}
.header-user{display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);cursor:pointer;height:36px;border-radius:var(--border-radius-md);transition:background var(--transition-fast)}
.header-user:hover{background:var(--color-gray-50)}
.header-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--color-primary-100),var(--color-primary-200));display:flex;align-items:center;justify-content:center;font-size:var(--font-size-xs);color:var(--color-primary-700);font-weight:var(--font-weight-medium)}
.header-user-info{display:flex;flex-direction:column;line-height:1.3}
.header-user-name{font-size:var(--font-size-sm);color:var(--text-primary);font-weight:var(--font-weight-medium)}
.header-user-role{font-size:10px;color:var(--text-tertiary)}
.layout-body{display:flex;margin-top:var(--header-height);height:calc(100vh - var(--header-height));overflow:hidden}
.layout-sidebar{width:var(--sidebar-width);background:var(--bg-sidebar);height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column}
.nav-menu{list-style:none;padding:var(--space-4) 0;flex:1}
.nav-group-label{padding:var(--space-5) var(--space-5) var(--space-1);font-size:11px;color:rgba(255,255,255,0.25);letter-spacing:0.08em;font-weight:var(--font-weight-medium);text-transform:uppercase}
.nav-item{position:relative}
.nav-item a{display:flex;align-items:center;gap:var(--space-3);padding:0 var(--space-5);height:40px;font-size:var(--font-size-sm);color:rgba(255,255,255,0.55);transition:all var(--transition-fast);text-decoration:none;position:relative}
.nav-item a:hover{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.85)}
.nav-item a.active{background:rgba(24,98,212,0.25);color:#FFFFFF;font-weight:var(--font-weight-medium)}
.nav-item a.active::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:3px;background:#FFFFFF;border-radius:0 2px 2px 0}
.nav-icon{width:16px;height:16px;flex-shrink:0;opacity:0.7}
.nav-item a.active .nav-icon{opacity:1}
.sidebar-bottom{padding:var(--space-3) var(--space-5);border-top:1px solid rgba(255,255,255,0.06)}
.sidebar-version{font-size:11px;color:rgba(255,255,255,0.2)}
.layout-main{flex:1;overflow-y:auto;padding:var(--space-6) var(--space-8);background:var(--bg-page)}

.breadcrumb{display:flex;align-items:center;gap:var(--space-1);font-size:var(--font-size-sm);margin-bottom:var(--space-4)}
.breadcrumb-item{color:var(--text-tertiary)}
.breadcrumb-item a{color:var(--text-tertiary)}
.breadcrumb-item a:hover{color:var(--text-link)}
.breadcrumb-item:last-child{color:var(--text-secondary);font-weight:var(--font-weight-medium)}
.breadcrumb-sep{color:var(--color-gray-300);font-size:11px}
.page-header{margin-bottom:var(--space-5)}
.page-title{font-size:var(--font-size-2xl);font-weight:var(--font-weight-bold);color:var(--text-title);line-height:var(--line-height-tight)}
.page-title-accent{display:inline-block;width:3px;height:20px;background:var(--color-primary-500);border-radius:2px;margin-right:var(--space-2);vertical-align:middle;position:relative;top:-1px}

/* ═══ 筛选区 ═══ */
.search-bar{display:flex;gap:var(--space-3);flex-wrap:wrap;align-items:flex-end;padding:var(--space-5) var(--space-6);background:var(--bg-card);border:1px solid var(--border-color-light);border-radius:var(--border-radius-lg);margin-bottom:var(--space-5);box-shadow:var(--shadow-card);position:relative}
.search-bar::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--color-primary-500);border-radius:var(--border-radius-lg) 0 0 var(--border-radius-lg)}
.search-item{display:flex;flex-direction:column;gap:var(--space-1)}
.search-label{font-size:var(--font-size-xs);color:var(--text-secondary);font-weight:var(--font-weight-medium);letter-spacing:0.02em}
.search-input,.search-select{height:var(--height-md);padding:0 var(--space-3);font-size:var(--font-size-sm);color:var(--text-primary);background:var(--bg-card);border:1px solid var(--border-color-default);border-radius:var(--border-radius-md);outline:none;width:172px;font-family:var(--font-family);transition:all var(--transition-fast)}
.search-input::placeholder{color:var(--text-tertiary)}
.search-input:hover,.search-select:hover{border-color:var(--color-primary-300)}
.search-input:focus,.search-select:focus{border-color:var(--border-color-focus);box-shadow:0 0 0 2px var(--color-primary-50)}

/* ═══ 多选下拉 ═══ */
.multi-select{position:relative;width:220px}
.multi-select-trigger{height:var(--height-md);padding:0 var(--space-3);font-size:var(--font-size-sm);color:var(--text-primary);background:var(--bg-card);border:1px solid var(--border-color-default);border-radius:var(--border-radius-md);cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:all var(--transition-fast);user-select:none}
.multi-select-trigger:hover{border-color:var(--color-primary-300)}
.multi-select-trigger.active{border-color:var(--border-color-focus);box-shadow:0 0 0 2px var(--color-primary-50)}
.multi-select-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.multi-select-arrow{width:12px;height:12px;color:var(--text-tertiary);flex-shrink:0;margin-left:var(--space-1);transition:transform var(--transition-fast)}
.multi-select-trigger.active .multi-select-arrow{transform:rotate(180deg)}
.multi-select-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--bg-card);border:1px solid var(--border-color-default);border-radius:var(--border-radius-md);box-shadow:var(--shadow-md);z-index:50;display:none;max-height:240px;overflow-y:auto}
.multi-select-dropdown.show{display:block}
.multi-select-option{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3);cursor:pointer;font-size:var(--font-size-sm);color:var(--text-primary);transition:background var(--transition-fast)}
.multi-select-option:hover{background:var(--color-gray-50)}
.multi-select-option input[type="checkbox"]{width:14px;height:14px;accent-color:var(--color-primary-500);flex-shrink:0;cursor:pointer}

/* ═══ 按钮 ═══ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-1);height:var(--height-md);padding:0 var(--space-4);font-size:var(--font-size-md);font-weight:var(--font-weight-medium);border-radius:var(--border-radius-md);border:1px solid transparent;cursor:pointer;transition:all var(--transition-fast);white-space:nowrap;line-height:1;outline:none;font-family:var(--font-family)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:0.5;cursor:not-allowed;pointer-events:none}
.btn-primary{background:var(--color-primary-500);color:var(--text-inverse);border-color:var(--color-primary-500)}
.btn-primary:hover{background:var(--color-primary-600);border-color:var(--color-primary-600)}
.btn-ghost{background:transparent;color:var(--text-secondary);border-color:var(--border-color-default)}
.btn-ghost:hover{background:var(--color-gray-100);color:var(--text-primary)}
.btn svg{width:14px;height:14px}

/* ═══ Tab ═══ */
.tab-bar{display:flex;gap:0;border-bottom:2px solid var(--border-color-light);margin-bottom:var(--space-4)}
.tab-item{padding:var(--space-2) var(--space-4);font-size:var(--font-size-sm);color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all var(--transition-fast);position:relative;background:none;border-top:none;border-left:none;border-right:none;font-family:var(--font-family)}
.tab-item:hover{color:var(--color-primary-500)}
.tab-item.active{color:var(--color-primary-500);font-weight:var(--font-weight-medium);border-bottom-color:var(--color-primary-500)}
.tab-count{display:inline-block;margin-left:var(--space-1);padding:0 6px;height:18px;line-height:18px;font-size:11px;color:var(--text-tertiary);background:var(--color-gray-100);border-radius:9px;min-width:20px;text-align:center}
.tab-item.active .tab-count{background:var(--color-primary-50);color:var(--color-primary-500)}

/* ═══ 表格 ═══ */
.card{background:var(--bg-card);border:1px solid var(--border-color-light);border-radius:var(--border-radius-lg);box-shadow:var(--shadow-card);padding:var(--space-5) var(--space-6);margin-bottom:var(--space-5)}
.table-wrapper{width:100%;overflow-x:auto}
.table{width:100%;border-collapse:collapse;font-size:var(--font-size-sm);table-layout:fixed}
.table th{background:var(--bg-table-head);color:var(--text-secondary);font-weight:var(--font-weight-medium);font-size:var(--font-size-xs);letter-spacing:0.02em;padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--border-color-light);white-space:nowrap}
.table td{padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--border-color-light);color:var(--text-primary);vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.table tbody tr:nth-child(even) td{background:var(--bg-table-stripe)}
.table tbody tr:hover td{background:var(--color-primary-50);transition:background var(--transition-fast)}
.table-action-link{color:var(--text-link);font-size:var(--font-size-sm);cursor:pointer;padding:0;background:none;border:none;text-decoration:none}
.table-action-link:hover{color:var(--text-link-hover);text-decoration:underline}
.col-no{width:46px;text-align:center}
.col-name1{width:280px;text-align:center}
.col-district{width:100px;text-align:center}
.col-status{width:110px;text-align:center}
.col-industry{width:70px;text-align:center}
.col-pstatus{width:90px;text-align:center}
.col-time{width:140px;text-align:center}
.col-actions{width:110px;text-align:center}

/* ═══ 标签 ═══ */
.tag{display:inline-flex;align-items:center;padding:0 var(--space-2);height:20px;font-size:var(--font-size-xs);font-weight:var(--font-weight-medium);border-radius:var(--border-radius-tag);border:1px solid transparent;white-space:nowrap}
.tag-success{background:var(--color-success-light);color:var(--color-success-dark);border-color:#B7DEC3}
.tag-default{background:var(--color-gray-100);color:var(--text-secondary);border-color:var(--border-color-light)}

/* ═══ 分页 ═══ */
.pagination{display:flex;align-items:center;justify-content:flex-end;gap:var(--space-1);padding:var(--space-4) 0 0;font-size:var(--font-size-sm)}
.page-btn{min-width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;padding:0 var(--space-2);border:1px solid var(--border-color-light);border-radius:var(--border-radius-md);color:var(--text-primary);background:var(--bg-card);cursor:pointer;transition:all var(--transition-fast);font-family:var(--font-family);font-size:var(--font-size-sm)}
.page-btn:hover{border-color:var(--color-primary-400);color:var(--color-primary-500)}
.page-btn.active{background:var(--color-primary-500);border-color:var(--color-primary-500);color:#FFFFFF}
.page-btn:disabled{opacity:0.4;cursor:not-allowed}
</style>

<div class="search-item"><span class="search-label">项目状态</span><div class="multi-select" id="statusMultiSelect"><div class="multi-select-trigger" onclick="toggleStatusDropdown()"><span class="multi-select-text" id="statusSelectText">请选择</span><svg class="multi-select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></div><div class="multi-select-dropdown" id="statusDropdown"></div></div></div>
<button class="btn btn-primary" onclick="doSearch()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>查询</button>
<button class="btn btn-ghost" onclick="resetFilter()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>重置</button>

<div class="card">

<script>
var STORAGE_KEY = 'redlineMockData_v2';
	var DEFAULT_DATA = [
	{no:1,project:'南山区科技园综合体项目',district:'南山区',industry:'住建',projectStatus:'在建',status:'已绘制',time:'2026-04-21 10:32',area:'2,340',geo:[[[22.538,113.952],[22.544,113.960],[22.534,113.968],[22.528,113.954]]]},
	{no:2,project:'福田中心区市政管网改造工程',district:'福田区',industry:'水务',projectStatus:'在建',status:'已绘制',time:'2026-04-18 14:05',area:'1,860',geo:[[[22.548,114.055],[22.556,114.063],[22.548,114.070],[22.540,114.058]]]},
	{no:3,project:'宝安区新安街道住宅楼项目',district:'宝安区',industry:'住建',projectStatus:'备案',status:'已绘制',time:'2026-04-15 09:45',area:'2,850',geo:[[[22.570,113.895],[22.578,113.905],[22.572,113.915],[22.562,113.900]]]},
	{no:4,project:'龙华区民治街道城市更新项目',district:'龙华区',industry:'住建',projectStatus:'在建',status:'已绘制',time:'2026-04-10 16:28',area:'1,950',geo:[[[22.620,114.035],[22.628,114.045],[22.618,114.052],[22.612,114.038]]]},
	{no:5,project:'光明区凤凰城道路工程',district:'光明区',industry:'交通',projectStatus:'报建',status:'未绘制',time:'—',area:'—',geo:null},
	{no:6,project:'盐田区港口配套基础设施项目',district:'盐田区',industry:'交通',projectStatus:'停工',status:'未绘制',time:'—',area:'—',geo:null},
	{no:7,project:'罗湖区湖贝旧村改造项目',district:'罗湖区',industry:'住建',projectStatus:'竣工',status:'已绘制',time:'2026-05-10 09:15',area:'2,120',geo:[[[22.543,114.126],[22.551,114.132],[22.545,114.138],[22.538,114.130]]]}
	];

var mockData = (function(){
  try {
    var stored = localStorage.getItem(STORAGE_KEY);
    if (stored) {
      var data = JSON.parse(stored);
      var defs = JSON.parse(JSON.stringify(DEFAULT_DATA));
      var migrated = false;
      for (var i = 0; i < data.length; i++) {
        if (data[i].industry === undefined && defs[i] && defs[i].industry) {
          data[i].industry = defs[i].industry;
          migrated = true;
        }
        if (data[i].projectStatus === undefined && defs[i] && defs[i].projectStatus) {
          data[i].projectStatus = defs[i].projectStatus;
          migrated = true;
        }
      }
      if (migrated) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {} }
      return data;
    }
  } catch(e) {}
  var defaults = JSON.parse(JSON.stringify(DEFAULT_DATA));
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(defaults)); } catch(e) {}
  return defaults;
})();

var filteredData=mockData.slice();
var currentPage=1;
var pageSize=8;

/* ═══ 项目状态多选筛选 ═══ */
var projectStatusOptions=['报建','在建','备案','中止监督','完工未验收','停工','竣工','其它'];
var defaultExcludeStatus=['报建','停工','竣工'];
var selectedStatuses=projectStatusOptions.filter(function(s){return defaultExcludeStatus.indexOf(s)===-1});

function toggleStatusDropdown(){
  var dd=document.getElementById('statusDropdown');
  var trigger=dd.previousElementSibling;
  dd.classList.toggle('show');
  trigger.classList.toggle('active');
}
function updateStatusText(){
  var text=document.getElementById('statusSelectText');
  if(selectedStatuses.length===0){text.textContent='请选择';text.style.color='var(--text-tertiary)'}
  else if(selectedStatuses.length===projectStatusOptions.length){text.textContent='全部';text.style.color='var(--text-primary)'}
  else{text.textContent=selectedStatuses.join('、');text.style.color='var(--text-primary)'}
}
function renderStatusOptions(){
  var html='';
  projectStatusOptions.forEach(function(opt){
    var checked=selectedStatuses.indexOf(opt)!==-1?'checked':'';
    html+='<label class="multi-select-option"><input type="checkbox" value="'+opt+'" '+checked+' onchange="onStatusCheck(this)"><span>'+opt+'</span></label>';
  });
  document.getElementById('statusDropdown').innerHTML=html;
  updateStatusText();
}
function onStatusCheck(cb){
  if(cb.checked){if(selectedStatuses.indexOf(cb.value)===-1)selectedStatuses.push(cb.value)}
  else{selectedStatuses=selectedStatuses.filter(function(s){return s!==cb.value})}
  updateStatusText();
}
document.addEventListener('click',function(e){
  var ms=document.getElementById('statusMultiSelect');
  if(ms&&!ms.contains(e.target)){
    document.getElementById('statusDropdown').classList.remove('show');
    var trigger=ms.querySelector('.multi-select-trigger');
    if(trigger)trigger.classList.remove('active');
  }
});
renderStatusOptions();

function renderTable(data){
  var tbody=document.getElementById('tableBody');
  var start=(currentPage-1)*pageSize;
  var end=Math.min(start+pageSize,data.length);
  var html='';
  for(var i=start;i<end;i++){
    var row=data[i];
    var statusTag=row.status==='已绘制'?'<span class="tag tag-success">已绘制</span>':'<span class="tag tag-default">未绘制</span>';
    var actions='<a class="table-action-link" href="redline-view.html?idx='+i+'">查看红线</a>';
    html+='<tr data-idx="'+i+'">'
      +'<td class="col-no">'+(i+1)+'</td>'
      +'<td class="col-name1" title="'+row.project+'">'+row.project+'</td>'
            +'<td class="col-district">'+row.district+'</td>'
      +'<td class="col-industry">'+(row.industry)+'</td>'
      +'<td class="col-pstatus">'+(row.projectStatus||'—')+'</td>'
      +'<td class="col-status">'+statusTag+'</td>'
      +'<td class="col-time">'+row.time+'</td>'
      +'<td class="col-actions">'+actions+'</td>'
      +'</tr>';
  }
  tbody.innerHTML=html;

  var totalPages=Math.ceil(data.length/pageSize);
  var pagHtml='';
  pagHtml+='<button class="page-btn" '+(currentPage<=1?'disabled':'')+' onclick="goPage('+(currentPage-1)+')">‹</button>';
  for(var p=1;p<=totalPages;p++){
    pagHtml+='<button class="page-btn'+(p===currentPage?' active':'')+'" onclick="goPage('+p+')">'+p+'</button>';
  }
  pagHtml+='<button class="page-btn" '+(currentPage>=totalPages?'disabled':'')+' onclick="goPage('+(currentPage+1)+')">›</button>';
  pagHtml+='<span style="margin-left:var(--space-3);font-size:var(--font-size-sm);color:var(--text-tertiary)">共 '+data.length+' 条</span>';
  document.getElementById('pagination').innerHTML=pagHtml;
}

function applyFilter(){
  var proj=document.getElementById('filterProject').value.trim();
    var dist=document.getElementById('filterDistrict').value;
  var stat=document.getElementById('filterStatus').value;
  filteredData=mockData.filter(function(row){
    if(proj&&row.project.indexOf(proj)===-1) return false;
        if(dist&&row.district!==dist) return false;
    if(stat&&row.status!==stat) return false;
    if(selectedStatuses.length>0&&selectedStatuses.indexOf(row.projectStatus)===-1) return false;
    return true;
  });
  currentPage=1;
  renderTable(filteredData);
}

function doSearch(){ applyFilter(); }

function resetFilter(){
  document.getElementById('filterProject').value='';
    document.getElementById('filterDistrict').value='';
  document.getElementById('filterStatus').value='';
  selectedStatuses=projectStatusOptions.filter(function(s){return defaultExcludeStatus.indexOf(s)===-1});
  renderStatusOptions();
}



function goPage(p){currentPage=p;renderTable(filteredData)}

applyFilter();
</script>
</body>
