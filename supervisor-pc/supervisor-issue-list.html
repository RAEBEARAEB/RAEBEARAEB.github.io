<script>
var _items=[],_page=1,_pageSize=10;
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function loadData(){_items=MOCK_DATA.getClosureIssues();}
function renderTable(){
  loadData();
  var kw=(document.getElementById('filterKeyword').value||'').trim().toLowerCase();
  var st=document.getElementById('filterStatus').value;
  var src=document.getElementById('filterSource').value;
  var ft=document.getElementById('filterType').value;
  if(kw)_items=_items.filter(function(i){return(i.details||'').toLowerCase().indexOf(kw)>-1||(i._projectName||'').toLowerCase().indexOf(kw)>-1||(i.engineerName||'').toLowerCase().indexOf(kw)>-1;});
  if(st!=='all')_items=_items.filter(function(i){return i.status===st;});
  if(src!=='all')_items=_items.filter(function(i){return(i.source||'街道上报')===src;});
  if(ft!=='all')_items=_items.filter(function(i){return i.type===ft;});
  var total=_items.length,start=(_page-1)*_pageSize,pageItems=_items.slice(start,start+_pageSize),h='';
  pageItems.forEach(function(i,idx){
    var sc=i.status==='待整改'?'待整改':i.status==='待审核'?'待审核':i.status==='退回整改'?'退回整改':i.status==='整改逾期'?'整改逾期':i.status==='待接收'?'待接收':'审核通过';
    var sCls=i.status==='待整改'?'tag-warning':i.status==='退回整改'?'tag-warning':i.status==='待审核'?'tag-info':i.status==='整改逾期'?'tag-danger':i.status==='待接收'?'tag-warning':'tag-success';
    h+='<tr><td>'+(start+idx+1)+'</td><td><span class="issue-type-text">'+esc(i.type||'')+'</span></td><td style="text-align:left">'+esc(i._projectName||'--')+'</td><td style="text-align:left">'+esc(i.engineerName||'--')+'</td><td>'+esc(i.street||'--')+'</td><td>'+esc(i._constructUnit||i.responsibleUnit||'--')+'</td><td>'+esc(i.source||'--')+'</td><td><span class="tag '+sCls+'">'+sc+'</span></td><td>'+esc(i.reportTime||'')+'</td><td><div class="table-actions"><a class="table-action-link" href="supervisor-issue-detail.html?id='+i.id+'">详情</a>'+(i.status==='待审核'?'<a class="table-action-link warning" href="supervisor-issue-audit.html?id='+i.id+'">审核</a>':'')+'</div></td></tr>';
  });
  if(!total)h='<tr><td colspan="10" style="padding:40px;color:var(--text-tertiary)">暂无数据</td></tr>';
  document.getElementById('tableBody').innerHTML=h;
  var tp=Math.ceil(total/_pageSize),phtml='<span>共 '+total+' 条</span><div class="pagination-btns">';
  phtml+='<button '+(_page<=1?'disabled':'')+' onclick="goPage('+(_page-1)+')">&lt;</button>';
  for(var p=1;p<=Math.min(tp,8);p++)phtml+='<button class="'+(p===_page?'active':'')+'" onclick="goPage('+p+')">'+p+'</button>';
  if(tp>8){phtml+='<button disabled>...</button><button onclick="goPage('+tp+')">'+tp+'</button>';}
  phtml+='<button '+(_page>=tp?'disabled':'')+' onclick="goPage('+(_page+1)+')">&gt;</button></div>';
  document.getElementById('paginationBar').innerHTML=phtml;
  renderStatCards();
}
function renderStatCards(){
  var all=MOCK_DATA.getClosureIssues(),counts={};
  ['待整改','退回整改','待审核','整改逾期','审核通过'].forEach(function(s){counts[s]=all.filter(function(i){return i.status===s;}).length;});
  var cards=[{key:'待整改',cls:'warn'},{key:'退回整改',cls:'warn'},{key:'整改逾期',cls:'danger'},{key:'待审核',cls:'info'},{key:'审核通过',cls:'success'}];
  var h='';cards.forEach(function(c){h+='<div class="stat-card '+c.cls+'"><div class="stat-card-lbl">'+c.key+'</div><div class="stat-card-val">'+counts[c.key]+'</div></div>';});
  document.getElementById('statCards').innerHTML=h;
}
function goPage(p){_page=p;renderTable();}
(function initTypeFilter(){
  var s=document.getElementById('filterType');if(!s)return;
  var types=window.MOCK_DATA?MOCK_DATA.getStreetIssueTypes():[];
  types.forEach(function(t){var o=document.createElement('option');o.value=t;o.textContent=t;s.appendChild(o);});
})();
renderTable();
</script>
