<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
var state={view:'project',period:'',keyword:'',unit:'',group:'all',grade:'all',sortField:'rank',sortDir:'asc',page:1,pageSize:20};
var periods=[],projectRows=[],engineeringRows=[],filteredRows=[];
function esc(value){var div=document.createElement('div');div.textContent=value==null?'':String(value);return div.innerHTML;}
function clampScore(value){return Math.max(0,Math.min(100,Math.round(value*10)/10));}
function scoreGrade(score){if(score==null)return{label:'—',cls:'tag-none'};if(score>=85)return{label:'优秀',cls:'tag-excellent'};if(score>=70)return{label:'良好',cls:'tag-good'};if(score>=55)return{label:'警示',cls:'tag-warning'};return{label:'差',cls:'tag-poor'};}
function formatDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function isoWeek(d){var date=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var day=date.getUTCDay()||7;date.setUTCDate(date.getUTCDate()+4-day);var start=new Date(Date.UTC(date.getUTCFullYear(),0,1));return Math.ceil((((date-start)/86400000)+1)/7);}
function buildPeriods(){var now=new Date(),day=now.getDay()||7,currentMon=new Date(now);currentMon.setHours(0,0,0,0);currentMon.setDate(now.getDate()-day+1);var list=[];for(var i=1;i<=8;i++){var mon=new Date(currentMon);mon.setDate(mon.getDate()-i*7);var sun=new Date(mon);sun.setDate(sun.getDate()+6);list.push({value:formatDate(mon)+'~'+formatDate(sun),label:mon.getFullYear()+'年第'+isoWeek(mon)+'周',range:formatDate(mon)+' 至 '+formatDate(sun),index:i-1});}return list;}
function shortUnit(name){return String(name||'—').replace(/有限责任公司|股份有限公司|有限公司/g,'').replace(/集团$/,'集团');}
function teamFor(project){var map={'福田区':'监督一组','南山区':'监督二组','龙华区':'监督三组','罗湖区':'监督四组'};return map[project.district]||'监督综合组';}
function distinct(items){return items.filter(function(v,i,a){return v&&a.indexOf(v)===i;});}
function average(nums){var valid=nums.filter(function(n){return typeof n==='number'&&!isNaN(n);});return valid.length?Math.round(valid.reduce(function(a,b){return a+b;},0)/valid.length*10)/10:null;}
function getSourceProjects(){
  var projects=[];

    if(window.MOCK_DATA){
      if(typeof window.MOCK_DATA.getProjects==='function')projects=window.MOCK_DATA.getProjects()||[];

function projectHoardings(project){

  return rows.map(function(item){
    var copy={};Object.keys(item||{}).forEach(function(key){copy[key]=item[key];});

  });
}
function buildScoreRows(){
  var projects=getSourceProjects(),periodScoreMaps={};
  periods.forEach(function(period){
    var baseScores=[],start=period.value.split('~')[0].split('-');

      });
      var participated=engineScores.length>0&&engineScores.some(function(s){return s!=null;}),projectScore=participated?average(engineScores):null,units=distinct(engines.map(function(e){return e.unit;}).filter(function(u){return u&&u!=='—';})),total=projectScore==null?null:clampScore(projectScore+((pIndex%5)-2)),grade=scoreGrade(projectScore);
      projectRows.push({id:'P-'+pIndex+'-'+periodIndex,period:period.value,projectName:project.name,units:units,group:teamFor(project),score:projectScore,grade:grade.label,gradeCls:grade.cls,total:total,participated:participated,reason:participated?'':'本期项目下未安装围挡，不参与评分',projectStatus:project.status||''});
    });

}

function getKeywordCandidates(){
  var seen={},items=[];

    projectRows.forEach(function(r){if(!seen[r.projectName]){seen[r.projectName]=true;items.push({value:r.projectName,name:r.projectName,sub:(r.units||[]).join('；')||'暂无责任单位'});}});

function toggleScoreHelp(e){e.stopPropagation();var pop=document.getElementById('scorePopover'),open=!pop.classList.contains('show');pop.classList.toggle('show',open);document.getElementById('scoreHelpBtn').setAttribute('aria-expanded',open?'true':'false');}
document.addEventListener('click',function(e){var pop=document.getElementById('scorePopover');if(pop&&!pop.contains(e.target)){pop.classList.remove('show');document.getElementById('scoreHelpBtn').setAttribute('aria-expanded','false');}var auto=document.getElementById('keywordAutocomplete');if(auto&&!auto.contains(e.target))closeKeywordSuggestions();});
function exportCurrentResults(){var rows=getFilteredRows(),period=periods.find(function(p){return p.value===state.period;}),viewText=state.view==='project'?'按项目':'按工程';if(!rows.length){showToast('当前条件下没有可导出的结果');return;}var aoa=[];if(state.view==='project'){aoa.push(['本期全市排名','项目名称','责任单位','监督组','本期得分','本期等级','总分','参评说明']);rows.forEach(function(r){aoa.push([r.rank||'—',r.projectName,(r.units||[]).join('；')||'—',r.group,r.score==null?'—':r.score,r.grade,r.total==null?'—':r.total,r.reason||'已参与评分']);});}else{aoa.push(['工程名称','关联项目','责任单位','监督组','本期得分','本期等级','总分','参评说明']);rows.forEach(function(r){aoa.push([r.engineeringName,r.projectName,r.unit,r.group,r.score==null?'—':r.score,r.grade,r.total==null?'—':r.total,r.reason||'已参与评分']);});}var filename='围挡评分管理_'+viewText+'_'+(period?period.label:'评分周期')+'.xlsx';if(window.XLSX){var wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet(aoa);XLSX.utils.book_append_sheet(wb,ws,'评分结果');XLSX.writeFile(wb,filename);showToast('已导出当前筛选范围全部结果');}else{var csv='\uFEFF'+aoa.map(function(row){return row.map(function(v){return'"'+String(v==null?'':v).replace(/"/g,'""')+'"';}).join(',');}).join('\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename.replace(/\.xlsx$/,'.csv');a.click();URL.revokeObjectURL(a.href);showToast('已导出当前结果（CSV）');}}
var toastTimer=null;function showToast(text){var el=document.getElementById('toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove('show');},2200);}
(function init(){periods=buildPeriods();buildScoreRows();populateFilters();render();})();
</script>
