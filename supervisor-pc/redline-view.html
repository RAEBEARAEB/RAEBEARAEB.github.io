  --border-radius-sm:2px;--border-radius-md:4px;--border-radius-lg:6px;--border-radius-tag:2px;
  --bg-page:var(--color-gray-50);--bg-card:var(--color-gray-0);--bg-table-head:var(--color-gray-100);
  --bg-table-stripe:var(--color-gray-50);--bg-sidebar:#0D2B55;--bg-header:#FFFFFF;--bg-overlay:rgba(0,0,0,0.45);
  --shadow-sm:0 1px 2px rgba(0,0,0,0.04);--shadow-md:0 2px 8px rgba(0,0,0,0.06);

  --font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --font-size-xs:12px;--font-size-sm:13px;--font-size-md:14px;--font-size-lg:16px;
  --font-size-xl:18px;--font-size-2xl:20px;--font-size-3xl:24px;
  --font-weight-regular:400;--font-weight-medium:500;--font-weight-bold:600;
  --line-height-tight:1.4;--line-height-normal:1.6;--line-height-loose:1.8;

  --height-sm:28px;--height-md:32px;--height-lg:36px;
  --header-height:56px;--sidebar-width:220px;

.leaflet-container{font-family:var(--font-family)!important;background:#E8ECF2}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font-family);font-size:var(--font-size-md);color:var(--text-primary);background:var(--bg-page);line-height:var(--line-height-normal);-webkit-font-smoothing:antialiased;height:100%}

::-webkit-scrollbar-thumb{background:var(--color-gray-300);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--color-gray-400)}

/* ═══ 布局 ═══ */
.layout-wrapper{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.layout-header{height:var(--header-height);background:var(--bg-header);display:flex;align-items:center;padding:0;position:fixed;top:0;left:0;right:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.layout-header::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--color-primary-600),var(--color-primary-400),var(--color-primary-600))}
.header-logo{display:flex;align-items:center;gap:var(--space-4);padding:0 var(--space-6);height:100%;border-right:1px solid var(--color-gray-100)}
.header-logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--color-primary-500),var(--color-primary-700));border-radius:var(--border-radius-md);display:flex;align-items:center;justify-content:center;color:var(--text-inverse);box-shadow:0 2px 6px rgba(24,98,212,0.25)}
.header-logo-text{font-size:var(--font-size-xl);font-weight:var(--font-weight-bold);color:var(--text-title);letter-spacing:0.02em}
.header-right{margin-left:auto;display:flex;align-items:center;gap:0;height:100%;padding:0 var(--space-5)}
.header-action-group{display:flex;align-items:center;gap:2px;padding:0 var(--space-3);border-right:1px solid var(--color-gray-100);height:100%}
.header-action-btn{position:relative;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:var(--border-radius-md);cursor:pointer;transition:background var(--transition-fast);background:none;border:none;color:var(--text-secondary)}
.header-action-btn:hover{background:var(--color-gray-50);color:var(--text-primary)}
.header-action-btn svg{width:18px;height:18px}
.header-badge{position:absolute;top:4px;right:4px;min-width:16px;height:16px;background:var(--color-danger);color:var(--text-inverse);font-size:10px;font-weight:var(--font-weight-bold);border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;line-height:1;border:2px solid var(--bg-header)}
.header-user{display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);cursor:pointer;height:36px;border-radius:var(--border-radius-md);transition:background var(--transition-fast)}
.header-user:hover{background:var(--color-gray-50)}
.header-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--color-primary-100),var(--color-primary-200));display:flex;align-items:center;justify-content:center;font-size:var(--font-size-xs);color:var(--color-primary-700);font-weight:var(--font-weight-medium)}
.header-user-info{display:flex;flex-direction:column;line-height:1.3}
.header-user-name{font-size:var(--font-size-sm);color:var(--text-primary);font-weight:var(--font-weight-medium)}
.header-user-role{font-size:10px;color:var(--text-tertiary)}
.layout-body{display:flex;margin-top:var(--header-height);height:calc(100vh - var(--header-height));overflow:hidden}
.layout-sidebar{width:var(--sidebar-width);background:var(--bg-sidebar);height:100%;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column}
.nav-menu{list-style:none;padding:var(--space-4) 0;flex:1}
.nav-group-label{padding:var(--space-5) var(--space-5) var(--space-1);font-size:11px;color:rgba(255,255,255,0.25);letter-spacing:0.08em;font-weight:var(--font-weight-medium);text-transform:uppercase}
.nav-item{position:relative}
.nav-item a{display:flex;align-items:center;gap:var(--space-3);padding:0 var(--space-5);height:40px;font-size:var(--font-size-sm);color:rgba(255,255,255,0.55);transition:all var(--transition-fast);text-decoration:none;position:relative}
.nav-item a:hover{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.85)}
.nav-item a.active{background:rgba(24,98,212,0.25);color:#FFFFFF;font-weight:var(--font-weight-medium)}
.nav-item a.active::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:3px;background:#FFFFFF;border-radius:0 2px 2px 0}
.nav-icon{width:16px;height:16px;flex-shrink:0;opacity:0.7}
.nav-item a.active .nav-icon{opacity:1}
.sidebar-bottom{padding:var(--space-3) var(--space-5);border-top:1px solid rgba(255,255,255,0.06)}

.layout-main{flex:1;background:var(--bg-page);display:flex;flex-direction:column;min-height:0}

.breadcrumb{display:flex;align-items:center;gap:var(--space-1);font-size:var(--font-size-sm);margin-bottom:var(--space-2);padding:var(--space-3) var(--space-6) 0;flex-shrink:0}

.page-header-actions{display:flex;gap:var(--space-3)}

/* ═══ 按钮 ═══ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-1);height:var(--height-md);padding:0 var(--space-4);font-size:var(--font-size-md);font-weight:var(--font-weight-medium);border-radius:var(--border-radius-md);border:1px solid transparent;cursor:pointer;transition:all var(--transition-fast);white-space:nowrap;line-height:1;outline:none;font-family:var(--font-family)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:0.5;cursor:not-allowed;pointer-events:none}
.btn-ghost{background:transparent;color:var(--text-secondary);border-color:var(--border-color-default)}
.btn-ghost:hover{background:var(--color-gray-100);color:var(--text-primary)}

/* ═══ 主内容区 ═══ */
.main-body{display:flex;flex:1;min-height:0;flex-direction:column;padding:var(--space-4) var(--space-6);gap:var(--space-4)}

.info-card{background:var(--bg-card);border:1px solid var(--border-color-light);border-radius:var(--border-radius-lg);box-shadow:var(--shadow-card);padding:var(--space-4) var(--space-6);flex-shrink:0}

.map-area{flex:1;display:flex;flex-direction:column;min-height:0}
.map-empty-overlay{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-3);color:var(--text-tertiary);background:rgba(255,255,255,0.6);z-index:500;pointer-events:none}

.toast{position:fixed;top:var(--space-6);left:50%;transform:translateX(-50%);z-index:2000;padding:var(--space-3) var(--space-6);background:var(--color-success);color:#fff;font-size:var(--font-size-sm);border-radius:var(--border-radius-md);box-shadow:var(--shadow-lg);display:none;align-items:center;gap:var(--space-2)}
.toast.show{display:flex}

/* ═══ 弹窗 ═══ */
.modal-overlay{position:fixed;inset:0;background:var(--bg-overlay);z-index:1000;display:flex;align-items:center;justify-content:center}
.modal{background:var(--bg-card);border-radius:var(--border-radius-lg);box-shadow:var(--shadow-lg);width:560px;max-width:90vw;max-height:80vh;display:flex;flex-direction:column}
.modal-header{padding:var(--space-5) var(--space-6);border-bottom:1px solid var(--border-color-light);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-title{font-size:var(--font-size-xl);font-weight:var(--font-weight-bold);color:var(--text-title)}
.modal-close{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:var(--border-radius-md);cursor:pointer;background:none;border:none;color:var(--text-tertiary)}
.modal-close:hover{background:var(--color-gray-100);color:var(--text-primary)}
.modal-body{padding:var(--space-6);overflow-y:auto;flex:1}
/* ═══ 变更记录 ═══ */
.ch-modal .modal{width:900px;max-width:95vw;max-height:85vh}
.timeline{padding:0;position:relative}
.timeline::before{content:'';position:absolute;left:15px;top:0;bottom:0;width:2px;background:var(--border-color-default)}
.timeline-card{position:relative;padding-left:40px;margin-bottom:24px}
.timeline-card:last-child{margin-bottom:0}
.timeline-dot{position:absolute;left:10px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--color-primary-500);border:2px solid #fff;box-shadow:0 0 0 2px var(--color-primary-200)}
.timeline-dot.first{background:var(--color-success);box-shadow:0 0 0 2px rgba(26,144,66,0.2)}
.ch-time{font-size:var(--font-size-sm);color:var(--text-secondary);margin-bottom:2px}
.ch-type{font-size:11px;color:var(--color-primary-500);font-weight:var(--font-weight-medium);margin-left:var(--space-2)}
.ch-meta{font-size:var(--font-size-xs);color:var(--text-tertiary);margin-bottom:var(--space-2);display:flex;gap:var(--space-4)}
.ch-maps{display:flex;gap:var(--space-3)}
.ch-map-wrap{flex:1;min-width:0}
.ch-map-label{font-size:11px;color:var(--text-tertiary);margin-bottom:4px;font-weight:var(--font-weight-medium)}
.ch-map{width:100%;height:180px;border-radius:var(--border-radius-md);border:1px solid var(--border-color-light);overflow:hidden}
.ch-empty-map{width:100%;height:180px;border-radius:var(--border-radius-md);border:1px dashed var(--border-color-default);display:flex;align-items:center;justify-content:center;font-size:var(--font-size-xs);color:var(--text-tertiary);background:var(--color-gray-50)}
</style>

<button class="btn btn-ghost" onclick="window.location.href='redline.html?idx='+urlIdx">返回列表</button>
</div>
</div>

<div class="main-body">

</div>
<div class="info-card-item">
<span class="info-card-label">行业类型</span>

</div>
<div class="info-card-item">
<span class="info-card-label">项目状态</span>
<span class="info-card-value" id="infoProjectStatus">-</span>
</div>
<div class="info-card-item">
<span class="info-card-label">更新时间</span>
<span class="info-card-value" id="infoTime">-</span>
</div>
</div>
</div>

<div class="map-area">
<div class="map-draw-container">
<div id="viewRedlineMap"></div>
<div class="map-empty-overlay" id="emptyOverlay">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
<span>该项目尚未绘制红线</span>

<div class="map-info-bar" id="viewMapInfo">

</div>
</div>
</div>
</main>
</div>
</div>

<div class="toast" id="toast"></div>

<!-- 变更记录弹窗 -->
<div class="modal-overlay ch-modal" id="changeHistoryModal" style="display:none">
<div class="modal">
<div class="modal-header">
<span class="modal-title">红线变更记录</span>
<button class="modal-close" onclick="closeChangeHistory()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
</div>
<div class="modal-body" id="changeHistoryBody"></div>
</div>
</div>

<script>
/* ═══ 数据加载 ═══ */
var STORAGE_KEY = 'redlineMockData_v2';
	var DEFAULT_DATA = [
	{no:1,project:'南山区科技园综合体项目',district:'南山区',industry:'住建',projectStatus:'在建',status:'已绘制',time:'2026-04-21 10:32',area:'2,340',geo:[[[22.538,113.952],[22.544,113.960],[22.534,113.968],[22.528,113.954]]]},
	{no:2,project:'福田中心区市政管网改造工程',district:'福田区',industry:'水务',projectStatus:'在建',status:'已绘制',time:'2026-04-18 14:05',area:'1,860',geo:[[[22.548,114.055],[22.556,114.063],[22.548,114.070],[22.540,114.058]]]},
	{no:3,project:'宝安区新安街道住宅楼项目',district:'宝安区',industry:'住建',projectStatus:'备案',status:'已绘制',time:'2026-04-15 09:45',area:'2,850',geo:[[[22.570,113.895],[22.578,113.905],[22.572,113.915],[22.562,113.900]]]},
	{no:4,project:'龙华区民治街道城市更新项目',district:'龙华区',industry:'住建',projectStatus:'在建',status:'已绘制',time:'2026-04-10 16:28',area:'1,950',geo:[[[22.620,114.035],[22.628,114.045],[22.618,114.052],[22.612,114.038]]]},
	{no:5,project:'光明区凤凰城道路工程',district:'光明区',industry:'交通',projectStatus:'报建',status:'未绘制',time:'—',area:'—',geo:null},
	{no:6,project:'盐田区港口配套基础设施项目',district:'盐田区',industry:'交通',projectStatus:'停工',status:'未绘制',time:'—',area:'—',geo:null},
	{no:7,project:'罗湖区湖贝旧村改造项目',district:'罗湖区',industry:'住建',projectStatus:'竣工',status:'已绘制',time:'2026-05-10 09:15',area:'2,120',geo:[[[22.543,114.126],[22.551,114.132],[22.545,114.138],[22.538,114.130]]]}
	];

var mockData = (function(){
  try {
    var stored = localStorage.getItem(STORAGE_KEY);
    if (stored) {
      var data = JSON.parse(stored);
      var defs = JSON.parse(JSON.stringify(DEFAULT_DATA));
      var migrated = false;
      for (var i = 0; i < data.length; i++) {
        if (data[i].industry === undefined && defs[i] && defs[i].industry) {
          data[i].industry = defs[i].industry;
          migrated = true;
        }
        if (data[i].projectStatus === undefined && defs[i] && defs[i].projectStatus) {
          data[i].projectStatus = defs[i].projectStatus;
          migrated = true;
        }
      }
      if (migrated) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {} }
      return data;
    }
  } catch(e) {}
  var defaults = JSON.parse(JSON.stringify(DEFAULT_DATA));
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(defaults)); } catch(e) {}
  return defaults;
})();

/* ═══ URL 参数 ═══ */
var urlIdx = (function(){
  var m = window.location.search.match(/idx=(\d+)/);
  return m ? parseInt(m[1], 10) : -1;
})();

if (urlIdx < 0 || urlIdx >= mockData.length) {
  window.location.href = 'redline.html';
}

var row = mockData[urlIdx];
function normalizeGeo(geo) {
  if (!geo || geo.length === 0) return [];
  if (Array.isArray(geo[0]) && Array.isArray(geo[0][0]) && typeof geo[0][0][0] === 'number') return geo;
  if (typeof geo[0][0] === 'number') return [geo];
  return [];
}

function normalizeGeoShapes(geo) {
  if (!geo || geo.length === 0) return [];
  // New format: array of {type, points}
  if (geo[0] && typeof geo[0].type === 'string' && Array.isArray(geo[0].points)) {
    return geo;
  }
  // Old format: array of coordinate arrays - convert to polygon shapes
  var pts = normalizeGeo(geo);
  return pts.map(function(p) { return {type: 'polygon', points: p}; });
}
var geoShapes = normalizeGeoShapes(row.geo);
var hasRedline = false;
for (var si = 0; si < geoShapes.length; si++) {
  var sp = geoShapes[si];
  if (sp.points && sp.points.length >= (sp.type === 'line' ? 2 : 3)) {
    hasRedline = true;
    break;
  }
}

document.getElementById('infoProject').textContent = row.project;
document.getElementById('infoDistrict').textContent = row.district;
	document.getElementById('infoIndustry').textContent = row.industry || '—';
document.getElementById('infoProjectStatus').textContent = row.projectStatus || '—';
document.getElementById('infoTime').textContent = row.time;
document.getElementById('pageTitle').textContent = '查看红线 — ' + row.project;
document.title = '查看红线 — ' + row.project + ' — 深圳市建设施工围挡数字化管理系统';

/* ═══ 地图 ═══ */
var viewMap = null, viewPolygons = [];

function initViewMap() {
  if (viewMap) return;
  try {
    viewMap = L.map('viewRedlineMap', { zoomControl: false }).setView([22.55, 114.05], 12);
    L.control.zoom({ position: 'bottomright' }).addTo(viewMap);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri', maxZoom: 19 }).addTo(viewMap);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(viewMap);
  } catch(e) {}
}

function renderPolygon() {
  initViewMap();
  setTimeout(function() {
    viewMap.invalidateSize();
    viewPolygons.forEach(function(l) { viewMap.removeLayer(l); });
    viewPolygons = [];
    if (hasRedline) {
      var group = L.featureGroup();
      geoShapes.forEach(function(shape) {
        var pts = shape.points;
        var isLine = shape.type === 'line';
        if (!pts || pts.length < (isLine ? 2 : 3)) return;
        var layer;
        if (isLine) {
          layer = L.polyline(pts, { color: '#D13B2F', weight: 3 }).addTo(viewMap);
        } else {
          layer = L.polygon(pts, { color: '#D13B2F', weight: 2.5, fillColor: 'rgba(209,59,47,0.15)', fillOpacity: 0.5 }).addTo(viewMap);
        }
        viewPolygons.push(layer);
        group.addLayer(layer);
      });
      try { viewMap.fitBounds(group.getBounds(), { padding: [30, 30], maxZoom: 17 }); } catch(e) {}
      document.getElementById('viewMapInfo').style.display = 'flex';
      document.getElementById('emptyOverlay').style.display = 'none';
    } else {
      document.getElementById('viewMapInfo').style.display = 'none';
      document.getElementById('emptyOverlay').style.display = 'flex';
    }
  }, 300);
}

window.addEventListener('DOMContentLoaded', function() {
  renderPolygon();
});

/* ═══ 变更记录 ═══ */
var chMaps = [];
var changeHistoryData = {
  0:[
    {time:'2026-05-10 14:20',unit:'中建三局第一建设工程有限公司',operator:'李建明',type:'范围调整',
     before:[[[22.538,113.952],[22.544,113.960],[22.534,113.968],[22.528,113.954]]],
     after:[[[22.536,113.950],[22.546,113.958],[22.536,113.966],[22.526,113.956]]]},
    {time:'2026-04-21 10:32',unit:'中建三局第一建设工程有限公司',operator:'李建明',type:'初始绘制',
     before:null,
     after:[[[22.538,113.952],[22.544,113.960],[22.534,113.968],[22.528,113.954]]]}
  ],
  1:[
    {time:'2026-05-06 11:08',unit:'深圳市水务工程建设有限公司',operator:'王志刚',type:'范围扩展',
     before:[[[22.548,114.055],[22.556,114.063],[22.548,114.070],[22.540,114.058]]],
     after:[[[22.546,114.052],[22.558,114.060],[22.550,114.072],[22.540,114.060],[22.538,114.050]]]},
    {time:'2026-04-18 14:05',unit:'深圳市水务工程建设有限公司',operator:'王志刚',type:'初始绘制',
     before:null,
     after:[[[22.548,114.055],[22.556,114.063],[22.548,114.070],[22.540,114.058]]]}
  ],
  2:[
    {time:'2026-04-15 09:45',unit:'宝安建工集团有限公司',operator:'陈国华',type:'初始绘制',
     before:null,
     after:[[[22.570,113.895],[22.578,113.905],[22.572,113.915],[22.562,113.900]]]}
  ],
  3:[
    {time:'2026-04-10 16:28',unit:'龙华建设发展有限公司',operator:'张伟',type:'初始绘制',
     before:null,
     after:[[[22.620,114.035],[22.628,114.045],[22.618,114.052],[22.612,114.038]]]}
  ],
  6:[
    {time:'2026-05-15 16:40',unit:'罗湖建筑工务署',operator:'刘明',type:'范围调整',
     before:[[[22.545,114.128],[22.553,114.134],[22.547,114.140]]],
     after:[[[22.543,114.126],[22.551,114.132],[22.545,114.138],[22.538,114.130]]]},
    {time:'2026-05-10 09:15',unit:'罗湖建筑工务署',operator:'刘明',type:'初始绘制',
     before:null,
     after:[[[22.545,114.128],[22.553,114.134],[22.547,114.140]]]}
  ]
};

function openChangeHistory(){
  destroyChMaps();
  var records=changeHistoryData[urlIdx];
  if(!records||records.length===0){
    document.getElementById('changeHistoryBody').innerHTML='<div style="display:flex;flex-direction:column;align-items:center;padding:48px 0;color:var(--text-tertiary);gap:12px"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.25"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><div style="font-size:13px">暂无变更记录</div></div>';
    document.getElementById('changeHistoryModal').style.display='flex';
    return;
  }
  var html='<div class="timeline">';
  records.forEach(function(rec,i){
    var isFirst=i===records.length-1;
    html+='<div class="timeline-card">';
    html+='<div class="timeline-dot'+(isFirst?' first':'')+'"></div>';
    html+='<div class="ch-time">'+rec.time+'<span class="ch-type">'+rec.type+'</span></div>';
    html+='<div class="ch-meta"><span>操作单位：'+rec.unit+'</span><span>操作人：'+rec.operator+'</span></div>';
    html+='<div class="ch-maps">';
    html+='<div class="ch-map-wrap"><div class="ch-map-label">变更前</div>';
    if(rec.before&&rec.before.length>0&&rec.before[0].length>=3){
      html+='<div class="ch-map" id="ch-before-'+i+'"></div>';
    }else{
      html+='<div class="ch-empty-map">无历史红线</div>';
    }
    html+='</div>';
    html+='<div class="ch-map-wrap"><div class="ch-map-label">变更后</div>';
    if(rec.after&&rec.after.length>0&&rec.after[0].length>=3){
      html+='<div class="ch-map" id="ch-after-'+i+'"></div>';
    }else{
      html+='<div class="ch-empty-map">无红线数据</div>';
    }
    html+='</div></div></div>';
  });
  html+='</div>';
  document.getElementById('changeHistoryBody').innerHTML=html;
  document.getElementById('changeHistoryModal').style.display='flex';
  setTimeout(function(){initChMaps(records)},300);
}

function initChMaps(records){
  records.forEach(function(rec,i){
    if(rec.before&&rec.before.length>0&&rec.before[0].length>=3){
      var el=document.getElementById('ch-before-'+i);
      if(el){
        var m=L.map(el,{zoomControl:false,attributionControl:false}).setView([22.55,114.05],12);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(m);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(m);
        var g=L.featureGroup();
        rec.before.forEach(function(pts){if(pts.length>=3){g.addLayer(L.polygon(pts,{color:'#9CA3B0',weight:2,fillColor:'rgba(156,163,176,0.15)',fillOpacity:0.5,dashArray:'4 3'}).addTo(m))}});
        try{m.fitBounds(g.getBounds(),{padding:[10,10],maxZoom:17})}catch(e){}
        chMaps.push(m);
      }
    }
    if(rec.after&&rec.after.length>0&&rec.after[0].length>=3){
      var el2=document.getElementById('ch-after-'+i);
      if(el2){
        var m2=L.map(el2,{zoomControl:false,attributionControl:false}).setView([22.55,114.05],12);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(m2);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(m2);
        var g2=L.featureGroup();
        rec.after.forEach(function(pts){if(pts.length>=3){g2.addLayer(L.polygon(pts,{color:'#D13B2F',weight:2,fillColor:'rgba(209,59,47,0.15)',fillOpacity:0.5}).addTo(m2))}});
        try{m2.fitBounds(g2.getBounds(),{padding:[10,10],maxZoom:17})}catch(e){}
        chMaps.push(m2);
      }
    }
  });
}

function destroyChMaps(){chMaps.forEach(function(m){m.remove()});chMaps=[]}
function closeChangeHistory(){document.getElementById('changeHistoryModal').style.display='none';setTimeout(destroyChMaps,200)}
</script>
</body>
</html>
