<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全景巡查 — 深圳市建设施工围挡数字化管理系统</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<style>
/* ═══════════════════════════════════════════════════════════════════════
   Design Tokens — Refined Government Command-Center Palette
   ═══════════════════════════════════════════════════════════════════════ */
:root {
  --ink-900: #0f172a; --ink-800: #1e293b; --ink-700: #334155;
  --ink-600: #475569; --ink-500: #64748b; --ink-400: #94a3b8;
  --ink-300: #cbd5e1; --ink-200: #e2e8f0; --ink-150: #f0f4f8;
  --ink-100: #f5f7fa; --ink-50: #fafbfc; --white: #fff;
  --accent-500: #1d5fcd; --accent-400: #3275e5; --accent-300: #5b93f0;
  --accent-50: #eef4fd; --accent-30: #f5f8fe;
  --success-500: #16a34a; --success-50: #f0fdf4;
  --warning-500: #d97706; --warning-50: #fffbeb;
  --danger-500: #dc2626; --danger-50: #fef2f2;
  --navy-900: #0a1929; --navy-800: #0f2744; --navy-sidebar: #0d2137;
  --radius-sm: 4px; --radius: 6px; --radius-lg: 8px; --radius-xl: 12px;
  --header-h: 54px; --sidebar-w: 220px;
  --font-base: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", system-ui, sans-serif;
  --shadow-xs: 0 1px 2px rgba(0,0,0,.04);
  --shadow-sm: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,.07);
  --ease-out: 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  --ease-smooth: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  /* Shared tokens needed by form components */
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px;
  --space-6:24px; --space-8:32px; --space-10:40px; --space-12:48px;
  --font-size-xs:12px; --font-size-sm:13px; --font-size-md:14px; --font-size-lg:16px;
  --font-weight-regular:400; --font-weight-medium:500; --font-weight-bold:600;
  --line-height-tight:1.4; --line-height-normal:1.6; --line-height-loose:1.8;
  --text-primary:var(--ink-800); --text-secondary:var(--ink-600); --text-tertiary:var(--ink-400);
  --text-title:var(--ink-900); --text-link:var(--accent-500);
  --border-color-light:var(--ink-200); --border-color-default:var(--ink-300);
  --height-md:32px; --height-lg:36px;
  --bg-card:var(--white); --bg-page:var(--ink-100);
  --color-primary-500:#1862D4; --color-primary-600:#104FAD; --color-primary-50:#EBF2FF;
  --color-danger:#D13B2F; --color-danger-light:#FDECEA;
  --color-gray-400:#9CA3B0; --color-gray-600:#6B7280; --color-gray-100:#F0F1F5;
  --border-radius-lg:6px; --transition-fast:0.15s ease;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  font-family: var(--font-base); font-size: 14px; color: var(--ink-800);
  background: var(--ink-100); line-height: 1.5; height: 100%;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
a { color: var(--accent-500); text-decoration: none; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--ink-300); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--ink-400); }

/* ═══════════════════════════════════════════════════════════════════════
   Shell — Header / Sidebar / Main
   ═══════════════════════════════════════════════════════════════════════ */
.layout-wrapper { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
.layout-header {
  height: var(--header-h); background: var(--white); display: flex; align-items: center;
  position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 0;
  border-bottom: 1px solid var(--ink-200); flex-shrink: 0;
}
.layout-header::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, #1a3c7a 0%, var(--accent-500) 50%, #1a3c7a 100%);
}
.header-logo {
  display: flex; align-items: center; gap: 10px; padding: 0 20px; height: 100%;
  border-right: 1px solid var(--ink-200);
}
.header-logo-icon {
  width: 34px; height: 34px; background: linear-gradient(135deg, #153e75, #1d5fcd);
  border-radius: var(--radius); display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 16px; flex-shrink: 0;
}
.header-logo-icon svg { width: 18px; height: 18px; }
.header-logo-text { font-size: 15px; font-weight: 600; color: var(--ink-900); letter-spacing: .02em; white-space: nowrap; }
.header-right { margin-left: auto; display: flex; align-items: center; height: 100%; padding: 0 16px; gap: 4px; }
.header-dashboard-btn{display:inline-flex;align-items:center;gap:6px;padding:0 16px;height:36px;font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);color:#fff;background:linear-gradient(135deg,#1D4ED8,#2563EB,#3B82F6);border-radius:var(--border-radius-md);cursor:pointer;transition:all var(--transition-fast);white-space:nowrap;text-decoration:none;border:1px solid rgba(37,99,235,0.4);box-shadow:0 2px 10px rgba(29,78,216,0.25),inset 0 1px 0 rgba(255,255,255,0.15);font-family:var(--font-family)}
.header-dashboard-btn:hover{background:linear-gradient(135deg,#1E40AF,#1D4ED8,#2563EB);box-shadow:0 4px 16px rgba(29,78,216,0.4),inset 0 1px 0 rgba(255,255,255,0.2);transform:translateY(-1px)}
.header-dashboard-btn svg{width:16px;height:16px;flex-shrink:0}
.header-user { display: flex; align-items: center; gap: 8px; padding: 6px 8px; cursor: pointer; border-radius: var(--radius); transition: background .15s; }
.header-user:hover { background: var(--ink-100); }
.header-avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, #dbeafe, #bfdbfe); display: flex; align-items: center; justify-content: center; font-size: 12px; color: #1e40af; font-weight: 600; flex-shrink: 0; }
.header-user-info { display: flex; flex-direction: column; line-height: 1.3; }
.header-user-name { font-size: 13px; color: var(--ink-800); font-weight: 500; }
.header-user-role { font-size: 10px; color: var(--ink-400); }
.layout-body { display: flex; margin-top: var(--header-h); height: calc(100vh - var(--header-h)); overflow: hidden; }
.layout-sidebar { width: var(--sidebar-w); background: var(--navy-sidebar); flex-shrink: 0; display: flex; flex-direction: column; overflow-y: auto; }
.nav-menu { list-style: none; padding: 12px 0; flex: 1; }
.nav-group-label { font-size: 10px; color: rgba(255,255,255,.22); letter-spacing: .1em; padding: 14px 20px 6px; font-weight: 600; text-transform: uppercase; }
.nav-item { position: relative; margin: 0 8px; border-radius: var(--radius); overflow: hidden; }
.nav-item a {
  display: flex; align-items: center; gap: 10px; padding: 0 12px; height: 38px;
  font-size: 13px; color: rgba(255,255,255,.55); transition: all var(--ease-out);
  text-decoration: none; border-radius: var(--radius);
}
.nav-item a:hover { background: rgba(255,255,255,.06); color: rgba(255,255,255,.85); }
.nav-item a.active { background: rgba(255,255,255,.1); color: #fff; font-weight: 500; }
.nav-item a.active::before { display: none; }
.nav-icon { width: 16px; height: 16px; flex-shrink: 0; opacity: .7; }
.nav-item a.active .nav-icon { opacity: 1; }
.sidebar-bottom { padding: 10px 16px; border-top: 1px solid rgba(255,255,255,.06); display: none; }
.sidebar-version { font-size: 10px; color: rgba(255,255,255,.15); }

.layout-main { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; background: var(--ink-100); }
.breadcrumb { display: flex; align-items: center; gap: 4px; font-size: 12px; padding: 10px 20px 0; flex-shrink: 0; }
.breadcrumb a, .breadcrumb-item { color: var(--ink-400); } .breadcrumb a:hover { color: var(--accent-500); }
.breadcrumb .current { color: var(--ink-700); font-weight: 500; }
.breadcrumb-sep { color: var(--ink-300); font-size: 10px; margin: 0 2px; }

.page-header-fixed {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 20px; flex-shrink: 0;
}
.page-title { font-size: 18px; font-weight: 600; color: var(--ink-900); display: flex; align-items: center; gap: 10px; }
.page-title-accent { width: 3px; height: 18px; background: var(--accent-500); border-radius: 2px; display: inline-block; }

/* ═══════════════════════════════════════════════════════════════════════
   Three-Panel Body
   ═══════════════════════════════════════════════════════════════════════ */
.patrol-body { display: flex; flex: 1; min-height: 0; overflow: hidden; }

/* ── Left Panel ── */
.panel-left {
  width: 288px; flex-shrink: 0; background: var(--white);
  display: flex; flex-direction: column; overflow: hidden; border-right: 1px solid var(--ink-200);
}
.panel-left-header {
  padding: 14px 18px; font-size: 14px; font-weight: 600; color: var(--ink-900);
  border-bottom: 1px solid var(--ink-150); flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  letter-spacing: .02em;
}
.panel-left-header .count { font-size: 11px; color: var(--ink-400); font-weight: 400; background: var(--ink-100); padding: 2px 8px; border-radius: 10px; }
.panel-left-search { padding: 8px 12px; border-bottom: 1px solid var(--ink-100); flex-shrink: 0; display: flex; align-items: center; gap: 6px; background: var(--ink-50) }
.panel-left-search input { flex: 1; border: none; outline: none; background: transparent; font-size: 12px; color: var(--ink-800); font-family: var(--font-base) }
.panel-left-search input::placeholder { color: var(--ink-400) }
.panel-left-filter { display: flex; gap: 0; padding: 6px 12px; border-bottom: 1px solid var(--ink-100); flex-shrink: 0; background: var(--ink-50) }
.panel-left-filter .ftab { flex: 1; text-align: center; padding: 4px 0; font-size: 11px; font-weight: 500; color: var(--ink-400); cursor: pointer; border-radius: var(--radius); transition: all .15s; font-family: var(--font-base) }
.panel-left-filter .ftab:hover { color: var(--ink-600); background: var(--ink-100) }
.panel-left-filter .ftab.active { color: var(--white); background: var(--accent-500) }
.panel-left-scroll { flex: 1; overflow-y: auto; padding: 6px 10px; }
.project-card.hidden-by-search { display: none !important; }

.project-card {
  background: var(--white); border: 1px solid var(--ink-150); border-radius: var(--radius-lg);
  margin-bottom: 6px; cursor: pointer; transition: all var(--ease-out); padding: 12px 14px;
}
.project-card:hover { border-color: var(--ink-300); }
.project-card.expanded { border-color: var(--ink-300); background: var(--ink-50); }
.proj-name { font-size: 13px; font-weight: 600; color: var(--ink-900); line-height: 1.4; margin-bottom: 6px; }
.proj-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.proj-status {
  font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 500; white-space: nowrap;
}
.proj-status.building { background: #dbeafe; color: #1e40af; }
.proj-status.other { background: var(--ink-150); color: var(--ink-500); }
.proj-plan { font-size: 11px; color: var(--ink-400); white-space: nowrap; }
.fence-sublist { display: none; border-top: 1px solid var(--ink-100); margin-top: 10px; padding-top: 8px; }
.project-card.expanded .fence-sublist { display: block; }
.fence-item {
  display: flex; align-items: center; justify-content: space-between; padding: 7px 10px;
  border-radius: var(--radius); cursor: pointer; transition: all .15s; font-size: 12px;
}
.fence-item:hover { background: var(--accent-30); }
.fence-item.active { background: #e8f0fc; border: 1px solid var(--accent-300); }
.fence-item-info { flex: 1; min-width: 0; }
.fence-item-name { font-size: 12px; font-weight: 500; color: var(--ink-800); }
.fence-item-sub { font-size: 11px; color: var(--ink-400); margin-top: 1px; line-height: 1.4; }
.fence-item-status {
  font-size: 10px; padding: 2px 8px; border-radius: 10px; flex-shrink: 0; margin-left: 8px; font-weight: 500;
}
.fence-item-status.setting { background: var(--warning-50); color: #b45309; }
.fence-item-status.normal { background: var(--success-50); color: #15803d; }
.fence-item-status.expiring { background: var(--danger-50); color: #b91c1c; }
.fence-empty { text-align: center; padding: 40px 16px; color: var(--ink-400); font-size: 13px; }
.fence-empty i { font-size: 32px; display: block; margin-bottom: 10px; opacity: .3; }

/* ── Center Panel ── */
.panel-center { flex: 1; min-width: 0; background: #000; position: relative; overflow: hidden; }
/* Override Pannellum internal structure to fill entire space */
#viewer-container { position: absolute !important; inset: 0 !important; width: auto !important; height: auto !important; }
#viewer-container .pnlm-container { width: 100% !important; height: 100% !important; }
#viewer-container .pnlm-render-container { position: absolute !important; inset: 0 !important; }
#viewer-container .pnlm-ui { position: absolute !important; inset: 0 !important; pointer-events: none !important; }
#viewer-container .pnlm-ui .pnlm-panorama-info { position: absolute !important; bottom: 8px !important; left: 50% !important; transform: translateX(-50%) !important; pointer-events: auto !important; }
#viewer-container .pnlm-load-box { position: absolute !important; top: 50% !important; left: 50% !important; transform: translate(-50%,-50%) !important; }
#viewer-container canvas { display: block !important; width: 100% !important; height: 100% !important; object-fit: cover !important; }
#patrol-iframe { display: none; position: absolute; inset: 0; border: none; z-index: 1; width: 100%; height: 100%; }
.center-placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; pointer-events: none; z-index: 2; }
.center-placeholder-icon {
  width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,.04);
  display: flex; align-items: center; justify-content: center;
}
.center-placeholder-icon i { font-size: 32px; color: rgba(255,255,255,.15); }
.center-placeholder-text { font-size: 14px; color: rgba(255,255,255,.2); letter-spacing: .04em; }
.center-placeholder-hint { font-size: 11px; color: rgba(255,255,255,.1); }

/* ── Right Panel ── */
.panel-right {
  width: 310px; flex-shrink: 0; background: var(--white);
  border-left: 1px solid var(--ink-200);
  display: flex; flex-direction: column; overflow: hidden;
}
.panel-right-header {
  padding: 14px 18px; font-size: 14px; font-weight: 600; color: var(--ink-900);
  border-bottom: 1px solid var(--ink-150); flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  letter-spacing: .02em;
}
.panel-right-header .count { font-size: 12px; color: var(--accent-500); font-weight: 700; background: var(--accent-50); padding: 2px 10px; border-radius: 10px; min-width: 24px; text-align: center; }
.patrol-info-row { display: flex; align-items: center; gap: 20px; padding: 10px 18px; border-bottom: 1px solid var(--ink-100); font-size: 12px; color: var(--ink-500); flex-shrink: 0; }
.patrol-info-row strong { color: var(--ink-800); font-weight: 500; margin-left: 2px; }
.patrol-info-row .sep { width: 1px; height: 14px; background: var(--ink-200); }
.btn-screenshot {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  margin: 12px 18px; padding: 9px 0; border-radius: var(--radius);
  background: var(--accent-500); color: #fff; border: none; cursor: pointer;
  font-size: 13px; font-weight: 500; letter-spacing: .02em;
  transition: all var(--ease-out); font-family: var(--font-base);
}
.btn-screenshot:hover { background: var(--accent-400); box-shadow: 0 2px 8px rgba(29,95,205,.25); transform: translateY(-1px); }
.btn-screenshot:active { transform: translateY(0); }
.btn-screenshot:disabled { background: var(--ink-200); color: var(--ink-400); cursor: not-allowed; box-shadow: none; transform: none; }
.issue-list-scroll { flex: 1; overflow-y: auto; padding: 6px 10px; }

.issue-card {
  display: flex; gap: 12px; padding: 12px; border-radius: var(--radius-lg);
  margin-bottom: 6px; background: var(--white); border: 1px solid var(--ink-100);
  position: relative; transition: all var(--ease-out); cursor: default;
}
.issue-card:hover { border-color: var(--ink-200); box-shadow: var(--shadow-xs); }
.issue-card-img {
  width: 56px; height: 56px; border-radius: var(--radius); flex-shrink: 0;
  background-size: cover; background-position: center; background-color: var(--ink-150);
  border: 1px solid var(--ink-100);
}
.issue-card-img-placeholder {
  width: 56px; height: 56px; border-radius: var(--radius); flex-shrink: 0;
  background: var(--ink-100); display: flex; align-items: center; justify-content: center;
  color: var(--ink-300); font-size: 20px; border: 1px solid var(--ink-150);
}
.issue-card-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.issue-card-type { font-size: 13px; font-weight: 600; color: var(--ink-900); line-height: 1.3; }
.issue-card-detail { font-size: 12px; color: var(--ink-500); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.issue-card-source { font-size: 10px; color: var(--accent-500); background: var(--accent-30); padding: 1px 6px; border-radius: 3px; display: inline-block; width: fit-content; font-weight: 500; }
.issue-card-delete {
  position: absolute; right: 6px; top: 6px; width: 22px; height: 22px; border-radius: 50%;
  border: none; background: transparent; color: var(--ink-300); cursor: pointer;
  font-size: 14px; display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: all .15s;
}
.issue-card:hover .issue-card-delete { opacity: 1; }
.issue-card-delete:hover { background: var(--danger-50); color: var(--danger-500); }
.issue-empty { text-align: center; padding: 48px 16px; color: var(--ink-300); font-size: 13px; }
.issue-empty i { font-size: 36px; display: block; margin-bottom: 12px; opacity: .25; }
.patrol-right-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--ink-300); font-size: 14px; min-height: 100%; }
.patrol-right-placeholder i { opacity: .2; }

/* ═══════════════════════════════════════════════════════════════════════
   PC Patrol Calendar
   ═══════════════════════════════════════════════════════════════════════ */
.patrol-calendar-pc { padding: 6px 14px; flex-shrink: 0; }
.patrol-calendar-pc-header { display: flex; align-items: center; justify-content: space-between; padding: 4px 0 8px; }
.patrol-calendar-pc-title { font-size: 13px; font-weight: 600; color: var(--ink-800); }
.patrol-calendar-pc-nav { display: flex; gap: 2px; }
.patrol-calendar-pc-nav button { width: 26px; height: 26px; border: 1px solid var(--ink-200); border-radius: var(--radius); background: var(--white); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--ink-500); transition: all .15s; font-size: 10px; }
.patrol-calendar-pc-nav button:hover { background: var(--ink-100); border-color: var(--ink-300); }
.patrol-calendar-pc-year { border: 1px solid var(--ink-200); border-radius: var(--radius); padding: 3px 6px; font-size: 12px; color: var(--ink-700); background: var(--white); font-family: var(--font-base); cursor: pointer; outline: none; }
.patrol-calendar-pc-year:focus { border-color: var(--accent-400); }
.patrol-calendar-pc-month-name { font-size: 13px; font-weight: 600; color: var(--ink-800); min-width: 36px; text-align: center; }
.patrol-calendar-pc-weekdays { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; margin-bottom: 2px; }
.patrol-calendar-pc-weekday { text-align: center; font-size: 10px; color: var(--ink-400); font-weight: 500; padding: 2px 0; }
.patrol-calendar-pc-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; }
.patrol-calendar-pc-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: var(--radius); font-size: 12px; color: var(--ink-700); cursor: pointer; transition: all .12s; position: relative; }
.patrol-calendar-pc-day:hover { background: var(--ink-100); }
.patrol-calendar-pc-day.other { color: var(--ink-300); cursor: default; }
.patrol-calendar-pc-day.other:hover { background: transparent; }
.patrol-calendar-pc-day.today { font-weight: 700; color: var(--accent-500); background: var(--accent-50); }
.patrol-calendar-pc-day.selected { background: var(--accent-500); color: #fff; font-weight: 600; }
.patrol-calendar-pc-day.has-records-normal::after { content: ''; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--success-500); }
.patrol-calendar-pc-day.has-records-issue::after { content: ''; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--danger-500); }
.patrol-calendar-pc-day.selected.has-records-normal::after,
.patrol-calendar-pc-day.selected.has-records-issue::after { background: #fff; }
.patrol-calendar-pc-legend { display: flex; gap: 14px; padding: 6px 2px 2px; font-size: 10px; color: var(--ink-400); flex-wrap: wrap; }
.patrol-calendar-pc-legend .legend-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 3px; vertical-align: middle; }
.patrol-calendar-pc-legend .today-dot { background: var(--accent-500); border: 1px solid var(--accent-300); }

/* Annotation Tools */
.annotate-tools { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; background: var(--ink-100); border-radius: var(--radius); padding: 4px; }
.annotate-tool-btn {

}
.annotate-tool-btn:hover { background: var(--white); color: var(--accent-500); }

}

.annotate-container {

/* Form */
.form-group { margin-bottom: var(--space-5); }

      <div class="annotation-row">

          <div class="annotate-tools">
            <button class="annotate-tool-btn active" data-tool="rect" onclick="setAnnotateTool('rect',this)"><i class="far fa-square"></i>画框</button>
            <button class="annotate-tool-btn" data-tool="circle" onclick="setAnnotateTool('circle',this)"><i class="far fa-circle"></i>画圈</button>
            <button class="annotate-tool-btn" data-tool="arrow" onclick="setAnnotateTool('arrow',this)"><i class="fas fa-arrow-right"></i>箭头</button>
            <span class="annotate-sep"></span>
            <span class="annotate-colors">
              <span class="annotate-color-dot active" style="background:#dc2626" data-color="#dc2626" onclick="setAnnotateColor('#dc2626',this)"></span>
              <span class="annotate-color-dot" style="background:#2563eb" data-color="#2563eb" onclick="setAnnotateColor('#2563eb',this)"></span>
              <span class="annotate-color-dot" style="background:#16a34a" data-color="#16a34a" onclick="setAnnotateColor('#16a34a',this)"></span>
            </span>
            <span class="annotate-sep"></span>
            <button class="annotate-tool-btn" onclick="undoAnnotation()"><i class="fas fa-undo"></i>撤销</button>
            <button class="annotate-tool-btn" onclick="clearAnnotations()"><i class="fas fa-trash"></i>清除</button>
          </div>
          <div class="annotate-container" id="annotate-container">
            <img id="annotate-img" src="" alt="截屏" style="display:block;max-width:100%">
            <canvas id="annotate-canvas" class="annotate-canvas"></canvas>
            <div class="annotate-paste-hint" id="annotate-paste-hint">
              <i class="fas fa-clipboard" style="font-size:40px;color:#2563eb;margin-bottom:14px;"></i>
              <span style="font-size:15px;color:#1e293b;font-weight:600;margin-bottom:6px;">Ctrl+V 粘贴截屏</span>
              <span style="font-size:12px;color:#94a3b8;">使用 Win+Shift+S 截取左侧全景画面后粘贴至此</span>
            </div>
          </div>
        </div>
        <div class="annotation-right">
          <div class="form-group"><label class="form-label"><span class="required">*</span> 问题类型</label><select class="form-select" id="issue-type"><option value="">请选择问题类型</option></select></div>
          <div class="form-group"><label class="form-label"><span class="required">*</span> 问题详情</label><textarea class="form-textarea" id="issue-detail" placeholder="简要描述问题的具体情况、位置和严重程度"></textarea></div>
          <div class="form-group" style="flex:1;display:flex;flex-direction:column;min-height:0;">
            <label class="form-label"><span class="required">*</span> 问题位置 <span style="font-weight:400;color:var(--ink-400)">— 点击地图选点</span></label>
            <div class="inline-loc-map" id="inline-loc-map"></div>
            <div class="inline-loc-status" id="inline-loc-status"><i class="fas fa-map-marker-alt" style="font-size:10px;"></i> <span>点击地图选择问题位置</span></div>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-cancel" onclick="closeAnnotate()">取消</button>
      <button class="btn btn-primary" onclick="saveIssue()"><i class="fas fa-check" style="margin-right:4px;"></i>保存问题</button>
    </div>
  </div>
</div>

<!-- ═══ Issue Report Modal ═══ -->
<div class="modal-mask" id="issue-report-modal">
  <div class="modal" style="width:680px;max-width:95vw">
    <div class="modal-head"><span><i class="fas fa-exclamation-triangle modal-head-icon" style="color:var(--color-danger,#D13B2F)"></i>新增问题</span><button class="modal-close" onclick="closeIssueReport()">&times;</button></div>
    <div class="modal-body" style="padding:16px 22px">
      <div class="issue-report-list" id="issueReportList"></div>
      <button class="issue-report-add-btn" onclick="addReportIssue()"><i class="fas fa-plus" style="font-size:10px"></i> 添加问题项</button>
    </div>
    <div class="modal-foot">
      <button class="btn btn-cancel" onclick="closeIssueReport()">取消</button>
      <button class="btn btn-primary" onclick="saveIssueReport()">保存问题</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ═══════════════════════════════════════════
   State
   ═══════════════════════════════════════════ */
var editorViewer = null, iframeMode = false, currentScreenshot = null, issueList = [];
var activeFenceId = null, activePatrolRecord = null, defaultSource = '监管巡查';
var patrolCalendarYear = 0, patrolCalendarMonth = 0, patrolSelectedDate = '';
var annotateTool = 'rect', annotateColor = '#dc2626', annotations = [];
var isDrawing = false, drawStart = {x:0,y:0}, drawCurrent = {x:0,y:0};
var annotateCanvas = null, annotateCtx = null, annotateImg = null;
var inlineLocMap = null, pickedLocation = {lat:null,lng:null,addr:'',picked:false};
var ISSUE_TYPES = ['围挡破损','围挡脏污','围挡缺失','围挡基础松动','围挡占道超限','张贴小广告','应建未建围挡','公益广告污损','公益广告内容不合时宜','公益广告画面不连贯影响整体美观','围挡安全隐患','围挡喷淋不符合要求','围挡二维码内容不全','无围挡维护责任人信息','其他'];
var allProjects = [], allHoardings = [];

/* ═══════════════════════════════════════════
   Data
   ═══════════════════════════════════════════ */
function loadData() {
  try {
    if (window.MOCK_DATA) { allProjects = window.MOCK_DATA.getProjects ? window.MOCK_DATA.getProjects() : []; allHoardings = window.MOCK_DATA.getHoardings ? window.MOCK_DATA.getHoardings() : []; }
    if (!allProjects.length && window.SD) allProjects = window.SD.getProjects ? window.SD.getProjects() : [];
  } catch(e) {}
  if (!allProjects.length) allProjects = [];
  if (!allHoardings.length) allHoardings = [];
}

function initIssueTypeSelect() {
  var s = document.getElementById('issue-type');
  s.innerHTML = '<option value="">请选择问题类型</option>';
  ISSUE_TYPES.forEach(function(t) { var o = document.createElement('option'); o.value = t; o.textContent = t; s.appendChild(o); });
}

/* ═══════════════════════════════════════════
   Left Panel — Project List
   ═══════════════════════════════════════════ */
var _projListCache = [];
var _patrolFilter = 'all';

function setPatrolFilter(filter, el) {
  _patrolFilter = filter;
  document.querySelectorAll('.panel-left-filter .ftab').forEach(function(t){t.classList.remove('active');});
  if(el) el.classList.add('active');
  var kw = document.querySelector('.panel-left-search input');
  renderProjectList(kw ? kw.value : '');
}

function renderProjectList(keyword) {
  var scrollEl = document.getElementById('project-list-scroll');
  var countEl = document.getElementById('project-count');
  if (!scrollEl) return;
  var projectMap = {};
  allHoardings.forEach(function(h) { if (!projectMap[h.projectName]) projectMap[h.projectName] = []; projectMap[h.projectName].push(h); });
  // Count patrol status
  var today=new Date();var td=today.getFullYear()+'-'+pad2(today.getMonth()+1)+'-'+pad2(today.getDate());
  var doneCnt=0, undoneCnt=0;
  allHoardings.forEach(function(h){
    var found=false;if(h.patrolRecords){h.patrolRecords.forEach(function(r){if(r.date===td)found=true;});}
    if(found)doneCnt++;else undoneCnt++;
  });
  document.querySelectorAll('.panel-left-filter .ftab').forEach(function(t){
    if(t.dataset.filter==='done')t.textContent='已巡检 '+doneCnt;
    else if(t.dataset.filter==='undone')t.textContent='未巡检 '+undoneCnt;
  });
  var projectList = [];
  allProjects.forEach(function(p) { projectList.push({ project: p, hoardings: projectMap[p.name] || [] }); });
  projectList.sort(function(a,b) { return (a.project.status==='在建'?0:1)-(b.project.status==='在建'?0:1); });
  _projListCache = projectList;
  countEl.textContent = projectList.length;

  if (!projectList.length) { scrollEl.innerHTML = '<div class="fence-empty"><i class="fas fa-inbox"></i>暂无项目数据</div>'; return; }

  var kw = (keyword||'').toLowerCase().trim();
  var htm = '';
  var matchCount = 0;
  projectList.forEach(function(item) {
    var p = item.project, hoardings = item.hoardings;
    // Filter by keyword
    if (kw) {
      var projMatch = p.name.toLowerCase().indexOf(kw) >= 0;
      var anyEngMatch = hoardings.some(function(h){ return (h.engineerName||'').toLowerCase().indexOf(kw) >= 0; });
      if (!projMatch && !anyEngMatch) return;
    }
    matchCount++;
    var sc = p.status === '在建' ? 'building' : 'other';
    var pd = hoardings.length>0&&hoardings[0].planRemoveDate ? hoardings[0].planRemoveDate : '--';
    htm += '<div class="project-card" id="proj-'+escH(p.name)+'" onclick="togProj(\''+escA(p.name)+'\')">';
    htm += '<div class="proj-name">'+escH(p.name)+'</div>';
    htm += '<div class="proj-meta"><span class="proj-status '+sc+'">'+escH(p.status||'--')+'</span><span class="proj-plan">计划拆除 '+pd+'</span></div>';
    htm += '<div class="fence-sublist">';
    if (!hoardings.length) {
      htm += '<div class="fence-item" style="cursor:default;color:var(--ink-400)"><div class="fence-item-info"><div class="fence-item-name">暂无围挡记录</div></div></div>';
    } else {
      hoardings.forEach(function(h) {
        var todayPatrolled=false;
        var today=new Date();var td=today.getFullYear()+'-'+pad2(today.getMonth()+1)+'-'+pad2(today.getDate());
        if(h.patrolRecords){h.patrolRecords.forEach(function(r){if(r.date===td)todayPatrolled=true;});}
        // Apply patrol status filter
        if(_patrolFilter==='done'&&!todayPatrolled)return;
        if(_patrolFilter==='undone'&&todayPatrolled)return;
        var fid = h.id, fd = h.fenceStatus==='已安装'?'setting':h.fenceStatus==='超期未拆'?'expiring':'normal';
        htm += '<div class="fence-item" id="fence-'+fid+'" onclick="event.stopPropagation();selFence(\''+escA(fid)+'\')">';
        var patrolStatus=todayPatrolled?'<span style="color:var(--green,#3BB346);font-size:11px;font-weight:500">今日已巡检</span>':'<span style="color:var(--red,#F93920);font-size:11px;font-weight:500">今日未巡检</span>';
        htm += '<div class="fence-item-info"><div class="fence-item-name">'+escH(h.engineerName||'--')+'</div>';
        htm += '<div class="fence-item-sub">'+escH(h.constructUnit||'--')+'</div>';
        htm += '<div class="fence-item-sub">'+patrolStatus+'</div></div>';
        htm += '<span class="fence-item-status '+fd+'">'+escH(h.fenceStatus||'--')+'</span></div>';
      });
    }
    htm += '</div></div>';
  });
  scrollEl.innerHTML = htm || '<div class="fence-empty"><i class="fas fa-inbox"></i>无匹配结果</div>';
}

function filterProjectList(kw) { renderProjectList(kw); }

function togProj(pn) { var c = document.getElementById('proj-'+pn); if (c) c.classList.toggle('expanded'); }

/* ═══════════════════════════════════════════
   Center — Fence Selection & Panorama
   ═══════════════════════════════════════════ */
function isImageUrl(u) { if(!u)return false; var x=u.split('?')[0].split('#')[0].toLowerCase(); return /\.(jpe?g|png|webp|bmp)$/i.test(x); }

function selFence(fid) {
  document.querySelectorAll('.fence-item.active').forEach(function(e){e.classList.remove('active')});
  var el = document.getElementById('fence-'+fid); if(el) el.classList.add('active');
  activeFenceId = fid;
  var fence = null;
  for (var i=0;i<allHoardings.length;i++) { if (allHoardings[i].id===fid) { fence=allHoardings[i]; break; } }
  if (!fence) { toast('未找到围挡记录'); return; }
  var pr = fence.patrolRecords || [];
  if (!pr.length) {
    toast('该围挡暂无巡检记录'); clearViewer();
    renderCalendarAndRecords();
    return;
  }
  var latest = pr[pr.length-1];
  activePatrolRecord = latest;
  // Auto-select the latest patrol record date
  patrolSelectedDate = latest.date || '';
  issueList = (latest.issues&&Array.isArray(latest.issues)) ? latest.issues.slice() : [];
  issueList.forEach(function(iss){ iss._persisted = true; });
  document.getElementById('center-placeholder').style.display = 'none';
  var panoUrl = latest.panoramaSrc || fence.panoramaSrc || '';
  if (!panoUrl) { toast('暂无全景照片'); return; }
  loadPano(panoUrl);
  // Init calendar to the month of the latest patrol
  if (latest.date) {
    var d = new Date(latest.date);
    patrolCalendarYear = d.getFullYear();
    patrolCalendarMonth = d.getMonth() + 1;
    patrolSelectedDate = latest.date;
  }
  renderCalendarAndRecords();
}

function loadPano(url) {
  hideAll();
  if (!isImageUrl(url)) {
    iframeMode = true;
    document.getElementById('patrol-iframe').src = url;
    document.getElementById('patrol-iframe').style.display = 'block';
    document.getElementById('viewer-container').style.display = 'none';
  } else {
    iframeMode = false;
    document.getElementById('patrol-iframe').style.display = 'none';
    document.getElementById('viewer-container').style.display = '';
    var sc = {'p':{title:'全景',type:'equirectangular',panorama:url,autoLoad:true,hotSpots:[]}};
    editorViewer = pannellum.viewer('viewer-container',{default:{firstScene:'p',autoLoad:true,showControls:false,draggable:true,mouseZoom:true},scenes:sc});
  }
}

function hideAll() {
  if (editorViewer) { try{editorViewer.destroy()}catch(e){} editorViewer=null; }
  document.getElementById('patrol-iframe').style.display = 'none';
  document.getElementById('viewer-container').style.display = '';
  document.getElementById('patrol-iframe').src = '';
}

function clearViewer() {
  hideAll(); issueList=[]; activePatrolRecord=null; activeFenceId=null; patrolSelectedDate='';
  document.getElementById('center-placeholder').style.display = '';
  toggleRightPanel(false);
}

/* ═══════════════════════════════════════════
   Right Panel — Calendar + Patrol Records
   ═══════════════════════════════════════════ */
function toggleRightPanel(active) {
  var content = document.getElementById('panelRightContent');
  var placeholder = document.getElementById('panelRightPlaceholder');
  if (active) { content.style.display = 'flex'; placeholder.style.display = 'none'; }
  else { content.style.display = 'none'; placeholder.style.display = 'flex'; }
}

function renderCalendarAndRecords() {
  toggleRightPanel(!!activeFenceId);
  renderPatrolCalendarPC();
  renderPatrolRecordsPC();
}

function renderPatrolCalendarPC() {
  var el = document.getElementById('patrolCalendarPC');
  var label = document.getElementById('patrol-month-label');
  if (!el) return;
  var now = new Date();
  if (!patrolCalendarYear) { patrolCalendarYear = now.getFullYear(); patrolCalendarMonth = now.getMonth()+1; }

  var weeks = ['一','二','三','四','五','六','日'];
  var firstDay = new Date(patrolCalendarYear, patrolCalendarMonth-1, 1);
  var daysInMonth = new Date(patrolCalendarYear, patrolCalendarMonth, 0).getDate();
  var startDow = firstDay.getDay() - 1; if (startDow < 0) startDow = 6;
  var todayStr = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');

  // Collect dates with patrol records for current fence, track normal vs issue
  var recordDates = {}; // { ds: { count:N, hasIssue:bool } }
  var totalPatrols = 0;
  if (activeFenceId) {
    var fence = null;
    for (var i=0;i<allHoardings.length;i++) { if (allHoardings[i].id===activeFenceId) { fence=allHoardings[i]; break; } }
    if (fence) {
      (fence.patrolRecords||[]).forEach(function(p){
        if (p.date) {
          if (!recordDates[p.date]) recordDates[p.date] = { count:0, hasIssue:false };
          recordDates[p.date].count++;
          if (p.issues&&p.issues.length) recordDates[p.date].hasIssue = true;
          totalPatrols++;
        }
      });
    }
  }
  // Count patrols in current calendar month only
  var monthStr = patrolCalendarYear+'-'+String(patrolCalendarMonth).padStart(2,'0');
  var monthCount = 0;
  Object.keys(recordDates).forEach(function(ds){
    if (ds.indexOf(monthStr)===0) monthCount++;
  });
  label.textContent = '本月已巡检 '+monthCount+' 次';

  // Header with year select
  var h = '<div class="patrol-calendar-pc-header">';
  h += '<select class="patrol-calendar-pc-year" onchange="changeCalYear(this.value)">';
  for (var y = now.getFullYear(); y >= now.getFullYear()-5; y--) {
    h += '<option value="'+y+'"'+(y===patrolCalendarYear?' selected':'')+'>'+y+' 年</option>';
  }
  h += '</select>';
  h += '<div class="patrol-calendar-pc-nav">';
  h += '<button onclick="changeCalMonth(-1)"><i class="fas fa-chevron-left"></i></button>';
  h += '<span class="patrol-calendar-pc-month-name">'+patrolCalendarMonth+'月</span>';
  h += '<button onclick="changeCalMonth(1)"><i class="fas fa-chevron-right"></i></button>';
  h += '</div></div>';

  h += '<div class="patrol-calendar-pc-weekdays">';
  weeks.forEach(function(w){ h += '<div class="patrol-calendar-pc-weekday">'+w+'</div>'; });
  h += '</div><div class="patrol-calendar-pc-grid">';
  for (var d = 0; d < startDow; d++) h += '<div class="patrol-calendar-pc-day other"></div>';
  for (var d = 1; d <= daysInMonth; d++) {
    var ds = patrolCalendarYear+'-'+String(patrolCalendarMonth).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var cls = 'patrol-calendar-pc-day';
    if (ds === todayStr) cls += ' today';
    if (ds === patrolSelectedDate) cls += ' selected';
    var tip = '';
    if (recordDates[ds]) {
      cls += recordDates[ds].hasIssue ? ' has-records-issue' : ' has-records-normal';
      tip = 'title="'+recordDates[ds].count+'条巡检记录'+(recordDates[ds].hasIssue?'（含问题）':'')+'"';
    } else if (activeFenceId) {
      cls += ' has-records-none';
    }
    h += '<div class="'+cls+'" onclick="pickCalendarDate(\''+ds+'\')" '+tip+'>'+d+'</div>';
  }
  h += '</div>';

  // Legend
  h += '<div class="patrol-calendar-pc-legend">';
  h += '<span><span class="legend-dot normal-dot"></span> 已巡检</span>';
  h += '<span><span class="legend-dot issue-dot"></span> 有问题</span>';
  h += '<span><span class="legend-dot none-dot"></span> 未巡检</span>';
  h += '</div>';
  el.innerHTML = h;
}

function changeCalYear(yr) { patrolCalendarYear = parseInt(yr); renderCalendarAndRecords(); }

function changeCalMonth(delta) {
  patrolCalendarMonth += delta;
  if (patrolCalendarMonth < 1) { patrolCalendarMonth = 12; patrolCalendarYear--; }
  if (patrolCalendarMonth > 12) { patrolCalendarMonth = 1; patrolCalendarYear++; }
  renderCalendarAndRecords();
}

function pickCalendarDate(ds) {
  patrolSelectedDate = (patrolSelectedDate === ds) ? '' : ds;
  renderCalendarAndRecords();
}

function renderPatrolRecordsPC() {
  var sc = document.getElementById('patrol-records-pc'), em = document.getElementById('patrol-records-empty');
  if (!sc) return;

  // Gather patrol records for current fence, filtered by selected date
  var records = [];
  if (activeFenceId) {
    var fence = null;
    for (var i=0;i<allHoardings.length;i++) { if (allHoardings[i].id===activeFenceId) { fence=allHoardings[i]; break; } }
    if (fence) records = (fence.patrolRecords||[]).slice();
  }
  if (patrolSelectedDate) records = records.filter(function(r){ return r.date === patrolSelectedDate; });
  records.sort(function(a,b){ return b.date.localeCompare(a.date) || (b.time||'').localeCompare(a.time||''); });

  var html = '';
  if (!activeFenceId) {
    html = '<div class="issue-empty"><i class="fas fa-arrow-left"></i>请从左侧选择围挡记录</div>';
  } else if (!patrolSelectedDate) {
    html = '<div class="issue-empty">请点击日历选择日期查看记录</div>';
  } else if (!records.length) {
    html = '<div class="issue-empty">该日期暂无巡检记录</div>';
  } else {
    records.forEach(function(r){
      var resultTag = r.result==='正常'?'正常':'问题';
      var resultCls = r.result==='正常'?'normal':'abnormal';
      var isActive = activePatrolRecord && r.date === activePatrolRecord.date && (!r.time||r.time === activePatrolRecord.time);
      var cardCls = 'patrol-record-pc-card' + (isActive ? ' selected' : '');
      html += '<div class="'+cardCls+'" data-patrol-id="'+(r.id||'')+'" onclick="openPatrolDetailModal(\x27'+(r.id||'')+'\x27)">';
      html += '<div class="patrol-record-pc-header">';
      html += '<span class="patrol-record-pc-date">'+escH(r.date||'--')+' '+escH(r.time||'')+'</span>';
      var issueCount = r.issues ? r.issues.length : (r.hasIssue?1:0);
      if (issueCount > 0) {
        html += '<span class="patrol-record-pc-result abnormal">'+issueCount+'个问题</span>';
      } else {
        html += '<span class="patrol-record-pc-result normal">正常</span>';
      }
      html += '</div>';
      html += '<div class="patrol-record-pc-person">巡检人：'+escH(r.inspector||'--')+'</div>';
      if (r.remark && (!r.issues || !r.issues.length)) {
        html += '<div class="patrol-record-pc-remark">备注：'+escH(r.remark)+'</div>';
      }
      html += '<div class="patrol-record-pc-actions"><button class="patrol-record-pc-view-btn" onclick="event.stopPropagation();viewPatrolDetail(\x27'+(r.id||'')+'\x27)">查看详情</button><button class="patrol-record-pc-report-btn" onclick="event.stopPropagation();openIssueReport(\x27'+(r.id||'')+'\x27)">新增问题</button></div>';
      html += '</div>';
    });
  }

  if (records.length) window._patrolRecordsCache = records;
  sc.innerHTML = html;
  if (em) em.style.display = (!activeFenceId || !patrolSelectedDate || !records.length) ? 'block' : 'none';
}

function viewPatrolDetail(rid) {
  var rec = (window._patrolRecordsCache||[]).find(function(r){return r.id === rid;});
  if (!rec) { toast('未找到该巡检记录'); return; }
  // Navigate to patrol detail page with panorama return context
  var fence = null;
  for (var i=0;i<allHoardings.length;i++) { if (allHoardings[i].id===activeFenceId) { fence=allHoardings[i]; break; } }
  var url = '../project-pc/patrol_issue_record.html?mode=view&patrolId='+encodeURIComponent(rid);
  url += '&source=panorama';
  if (fence) {
    if (fence.projectName) url += '&project='+encodeURIComponent(fence.projectName);
    if (fence.engineerName) url += '&engineering='+encodeURIComponent(fence.engineerName);
  }
  if (activeFenceId) url += '&fenceId='+encodeURIComponent(activeFenceId);

function loadSS(dataUrl) {
  currentScreenshot = dataUrl;
  var ph=document.getElementById('annotate-paste-hint'); if(ph)ph.style.display='none';
  annotateCanvas=document.getElementById('annotate-canvas'); annotateCanvas.style.display='none';
  var p = new Image();
  p.onload = function() {
    var iw=p.naturalWidth, ih=p.naturalHeight; if(!iw||!ih){toast('截图尺寸异常',true);return;}
    annotateImg=document.getElementById('annotate-img'); var ct=document.getElementById('annotate-container');
    annotateImg.src=dataUrl; annotateImg.style.display='block';
    var cw=ct?ct.clientWidth:iw, dw=Math.min(cw-2,iw), r=dw/iw, dh=Math.round(ih*r);
    annotateCanvas.width=dw; annotateCanvas.height=dh; annotateCanvas.style.width=dw+'px'; annotateCanvas.style.height=dh+'px';
    annotateCanvas.style.display=''; annotateCtx=annotateCanvas.getContext('2d'); redrawA();
    annotateCanvas.onmousedown=amD; annotateCanvas.onmousemove=amM; annotateCanvas.onmouseup=amU; annotateCanvas.onmouseleave=amU;
  };

document.addEventListener('paste',function(e){
  var m=document.getElementById('annotate-modal'); if(!m.classList.contains('show'))return;

  if(currentScreenshot)return; var items=(e.clipboardData||e.originalEvent.clipboardData).items; if(!items)return;
  for(var i=0;i<items.length;i++){ if(items[i].type.indexOf('image')!==-1){ var rr=new FileReader(); rr.onload=function(ev){loadSS(ev.target.result)}; rr.readAsDataURL(items[i].getAsFile()); e.preventDefault(); return; }}
});

function setAnnotateTool(t,b){annotateTool=t;document.querySelectorAll('.annotate-tool-btn[data-tool]').forEach(function(x){x.classList.remove('active')});if(b)b.classList.add('active')}
function setAnnotateColor(c,b){annotateColor=c;document.querySelectorAll('.annotate-color-dot').forEach(function(x){x.classList.remove('active')});if(b)b.classList.add('active')}
function undoAnnotation(){annotations.pop();redrawA()}
function clearAnnotations(){annotations=[];redrawA()}
function getCP(e){var r=annotateCanvas.getBoundingClientRect();return{x:(e.clientX-r.left)*(annotateCanvas.width/r.width),y:(e.clientY-r.top)*(annotateCanvas.height/r.height)}}
function amD(e){e.preventDefault();isDrawing=true;drawStart=getCP(e);drawCurrent=drawStart}
function amM(e){if(!isDrawing)return;drawCurrent=getCP(e);redrawA();drawCS()}
function amU(e){if(!isDrawing)return;isDrawing=false;drawCurrent=getCP(e);addCA();redrawA()}
function addCA(){var dx=Math.abs(drawCurrent.x-drawStart.x),dy=Math.abs(drawCurrent.y-drawStart.y);if(annotateTool==='arrow'){if(Math.sqrt(dx*dx+dy*dy)<8)return}else{if(dx<5&&dy<5)return}annotations.push({type:annotateTool,x1:drawStart.x,y1:drawStart.y,x2:drawCurrent.x,y2:drawCurrent.y,color:annotateColor})}
function drawCS(){if(!annotateCtx)return;drawS(annotateCtx,{type:annotateTool,x1:drawStart.x,y1:drawStart.y,x2:drawCurrent.x,y2:drawCurrent.y,color:annotateColor})}
function drawS(ctx,s){ctx.save();ctx.strokeStyle=s.color;ctx.fillStyle=s.color;ctx.lineWidth=3;ctx.lineCap='round';var x1=s.x1,y1=s.y1,x2=s.x2,y2=s.y2;if(s.type==='rect'){var rx=Math.min(x1,x2),ry=Math.min(y1,y2),rw=Math.abs(x2-x1),rh=Math.abs(y2-y1);ctx.globalAlpha=.15;ctx.fillRect(rx,ry,rw,rh);ctx.globalAlpha=1;ctx.strokeRect(rx,ry,rw,rh)}else if(s.type==='circle'){var cx=(x1+x2)/2,cy=(y1+y2)/2,rx2=Math.abs(x2-x1)/2,ry2=Math.abs(y2-y1)/2;ctx.globalAlpha=.15;ctx.beginPath();ctx.ellipse(cx,cy,rx2,ry2,0,0,2*Math.PI);ctx.fill();ctx.globalAlpha=1;ctx.beginPath();ctx.ellipse(cx,cy,rx2,ry2,0,0,2*Math.PI);ctx.stroke()}else if(s.type==='arrow'){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();var angle=Math.atan2(y2-y1,x2-x1),hl=14;ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-hl*Math.cos(angle-Math.PI/6),y2-hl*Math.sin(angle-Math.PI/6));ctx.moveTo(x2,y2);ctx.lineTo(x2-hl*Math.cos(angle+Math.PI/6),y2-hl*Math.sin(angle+Math.PI/6));ctx.stroke()}ctx.restore()}
function redrawA(){if(!annotateCtx||!annotateCanvas)return;annotateCtx.clearRect(0,0,annotateCanvas.width,annotateCanvas.height);for(var i=0;i<annotations.length;i++)drawS(annotateCtx,annotations[i])}

function saveIssue() {
  var it=document.getElementById('issue-type').value, id=document.getElementById('issue-detail').value.trim();
  if(!it){toast('请选择问题类型',true);return} if(!id){toast('请填写问题详情',true);return}

  var ti=ci; if(annotateCanvas){var tc=document.createElement('canvas'),ms=120,sc=Math.min(ms/annotateCanvas.width,ms/annotateCanvas.height,1);tc.width=annotateCanvas.width*sc;tc.height=annotateCanvas.height*sc;var tx=tc.getContext('2d');tx.drawImage(document.getElementById('annotate-img'),0,0,tc.width,tc.height);tx.save();tx.scale(sc,sc);tx.drawImage(annotateCanvas,0,0);tx.restore();try{ti=tc.toDataURL('image/jpeg',0.7)}catch(e){}}
  issueList.push({id:'issue_'+Date.now(),type:it,detail:id,source:defaultSource,_persisted:false,location:{lat:pickedLocation.lat,lng:pickedLocation.lng,addr:pickedLocation.addr},screenshot:ci,thumbnail:ti,annotations:annotations.slice(),createdAt:new Date().toISOString()});

var _reportIssues=[], _reportPatrolRec=null;

function openIssueReport(rid){
  var rec=(window._patrolRecordsCache||[]).find(function(r){return r.id===rid;});
  if(!rec){toast('未找到该巡检记录',true);return;}
  _reportPatrolRec=rec;

  renderReportIssues();
  document.getElementById('issue-report-modal').classList.add('show');

function closeIssueReport(){
  document.getElementById('issue-report-modal').classList.remove('show');
}

function addReportIssue(){
  var defaultUnit=_reportIssues.length>0?_reportIssues[0].unit:'';
  _reportIssues.push({type:'',unit:defaultUnit,detail:'',photos:[],location:null});
  renderReportIssues();
}

function removeReportIssue(idx){
  _reportIssues.splice(idx,1); renderReportIssues();
}

function onReportFieldChange(idx,field,value){
  _reportIssues[idx][field]=value;
}

function addReportPhoto(idx){
  var el=document.getElementById('reportPhotoInput_'+idx);if(el)el.click();
}

function handleReportPhotos(idx,e){
  var files=e.target.files;if(!files||!files.length)return;
  var iss=_reportIssues[idx];
  for(var k=0;k<Math.min(files.length,9-iss.photos.length);k++){
    var fr=new FileReader();
    fr.onload=(function(i){return function(ev){_reportIssues[i].photos.push(ev.target.result);renderReportIssues();};})(idx);
    fr.readAsDataURL(files[k]);

  e.target.value='';
}

function removeReportPhoto(idx,pIdx){
  _reportIssues[idx].photos.splice(pIdx,1); renderReportIssues();
}

function pickReportLoc(idx){
  if(!_leafletMap){toast('地图未加载，请在项目中操作',true);return;}
  var fence=null;
  for(var i=0;i<allHoardings.length;i++){if(allHoardings[i].id===activeFenceId){fence=allHoardings[i];break;}}
  if(!fence||!fence.gpsShape||!fence.gpsShape.length){toast('围挡无GPS范围数据',true);return;}
  var center=fence.gpsShape[0];
  var popup=L.popup().setLatLng([center[0],center[1]]).setContent('点击地图选择问题位置<br><button onclick=\"confirmReportLoc('+idx+')\" style=\"margin-top:4px;padding:3px 8px;font-size:11px;cursor:pointer\">✅ 确认此位置</button>').openOn(_leafletMap);
  _reportLocPicker={idx:idx, popup:popup};
  _leafletMap.once('click',function(e){
    _reportIssues[_reportLocPicker.idx].location={lat:e.latlng.lat,lng:e.latlng.lng};
    _leafletMap.closePopup(_reportLocPicker.popup);
    _reportLocPicker=null;
    renderReportIssues();

var _reportLocPicker=null;

function confirmReportLoc(idx){
  var cp=_leafletMap.getCenter();
  _reportIssues[idx].location={lat:cp.lat,lng:cp.lng};
  _leafletMap.closePopup();
  _reportLocPicker=null;
  renderReportIssues();
}

function renderReportIssues(){
  var list=document.getElementById('issueReportList');
  if(!_reportIssues.length){_reportIssues=[{type:'',unit:'',detail:'',photos:[],location:null}];}
  // Build unit options from project fences
  var units=[];
  var fence=null;
  for(var i=0;i<allHoardings.length;i++){if(allHoardings[i].id===activeFenceId){fence=allHoardings[i];break;}}
  if(fence&&fence.projectName){
    var projs=MOCK_DATA.getProjects();
    for(var pi=0;pi<projs.length;pi++){
      if(projs[pi].name===fence.projectName){
        (projs[pi].hoardings||[]).forEach(function(h){
          if(h.constructUnit&&units.indexOf(h.constructUnit)<0)units.push(h.constructUnit);
        });
        break;
      }
    }
  }
  if(!units.length&&fence&&fence.constructUnit)units.push(fence.constructUnit);

  list.innerHTML=_reportIssues.map(function(iss,i){
    var typeOpts=ISSUE_TYPES.map(function(t){return'<option value="'+t+'"'+(iss.type===t?' selected':'')+'>'+t+'</option>';}).join('');
    var unitOpts=units.map(function(u){return'<option value="'+u+'"'+(iss.unit===u?' selected':'')+'>'+u+'</option>';}).join('');
    var locText=iss.location?(iss.location.lat.toFixed(5)+', '+iss.location.lng.toFixed(5)):'点击地图选点';
    var photosHtml=iss.photos.map(function(p,j){return'<div class="issue-report-photo-thumb"><img src="'+p+'"><div class="photo-del" onclick="removeReportPhoto('+i+','+j+')">&times;</div></div>';}).join('');
    if(iss.photos.length<9){photosHtml+='<div class="issue-report-photo-add" onclick="addReportPhoto('+i+')"><i class="fas fa-camera" style="font-size:14px"></i>拍照</div>';}
    return'<div class="issue-report-item">'+
      '<div class="issue-report-item-body">'+
        '<div style="display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:600;color:var(--ink-500)"><span>问题项 '+(i+1)+'</span></div>'+
        '<select onchange="onReportFieldChange('+i+',\'type\',this.value)"><option value="">— 请选择问题类型 —</option>'+typeOpts+'</select>'+
        '<select onchange="onReportFieldChange('+i+',\'unit\',this.value)"><option value="">— 请选择责任单位 —</option>'+unitOpts+'</select>'+
        '<textarea placeholder="请描述问题详情" onchange="onReportFieldChange('+i+',\'detail\',this.value)">'+escH(iss.detail)+'</textarea>'+
        '<div class="issue-report-photo-row">'+photosHtml+'</div>'+
        '<input type="file" id="reportPhotoInput_'+i+'" accept="image/*" capture="environment" multiple style="display:none" onchange="handleReportPhotos('+i+',event)">'+
        '<div class="issue-report-loc-row"><span style="font-size:11px;color:var(--ink-400)">位置：</span><button class="issue-report-loc-btn" onclick="pickReportLoc('+i+')"><i class="fas fa-map-marker-alt" style="font-size:10px"></i> '+locText+'</button></div>'+
      '</div>'+
      (_reportIssues.length>1?'<button class="issue-report-del" onclick="removeReportIssue('+i+')" title="删除">&times;</button>':'')+
    '</div>';
  }).join('');
}

function saveIssueReport(){
  if(!activeFenceId){toast('请选择围挡',true);return;}
  if(!_reportIssues.length){toast('请至少添加一个问题项',true);return;}
  for(var i=0;i<_reportIssues.length;i++){
    var iss=_reportIssues[i];
    if(!iss.type){toast('请选择问题项'+(i+1)+'的问题类型',true);return;}
    if(!iss.unit){toast('请选择问题项'+(i+1)+'的责任单位',true);return;}
    if(!iss.detail.trim()){toast('请填写问题项'+(i+1)+'的问题详情',true);return;}
    if(!iss.location){toast('请选择问题项'+(i+1)+'的问题位置',true);return;}
  }
  var fence=null;
  for(var i=0;i<allHoardings.length;i++){if(allHoardings[i].id===activeFenceId){fence=allHoardings[i];break;}}
  if(!fence){toast('未找到围挡数据',true);return;}
  var now=new Date();var dt=now.toISOString().slice(0,19).replace('T',' ');
  var existingIssues=[];
  try{var raw=localStorage.getItem('YZY_STREET_ISSUES');if(raw)existingIssues=JSON.parse(raw);}catch(e){}
  _reportIssues.forEach(function(iss,i){
    existingIssues.unshift({
      id:'RPT-'+Date.now()+'-'+i,
      type:iss.type,fenceId:activeFenceId,fenceAddr:fence.address||'',
      details:iss.detail.trim(),
      status:'待整改',source:'监管巡查',
      reportTime:dt,

      photos:iss.photos.slice(),
      location:{lat:iss.location.lat,lng:iss.location.lng,addr:fence.address||''}

  });
  localStorage.setItem('YZY_STREET_ISSUES',JSON.stringify(existingIssues));
  closeIssueReport(); toast('已上报 '+_reportIssues.length+' 个问题');
}

function getFenceCtx() {
  var c={fenceGps:null,fenceEntrances:null,redlineGeo:null,centerLat:22.548,centerLng:114.061}; if(!activeFenceId)return c;
  for(var i=0;i<allHoardings.length;i++){if(allHoardings[i].id===activeFenceId){var h=allHoardings[i];c.fenceGps=h.gpsShape;c.fenceEntrances=h.entrances;if(c.fenceGps&&c.fenceGps.length>0){c.centerLat=c.fenceGps[0][0];c.centerLng=c.fenceGps[0][1]}for(var j=0;j<allProjects.length;j++){if(allProjects[j].name===h.projectName&&allProjects[j].redlineGeo){c.redlineGeo=allProjects[j].redlineGeo;break}}break}}
  return c;
}
function initInlineLocMap() {
  destroyInlineLocMap(); var me=document.getElementById('inline-loc-map'); if(!me)return;
  var cx=getFenceCtx(); if(pickedLocation.picked){cx.centerLat=pickedLocation.lat;cx.centerLng=pickedLocation.lng}
  var m=L.map(me,{zoomControl:true,attributionControl:false}); m.zoomControl.setPosition('bottomright');
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(m);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,opacity:.4}).addTo(m);
  if(cx.redlineGeo&&cx.redlineGeo.length>=3) L.polygon(cx.redlineGeo,{color:'#dc2626',weight:2,fillOpacity:.06}).addTo(m).bindTooltip('项目红线');
  if(cx.fenceGps&&cx.fenceGps.length>=2){cx.fenceGps.length===2?L.polyline(cx.fenceGps,{color:'#2563eb',weight:2}).addTo(m):L.polygon(cx.fenceGps,{color:'#2563eb',weight:2,dashArray:'6 3',fillOpacity:.08}).addTo(m).bindTooltip('围挡范围')}
  if(cx.fenceEntrances) cx.fenceEntrances.forEach(function(e){var c=e.type==='vehicle'?'#2563eb':e.type==='pedestrian'?'#16a34a':'#d97706';L.circleMarker([e.lat,e.lng],{radius:5,color:c,fillColor:c,fillOpacity:.6,weight:2}).addTo(m).bindTooltip(e.name||'出入口')});
  var pm=null;
  m.on('click',function(e){var lat=e.latlng.lat,lng=e.latlng.lng;pickedLocation={lat:lat,lng:lng,addr:lat.toFixed(6)+', '+lng.toFixed(6),picked:true};if(pm)m.removeLayer(pm);pm=L.marker([lat,lng],{icon:L.divIcon({className:'',html:'<div style="width:22px;height:22px;background:#dc2626;border:3px solid #fff;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.3);transform:translate(-11px,-11px)"></div>',iconSize:[0,0]})}).addTo(m);document.getElementById('inline-loc-map').classList.add('picked');var st=document.getElementById('inline-loc-status');st.classList.add('picked');st.innerHTML='<i class="fas fa-check-circle" style="font-size:10px;"></i> <span>'+pickedLocation.addr+'</span>'});
  m.setView([cx.centerLat,cx.centerLng],16); inlineLocMap=m; setTimeout(function(){if(m)m.invalidateSize()},400);
}
function destroyInlineLocMap(){if(inlineLocMap){try{inlineLocMap.remove()}catch(e){}inlineLocMap=null}var me=document.getElementById('inline-loc-map');if(me){me.classList.remove('picked');me.innerHTML=''}}

/* ═══════════════════════════════════════════
   Utility
   ═══════════════════════════════════════════ */
function escH(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function escA(s){return String(s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;')}
function pad2(n){return n<10?'0'+n:''+n;}
function toast(m,isErr) {
  var ct = document.getElementById('toast-container');
  var e = document.createElement('div'); e.className = 'toast'+(isErr?' error':''); e.textContent = m;
  ct.appendChild(e); requestAnimationFrame(function(){ e.classList.add('show'); });
  setTimeout(function(){ e.classList.remove('show'); setTimeout(function(){ if(e.parentNode) e.remove(); },300); },2200);
}

/* ═══════════════════════════════════════════
   Init
   ═══════════════════════════════════════════ */
initIssueTypeSelect(); loadData(); renderProjectList(); toggleRightPanel(false);
// Auto-expand all projects & select first fence with patrol records
setTimeout(function(){
  document.querySelectorAll('.project-card').forEach(function(c){c.classList.add('expanded');});
  // Find first fence that has patrol records
  for(var i=0;i<allHoardings.length;i++){
    var h=allHoardings[i]; if(h.patrolRecords&&h.patrolRecords.length>0){selFence(h.id);break;}
  }
},200);

// Support returning from patrol detail page with pre-selected fence
(function(){
  var m = window.location.search.match(/fenceId=([^&]+)/);
  if (m) {
    var fid = decodeURIComponent(m[1]);
    setTimeout(function(){
      var fence = null;
      for (var i=0;i<allHoardings.length;i++) { if (allHoardings[i].id===fid) { fence=allHoardings[i]; break; } }
      if (fence && fence.projectName) {
        togProj(fence.projectName);
        setTimeout(function(){
          selFence(fid);
          var dm = window.location.search.match(/patrolDate=([^&]+)/);
          if (dm) {
            patrolSelectedDate = decodeURIComponent(dm[1]);
            loadPatrolRecords();
            refreshCalendar();
          }
        }, 200);
      }
    }, 300);
  }
})();
</script>
