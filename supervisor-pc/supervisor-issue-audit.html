function onResultChange(){var v=document.querySelector('input[name="auditResult"]:checked').value;document.getElementById('opinionReq').style.display=v==='退回整改'?'inline':'none';}

function loadIssue(){
  _issue=MOCK_DATA.getClosureDetail(decodeURIComponent(issueId));if(!_issue)return;
  var sc=_issue.status==='待整改'?'待整改':_issue.status==='待审核'?'待审核':_issue.status==='退回整改'?'退回整改':_issue.status==='整改逾期'?'整改逾期':'审核通过';
  var sCls=_issue.status==='待整改'?'tag-warning':_issue.status==='退回整改'?'tag-warning':_issue.status==='待审核'?'tag-info':_issue.status==='整改逾期'?'tag-danger':'tag-success';
  var h='<div class="info-item"><span class="info-lbl">问题类型</span><span class="info-val" style="color:var(--color-primary-500);font-weight:var(--font-weight-medium)">'+esc(_issue.type||'')+'</span></div>'+
    '<div class="info-item"><span class="info-lbl">问题状态</span><span class="info-val"><span class="tag '+sCls+'">'+sc+'</span></span></div>'+
    '<div class="info-item"><span class="info-lbl">问题来源</span><span class="info-val">'+esc(_issue.source||'--')+'</span></div>'+
    '<div class="info-item"><span class="info-lbl">关联项目</span><span class="info-val">'+esc(_issue._projectName||'--')+'</span></div>'+
    '<div class="info-item"><span class="info-lbl">关联工程</span><span class="info-val">'+esc(_issue.engineerName||'--')+'</span></div>'+
    '<div class="info-item"><span class="info-lbl">责任单位</span><span class="info-val">'+esc(_issue._constructUnit||_issue.responsibleUnit||'--')+'</span></div>'+
    '<div class="info-item"><span class="info-lbl">上报时间</span><span class="info-val">'+esc(_issue.reportTime||'')+'</span></div>'+
    '<div class="info-item full"><span class="info-lbl">问题详情</span><span class="info-val">'+esc(_issue.details||'')+'</span></div>';
  if(_issue.photos&&_issue.photos.length)h+='<div class="info-item full"><span class="info-lbl">现场照片</span><div class="photo-grid">'+_issue.photos.map(function(p){return'<img src="'+p+'">'}).join('')+'</div></div>';
  if(_issue.location&&_issue.location.lat)h+='<div class="info-item full"><span class="info-lbl">问题位置</span><span class="info-val">'+esc(_issue.location.addr||'')+'</span><div class="loc-map" id="locMap"></div></div>';
  document.getElementById('issueInfoBody').innerHTML=h;

  // Rectification info
  var r=_issue._rectification;
  if(r){
    var rh='<div class="info-item"><span class="info-lbl">整改人</span><span class="info-val">'+esc(r.rectifier||'')+'</span></div>'+
      '<div class="info-item"><span class="info-lbl">整改单位</span><span class="info-val">'+esc(r.rectifierUnit||'')+'</span></div>'+
      '<div class="info-item"><span class="info-lbl">整改时间</span><span class="info-val">'+esc(r.rectTime||'')+'</span></div>'+
      '<div class="info-item full"><span class="info-lbl">整改说明</span><span class="info-val">'+esc(r.desc||'')+'</span></div>';
    if(r.photos&&r.photos.length)rh+='<div class="info-item full"><span class="info-lbl">整改照片</span><div class="photo-grid">'+r.photos.map(function(p){return'<img src="'+p+'">'}).join('')+'</div></div>';
    document.getElementById('rectifyBody').innerHTML=rh;
  }else{document.getElementById('rectifyCard').style.display='none';}

  // Location map
  if(_issue.location&&_issue.location.lat)setTimeout(function(){
    var el=document.getElementById('locMap');if(!el)return;
    var fence=null,project=null;if(_issue.fenceId)fence=MOCK_DATA.findFenceById(_issue.fenceId);if(!fence){var allH=MOCK_DATA.getHoardings();if(allH.length)fence=allH[0];}if(fence){var allP=MOCK_DATA.getProjects();for(var k=0;k<allP.length;k++){if(allP[k].name===fence.projectName){project=allP[k];break;}}}if(!project)project=MOCK_DATA.getProjects()[0];
    var m=L.map(el,{zoomControl:true,attributionControl:false,dragging:true,scrollWheelZoom:true});m.zoomControl.setPosition('topright');
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(m);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,opacity:0.4}).addTo(m);
    if(project&&project.redlineGeo&&project.redlineGeo.length>=3)L.polygon(project.redlineGeo,{color:'#D13B2F',weight:2.5,fillOpacity:0.08,fillColor:'#D13B2F'}).addTo(m);
    if(fence&&fence.gpsShape&&fence.gpsShape.length>=2){if(fence.gpsShape.length===2)L.polyline(fence.gpsShape,{color:'#1862D4',weight:2.5}).addTo(m);else L.polygon(fence.gpsShape,{color:'#1862D4',weight:2,fillOpacity:0.1,fillColor:'#1862D4',dashArray:'8 4'}).addTo(m);}
    if(fence&&fence.entrances)fence.entrances.forEach(function(e){var c=e.type==='vehicle'?'#1862D4':e.type==='pedestrian'?'#1A9042':e.type==='temporary'?'#f0832c':'#D13B2F';L.circleMarker([e.lat,e.lng],{radius:5,color:c,fillColor:c,fillOpacity:0.7,weight:2}).addTo(m).bindTooltip(e.name||'出入口',{direction:'top'});});
    L.circleMarker([_issue.location.lat,_issue.location.lng],{radius:8,color:'#D13B2F',fillColor:'#D13B2F',fillOpacity:0.9,weight:3}).addTo(m).bindPopup('<b>问题位置</b><br>'+esc(_issue.location.addr||''));
    L.circleMarker([_issue.location.lat,_issue.location.lng],{radius:14,color:'#D13B2F',fillOpacity:0,weight:1.5,opacity:0.4}).addTo(m);
    var bounds=L.latLngBounds([]);if(project&&project.redlineGeo)project.redlineGeo.forEach(function(p){bounds.extend(p);});if(fence&&fence.gpsShape)fence.gpsShape.forEach(function(p){bounds.extend(p);});bounds.extend([_issue.location.lat,_issue.location.lng]);if(bounds.isValid())m.fitBounds(bounds.pad(0.3));m.setZoom(Math.min(m.getZoom(),18));
    setTimeout(function(){m.invalidateSize();},300);
  },400);
}

function handlePhotos(e){var files=e.target.files;if(!files||!files.length)return;for(var i=0;i<files.length;i++){if(_photos.length>=9){showMsg('最多上传9张照片');break}(function(f){var r=new FileReader();r.onload=function(ev){_photos.push(ev.target.result);renderPhotos();};r.readAsDataURL(f);})(files[i]);}e.target.value='';}
function removePhoto(i){_photos.splice(i,1);renderPhotos();}
function renderPhotos(){var row=document.getElementById('photoArea');var h=_photos.map(function(p,i){return'<div class="photo-thumb"><img src="'+p+'"><div class="del" onclick="event.stopPropagation();removePhoto('+i+')">&times;</div></div>';}).join('');if(_photos.length<9){h+='<div class="photo-btn" onclick="document.getElementById(\'camInput\').click()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>拍照</div>';h+='<div class="photo-btn" onclick="document.getElementById(\'fileInput\').click()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>相册</div>';}h+='<input type="file" id="camInput" accept="image/*" capture="environment" multiple style="display:none" onchange="handlePhotos(event)"><input type="file" id="fileInput" accept="image/*" multiple style="display:none" onchange="handlePhotos(event)">';row.innerHTML=h;}

function submitAudit(result){
  if(!_issue){showMsg('问题不存在');return;}
  var opinion=document.getElementById('auditOpinion').value.trim();
  if(result==='退回整改'&&!opinion){showMsg('退回整改时审核意见为必填');return;}
  MOCK_DATA.submitAudit(_issue.id,{auditor:'张建国',auditorUnit:'深圳市住房和建设局',result:result,opinion:opinion,photos:_photos.slice()});
  showMsg(result==='审核通过'?'审核通过，问题已闭环':'已退回整改');
  setTimeout(function(){window.location.href='supervisor-issue-list.html';},1200);
}
function showMsg(m){var d=document.createElement('div');d.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.8);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:9999';d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},2000);}

loadIssue();
</script>
</body>
</html>
