  <table class="table">
    <thead><tr>
      <th style="width:32px">序号</th><th style="width:90px">问题类型</th><th id="fenceNameHead" style="width:120px;text-align:left">围挡名称</th><th style="width:120px;text-align:left">关联工程</th><th id="streetHead" style="width:80px;display:none">所属街道</th><th style="width:140px">责任单位</th><th style="width:75px">问题来源</th><th style="width:75px">状态</th><th style="width:100px">上报时间</th><th style="width:80px">操作</th>
    </tr></thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>
<div class="pagination" id="paginationBar"><span>共 0 条</span><div class="pagination-btns"></div></div>
</div>
</main>
</div></div>

<script src="../shared_data.js"></script>
<script src="../mock-data.js"></script>
<script>
var _projName=decodeURIComponent((window.location.search.match(/project=([^&]*)/)||[])[1]||'');
var _items=[],_page=1,_pageSize=10;

function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// Set project name in UI
var _isUnregistered=_projName==='_unregistered';
document.getElementById('breadcrumbProj').textContent=_isUnregistered?'未报建-应建未建围挡问题':(_projName||'项目问题');
document.getElementById('projPageTitle').textContent=_isUnregistered?'未报建-应建未建围挡问题':((_projName||'项目')+' - 围挡问题');
if(_isUnregistered){
  document.getElementById('filterEngineer').style.display='none';
  document.getElementById('filterStreet').style.display='';
  document.getElementById('fenceNameHead').style.display='none';
  document.getElementById('streetHead').style.display='';
}

function findIssueFence(issue){
  if(!issue||!issue.fenceId)return null;
  if(MOCK_DATA.findFenceById){var exact=MOCK_DATA.findFenceById(issue.fenceId);if(exact)return exact;}
  var all=MOCK_DATA.getHoardings?MOCK_DATA.getHoardings():[];
  return all.find(function(h){return h.id===issue.fenceId;})||null;
}

function loadData(){
  _items=MOCK_DATA.getClosureIssues();
  // Filter to this project, or unregistered issues
  if(_isUnregistered){
    _items=_items.filter(function(i){return i._unregistered;});
  }else{
    _items=_items.filter(function(i){return (i._projectName||'')===_projName;});
  }
}

(function initTypeFilter(){
  var s=document.getElementById('filterType');if(!s)return;
  var types=MOCK_DATA.getStreetIssueTypes();
  types.forEach(function(t){var o=document.createElement('option');o.value=t;o.textContent=t;s.appendChild(o);});
})();

// Init engineer filter from project data
(function initEngineerFilter(){
  if(_isUnregistered)return;
  var issues=MOCK_DATA.getClosureIssues();
  var engSet={};
  issues.forEach(function(i){
    if((i._projectName||'')===_projName&&i.engineerName)engSet[i.engineerName]=true;
  });
  var s=document.getElementById('filterEngineer');if(!s)return;
  Object.keys(engSet).sort().forEach(function(e){
    var o=document.createElement('option');o.value=e;o.textContent=e;s.appendChild(o);
  });
})();

// Init street filter (for unregistered issues)
(function initStreetFilter(){
  if(!_isUnregistered)return;
  var issues=MOCK_DATA.getClosureIssues();
  var streetSet={};
  issues.forEach(function(i){
    if(i._unregistered&&i.street)streetSet[i.street]=true;
  });
  var s=document.getElementById('filterStreet');if(!s)return;
  Object.keys(streetSet).sort().forEach(function(st){
    var o=document.createElement('option');o.value=st;o.textContent=st;s.appendChild(o);
  });
})();

var _statusTab='all';

function onStatusTab(tab){_statusTab=tab;_page=1;renderTable();}

function renderStatusTabs(){
  var all=MOCK_DATA.getClosureIssues().filter(function(i){return _isUnregistered?i._unregistered:((i._projectName||'')===_projName);});
  var tabs=['all','待整改','整改逾期','整改完成'];
  var labels=['全部','待整改','整改逾期','整改完成'];
  var warnTabs={'待整改':true};
  var dangerTabs={'整改逾期':true};
  var counts={};
  tabs.forEach(function(t){counts[t]=t==='all'?all.length:all.filter(function(i){return i.status===t;}).length;});
  var html='';
  tabs.forEach(function(t,idx){
    var active=_statusTab===t?' active':'';
    var numCls=warnTabs[t]?' status-tab-num-warn':dangerTabs[t]?' status-tab-num-danger':'';
    html+='<button class="status-tab'+active+'" onclick="onStatusTab(\''+t+'\')">'+labels[idx]+' <span class="status-tab-num'+numCls+'">'+counts[t]+'</span></button>';
  });
  document.getElementById('statusTabs').innerHTML=html;
}

function renderTable(){
  loadData();
  var eng=document.getElementById('filterEngineer').value;
  var src=document.getElementById('filterSource').value;
  var ft=document.getElementById('filterType').value;
  if(_statusTab!=='all')_items=_items.filter(function(i){return i.status===_statusTab;});
  if(eng!=='all')_items=_items.filter(function(i){return i.engineerName===eng;});
  if(src!=='all')_items=_items.filter(function(i){return i.source===src;});
  if(ft!=='all')_items=_items.filter(function(i){return i.type===ft;});
  if(_isUnregistered){var fst=document.getElementById('filterStreet').value;if(fst!=='all')_items=_items.filter(function(i){return i.street===fst;});}
  // Sort by reportTime descending
  _items.sort(function(a,b){return(b.reportTime||'').localeCompare(a.reportTime||'');});

  var total=_items.length,start=(_page-1)*_pageSize,pageItems=_items.slice(start,start+_pageSize),h='';
  pageItems.forEach(function(i,idx){
    var sc=i.status==='待整改'?'待整改':i.status==='整改逾期'?'整改逾期':'整改完成';
    var sCls=i.status==='待整改'?'tag-warning':i.status==='整改逾期'?'tag-danger':'tag-success';
    var engCol=_isUnregistered?'<span style="color:var(--text-tertiary)">—</span>':esc(i.engineerName||'--');
    var fence=findIssueFence(i),fenceName=fence?(fence.fenceName||fence.name||'--'):'--';
    h+='<tr><td>'+(start+idx+1)+'</td>'+
      '<td><span class="issue-type-text">'+esc(i.type||'')+'</span></td>'+
      (_isUnregistered?'':'<td style="text-align:left" title="'+esc(fenceName)+'">'+esc(fenceName)+'</td>')+
      '<td style="text-align:left">'+engCol+'</td>'+
      (_isUnregistered?'<td>'+esc(i.street||'--')+'</td>':'')+
      '<td>'+esc(i._constructUnit||i.responsibleUnit||'--')+'</td>'+
      '<td>'+esc(i.source||'--')+'</td>'+
      '<td><span class="tag '+sCls+'">'+sc+'</span></td>'+
      '<td>'+esc(i.reportTime||'')+'</td>'+
      '<td><div class="table-actions"><a class="table-action-link" href="supervisor-issue-detail.html?id='+i.id+'">详情</a></div></td></tr>';
  });
  if(!total)h='<tr><td colspan="9" style="padding:40px;color:var(--text-tertiary)">暂无数据</td></tr>';
  document.getElementById('tableBody').innerHTML=h;

  var tp=Math.ceil(total/_pageSize),phtml='<span>共 '+total+' 条</span><div class="pagination-btns">';
  phtml+='<button '+(_page<=1?'disabled':'')+' onclick="goPage('+(_page-1)+')">&lt;</button>';
  for(var p=1;p<=Math.min(tp,8);p++)phtml+='<button class="'+(p===_page?'active':'')+'" onclick="goPage('+p+')">'+p+'</button>';
  if(tp>8){phtml+='<button disabled>...</button><button onclick="goPage('+tp+')">'+tp+'</button>';}
  phtml+='<button '+(_page>=tp?'disabled':'')+' onclick="goPage('+(_page+1)+')">&gt;</button></div>';
  document.getElementById('paginationBar').innerHTML=phtml;
  renderStatusTabs();
}

function goPage(p){_page=p;renderTable();}
renderTable();
</script>
</body>
</html>
